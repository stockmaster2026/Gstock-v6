<!DOCTYPE html>

<html><head><meta charset="UTF-8">
<title>diary 診斷</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f5f0e8;}
.box{background:#fff;padding:15px;border-radius:10px;margin:10px 0;border:1px solid #ddd;}
.ok{background:#d5f2e2;color:#1e5a3f;}
.fail{background:#fcdcdc;color:#7a2020;}
pre{background:#f0f0f0;padding:8px;font-size:11px;overflow:auto;}
button{padding:10px 20px;border-radius:8px;background:#c8a84b;color:#fff;border:none;font-size:14px;cursor:pointer;margin:5px;}
</style></head>
<body>
<h2>🔍 diary.html 診斷</h2>

<div class="box" id="r1">測試 1:檔案是否存在...</div>
<div class="box" id="r2">測試 2:iframe 載入...</div>
<div class="box" id="r3">測試 3:函數是否可呼叫...</div>

<button onclick="testBtn()">🧪 測試按鈕點擊</button>

<iframe id="frame" src="diary.html?v=diag" style="width:100%;height:400px;border:1px solid #ccc;margin-top:20px;"></iframe>

<script>
// 測試 1:fetch
fetch('diary.html?v=diag').then(r => {
  var el = document.getElementById('r1');
  if(r.ok) {
    el.className = 'box ok';
    el.innerHTML = '✅ 測試 1:檔案存在 (HTTP ' + r.status + ')';
    return r.text();
  } else {
    el.className = 'box fail';
    el.innerHTML = '❌ 測試 1:檔案錯誤 ' + r.status;
    return null;
  }
}).then(text => {
  var el2 = document.getElementById('r2');
  if(!text) { el2.className='box fail'; el2.innerHTML='⛔ 跳過'; return; }
  el2.className = 'box ok';
  el2.innerHTML = '✅ 測試 2:檔案大小 ' + (text.length/1024).toFixed(1) + ' KB';

  // 檢查關鍵函數是否在原始碼裡
  var checks = [
    {name:'openAddTrade', found: text.includes('function openAddTrade()')},
    {name:'switchPool', found: text.includes('function switchPool(')},
    {name:'calcTargets', found: text.includes('function calcTargets(')},
    {name:'state 物件', found: text.includes('var state = {')},
    {name:'loadData', found: text.includes('function loadData()')}
  ];
  var results = checks.map(c => (c.found?'✅':'❌')+' '+c.name).join('<br>');
  document.getElementById('r3').className = 'box ok';
  document.getElementById('r3').innerHTML = '測試 3:函數檢查<br>' + results;
});

function testBtn() {
  try {
    var frame = document.getElementById('frame');
    var frameWin = frame.contentWindow;
    if(frameWin.openAddTrade) {
      frameWin.openAddTrade();
      alert('✅ openAddTrade 可以呼叫!問題可能在你裝置的 Safari 快取');
    } else {
      alert('❌ iframe 裡找不到 openAddTrade 函數');
    }
  } catch(e) {
    alert('錯誤: ' + e.message);
  }
}
</script>

</body></html>
