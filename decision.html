<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個股決策樹 · Stage 審判版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#f5f0e8;font-family:-apple-system,'Helvetica Neue',sans-serif;padding:16px;color:#1a1a2e;min-height:100vh;}
body.iframe-mode{padding:12px;background:#fffdf5;}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
body.iframe-mode .hdr{margin-bottom:12px;}
.dot{width:8px;height:8px;border-radius:50%;background:#c8a84b;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.hdr h2{font-size:16px;font-weight:700;letter-spacing:2px;color:#8a6e2f;}

.sym-bar{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 12px rgba(200,168,75,.08);}
.sym-bar-lbl{font-size:11px;color:#a88d4a;font-weight:700;letter-spacing:1px;margin-bottom:8px;}
.sym-bar input{background:#fffbec;border:1px solid #e0d5b8;border-radius:10px;padding:11px 14px;font-size:16px;color:#1a1a2e;width:100%;text-transform:uppercase;outline:none;font-family:monospace;font-weight:700;text-align:center;}
.sym-bar input:focus{border-color:#c8a84b;}

.progress{display:flex;gap:6px;margin-bottom:16px;}
.pstep{flex:1;height:5px;background:#e8dfc0;border-radius:3px;transition:background .3s;}
.pstep.done,.pstep.active{background:#c8a84b;}

.qcard{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;padding:20px 18px;box-shadow:0 2px 12px rgba(200,168,75,.08);margin-bottom:14px;}
.qnum{font-size:11px;color:#c8952a;font-weight:700;letter-spacing:2px;margin-bottom:6px;}
.qtitle{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:4px;line-height:1.4;}
.qhint{font-size:12px;color:#a88d4a;margin-bottom:16px;line-height:1.6;}

.opts{display:flex;flex-direction:column;gap:9px;}
.opt{background:#fffbec;border:2px solid #e0d5b8;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;color:#1a1a2e;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:10px;}
.opt:active{transform:scale(.98);}
.opt.sel{background:#fff8e0;border-color:#c8a84b;color:#5a4010;}
.opt-emoji{font-size:20px;flex-shrink:0;}
.opt-txt{flex:1;}
.opt-sub{font-size:11px;color:#999;font-weight:500;margin-top:2px;}

.actions{display:flex;gap:8px;margin-top:14px;}
.btn{flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:700;border:none;cursor:pointer;}
.btn-back{background:#f0e8d0;color:#8a6e2f;}
.btn-reset{background:#fef0f0;color:#d94f4f;border:1px solid #f5cccc;}

.result{background:#fffdf5;border:2px solid #c8a84b;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(200,168,75,.2);margin-bottom:14px;}
.result-hero{padding:24px 20px;text-align:center;background:linear-gradient(135deg,#fffbec,#fff8e0);}
.result-emoji{font-size:48px;margin-bottom:8px;}
.result-verdict{font-size:22px;font-weight:900;margin-bottom:8px;line-height:1.3;}
.v-buy{color:#2ea86e;}
.v-watch{color:#c8952a;}
.v-skip{color:#d94f4f;}
.result-pos{font-size:14px;color:#5a4010;font-weight:700;background:#fff;padding:8px 14px;border-radius:20px;display:inline-block;margin-top:6px;}
.result-body{padding:16px 18px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f5eed8;}
.result-row:last-child{border:none;}
.result-lbl{font-size:13px;color:#8a7050;font-weight:600;}
.result-val{font-size:14px;font-weight:700;font-family:monospace;color:#1a1a2e;}
.reason-box{background:#f0f8ff;border-left:3px solid #3a7bd5;padding:12px 14px;border-radius:0 10px 10px 0;margin-top:12px;}
.reason-lbl{font-size:10px;color:#3a7bd5;font-weight:700;letter-spacing:1px;margin-bottom:6px;}
.reason-txt{font-size:13px;color:#1a3a5c;line-height:1.8;font-weight:500;}
.warn-box{background:#fff5f5;border-left:3px solid #d94f4f;padding:12px 14px;border-radius:0 10px 10px 0;margin-top:10px;}
.warn-lbl{font-size:10px;color:#d94f4f;font-weight:700;letter-spacing:1px;margin-bottom:4px;}
.warn-txt{font-size:12px;color:#d94f4f;font-weight:600;line-height:1.6;}
.choices-recap{background:#faf5e8;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:11px;color:#8a7050;line-height:1.6;}
.choices-recap b{color:#5a4010;}
.restart{width:100%;padding:14px;background:#c8a84b;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
.restart:active{background:#a8882b;}

.menu{display:flex;flex-direction:column;gap:10px;}
.menu-btn{background:#fffdf5;border:2px solid #e0d5b8;border-radius:14px;padding:18px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;}
.menu-btn:active{transform:scale(.98);background:#fff8e0;}
.menu-emoji{font-size:28px;flex-shrink:0;}
.menu-title{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:2px;}
.menu-desc{font-size:12px;color:#999;}

/* ═══ Stage 審判閘門 專用 ═══ */
.stage-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(200,168,75,.08);margin-bottom:14px;}
.stage-title{font-size:13px;color:#c8952a;font-weight:700;letter-spacing:2px;margin-bottom:10px;}
.fetch-btn{width:100%;padding:14px;background:linear-gradient(135deg,#c8a84b,#a8882b);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 8px rgba(200,168,75,.3);margin-top:4px;}
.fetch-btn:active{transform:scale(.98);}
.fetch-btn:disabled{background:#ddd;box-shadow:none;}
.fetch-status{text-align:center;font-size:12px;color:#a88d4a;margin-top:10px;line-height:1.6;}
.fetch-status.err{color:#d94f4f;}
.fetch-status.ok{color:#2ea86e;}

.manual-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.mfield{background:#faf5e8;border-radius:9px;padding:8px 10px;}
.mfield label{display:block;font-size:10px;color:#8a7050;font-weight:700;margin-bottom:3px;}
.mfield input{width:100%;background:#fff;border:1px solid #e0d5b8;border-radius:6px;padding:7px;font-size:14px;font-family:monospace;font-weight:700;color:#1a3a5c;text-align:center;outline:none;}
.mfield input:focus{border-color:#c8a84b;}
.mfield.full{grid-column:1/-1;}
.manual-note{font-size:11px;color:#a88d4a;margin:10px 0 4px;line-height:1.6;}

/* Trend Template 檢核表 */
.tt-list{margin-top:6px;}
.tt-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #f5eed8;font-size:13px;}
.tt-row:last-child{border:none;}
.tt-ic{width:20px;text-align:center;flex-shrink:0;font-size:14px;}
.tt-txt{flex:1;color:#5a4010;}
.tt-val{font-family:monospace;font-size:12px;color:#3a7bd5;font-weight:700;flex-shrink:0;}
.tt-pass .tt-txt{color:#2ea86e;}
.tt-fail .tt-txt{color:#d94f4f;}

/* Stage 裁決條 */
.verdict-bar{padding:18px;border-radius:14px;margin-top:14px;text-align:center;}
.verdict-bar .vb-stage{font-size:24px;font-weight:900;margin-bottom:6px;}
.verdict-bar .vb-sub{font-size:13px;font-weight:600;line-height:1.6;}
.vb-go{background:#edfaf3;border:2px solid #2ea86e;}
.vb-go .vb-stage{color:#2ea86e;}
.vb-late{background:#fff5ec;border:2px solid #d97020;}
.vb-late .vb-stage{color:#d97020;}
.vb-no{background:#fef0f0;border:2px solid #d94f4f;}
.vb-no .vb-stage{color:#d94f4f;}
.vb-metrics{display:flex;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap;}
.vb-metric{font-size:11px;color:#8a7050;}
.vb-metric b{display:block;font-size:15px;font-family:monospace;color:#1a3a5c;margin-top:2px;}

.proceed-btn{width:100%;padding:15px;background:linear-gradient(135deg,#2ea86e,#1e8a56);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;box-shadow:0 3px 8px rgba(46,168,110,.3);}
.proceed-btn:active{transform:scale(.98);}
.override-btn{width:100%;padding:12px;background:transparent;border:1px dashed #d97020;color:#d97020;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px;}
.firewall-note{background:#fff5f5;border-left:3px solid #d94f4f;padding:11px 13px;border-radius:0 10px 10px 0;margin-top:10px;font-size:12px;color:#d94f4f;font-weight:600;line-height:1.7;}
.firewall-note b{color:#b33;}

.tag-g{background:#edfaf3;color:#2ea86e;border:1px solid #c5eedd;}
.tag-y{background:#fffbec;color:#c8952a;border:1px solid #f0dfa0;}
.tag-o{background:#fff5ec;color:#d97020;border:1px solid #f0cca0;}
.tag-r{background:#fef0f0;color:#d94f4f;border:1px solid #f5cccc;}
.tag-b{background:#e8f0fe;color:#3a7bd5;border:1px solid #b8d0f8;}
.pf-val-tag{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:700;margin-left:5px;}
</style>
</head>
<body>

<div class="hdr"><div class="dot"></div><h2>個股決策樹 · Stage 審判版</h2></div>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════
// 狀態
// ═══════════════════════════════════════════
var state = {
  mode: null, sym: '', step: 0, answers: {},
  stage: null,        // Stage 審判結果
  metrics: null,      // 自動/手動算出的數值
  manual: {},         // 手動輸入暫存
};
var app = document.getElementById('app');

// ═══════════════════════════════════════════
// ①  Stage 審判閘門 —— 新的進入點
// ═══════════════════════════════════════════
function renderStageGate(){
  var m = state.manual;
  var h = '';
  h += '<div class="sym-bar">';
  h += '<div class="sym-bar-lbl">📌 輸入股票代號,先過 Stage 審判</div>';
  h += '<input id="symInput" placeholder="例如 RKLB" maxlength="6" value="'+(state.sym||'')+'">';
  h += '</div>';

  h += '<div class="stage-card">';
  h += '<div class="stage-title">🚦 第一層 · Stage 自動審判</div>';
  h += '<button class="fetch-btn" id="fetchBtn" onclick="doFetch()">🔍 自動抓取並判讀</button>';
  h += '<div class="fetch-status" id="fetchStatus">先按自動抓取;抓不到再用下方手動填(數字可從 TradingView 直接讀)</div>';

  h += '<div class="manual-note">▾ 手動輸入(自動失敗時用,或想覆蓋):</div>';
  h += '<div class="manual-grid">';
  h += mfield('price','現價',m.price);
  h += mfield('ma50','50日均',m.ma50);
  h += mfield('ma150','150日均',m.ma150);
  h += mfield('ma200','200日均',m.ma200);
  h += mfield('ma200prev','200均(1月前)',m.ma200prev);
  h += mfield('ma50prev','50均(3週前)',m.ma50prev);
  h += mfield('high52','52週高',m.high52);
  h += mfield('low52','52週低',m.low52);
  h += mfield('rs','RS 分數',m.rs);
  h += '<div class="mfield full"><label>突破後幾週(選填,判末段用)</label><input type="number" inputmode="decimal" data-mk="weeks" value="'+(m.weeks||'')+'" oninput="onManual(event)"></div>';
  h += '</div>';
  h += '<button class="fetch-btn" style="background:linear-gradient(135deg,#3a7bd5,#2a5ba5);margin-top:10px;" onclick="judgeStage()">⚖️ 用上面數字判讀 Stage</button>';
  h += '</div>';

  // 已有審判結果就顯示
  if(state.stage){ h += renderStageVerdict(); }

  h += '<div style="text-align:center;margin-top:6px;"><button class="override-btn" style="border-color:#c8a84b;color:#8a6e2f;" onclick="skipToTree()">略過審判,直接逐題回答 →</button></div>';

  app.innerHTML = h;
  var inp = document.getElementById('symInput');
  if(inp) inp.addEventListener('input',function(e){ state.sym=e.target.value.toUpperCase().trim(); });
}

function mfield(key,label,val){
  return '<div class="mfield"><label>'+label+'</label>'+
    '<input type="number" inputmode="decimal" data-mk="'+key+'" value="'+(val!=null?val:'')+'" oninput="onManual(event)"></div>';
}
function onManual(e){ state.manual[e.target.dataset.mk]=e.target.value; }

// ═══════════════════════════════════════════
// 自動抓資料(Yahoo v8 + corsproxy);失敗有手動退路
// ═══════════════════════════════════════════
function doFetch(){
  var sym = (document.getElementById('symInput')||{}).value;
  sym = (sym||state.sym||'').toUpperCase().trim();
  if(!sym){ setStatus('請先輸入代號','err'); return; }
  state.sym = sym;
  var btn=document.getElementById('fetchBtn');
  btn.disabled=true; setStatus('抓取中… '+sym,'');

  var yahoo='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)+'?range=1y&interval=1d';
  var url='https://corsproxy.io/?url='+encodeURIComponent(yahoo);

  fetch(url).then(function(r){ return r.json(); }).then(function(j){
    var res=j.chart && j.chart.result && j.chart.result[0];
    if(!res) throw new Error('no data');
    var q=res.indicators.quote[0];
    var closes=(q.close||[]).filter(function(x){return x!=null;});
    var highs=(q.high||[]).filter(function(x){return x!=null;});
    var lows=(q.low||[]).filter(function(x){return x!=null;});
    if(closes.length<200) throw new Error('歷史不足');

    var price=closes[closes.length-1];
    state.manual.price=round(price);
    state.manual.ma50=round(ma(closes,50));
    state.manual.ma150=round(ma(closes,150));
    state.manual.ma200=round(ma(closes,200));
    state.manual.ma200prev=round(maAt(closes,200,21));   // 約1個月前
    state.manual.ma50prev=round(maAt(closes,50,15));      // 約3週前
    state.manual.high52=round(Math.max.apply(null,highs));
    state.manual.low52=round(Math.min.apply(null,lows));
    // RS 無法用單檔精算,保留使用者既有值,不覆蓋
    setStatus('✅ '+sym+' 抓取成功,數字已填入下方。RS 請自己從 TradingView 補。','ok');
    btn.disabled=false;
    renderStageGate();
    setStatus('✅ '+sym+' 已填入,按「用上面數字判讀」或補 RS 後判讀。','ok');
  }).catch(function(e){
    btn.disabled=false;
    setStatus('⚠️ 自動抓取失敗('+(e.message||'網路/proxy')+')。請手動填下方數字後按藍色判讀鈕。','err');
  });
}
function setStatus(t,c){ var s=document.getElementById('fetchStatus'); if(s){ s.textContent=t; s.className='fetch-status '+(c||''); } }
function ma(a,n){ if(a.length<n) return null; var s=0; for(var i=a.length-n;i<a.length;i++)s+=a[i]; return s/n; }
function maAt(a,n,back){ var end=a.length-back; if(end<n) return null; var s=0; for(var i=end-n;i<end;i++)s+=a[i]; return s/n; }
function round(x){ return x==null?null:Math.round(x*100)/100; }

// ═══════════════════════════════════════════
// Stage 審判核心
// ═══════════════════════════════════════════
function judgeStage(){
  var m=state.manual;
  var num=function(k){ var v=parseFloat(m[k]); return isNaN(v)?null:v; };
  var price=num('price'),ma50=num('ma50'),ma150=num('ma150'),ma200=num('ma200'),
      ma200prev=num('ma200prev'),ma50prev=num('ma50prev'),high52=num('high52'),low52=num('low52'),
      rs=num('rs'),weeks=num('weeks');

  if(price==null||ma50==null||ma150==null||ma200==null||high52==null||low52==null){
    setStatus('⚠️ 至少要有:現價、50/150/200均、52週高低。缺的補一下。','err'); return;
  }

  // —— Trend Template 8 條 ——
  var tt=[
    {t:'股價 > 150日 且 > 200日均', pass:(price>ma150 && price>ma200), v:''},
    {t:'150日均 > 200日均', pass:(ma150>ma200), v:''},
    {t:'200日均 向上(近1月)', pass:(ma200prev!=null? ma200>ma200prev : null), v:(ma200prev!=null?(((ma200/ma200prev-1)*100).toFixed(1)+'%'):'缺')},
    {t:'50日均 > 150日 且 > 200日均', pass:(ma50>ma150 && ma50>ma200), v:''},
    {t:'股價 > 50日均', pass:(price>ma50), v:''},
    {t:'離52週低 ≥ +30%', pass:((price/low52-1)>=0.30), v:'+'+((price/low52-1)*100).toFixed(0)+'%'},
    {t:'離52週高 跌幅 ≤ 25%', pass:((1-price/high52)<=0.25), v:'-'+((1-price/high52)*100).toFixed(0)+'%'},
    {t:'RS ≥ 70', pass:(rs!=null? rs>=70 : null), v:(rs!=null?String(rs):'缺')},
  ];
  var passCount=tt.filter(function(x){return x.pass===true;}).length;
  var hardFail=tt.some(function(x){return x.pass===false;});
  var hasNull=tt.some(function(x){return x.pass===null;});

  // —— 末段訊號(Stage 2 早 vs Stage 3 末)——
  var dev50=(price/ma50-1);                       // 離50均乖離
  var gainLow=(price/low52-1);                     // 離52週低漲幅
  var offHigh=(1-price/high52);                    // 離高點
  var slope50=(ma50prev!=null)?(ma50/ma50prev-1):null;
  var lateFlags=[]; 
  if(dev50>0.25) lateFlags.push('離50均乖離 +'+(dev50*100).toFixed(0)+'%(>25%,拉太開)');
  if(gainLow>0.90) lateFlags.push('離52週低已 +'+(gainLow*100).toFixed(0)+'%(漲幅巨大,衝頂風險)');
  if(slope50!=null && slope50<0.01) lateFlags.push('50均近3週走平/翻緩(動能轉弱)');
  if(weeks!=null && weeks>=10) lateFlags.push('突破已 '+weeks+' 週(成熟,非新鮮起漲)');
  if(offHigh<0.03 && gainLow>0.6) lateFlags.push('貼前高又漲多(末段churning風險)');

  var earlyFlags=[];
  if(dev50<0.10) earlyFlags.push('貼著50均(乖離小,起漲位置健康)');
  if(weeks!=null && weeks<=8) earlyFlags.push('突破 '+weeks+' 週內(新鮮)');
  if(slope50!=null && slope50>0.03) earlyFlags.push('50均陡上(動能強)');

  // —— 裁決 ——
  var stage;
  if(hardFail && !hasNull && passCount<6){
    // 結構壞掉:判 Stage 1 或 4
    var sub;
    if(ma200prev!=null && ma200<ma200prev && price<ma200) sub='下降結構,偏 Stage 4(走空)— 不碰';
    else if(price<ma50 && price<ma150) sub='均線糾結/壓在均線下,偏 Stage 1(底部)— 還沒起漲,等';
    else sub='不符上升結構,8條過 '+passCount+'/8 — 不夠格';
    stage={cls:'no',label:'非 Stage 2',sub:sub,tt:tt,passCount:passCount,
      metrics:{dev50:dev50,gainLow:gainLow,offHigh:offHigh},flags:lateFlags.concat(earlyFlags),proceed:false};
  } else if(hardFail || passCount<8){
    stage={cls:'no',label:'資格未滿',sub:'Trend Template 過 '+passCount+'/8'+(hasNull?'(有缺值,補齊再判)':'')+' — 尚不夠格進場',
      tt:tt,passCount:passCount,metrics:{dev50:dev50,gainLow:gainLow,offHigh:offHigh},flags:[],proceed:false};
  } else {
    // 8條全過 → 分早段/末段
    if(lateFlags.length>=2){
      stage={cls:'late',label:'Stage 3 末段',sub:'8/8 PASS,但出現 '+lateFlags.length+' 個末段訊號 = 高位陷阱,減碼別追',
        tt:tt,passCount:8,metrics:{dev50:dev50,gainLow:gainLow,offHigh:offHigh},flags:lateFlags,proceed:false};
    } else if(lateFlags.length===1){
      stage={cls:'late',label:'Stage 2 偏中段',sub:'8/8 PASS,1 個末段訊號需留意。可進但倉位收斂、停損更嚴',
        tt:tt,passCount:8,metrics:{dev50:dev50,gainLow:gainLow,offHigh:offHigh},flags:lateFlags.concat(earlyFlags),proceed:true};
    } else {
      stage={cls:'go',label:'Stage 2 早段',sub:'8/8 PASS,無末段訊號 = 該買的起漲位置。往下走四因子進場檢核',
        tt:tt,passCount:8,metrics:{dev50:dev50,gainLow:gainLow,offHigh:offHigh},flags:earlyFlags,proceed:true};
    }
  }
  state.stage=stage;
  renderStageGate();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function renderStageVerdict(){
  var s=state.stage;
  var h='<div class="verdict-bar vb-'+s.cls+'">';
  h+='<div class="vb-stage">'+(s.cls==='go'?'🟢 ':s.cls==='late'?'🟠 ':'🔴 ')+s.label+'</div>';
  h+='<div class="vb-sub">'+s.sub+'</div>';
  h+='<div class="vb-metrics">';
  h+='<div class="vb-metric">離50均<b>'+(s.metrics.dev50*100).toFixed(0)+'%</b></div>';
  h+='<div class="vb-metric">離52週低<b>+'+(s.metrics.gainLow*100).toFixed(0)+'%</b></div>';
  h+='<div class="vb-metric">離52週高<b>-'+(s.metrics.offHigh*100).toFixed(0)+'%</b></div>';
  h+='</div></div>';

  // Trend Template 檢核表
  h+='<div class="stage-card" style="margin-top:12px;"><div class="stage-title">📋 Trend Template '+s.passCount+'/8</div><div class="tt-list">';
  s.tt.forEach(function(x){
    var ic=x.pass===true?'✅':x.pass===false?'❌':'➖';
    var cls=x.pass===true?'tt-pass':x.pass===false?'tt-fail':'';
    h+='<div class="tt-row '+cls+'"><span class="tt-ic">'+ic+'</span><span class="tt-txt">'+x.t+'</span><span class="tt-val">'+(x.v||'')+'</span></div>';
  });
  h+='</div></div>';

  // 末段/起漲訊號
  if(s.flags && s.flags.length){
    h+='<div class="stage-card" style="margin-top:12px;"><div class="stage-title">🔎 訊號明細</div>';
    s.flags.forEach(function(f){ h+='<div style="font-size:12px;color:#5a4010;padding:5px 0;">• '+f+'</div>'; });
    h+='</div>';
  }

  // 行動
  if(s.proceed){
    h+='<button class="proceed-btn" onclick="enterTree()">→ 進入四因子進場決策</button>';
  } else {
    if(s.cls==='late'){
      h+='<div class="firewall-note">🚨 <b>防火牆 D 提醒</b>:這是末段/陷阱區,系統判定 NO。要覆蓋,必須湊滿「兩個獨立證據」並留紀錄,不准用單一強訊號(尤其大單)翻盤。</div>';
      h+='<button class="override-btn" onclick="enterTree()">我有兩個獨立證據,仍要進四因子(已留紀錄)</button>';
    } else {
      h+='<div class="firewall-note" style="border-color:#8a7050;color:#8a7050;">這檔不夠格(或還在底部/走空)。把判斷外包給系統 = 這裡停手,去看名單上下一檔。</div>';
    }
  }
  return h;
}

// Stage 過了 → 進入原本的決策樹(空手進場模式),並把能帶的答案預填
function enterTree(){
  state.mode='buy'; state.step=0; state.answers={};
  // 用 Stage 數值預填四因子裡的「漲幅/位置」相關題
  var g=state.stage && state.stage.metrics ? state.stage.metrics.gainLow : null;
  if(g!=null){
    if(g<0.20) state.answers.gain='0-20';
    else if(g<0.40) state.answers.gain='20-40';
    else if(g<0.60) state.answers.gain='40-60';
    else state.answers.gain='60+';
  }
  var rs=parseFloat(state.manual.rs);
  if(!isNaN(rs)){
    if(rs>=85) state.answers.rs='85+';
    else if(rs>=70) state.answers.rs='70-84';
    else if(rs>=50) state.answers.rs='50-69';
    else state.answers.rs='<50';
  }
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function skipToTree(){ renderMenu(); }

  var inp=document.getElementById('symInput2');
  if(inp) state.sym=inp.value.toUpperCase().trim();
  state.mode=mode; state.step=0; state.answers={};
  render();
}

function render(){
  var qs=state.mode==='buy'?BUY_QUESTIONS:HOLD_QUESTIONS;
  if(state.step>=qs.length){ renderResult(); return; }
  var q=qs[state.step],total=qs.length;
  var progressHtml='<div class="progress">';
  for(var i=0;i<total;i++){ var cls=i<state.step?'done':(i===state.step?'active':''); progressHtml+='<div class="pstep '+cls+'"></div>'; }
  progressHtml+='</div>';
  var optsHtml='';
  q.options.forEach(function(o){
    var sel=state.answers[q.key]===o.val?' sel':'';
    optsHtml+='<div class="opt'+sel+'" onclick="selectAnswer(\''+q.key+'\',\''+o.val+'\')"><span class="opt-emoji">'+o.emoji+'</span><div class="opt-txt">'+o.txt+(o.sub?'<div class="opt-sub">'+o.sub+'</div>':'')+'</div></div>';
  });
  var symLabel=state.sym?'<div style="font-size:11px;color:#c8952a;font-weight:700;margin-bottom:4px;">📌 '+state.sym+'</div>':'';
  var actionsHtml='<div class="actions">';
  if(state.step>0) actionsHtml+='<button class="btn btn-back" onclick="goBack()">← 上一題</button>';
  actionsHtml+='<button class="btn btn-reset" onclick="resetAll()">重新開始</button></div>';
  app.innerHTML=progressHtml+'<div class="qcard">'+symLabel+'<div class="qnum">第 '+(state.step+1)+' / '+total+' 題 · '+(state.mode==='buy'?'空手判斷':'持有判斷')+'</div><div class="qtitle">'+q.title+'</div><div class="qhint">'+q.hint+'</div><div class="opts">'+optsHtml+'</div></div>'+actionsHtml;
}

function selectAnswer(key,val){
  state.answers[key]=val;
  setTimeout(function(){ state.step++; render(); window.scrollTo({top:0,behavior:'smooth'}); },150);
}
function goBack(){ if(state.step>0){ state.step--; render(); } }
function resetAll(){
  state={mode:null,sym:state.sym,step:0,answers:{},stage:state.stage,metrics:null,manual:state.manual};
  renderStageGate();
}

function judgeBuy(a){
  var r={verdict:'',pos:'',emoji:'',vClass:'',reasons:[],warns:[],stop:'',target:''};
  if(a.sellSignal==='yes'){ r.verdict='❌ 跳過';r.pos='不進場';r.emoji='🚫';r.vClass='v-skip';r.warns.push('近15天有大單賣出訊號,主力可能在出貨。即使其他條件好也不該進場,等賣出訊號消退後再看。');return r; }
  if(a.gain==='60+'){ r.verdict='❌ 不追高';r.pos='不進場';r.emoji='🚫';r.vClass='v-skip';r.warns.push('距主力成本已漲超過60%,R/R比太差。等回測主力成本+20-30%區間再考慮。');return r; }
  if(a.rs==='<50'){ r.verdict='❌ 跳過';r.pos='不進場';r.emoji='🚫';r.vClass='v-skip';r.warns.push('RS低於50代表跑輸大盤。Minervini硬底線:跑輸的不碰。');return r; }
  if(a.breakout==='15+'){ r.verdict='⏸ 等回測';r.pos='不進場,等拉回';r.emoji='⏸';r.vClass='v-watch';r.reasons.push('突破超過15天,已錯過最佳進場窗口。等回測支撐位時再進。');return r; }
  if(a.rs==='50-69'){
    if(a.momentum==='both'||a.momentum==='one'){ r.verdict='🟡 輕倉試探';r.pos='倉位10%';r.emoji='🟡';r.vClass='v-watch';r.reasons.push('RS介於50-69屬「合格邊緣」,但有動能訊號,可能從普通轉強勢。');r.reasons.push('只能小倉位試探,停損嚴格;RS沒繼續上升立刻出場。'); }
    else { r.verdict='❌ 跳過';r.pos='不進場';r.emoji='🚫';r.vClass='v-skip';r.reasons.push('RS 50-69且無動能訊號。等RS升到70+或出現🔥再考慮。');return r; }
    r.stop='-7%(嚴格停損)';r.target='+15%(觀察RS變化)';return r;
  }
  if(a.momentum==='none'&&(a.rs==='85+'||a.rs==='70-84')){ r.verdict='🟡 高原期,觀望';r.pos='不進場';r.emoji='⏸';r.vClass='v-watch';r.reasons.push('RS高但動能訊號都消失,很可能進入高原期(盤整見頂)。');r.reasons.push('等✨新高或🔥上升回來再進,否則容易買在反轉前。');return r; }
  if(a.breakout==='pre'&&!a.gain){
    if(a.rs==='85+'){ r.verdict='👀 底部觀察';r.pos='先建底倉10-15%';r.vClass='v-watch';r.emoji='👀';r.reasons.push('強勢股(RS85+)但還沒突破,可先建小底倉試水。');r.reasons.push('等突破TR後再加碼到標準倉位。');r.stop='-8%';r.target='看突破後動能'; }
    else if(a.rs==='70-84'){ r.verdict='👀 底部觀察';r.pos='小倉位10%';r.vClass='v-watch';r.emoji='👀';r.reasons.push('合格股尚未突破,可小倉位觀察。');r.reasons.push('等突破放量再加碼,沒突破就停損。');r.stop='-8%';r.target='看突破後動能'; }
    else { r.verdict='⏸ 觀望';r.pos='不進場';r.vClass='v-watch';r.emoji='⏸';r.reasons.push('底部震盪+RS不夠強,不如等更明確的機會。'); }
    return r;
  }
  if(!a.gain) a.gain='0-20';
  if(a.gain==='0-20'){
    if(a.rs==='85+'&&a.momentum==='both'){ r.verdict='🚀 最佳進場!';r.pos='標準倉位30-50%';r.vClass='v-buy';r.emoji='🥇';r.reasons.push('強勢股+動能加速(✨+🔥)+低漲幅,是Minervini策略的黃金組合。');r.stop='-7% 至 -8%';r.target='+20-30%'; }
    else if(a.rs==='85+'){ r.verdict='🚀 強力買入';r.pos='倉位25-35%';r.vClass='v-buy';r.emoji='🚀';r.reasons.push('強勢股+低漲幅,進場位置優秀。');if(a.momentum==='one')r.reasons.push('動能部分展開,可能剛啟動或放緩中。');r.stop='-8%';r.target='+20%'; }
    else { r.verdict='👀 可進場';r.pos='倉位15-25%';r.vClass='v-buy';r.emoji='👀';r.reasons.push('RS合格+低漲幅,位置好但強度普通。');r.stop='-8%';r.target='+15-20%'; }
  } else if(a.gain==='20-40'){
    if(a.rs==='85+'&&a.momentum==='both'){ r.verdict='🚀 強力買入 · 倉位減半';r.pos='倉位15-25%';r.vClass='v-buy';r.emoji='🚀';r.reasons.push('雖已漲20-40%,但強勢股+動能加速仍值得進場。');r.reasons.push('倉位減半因距主力成本已有距離,R/R下降。');r.stop='-8%';r.target='+15-20%'; }
    else if(a.rs==='85+'||a.rs==='70-84'){ r.verdict='👀 輕倉試探';r.pos='倉位10-15%';r.vClass='v-watch';r.emoji='👀';r.reasons.push('已漲20-40%,強度合格但非最佳位置。');r.stop='-8%';r.target='+12-15%'; }
    else { r.verdict='⏸ 觀望';r.pos='不進場';r.vClass='v-watch';r.emoji='⏸';r.reasons.push('已漲一段+強度不夠,不如等更好的機會。');return r; }
  } else if(a.gain==='40-60'){
    if(a.rs==='85+'&&a.momentum==='both'){ r.verdict='⚠️ 輕倉試探';r.pos='倉位10-15%';r.vClass='v-watch';r.emoji='⚠️';r.reasons.push('已漲40-60%,即使強勢股也要控制倉位。');r.reasons.push('停損要比平常更嚴格(-6%),追高本身風險高。');r.stop='-6%(嚴格)';r.target='+10-15%'; }
    else { r.verdict='⏸ 觀望';r.pos='不進場';r.vClass='v-watch';r.emoji='⏸';r.reasons.push('漲幅已大+強度不頂尖,R/R太差,寧可等下一檔。');return r; }
  }
  if(a.breakout==='1-5'&&r.vClass==='v-buy') r.reasons.push('加分:剛突破1-5天,正是爆發期,倉位可取上限。');
  else if(a.breakout==='6-15'&&r.vClass==='v-buy') r.reasons.push('提醒:突破已6-15天,倉位取下限,別追最後一段。');
  else if(a.breakout==='pre') r.reasons.push('備註:尚未突破TR,可先建底倉,等突破放量再加碼。');
  return r;
}

function judgeHold(a){
  var r={verdict:'',pos:'',emoji:'',vClass:'',reasons:[],warns:[]};
  if(a.stop==='broken'){ r.verdict='🚨 立刻停損';r.pos='全部出場';r.emoji='🚨';r.vClass='v-skip';r.warns.push('已跌破主力成本-8%,硬性停損線。不管其他訊號,必須無條件出場。');r.warns.push('停損紀律是長期獲利的關鍵,別因「再等等看」擴大虧損。');return r; }
  if(a.sellSignal==='heavy'){ r.verdict='🚨 立刻減倉';r.pos='減倉50-70%';r.emoji='🚨';r.vClass='v-skip';r.reasons.push('近15天有2次以上大單賣出,主力明確在出貨。');r.reasons.push('即使技術沒破,籌碼已變壞,先減倉保護利潤。');return r; }
  if(a.macd==='down'){ r.verdict='🔴 減倉出場';r.pos='減倉50%';r.emoji='🔴';r.vClass='v-skip';r.reasons.push('MACD跌回零軸下,動能完整轉弱。');r.reasons.push('技術面警訊,搭配其他弱勢訊號應大幅減倉。');return r; }
  if(a.gainWeek==='crazy'){ r.verdict='🟡 減倉一半';r.pos='減倉30-50%';r.emoji='🟡';r.vClass='v-watch';r.reasons.push('一週漲20%以上屬過熱,短線有回調壓力。');r.reasons.push('先落袋一半,剩下繼續參與主升段。');return r; }
  if(a.rsState==='down'){ r.verdict='🟡 考慮減倉';r.pos='減倉30-40%';r.emoji='🟡';r.vClass='v-watch';r.reasons.push('RS走弱(一月下降10+)代表相對強度衰退。');r.reasons.push('即使絕對價格還在漲,Minervini會提前減倉,強度變化領先價格。');return r; }
  var score=0;
  if(a.rsState==='strong')score+=3; else if(a.rsState==='weaken')score+=1; else if(a.rsState==='gone')score-=1;
  if(a.macd==='strong')score+=2;
  if(a.sellSignal==='no')score+=1; else if(a.sellSignal==='light')score-=1;
  if(a.stop==='above')score+=1; else if(a.stop==='near')score-=1;
  if(a.gainWeek==='hot')score-=1;
  if(score>=5){ r.verdict='🟢 繼續持有';r.pos='維持倉位';r.emoji='🟢';r.vClass='v-buy';r.reasons.push('所有訊號都還在,主升段延續中。');r.reasons.push('Minervini原則:訊號不變就不動作,讓獲利奔跑。');if(a.rsState==='strong')r.reasons.push('✨+🔥都在=動能還在加速,可續抱到訊號衰退為止。'); }
  else if(score>=2){ r.verdict='🟡 減倉一半';r.pos='減倉30-50%';r.emoji='🟡';r.vClass='v-watch';r.reasons.push('訊號開始衰退但還沒破位,屬「動能放緩」階段。');r.reasons.push('先減倉一半落袋,剩下觀察;繼續弱化再全出。');if(a.stop==='near')r.warns.push('接近停損線,減倉後務必設好警示,跌破立刻全出。'); }
  else { r.verdict='🔴 大幅減倉';r.pos='減倉70%+';r.emoji='🔴';r.vClass='v-skip';r.reasons.push('多個訊號轉弱,主升段可能已結束。');r.reasons.push('保留少量(20-30%)觀察,重新轉強再加回。'); }
  return r;
}

function renderResult(){
  var r=state.mode==='buy'?judgeBuy(state.answers):judgeHold(state.answers);
  var qs=state.mode==='buy'?BUY_QUESTIONS:HOLD_QUESTIONS;
  var progressHtml='<div class="progress">';
  for(var i=0;i<qs.length;i++) progressHtml+='<div class="pstep done"></div>';
  progressHtml+='</div>';
  var symHtml=state.sym?'<div style="font-size:13px;color:#8a6e2f;font-weight:700;margin-bottom:6px;">📌 '+state.sym+'</div>':'';
  var h=progressHtml+'<div class="result"><div class="result-hero">'+symHtml+'<div class="result-emoji">'+r.emoji+'</div><div class="result-verdict '+r.vClass+'">'+r.verdict+'</div><div class="result-pos">建議:'+r.pos+'</div></div><div class="result-body">';
  if(state.stage) h+='<div class="result-row"><span class="result-lbl">🚦 Stage</span><span class="result-val">'+state.stage.label+'</span></div>';
  if(r.stop) h+='<div class="result-row"><span class="result-lbl">🛑 停損位</span><span class="result-val">'+r.stop+'</span></div>';
  if(r.target) h+='<div class="result-row"><span class="result-lbl">🎯 目標區</span><span class="result-val">'+r.target+'</span></div>';
  if(r.reasons.length){ h+='<div class="reason-box"><div class="reason-lbl">📊 為什麼?</div><div class="reason-txt">';r.reasons.forEach(function(x,i){h+=(i>0?'<br>• ':'• ')+x;});h+='</div></div>'; }
  if(r.warns.length){ h+='<div class="warn-box"><div class="warn-lbl">⚠️ 警訊</div><div class="warn-txt">';r.warns.forEach(function(x,i){h+=(i>0?'<br>• ':'• ')+x;});h+='</div></div>'; }
  h+='<div class="choices-recap"><b>📝 你的回答:</b><br>';
  qs.forEach(function(q){ var ans=state.answers[q.key];var opt=q.options.find(function(o){return o.val===ans;});if(opt)h+=(q.shortLabel||q.title)+' → <b>'+opt.txt+'</b><br>'; });
  h+='</div></div></div>';
  h+='<button class="restart" onclick="resetAll()">🔄 分析下一檔(回 Stage 審判)</button>';
  app.innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}

// ═══════════════════════════════════════════
// 啟動
// ═══════════════════════════════════════════
(function init(){
  try { if(window.self!==window.top) document.body.classList.add('iframe-mode'); }
  catch(e){ document.body.classList.add('iframe-mode'); }
  var params=new URLSearchParams(window.location.search);
  if(params.has('sym')) state.sym=(params.get('sym')||'').toUpperCase().trim();
  renderStageGate();
})();
</script>
