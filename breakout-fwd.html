function getSectors(){
  var stored=null;
  try{var s=localStorage.getItem(SKEY);if(s) stored=JSON.parse(s);}catch(e){}
  var defs=JSON.parse(JSON.stringify(SECTORS_DEFAULT));
  if(!stored||!Array.isArray(stored)) return defs.filter(function(x){return x.id!=='custom'||x.tickers.length;});
  var byName={},order=[];
  stored.forEach(function(sec){
    if(!sec||!sec.name) return;
    sec.tickers=sec.tickers||[];
    if(byName[sec.name]){ sec.tickers.forEach(function(t){ if(byName[sec.name].tickers.indexOf(t)<0) byName[sec.name].tickers.push(t); }); }
    else{ byName[sec.name]=sec; order.push(sec.name); }
  });
  var out=order.map(function(n){return byName[n];});
  var defByName={}; defs.forEach(function(d){defByName[d.name]=d;});
  out.forEach(function(sec){ var d=defByName[sec.name]; if(d){ sec.id=d.id; sec.icon=d.icon; } });
  var ids={}; out.forEach(function(sec){ids[sec.id]=true;});
  defs.forEach(function(d){ if(!ids[d.id] && d.id!=='custom') out.push(d); });
  return out.filter(function(sec){ return sec.id!=='custom' || (sec.tickers&&sec.tickers.length); });
}

async function fetchYahoo(t,retried){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(t)+'?interval=1d&range=2y&_cb='+Date.now();   // 時間戳：避免代理或中間層回傳舊快取
  var r=await fetch(PROXY+encodeURIComponent(base),{cache:'no-store'});
  if(r.status===429 && !retried){ await sleep(2000); return fetchYahoo(t,true); }
  if(!r.ok) throw new Error('Yahoo HTTP '+r.status);
  var data=await r.json();
  if(!data.chart||!data.chart.result||!data.chart.result[0]) throw new Error('Yahoo 沒有這檔的資料');
  return data.chart.result[0];
}
function rd3(x){return Math.round(x*1000)/1000;}
function parseBars(res){
  var ts=res.timestamp||[], q=res.indicators.quote[0];
  var B={d:[],o:[],h:[],l:[],c:[],v:[]};
  for(var i=0;i<ts.length;i++){
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i]){
      B.d.push(new Date(ts[i]*1000).toISOString().slice(0,10));
      B.o.push(rd3(q.open[i]));B.h.push(rd3(q.high[i]));B.l.push(rd3(q.low[i]));B.c.push(rd3(q.close[i]));B.v.push(q.volume[i]);
    }
  }
  if(B.c.length<20) throw new Error('資料太少（'+B.c.length+' 天）');
  B.nm=(res.meta&&(res.meta.longName||res.meta.shortName))||null;
  // Yahoo 的日線最後一根有時還沒更新到今天：用 meta 的最新成交價補上或更新

/* 第 N 天收盤相對進場價的漲跌（%）；N=1 是進場那天 */
function retN(e,N){ var B=e.B; return (e.i+N<B.c.length)?(B.c[e.i+N]/e.E-1)*100:null; }
/* 進場後 N 天內：最高漲到哪、最深跌到哪（相對進場價，小數） */
function pathN(e,N){
  var B=e.B; if(e.i+N>=B.c.length) return null; var mx=-1,mn=1;
  for(var j=e.i+1;j<=e.i+N;j++){ var u=B.h[j]/e.E-1, l=B.l[j]/e.E-1; if(u>mx) mx=u; if(l<mn) mn=l; }
  return {mfe:mx,mae:mn};
}
/* 模擬：停損＝進場價 − sa×ATR；停利＝進場價 + ta×ATR（ta=null 表示不設停利）；最多抱 H 天，到期收盤出。
   同一天既碰停損又碰停利時，保守算先碰停損；跳空超過停損／停利，以開盤價成交（會比預設更差／更好）。
   結果用 R 表示：1R＝停損距離（你願意賠的那一份）。cost＝來回成本（小數）。 */
function sim(e,H,sa,ta,cost){
  var B=e.B; if(e.i+H>=B.c.length) return null;
  var E=e.E, stop=E*(1-sa*e.a), tgt=ta==null?Infinity:E*(1+ta*e.a), px=null, kind='time';
  for(var j=e.i+1;j<=e.i+H;j++){
    var o=B.o[j], h=B.h[j], l=B.l[j];
    if(j>e.i+1){ if(o<=stop){ px=o; kind='stop'; break; } if(o>=tgt){ px=o; kind='target'; break; } }
    if(l<=stop){ px=stop; kind='stop'; break; }
    if(h>=tgt){ px=tgt; kind='target'; break; }
  }
  if(px==null) px=B.c[e.i+H];
  return {R:((px/E-1)-cost)/(sa*e.a),k:kind,r:(px/E-1)*100};
}
function simStat(evs,H,sa,ta,cost){
  var rs=[],st=0,tg=0,tm=0;
  evs.forEach(function(e){ var s=sim(e,H,sa,ta,cost); if(!s) return; rs.push(s.R); if(s.k==='stop') st++; else if(s.k==='target') tg++; else tm++; });
  var n=rs.length; return {n:n,avg:n?mean(rs):null,stop:n?st/n:null,tgt:n?tg/n:null,time:n?tm/n:null,rs:rs};
}

      var pv=el('paste').value.trim();
      if(pv){ try{ recs=JSON.parse(pv); if(!Array.isArray(recs)) throw 0; }catch(e){ pg.textContent='貼上的文字讀不懂，請在 dna 重新按「💾 複製備份」。'; btn.disabled=false; return; } }
      else { recs=await new Promise(function(res){ readIDB(function(v,err){ if(!v||!v.length){ pg.textContent=(err||'這個瀏覽器裡沒有找到 dna 的回測紀錄')+'。可以按「我要貼備份」，把 dna「💾 複製備份」的文字貼過來；或改選「30 日新高」。'; res(null); } else res(v); }); }); if(!recs){ btn.disabled=false; return; } }
      var need={}; recs.forEach(function(r){ if(r&&r.tk&&!BARS[r.tk]) need[r.tk]=1; });
      var nl=Object.keys(need); if(nl.length){ await loadMany(nl,function(d,n){ pg.textContent='補載 dna 紀錄裡的股票 '+d+'／'+n+' …'; }); }
    }
    pg.textContent='計算大盤寬度與板塊燈號時間線 …（約十幾秒）';
    await new Promise(function(r){ setTimeout(r,30); });
    buildBreadth(); buildTL();
    buildEvents();
    if(SRC==='dna') dnaSkip=buildFromDna(recs);
    finishEvents();
    if(EV.length<20){ pg.textContent='突破次數太少（'+EV.length+' 次），無法比較。'; btn.disabled=false; return; }
    pg.textContent='完成：'+(SRC==='dna'?'dna 回測紀錄 '+EV.length+' 筆（另有 '+dnaSkip+' 筆缺資料略過）':'收盤創 30 日新高的突破 '+EV.length+' 次')+'；對照組（任何一天）'+BASE.length+' 筆；價格資料到 '+BARS['SPY'].d[BARS['SPY'].d.length-1]+'。';
    renderAll();
  }catch(e){ pg.textContent='出錯：'+(e&&e.message||e); }
  btn.disabled=false;
}
async function init(){
  try{ migrateNames2(); }catch(e){}
  SECS=getSectors().filter(function(s){ return s.tickers&&s.tickers.length>=3; });
  var tick={'SPY':1}; SECS.forEach(function(s){ s.tickers.forEach(function(t){ tick[t]=1; }); });
  var list=Object.keys(tick).filter(function(t){ return !BARS[t]; });
  await loadMany(list,function(d,tot){ el('prog').textContent='載入價格 '+d+'／'+tot+' …（第一次要一兩分鐘；20 分鐘內開過 charts 的話會用同一份快取）'; });
  if(!BARS['SPY']){ el('prog').textContent='沒抓到大盤（SPY）資料，請稍後按重新整理。'; return; }
  SECS.forEach(function(s){ s.tickers.forEach(function(t){ (T2S[t]=T2S[t]||[]).push(s.name); }); var l=s.tickers.filter(function(t){ return BARS[t]; }).map(function(t){ return {t:t,B:BARS[t],o:{}}; }); if(l.length>=3) LISTS[s.name]=l; });
  el('prog').textContent='價格資料到 '+BARS['SPY'].d[BARS['SPY'].d.length-1]+'，共 '+Object.keys(T2S).filter(function(t){ return BARS[t]; }).length+' 檔。選好樣本來源，按「開始」。';
  el('btnGo').disabled=false;
}

init();
</script>
