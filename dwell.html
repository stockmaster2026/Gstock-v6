<h1>⏱ 領先停留天數 v0.12</h1>
<div class="sub dim">問題：股票「進入 RRG 領先」之後，通常會待幾個交易日？用現在 rrg.html 同一套引擎（日線、平滑 5 天）、同一份板塊名單，往回看每一次進入領先。這是參考用的統計，不是買賣訊號。</div>
<div class="ctl"><button id="go">開始分析（約 2–3 分鐘）</button>
<select id="mode"><option value="strict">結束＝掉出領先 1 天就算</option><option value="tol">結束＝連續 3 天以上掉出才算</option></select></div>
<div id="status">按「開始分析」會抓全部名單內個股兩年日線。</div><div id="out"></div>
<script>// ===== dwell.html 邏輯 =====
var VER='v0.12';
var SM_WIN=5, LR_WIN=63, MOM_SPAN=10, NORM_WIN=252, NORM_MIN=40, MOM_GAIN_MAX=4, AXIS_CLAMP=40;
var WARMUP=SM_WIN+LR_WIN+NORM_MIN+MOM_SPAN, DAYS_NEEDED=460;
var rrgInterval='1d';
function scoreRsLevel(){return null;}function scoreAbsTrend(){return null;}function scoreShape(){return null;}function scoreVolume(){return null;}function rankScore(){return null;}function defenseEvents(){return null;}
  function winMean(arr, i, n) {
    if (i-n+1 < 0) return null;
    var s=0;
    for(var k=i-n+1;k<=i;k++){ var v=arr[k]; if(v===null||!isFinite(v)) return null; s+=v; }
    return s/n;
  }
  // arr[0..i] 裡最後 maxN 個非 null 值的標準差（後視窗口，不含未來）
  function trailStd(arr, i, maxN, minN) {
    var v=[];
    for(var k=i;k>=0&&v.length<maxN;k--){ var x=arr[k]; if(x!==null&&isFinite(x)) v.push(x); }
    if (v.length<minN) return null;
    var m=0; for(var a=0;a<v.length;a++) m+=v[a]; m/=v.length;
    var s2=0; for(var b=0;b<v.length;b++){ var d=v[b]-m; s2+=d*d; }
    var sd=Math.sqrt(s2/(v.length-1));
    return (isFinite(sd)&&sd>0)?sd:null;
  }

  function clampAxis(v) {
    if(!isFinite(v)) return 100;
    if(v>100+AXIS_CLAMP) return 100+AXIS_CLAMP;
    if(v<100-AXIS_CLAMP) return 100-AXIS_CLAMP;
    return v;
  }

  var BUF_FRAC=0.30, BUF_MIN=0.30, BUF_MAX=3.0;
  function axisSd(arr) {
    if(!arr||arr.length<10) return 1;
    var m=0,n=arr.length;
    for(var i=0;i<n;i++) m+=arr[i]; m/=n;
    var s2=0; for(var j=0;j<n;j++){ var d=arr[j]-m; s2+=d*d; }
    var sd=Math.sqrt(s2/(n-1));
    return (isFinite(sd)&&sd>0)?sd:1;
  }
  function bufOf(sd) { return Math.min(Math.max(sd*BUF_FRAC, BUF_MIN), BUF_MAX); }
  function wmaAt(arr, i, n) {
    if (i-n+1 < 0) return null;
    var s=0, w=0;
    for(var k=0;k<n;k++){ var v=arr[i-n+1+k]; if(v===null||!isFinite(v)) return null; s+=v*(k+1); w+=(k+1); }
    return s/w;
  }
  function calculateRRG(sectorCloses, spyCloses, secVols) {
    var N=Math.min(sectorCloses.length, spyCloses.length);
    if (N<WARMUP+2) return { ratios:[], moms:[] };

    // ① 對數相對強度線。取 log 的用意：斜率就是「每天贏幾 %」，與股價絕對水準無關，
    //    所以 4 元的股票和 400 元的股票放在同一張圖上才有可比性。
    var lr=[];
    for(var i=0;i<N;i++){
      var sp=sectorCloses[i], bp=spyCloses[i];
      if(!(sp>0)||!(bp>0)){ lr.push(null); continue; }
      lr.push(Math.log(sp/bp)*100);
    }

    // ② RS-Ratio = 對數 RS 線偏離自己 63 根均線的幅度（單位：%），以 100 為中心。
    //    形式跟舊版同源，差別只在窗口 10 → 63，但差別是決定性的：
    //    對一條以固定速率上升的 RS 線，「偏離長均線」≈ 斜率 × (窗口/2)，
    //    窗口 10 的放大倍數只有 ~4.5，窗口 63 是 ~31 —— 前者分不出強弱，後者分得出。
    //    取 log 讓它與股價水準無關，上下對稱，4 元和 400 元的股票可以放同一張圖。
    // v2.14.0：先平滑（WMA）。平滑後的值 sm[j] 才拿去跟自己 LR_WIN 根均值比。
    var sm=[];
    for(var si=0;si<N;si++) sm.push(wmaAt(lr,si,SM_WIN));
    var dev=[];
    for(var j=0;j<N;j++){
      var m=winMean(sm,j,LR_WIN);
      dev.push((m===null||sm[j]===null)?null:(sm[j]-m));
    }
    var ratioAll=[];
    for(var p=0;p<N;p++){
      ratioAll.push(dev[p]===null?null:clampAxis(100+dev[p]));
    }

    // ③ RS-Momentum = RS-Ratio 的變化量（官方：是 RS-Ratio 的 ROC，
    //    不是價格動能、也不是原始 RS 線的動能），再做 normalize —— 舊版缺掉這一步。
    //    normalize 用「兩軸標準差比」當增益，讓 x/y 尺度相同，圖上的 45 度線才有意義。
    //    增益設上限：平滑序列的 momRaw 本身趨近 0，乘上有限增益仍然趨近 0，不會爆。
    var momRaw=[];
    for(var q=0;q<N;q++){
      var a=dev[q], b=(q-MOM_SPAN>=0)?dev[q-MOM_SPAN]:null;
      momRaw.push((a===null||b===null)?null:(a-b));
    }
    var momAll=[];
    for(var t=0;t<N;t++){
      var mr=momRaw[t];
      if(mr===null){ momAll.push(null); continue; }
      var sdR=trailStd(dev,t,NORM_WIN,NORM_MIN);
      var sdM=trailStd(momRaw,t,NORM_WIN,NORM_MIN);
      var gain=1;
      if(sdR!==null&&sdM!==null) gain=Math.min(sdR/sdM, MOM_GAIN_MAX);
      momAll.push(clampAxis(100+mr*gain));
    }

    // ④ 只輸出兩軸同時有值的點，並保持 ratios[i] 與 moms[i] 成對（下游全部依賴這個前提）
    var ratios=[], moms=[];
    for(var z=0;z<N;z++){
      if(ratioAll[z]===null||momAll[z]===null) continue;
      ratios.push(ratioAll[z]); moms.push(momAll[z]);
    }

    // ⑤ 這一檔自己的「邊界死區」。舊版是固定 ±1.0，但 RS-Ratio 的實際全幅只有 5.8，
    //    ±1.0 就吃掉 78% 的日子；而波動大的股票又等於沒有死區 —— 不是尺度無關的。
    //    改成按這一檔自己的振幅抓比例，讓死區在每一檔身上代表同樣的「幾乎沒動」。
    var sdR=axisSd(ratios), sdM=axisSd(moms);
    var buf={ r:bufOf(sdR), m:bufOf(sdM), sdR:sdR, sdM:sdM };

    // ⑥ 排名分數（v2.8）。RRG 的角色是排序，所以這裡一併算出來。
    var _rsNow = ratios.length ? ratios[ratios.length-1] : null;
    var sRs    = scoreRsLevel(_rsNow);
    var sAbs   = scoreAbsTrend(sectorCloses);
    var sShape = scoreShape(lr);
    var sVol   = scoreVolume(secVols);
    var rank = rankScore({ rs:sRs,
                           abs:(sAbs?sAbs.score:null),
                           shape:(sShape?sShape.score:null),
                           vol:(sVol?sVol.score:null) });
    return { ratios:ratios, moms:moms, buf:buf,
             rank:rank, rsPart:sRs, absPart:sAbs, shapePart:sShape, volPart:sVol,
             defense: defenseEvents(sectorCloses, secVols) };
  }

  function readRadarSectors() {

      var raw = localStorage.getItem(STORAGE_KEY_RADAR);

    // v2.13.0：舊名單裡還是「AI 電力與散熱」一組的，自動換成拆開後的兩組（發電端／設備端）。已存的名單不會被其他改動影響。

    function rr(lbl,s){ return '<tr><td>'+lbl+'</td><td>'+s.n+'</td><td><b>'+(s.n?sgn(s.med):'—')+'</b></td><td>'+(s.n?sgn(s.medRel):'—')+'</td><td>'+(s.n?pp(s.up):'—')+'</td><td>'+(s.n?pp(s.beat):'—')+'</td><td>'+(s.n?sgn(s.p10):'—')+'</td><td>'+(s.n?pp(s.on):'—')+'</td></tr>'; }
    h+='<div style="margin:8px 0;padding:10px 12px;border:1px solid #00d4a855;border-radius:8px"><div style="font-weight:800;margin-bottom:6px">🎯 候選名單追蹤：當時挑的候選，後來表現比「其他領先中的股票」好嗎？</div>'
     +'<div style="overflow-x:auto"><table><tr class="th"><td>組別</td><td>檔數</td><td>到現在中位數漲跌</td><td>相對大盤</td><td>漲的比例</td><td>贏大盤的比例</td><td>最差 1 成</td><td>現在還在領先</td></tr>'+rr('候選（板塊領先＋≤8 天＋Stage 2 低位）',sc)+rr('其他領先中的股票（對照組）',so)+'</table></div>'
     +(rows?'<div style="overflow-x:auto;margin-top:6px"><table><tr class="th"><td>當時日期</td><td>候選</td><td>當時</td><td>到現在漲跌</td><td>相對大盤</td><td>現在</td></tr>'+rows+'</table></div>':'')
     +'<div class="sub dim">白話：「漲的比例」和「贏大盤的比例」就是這個篩法的準確率。候選如果明顯比對照組好（例如漲的比例高、最差 1 成比較淺），代表這個篩法有用；差不多，就代表只看這些條件分不出好壞。檔數很少時（不到 30 檔）只能當線索，要累積幾次才有意義。漲跌是從當時收盤到最新收盤，經過的天數不同。</div></div>';
  })();
  h+=imprTrack(old);
  h+='<div class="sub">白話：下面拿「當時存下的判斷」去對照「後來實際發生什麼」。判斷對不對，要看很多檔的平均，不要看單一檔。</div>';
  h+='<table><tr class="th"><td>個股判斷</td><td>當時預測</td><td>實際</td><td>樣本</td></tr>'
   +'<tr><td>「至少再待 5 天」</td><td>平均 '+(avgP==null?'—':avgP+'%')+' 會做到</td><td><b>'+(rate(st5)==null?'—':rate(st5)+'%')+'</b> 做到</td><td>'+st5.length+'</td></tr>'
   +'<tr><td>「至少再待到預測的中位數天數」</td><td>約 50% 會做到</td><td><b>'+(rate(stR)==null?'—':rate(stR)+'%')+'</b> 做到</td><td>'+stR.length+'</td></tr></table>';
  var pr='<table style="margin-top:8px"><tr class="th"><td>個股當時的 K 線位置</td><td>檔數</td><td>到現在的中位數漲跌</td><td>漲的比例</td><td>最差 1 成</td><td>歷史對照（10 天：中位數／最差 1 成）</td></tr>';
  ['low','mid','far','non'].forEach(function(k){ var v=priceG[k]; var up=v.length?Math.round(v.filter(function(x){return x>0;}).length/v.length*100):null; pr+='<tr><td><span style="color:'+POSCOL[k]+'">'+POSNAME[k]+'</span></td><td>'+v.length+'</td><td><b>'+sgn(med(v))+'</b></td><td>'+(up==null?'—':up+'%')+'</td><td>'+sgn(pct(v,0.1))+'</td><td>'+sgn(PGm.H[k].med10)+'／'+sgn(PGm.H[k].p10)+'</td></tr>'; });
  pr+='</table>';
  h+=pr;
  h+='<div style="overflow-x:auto;margin-top:8px"><table><tr class="th"><td>當時日期</td><td>板塊</td><td>當時判斷</td><td>現在</td><td>對不對</td></tr>'+srows+'</table></div>';
  h+='<div class="sub dim">怎麼看：「至少再待 5 天」實際做到的比例，如果跟當時預測的平均差不多，代表 ⑬ 的統計在最近這段時間還管用；差很多（例如預測 56% 實際只有 30%），代表行情變了，統計要重新看。個股漲跌是從當時的收盤到最新收盤，經過的天數不一樣，歷史對照只是大概參考。樣本少時（不到 30 檔）只能當線索。</div></div>';
  return h;
}

function initTimeline(){
  var sel=el('tlSec'); if(!sel||!RES) return;
  var names=Object.keys(RES.secIdx||{}); sel.innerHTML=names.map(function(n){return '<option>'+n+'</option>';}).join('');
  var prev=window.__tlSec; if(prev&&names.indexOf(prev)>=0) sel.value=prev;
  var pw=window.__tlWin; if(pw) el('tlWin').value=pw;
  sel.onchange=function(){ window.__tlSec=sel.value; drawTimeline(); }; el('tlWin').onchange=function(){ window.__tlWin=el('tlWin').value; drawTimeline(); };
  drawTimeline();
}
function drawTimeline(){
  var sn=el('tlSec').value, W=parseInt(el('tlWin').value,10), si=RES.secIdx[sn]; if(!si){ el('tlOut').innerHTML=''; return; }
  var sc=RES.secs.filter(function(s){return s.name===sn;})[0]; if(!sc) return;
  var dts=si.dts.slice(-W), n=dts.length, wk=['日','一','二','三','四','五','六'];
  var mem=sc.stocks.map(function(t){return String(t||'').toUpperCase().trim();}).filter(function(t){return RES.per[t];});
  var rows=[];
  mem.forEach(function(t){ var P=RES.per[t], arr=[], any=false, i;
    for(i=0;i<n;i++){ var v=P.leadMap[dayKey(dts[i])]; arr.push(v===true); if(v===true) any=true; }
    if(!any) return;
    // 找出每一段連續領先（窗內）
    var runs=[], st=-1; for(i=0;i<n;i++){ if(arr[i]&&st<0) st=i; if((!arr[i]||i===n-1)&&st>=0){ var en=arr[i]?i:i-1; runs.push({s:st,e:en}); st=-1; } }
    // 視窗第一天就在領先 → 往窗外回推真正的進入日
    var pidx0=-1; for(i=0;i<P.dts.length;i++){ if(dayKey(P.dts[i])===dayKey(dts[0])){ pidx0=i; break; } }
    function trueStart(rs){ if(rs.s>0||pidx0<0) return {ts:dts[rs.s],extra:0,clip:false}; var q=pidx0; while(q>0&&P.lead[q-1]) q--; return {ts:P.dts[q],extra:pidx0-q,clip:true}; }
    var fr=trueStart(runs[0]), lr=runs[runs.length-1], ls=trueStart(lr);
    rows.push({t:t,arr:arr,firstTs:fr.ts,firstClip:fr.clip,lastTs:ls.ts,lastClip:ls.clip,lastDays:(lr.e-lr.s+1)+ls.extra,lastOn:(lr.e===n-1),inWinFirst:(runs.filter(function(r){return r.s>0;})[0]||null)}); });
  rows.sort(function(x,y){ return x.firstTs-y.firstTs; });
  var sarr=[]; for(var i=0;i<n;i++) sarr.push(si.leadMap[dayKey(dts[i])]===true);
  function cells(arr,col){ return '<span class="cells">'+arr.map(function(b){return '<i style="background:'+(b?col:'#0d1220')+'"></i>';}).join('')+'</span>'; }
  function dstr(ts){ var d=new Date(ts*1000); return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+'（'+wk[d.getUTCDay()]+'）'; }
  var h='<div class="tl"><div class="tlrow"><span class="tk"><b>'+sn+'（板塊整體）</b></span>'+cells(sarr,'#ffd166')+'<span class="nt"></span></div>';
  rows.forEach(function(r){ h+='<div class="tlrow"><span class="tk">'+r.t+'</span>'+cells(r.arr,'#00d4a8')+'<span class="nt">'+(r.firstClip?'<span style="color:#ffb454">窗前就在領先</span> · ':'')+'最近一次 '+dstr(r.lastTs)+' 進入，'+(r.lastClip?'已':'待')+' '+r.lastDays+' 天'+(r.lastOn?'・<b style="color:#00d4a8">還在領先</b>':'')+'</span></div>'; });
  var ax=''; var lastM=-1; var axc=''; for(var q=0;q<n;q++){ var d=new Date(dts[q]*1000), m=d.getUTCMonth(); axc+='<i>'+(m!==lastM?(m+1)+'月':'')+'</i>'; lastM=m; }
  h+='<div class="tlrow"><span class="tk"></span><span class="cells ax">'+axc+'</span><span class="nt"></span></div></div>';
  var clipN=rows.filter(function(r){return r.firstClip;}).length, inw=rows.filter(function(r){return !r.firstClip;}).map(function(r){return r.firstTs;}).sort(function(a,b){return a-b;});
  var onN=rows.filter(function(r){return r.lastOn;}).length;
  h+='<div class="sub dim">在這段期間，板塊裡共 '+mem.length+' 檔中有 '+rows.length+' 檔進過領先；其中 <b>'+clipN+'</b> 檔在視窗第一天就已經在領先（橘字「窗前就在領先」，它們真正的進入日在視窗之前，排序用的是回推出來的真正進入日）；目前還在領先的有 '+onN+' 檔。'+(inw.length?'視窗內第一次才進入的最早是 '+dstr(inw[0])+'、最晚是 '+dstr(inw[inw.length-1])+'。':'')+'右邊寫的是「最近一次」連續領先的進入日與天數（還在領先就算到最後一天）。白話：如果真的是「接棒」，綠色會像階梯，一批一批往右移；如果是同時出現、同時消失，就不是接棒。黃色那列是整個板塊的指數。</div>';
  el('tlOut').innerHTML=h;
}
window.addEventListener('DOMContentLoaded',function(){ el('go').addEventListener('click',run); el('mode').addEventListener('change',render); });
