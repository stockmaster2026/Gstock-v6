function getSectors(){
  var stored=null;
  try{var s=localStorage.getItem(SKEY);if(s) stored=JSON.parse(s);}catch(e){}

  if(!stored||!Array.isArray(stored)) return defs.filter(function(x){return x.id!=='custom'||x.tickers.length;});
  var byName={},order=[];
  stored.forEach(function(sec){
    if(!sec||!sec.name) return;
    sec.tickers=sec.tickers||[];
    if(byName[sec.name]){ sec.tickers.forEach(function(t){ if(byName[sec.name].tickers.indexOf(t)<0) byName[sec.name].tickers.push(t); }); }
    else{ byName[sec.name]=sec; order.push(sec.name); }
  });
  var out=order.map(function(n){return byName[n];});
  var defByName={}; defs.forEach(function(d){defByName[d.name]=d;});
  out.forEach(function(sec){ var d=defByName[sec.name]; if(d){ sec.id=d.id; sec.icon=d.icon; } });
  var ids={}; out.forEach(function(sec){ids[sec.id]=true;});
  defs.forEach(function(d){ if(!ids[d.id] && d.id!=='custom') out.push(d); });
  return out.filter(function(sec){ return sec.id!=='custom' || (sec.tickers&&sec.tickers.length); });
}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function fetchYahoo(t,retried){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(t)+'?interval=1d&range=2y&_cb='+Date.now();   // 時間戳：避免代理或中間層回傳舊快取
  var r=await fetch(PROXY+encodeURIComponent(base),{cache:'no-store'});
  if(r.status===429 && !retried){ await sleep(2000); return fetchYahoo(t,true); }
  if(!r.ok) throw new Error('Yahoo HTTP '+r.status);
  var data=await r.json();
  if(!data.chart||!data.chart.result||!data.chart.result[0]) throw new Error('Yahoo 沒有這檔的資料');
  return data.chart.result[0];
}
function rd3(x){return Math.round(x*1000)/1000;}
function parseBars(res){
  var ts=res.timestamp||[], q=res.indicators.quote[0];
  var B={d:[],o:[],h:[],l:[],c:[],v:[]};
  for(var i=0;i<ts.length;i++){
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i]){
      B.d.push(new Date(ts[i]*1000).toISOString().slice(0,10));
      B.o.push(rd3(q.open[i]));B.h.push(rd3(q.high[i]));B.l.push(rd3(q.low[i]));B.c.push(rd3(q.close[i]));B.v.push(q.volume[i]);
    }
  }
  if(B.c.length<20) throw new Error('資料太少（'+B.c.length+' 天）');

  var h='<div class="box"><div class="verdict" style="background:#eef6ee;color:#1f6f3a">'+(G.watch.length?'有 '+G.watch.length+' 檔「放量偏準備＋板塊順風」，可以先放進觀察名單':'這次沒有「放量偏準備＋板塊順風」的股票')+'</div><div class="sub">共 '+out.length+' 檔量 ≥ '+thr+' 倍（'+(W===1?'最新一天':'近 '+W+' 天內')+'）。<b>「觀察名單」只是「值得多看一眼」，不是買進訊號</b>；要不要買，還是看它自己的 pivot／DNA。DNA 的 pivot 標籤這版還沒接。</div></div>';
  h+=sect('★ 觀察名單候選：放量偏準備＋板塊順風','#1f6f3a',G.watch,'量大、價格收強、位置還不高，而且所屬板塊現在是順風。',true);
  h+=sect('放量偏準備，但板塊不順','#c0600a',G.weak,'股票本身的量價像在吃貨，但板塊在小心／逆風，先留意就好。',false);
  h+=sect('偏出貨：先排除','#b3262e',G.dist,'量大但價格是弱的或已經漲多，比較像賣壓或高潮量。',false);
  h+=sect('看不出來','#667',G.unk,'量大，但價格和位置沒有清楚偏向。',false);
  el('scanOut').innerHTML=h;
}
// ───────── 回測 ─────────
function runBt(){
  var btn=el('btBtn')||el('btnBt'); btn.disabled=true; var outEl=el('btOut'); outEl.innerHTML='<div class="sub">計算中…</div>';
  var S=BARS['SPY'], uni=Object.keys(T2S).filter(function(t){return BARS[t];}), ti=0;
  var GR=[]; // {g:groupKey, r20,r60,stop,beat}
  var rows=[];
  var last={};
  function add(g,t,i,r){ var key=g+'|'+t; if(last[key]!=null&&i-last[key]<5) return; last[key]=i; rows.push({g:g,r:r}); }
  function step(){
    var end=Math.min(uni.length,ti+6);
    for(;ti<end;ti++){
      var t=uni[ti], B=BARS[t], n=B.c.length;
      for(var i=60;i+21<n;i++){
        var f=feat(B,i); if(!f) continue;
        var e=B.o[i+1]; if(!(e>0)) continue;
        var j=S.map[B.d[i]]; if(j==null||j+21>=S.c.length) continue;
        var r20=B.c[i+20]/e-1, s20=S.c[j+20]/S.o[j+1]-1;
        var r60=(i+61<n&&j+61<S.c.length)?B.c[i+60]/e-1:null;
        var mn=1e9; for(var k=i+1;k<=i+20;k++) if(B.l[k]<mn) mn=B.l[k];
        var r={r20:r20,r60:r60,stop:mn<=e*0.92,beat:r20>s20};
        var cl=classify(f), gs=['全部日子'];
        gs.push(f.rv<1?'量 <1 倍（量縮）':f.rv<1.5?'量 1～1.5 倍':f.rv<2?'量 1.5～2 倍':f.rv<3?'量 2～3 倍':'量 ≥3 倍');
        if(f.rv>=1.5){
          gs.push('放量(≥1.5倍)・'+KN[cl.k]);
          gs.push('放量(≥1.5倍)・'+(f.chg>0.005?'上漲日':f.chg<-0.005?'下跌日':'平盤日')+'・收在'+(f.cp>=0.6?'上段':f.cp<=0.4?'下段':'中段'));
          gs.push('放量(≥1.5倍)・離50日線'+(f.ext<-0.05?'下方 >5%':f.ext<0.05?'±5% 內':f.ext<0.15?'上方 5～15%':f.ext<0.25?'上方 15～25%':'上方 >25%'));
          gs.push('放量(≥1.5倍)・離1年高點'+(f.nearHi>-0.03?'<3%':f.nearHi>-0.10?'3～10%':f.nearHi>-0.20?'10～20%':'>20%'));
        }
        if(f.rv>=2&&f.top) gs.push('爆量(≥2倍)且是近3個月最大量');
        gs.forEach(function(g){ add(g,t,i,r); });
      }
    }
    outEl.innerHTML='<div class="sub">計算中 '+ti+'／'+uni.length+' 檔…</div>';
    if(ti<uni.length) return setTimeout(step,0);
    render(); btn.disabled=false;
  }
  function stat(g){ var a=rows.filter(function(x){return x.g===g;}).map(function(x){return x.r;}); if(!a.length) return null;
    var r60=a.filter(function(x){return x.r60!=null;}).map(function(x){return x.r60;});
    return {n:a.length,avg:mean(a.map(function(x){return x.r20;})),med:med(a.map(function(x){return x.r20;})),win:a.filter(function(x){return x.r20>0;}).length/a.length,beat:a.filter(function(x){return x.beat;}).length/a.length,stop:a.filter(function(x){return x.stop;}).length/a.length,m60:med(r60)}; }
  function line(g,base){ var s=stat(g); if(!s) return ''; var d=base?s.med-base.med:null; var cls=function(v){return v>=0?'pos':'neg';};
    return '<tr><td><b>'+g+'</b></td><td>'+s.n+'</td><td class="'+cls(s.med)+'">'+pc1(s.med)+'</td><td>'+pc1(s.avg)+'</td><td>'+Math.round(s.win*100)+'%</td><td>'+Math.round(s.beat*100)+'%</td><td>'+Math.round(s.stop*100)+'%</td><td>'+pc1(s.m60)+'</td></tr>'; }
  function table(title,gs,base,note){
    var body=gs.map(function(g){return line(g,base);}).join(''); if(!body) return '';
    return '<div style="margin-top:12px"><div style="font-weight:900;font-size:15.5px">'+title+'</div><div class="tw"><table class="t"><tr><th>情況</th><th>次數</th><th>20 天中位數</th><th>平均</th><th>20 天賺錢</th><th>贏過大盤</th><th>碰停損 8%</th><th>60 天中位數</th></tr>'+line('全部日子',null)+body+'</table></div>'+(note?'<div class="read">'+note+'</div>':'')+'</div>'; }
  function cmp(g,base){ var s=stat(g); if(!s||!base) return null; var d=(s.med-base.med)*100, e=(s.stop-base.stop)*100;
    var v=s.n<30?'次數太少（'+s.n+'），不能下結論':(Math.abs(d)<1.5?'看不出差別':(d>0?'比基準好':'比基準差'));
    return {s:s,d:d,e:e,v:v}; }
  function render(){
    var base=stat('全部日子'); if(!base){ outEl.innerHTML='<div class="box">資料不夠。</div>'; return; }
    var P=cmp('放量(≥1.5倍)・偏準備',base), D=cmp('放量(≥1.5倍)・偏出貨',base), B2=cmp('量 ≥3 倍',base), T3=cmp('爆量(≥2倍)且是近3個月最大量',base);
    var verdict, vc;
    if(!P||P.s.n<30){ verdict='放量偏準備的次數太少，還不能下結論。'; vc='#eee;color:#445'; }
    else if(Math.abs(P.d)<1.5){ verdict='在你這批股票裡，「放量偏準備」之後 20 天，<b>跟隨便哪一天買看不出差別</b>（中位數差 '+P.d.toFixed(1)+' 個百分點）。目前證據不支持把量當成預測因子。'; vc='#fff3d6;color:#8a5a00'; }
    else if(P.d>0){ verdict='「放量偏準備」之後 20 天，中位數比隨便哪一天買高 <b>'+P.d.toFixed(1)+' 個百分點</b>（弱證據：只有約 2 年、同一段行情）。量可能有一點預測力，值得繼續驗證。'; vc='#eef6ee;color:#1f6f3a'; }
    else { verdict='「放量偏準備」之後 20 天，中位數反而比隨便哪一天買低 <b>'+(-P.d).toFixed(1)+' 個百分點</b>。這個分法目前沒有幫助。'; vc='#fbeaea;color:#b3262e'; }
    var h='<div class="verdict" style="background:'+vc+'">'+verdict+'</div>';
    h+='<div class="read"><b>白話：</b>基準（隨便哪一天買）20 天中位數 '+pc1(base.med)+'、'+Math.round(base.win*100)+'% 的時候有賺、'+Math.round(base.stop*100)+'% 的時候 20 天內碰到 8% 停損。下面每一行都跟這條基準比：<b>差不到 1.5 個百分點、或次數不到 30，都當作「看不出差別」。</b>'+(D&&D.s.n>=30?' 「偏出貨」那組中位數 '+pc1(D.s.med)+'，'+(D.d<=-1.5?'確實比基準差，排除它有道理。':(D.d>=1.5?'反而比基準好，代表我的出貨判斷可能不準。':'跟基準差不多，代表目前分不出出貨。')):'')+'</div>';
    h+=table('A. 量放大到幾倍',['量 <1 倍（量縮）','量 1～1.5 倍','量 1.5～2 倍','量 2～3 倍','量 ≥3 倍','爆量(≥2倍)且是近3個月最大量'],base,'');
    h+=table('B. 放量（≥1.5 倍）時，我分的「準備／出貨」準不準',['放量(≥1.5倍)・偏準備','放量(≥1.5倍)・偏出貨','放量(≥1.5倍)・看不出來'],base,'');
    h+='<details><summary>C. 拆開看：是價格還是位置在起作用？（細項）</summary>'+
      table('C1. 放量當天的漲跌與收位',['上漲日','平盤日','下跌日'].reduce(function(a,d){ ['上段','中段','下段'].forEach(function(p){ a.push('放量(≥1.5倍)・'+d+'・收在'+p); }); return a; },[]),base,'')+
      table('C2. 放量時，離 50 日線多遠',['下方 >5%','±5% 內','上方 5～15%','上方 15～25%','上方 >25%'].map(function(x){return '放量(≥1.5倍)・離50日線'+x;}),base,'')+
      table('C3. 放量時，離 1 年高點多遠',['<3%','3～10%','10～20%','>20%'].map(function(x){return '放量(≥1.5倍)・離1年高點'+x;}),base,'')+'</details>';
    h+='<div class="sub" style="margin-top:10px">⚠ 資料只有約 2 年、全是同一段 AI 行情；同一檔股票每組每 5 個交易日最多算 1 次，但相鄰結果仍有重疊；板塊位階（順風／小心）這版沒放進回測，下一版再加。拆越細樣本越少，結果只能當線索，不是規律。「準備／出貨」的條件和 1.5 個百分點的差距門檻都是我訂的，沒有冠軍原文可驗。</div>';
    outEl.innerHTML=h;
  }
  setTimeout(step,0);
}
