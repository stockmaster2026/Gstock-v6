<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飆股雷達 v8.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
  --bg:#f5e8a0;--surface:#fffef2;--border:#e0cc70;
  --blue:#0066bb;--green:#009944;--orange:#dd6600;
  --red:#cc1133;--dim:#8a8a6a;--text:#1a1a2e;
  --improving:#3498db;--leading:#27ae60;--weakening:#f39c12;--lagging:#7f8c8d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}

.topbar{background:rgba(245,232,140,0.97);border-bottom:2px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:200;}
.logo{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;color:var(--orange);letter-spacing:2px;flex-shrink:0;}
.logo span{color:var(--blue);}
.back-btn{font-size:24px;color:var(--blue);cursor:pointer;flex-shrink:0;line-height:1;}
.topbar-title{flex:1;font-family:'Orbitron',monospace;font-size:15px;font-weight:900;text-align:center;}
.refresh-btn{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:900;cursor:pointer;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,0.2);}

.heat-strip{
background:#fff8e0;border-bottom:3px solid #d4b800;
padding:10px 8px;display:flex;gap:6px;overflow-x:auto;
-webkit-overflow-scrolling:touch;
}
.heat-strip::-webkit-scrollbar{display:none;}
.heat-chip{
flex-shrink:0;display:flex;flex-direction:column;align-items:center;
padding:6px 8px;border-radius:10px;cursor:pointer;
border:2px solid #d4b800;background:#fffde0;
transition:all 0.2s;width:78px;position:relative;
}
.heat-chip:active{transform:scale(0.95);}
.heat-chip.sel{border-color:var(--orange);background:rgba(221,102,0,0.12);}
.hc-icon{font-size:20px;margin-bottom:2px;}
.hc-name{font-size:10px;color:#1a1a2e;margin-bottom:2px;font-weight:800;text-align:center;word-break:break-all;white-space:normal;width:100%;line-height:1.2;}
.hc-score{font-size:11px;font-weight:700;color:#444;}
.hc-change{font-size:9px;font-weight:700;margin-top:1px;}
.hc-change.up{color:var(--green);}
.hc-change.dn{color:var(--red);}
.hc-change.flat{color:var(--dim);}
.hc-trend{font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-top:2px;color:white;}
.tr-improving{background:var(--improving);}
.tr-leading{background:var(--leading);}
.tr-weakening{background:var(--weakening);}
.tr-lagging{background:var(--lagging);}
.hc-bar{width:100%;height:4px;background:rgba(0,0,0,0.12);border-radius:2px;margin-top:3px;overflow:hidden;}
.hc-fill{height:100%;border-radius:2px;transition:width 1s ease;}
.hot3{background:linear-gradient(90deg,#ff4400,#ff8800);}
.hot2{background:linear-gradient(90deg,#ff8800,#ffcc00);}
.hot1{background:linear-gradient(90deg,#ccaa00,#99bb00);}
.cold{background:var(--dim);}

.search-wrap{padding:10px 14px 4px;display:flex;gap:8px;}
.search-input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;background:var(--surface);outline:none;font-family:'Noto Sans TC',sans-serif;}
.search-input:focus{border-color:var(--blue);}
.search-btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:900;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,0.2);}

.history-info{padding:6px 14px;font-size:11px;color:var(--dim);background:rgba(255,255,255,0.5);border-bottom:1px solid var(--border);}

.page{display:none;padding:10px 14px 24px;flex-direction:column;}
.page.active{display:flex;}

.stock-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:transform 0.15s;position:relative;margin-top:2px;}
.stock-card:active{transform:scale(0.98);}
.slbar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px;}
.sl-o{background:var(--orange);}.sl-b{background:var(--blue);}.sl-r{background:var(--red);}.sl-g{background:var(--green);}

.srow{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px;}
.sticker{font-family:'Orbitron',monospace;font-size:16px;font-weight:900;}
.stoday{font-size:10px;color:var(--dim);margin-top:2px;}
.sright{text-align:right;}
.sprice{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;}
.sdist{font-size:10px;margin-top:1px;}
.up{color:var(--green);}.dn{color:var(--red);}

.sbadge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;margin-bottom:6px;}
.bd-o{background:rgba(221,102,0,0.12);color:var(--orange);border:1px solid rgba(221,102,0,0.3);}
.bd-b{background:rgba(0,102,187,0.12);color:var(--blue);border:1px solid rgba(0,102,187,0.3);}
.bd-r{background:rgba(204,17,51,0.1);color:var(--red);border:1px solid rgba(204,17,51,0.2);}
.bd-g{background:rgba(0,153,68,0.12);color:var(--green);border:1px solid rgba(0,153,68,0.3);}

.chip-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.chip-lbl{font-size:10px;color:var(--dim);flex-shrink:0;width:42px;}
.chip-track{flex:1;height:7px;background:rgba(0,0,0,0.07);border-radius:3px;overflow:hidden;}
.chip-fill{height:100%;border-radius:3px;transition:width 1.2s ease;}
.cf-full{background:linear-gradient(90deg,#0066bb,#00aa55);}
.cf-high{background:linear-gradient(90deg,#0088cc,#44aaff);}
.cf-mid{background:linear-gradient(90deg,#dd8800,#ffbb44);}
.cf-low{background:linear-gradient(90deg,#cc1133,#ff6688);}
.chip-num{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;flex-shrink:0;width:34px;text-align:right;}

.arrow-row{position:relative;height:13px;}
.arrow-lbl{position:absolute;font-size:9px;font-weight:700;color:var(--orange);transform:translateX(-50%);white-space:nowrap;}
.cost-track{height:7px;background:rgba(0,0,0,0.07);border-radius:3px;position:relative;overflow:hidden;}
.cost-zone{position:absolute;top:0;bottom:0;background:rgba(0,102,187,0.3);}
.cost-pin{position:absolute;top:0;bottom:0;width:3px;background:var(--orange);}
.cost-axis{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);margin-top:2px;}
.shint{text-align:center;font-size:10px;color:var(--dim);margin-top:5px;}

.dc{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;margin-top:2px;}
.dtitle{font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:8px;}
.big-chip{font-family:'Orbitron',monospace;font-size:32px;font-weight:900;margin-bottom:6px;}
.bc-full{color:var(--green);}.bc-high{color:var(--blue);}.bc-mid{color:var(--orange);}.bc-low{color:var(--red);}
.cost-big{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:var(--blue);margin-bottom:10px;}
.adv{display:flex;gap:8px;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.7;margin-top:8px;}
.adv-o{background:rgba(221,102,0,0.07);border:1px solid rgba(221,102,0,0.2);}
.adv-b{background:rgba(0,102,187,0.07);border:1px solid rgba(0,102,187,0.2);}
.adv-r{background:rgba(204,17,51,0.05);border:1px solid rgba(204,17,51,0.15);}
.adv-g{background:rgba(0,153,68,0.07);border:1px solid rgba(0,153,68,0.2);}
.adv-title{font-weight:700;display:block;margin-bottom:2px;}
.at-o{color:var(--orange);}.at-b{color:var(--blue);}.at-r{color:var(--red);}.at-g{color:var(--green);}
.dr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(0,0,0,0.05);font-size:12px;}
.dr:last-child{border:none;}
.dv-b{color:var(--blue);font-weight:600;}.dv-g{color:var(--green);font-weight:600;}
.dv-o{color:var(--orange);font-weight:600;}.dv-r{color:var(--red);font-weight:600;}

.btn-add{width:100%;background:var(--green);color:white;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px;font-family:'Noto Sans TC',sans-serif;}
.btn-blue{background:var(--blue);}
.btn-remove{width:100%;background:rgba(204,17,51,0.08);color:var(--red);border:1.5px solid rgba(204,17,51,0.3);border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px;font-family:'Noto Sans TC',sans-serif;}

.spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top:3px solid var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{text-align:center;padding:20px;color:var(--dim);font-size:13px;}
.err{background:rgba(204,17,51,0.07);border:1px solid rgba(204,17,51,0.2);border-radius:10px;padding:10px;font-size:12px;color:var(--red);text-align:center;margin-bottom:8px;margin-top:2px;}
.pg-hdr{font-size:11px;color:var(--dim);padding:8px 0 4px;}
.empty-hint{text-align:center;padding:30px 20px;color:var(--dim);font-size:13px;line-height:1.8;}

.add-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:center;justify-content:center;padding:20px;}
.add-modal.show{display:flex;}
.add-modal-content{background:var(--surface);border-radius:14px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;}
.add-modal-title{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text);}
.add-sector-btn{width:100%;background:var(--blue);color:white;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px;font-family:'Noto Sans TC',sans-serif;text-align:left;}
.add-modal-close{width:100%;background:#ddd;color:#333;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;}
</style>

</head>
<body>

<div class="topbar" id="topbar">
  <div class="logo">飆股<span>RADAR</span> v8.1</div>
  <div style="flex:1"></div>
  <button class="refresh-btn" onclick="initApp()">🔄 更新</button>
</div>

<div class="history-info" id="historyInfo">載入中...</div>

<!-- 今日急迫清單（從日記持倉抓） -->

<div id="urgentList" style="display:none;"></div>

<!-- 白話文觀察區 -->

<div id="dailyObserve" style="background:#fff8e0;padding:10px 14px;border-bottom:2px solid #d4b800;font-size:12px;line-height:1.6;color:#1a1a2e;display:none;"></div>

<div class="heat-strip" id="heatStrip"></div>

<div class="page active" id="stockListPage">
  <div class="search-wrap" id="searchWrap">
    <input class="search-input" id="searchInput" placeholder="搜尋股票代號，如 ONDS、IRDM"
      onkeydown="if(event.key==='Enter')searchStock()">
    <button class="search-btn" onclick="searchStock()">搜尋</button>
  </div>
  <div class="pg-hdr" id="listHeader" style="padding:4px 0 6px;">👆 點選上方板塊查看個股</div>
  <div id="cardContainer"></div>
</div>

<div class="page" id="detailPage"></div>

<!-- 加股 Modal -->

<div class="add-modal" id="addModal">
  <div class="add-modal-content">
    <div class="add-modal-title" id="addModalTitle">加入到哪個板塊？</div>
    <div id="addModalBody"></div>
    <button class="add-modal-close" onclick="closeAddModal()">取消</button>
  </div>
</div>

<script>
var SKEY='biaoguo_sectors_v5';
var HKEY='biaoguo_history_v1';

// ═══ v7.1 變更：CORS 代理改為自建 Cloudflare Worker ═══════════
var PROXY='https://gstock-proxy.cykjas.workers.dev/?url=';

var SECTORS_DEFAULT=[
  {id:'ai_giant',  icon:'🤖', name:'AI巨頭',    etf:'QQQ',  tickers:['NVDA','META','GOOGL','MSFT','AMZN']},
  {id:'ai_infra',  icon:'🏗️', name:'AI基礎設施', etf:'XLK',  tickers:['ANET','SMCI','DELL','CRWD','SNOW']},
  {id:'optical',   icon:'💡', name:'光通信',     etf:'FOTO', tickers:['COHR','LITE','AAOI','AXTI','APH']},
  {id:'power',     icon:'⚡', name:'AI電力散熱', etf:'XLU',  tickers:['VST','CEG','ETN','GNRC','AXON']},
  {id:'space',     icon:'🛰️', name:'太空衛星',   etf:'UFO',  tickers:['LUNR','RKLB','PL','BKSY','ASTS','IRDM','SATS','GSAT','VSAT']},
  {id:'drone',     icon:'🚁', name:'無人機國防', etf:'ITA',  tickers:['ONDS','KTOS','PLTR','ACHR','JOBY']},
  {id:'quantum',   icon:'⚛️', name:'量子運算',   etf:'QTUM', tickers:['IONQ','RGTI','QBTS','QUBT']},
  {id:'storage',   icon:'💾', name:'儲存硬體',   etf:'SMH',  tickers:['MU','WDC','NTAP','STX','SNDK','P']},
  {id:'biotech',   icon:'🧬', name:'生技健康',   etf:'XBI',  tickers:['TEM','HIMS','RXRX','NVAX','CRSP']},
  {id:'metals',    icon:'💰', name:'貴金屬礦業', etf:'GDX',  tickers:['GLD','SLV','NEM','AEM','WPM']},
  {id:'robot',     icon:'🤖', name:'機器人',     etf:'BOTZ', tickers:['TSLA','SYM','SERV','ISRG','CGNX','AMBA','OUST','TEL']},
  {id:'ai_compute',icon:'☁️', name:'AI算力雲',   etf:'SKYY', tickers:['NBIS','CRWV','IREN']},
  // ═══ v7.8 新增：應用層原本一個都沒有 ═══════════════════════════
  // 舊的 14 個板塊全是硬體與基礎設施。名單裡沒有的東西，radar 永遠不會告訴你它在漲，
  // 所以「軟體在走強但我沒看到」不是漏看，是結構上看不到。
  // 基準用 XSW（等權重軟體）而不是 IGV —— IGV 前三大就佔 30%，它漲往往只是三檔在漲。
  {id:'ai_soft',   icon:'🧠', name:'AI軟體應用', etf:'XSW',  tickers:['NOW','CRM','SNOW','DDOG','WDAY','TEAM','APP','MDB','PLTR']},
  // 資安獨立：IGV 裡 PANW+CRWD+FTNT+ZS 約佔 22%，跟應用軟體混在一起會互相污染
  {id:'cyber',     icon:'🔒', name:'資安',       etf:'CIBR', tickers:['PANW','CRWD','FTNT','ZS','S']},
  {id:'custom',    icon:'⭐', name:'自訂',       etf:null,   tickers:[]},
];

// ═══ v7.8:【一次性成分股搬移】════════════════════════════════════
// getSectors 的合併邏輯只會把「新板塊」整個補進來，不會動已存在板塊的 tickers，
// 所以 CRWD／SNOW／PLTR 放錯位置這件事必須靠一次性遷移修，否則會兩邊重複計分。
var MIGKEY='gstock_radar_mig';
function migrateSectors(){
  try{
    var done=localStorage.getItem(MIGKEY)||'';
    if(done.indexOf('v81')>=0) return;
    var secs=getSectors();
    var drop={ai_infra:['CRWD','SNOW'], drone:['PLTR']};      // 已搬到 資安／AI軟體應用
    var add ={ai_infra:['VRT','MRVL'],  drone:['AVAV']};      // 搬走之後補回同性質的
    secs.forEach(function(sec){
      var rm=drop[sec.id];
      if(rm) sec.tickers=sec.tickers.filter(function(t){return rm.indexOf(t)<0;});
      var ad=add[sec.id];
      if(ad) ad.forEach(function(t){if(sec.tickers.indexOf(t)<0) sec.tickers.push(t);});
    });
    // ═══ v8.1:【兩組重疊的板塊合併】═════════════════════════════════
    // 衛星通信與太空衛星本來就掛同一支 ETF（UFO），是同一個板塊被切成兩半，
    // 兩邊各只有 4~5 檔，誰都湊不出足夠的樣本。感測視覺（ROBO）與機器人（BOTZ）
    // 的基準 ETF 成分也大幅重疊，同理合併。
    // 合併＝把來源的成分股併進目標，然後把來源整個刪掉（名稱不動）。
    var merge=[{from:'satcom',to:'space'},{from:'sensor',to:'robot'}];
    merge.forEach(function(m){
      var src=null,dst=null;
      secs.forEach(function(sec){ if(sec.id===m.from) src=sec; if(sec.id===m.to) dst=sec; });
      if(!src||!dst) return;
      src.tickers.forEach(function(t){ if(dst.tickers.indexOf(t)<0) dst.tickers.push(t); });
      secs=secs.filter(function(sec){ return sec.id!==m.from; });
    });
    saveSectors(secs);
    localStorage.setItem(MIGKEY, done+' v78 v81');
  }catch(e){}
}

function getSectors(){
  var stored=null;
  try{var s=localStorage.getItem(SKEY);if(s) stored=JSON.parse(s);}catch(e){}
  var defaultSectors=JSON.parse(JSON.stringify(SECTORS_DEFAULT));
  if(!stored||!Array.isArray(stored)) return defaultSectors;
  var nameMap={};
  var nameOrder=[];
  for(var i=0;i<stored.length;i++){
    var sec=stored[i];
    if(!sec||!sec.name) continue;
    sec.tickers=sec.tickers||[];
    if(nameMap[sec.name]){
      var existing=nameMap[sec.name];
      for(var x=0;x<sec.tickers.length;x++){
        if(existing.tickers.indexOf(sec.tickers[x])<0) existing.tickers.push(sec.tickers[x]);
      }
    }else{
      nameMap[sec.name]=sec;
      nameOrder.push(sec.name);
    }
  }
  var deduped=[];
  for(var n=0;n<nameOrder.length;n++) deduped.push(nameMap[nameOrder[n]]);
  var defaultByName={};
  for(var p=0;p<defaultSectors.length;p++) defaultByName[defaultSectors[p].name]=defaultSectors[p];
  for(var q=0;q<deduped.length;q++){
    var d=defaultByName[deduped[q].name];
    if(d){
      deduped[q].id=d.id;
      deduped[q].icon=d.icon;
      // v7.1 變更：預設 ETF 一律覆蓋 localStorage 舊值，否則改了 SECTORS_DEFAULT 不會生效
      if(d.etf) deduped[q].etf=d.etf;
    }
  }
  var storedIds={};
  for(var r=0;r<deduped.length;r++) storedIds[deduped[r].id]=true;
  var customIdx=-1;
  for(var t=0;t<deduped.length;t++){
    if(deduped[t].id==='custom'){customIdx=t;break;}
  }
  for(var u=0;u<defaultSectors.length;u++){
    var dd=defaultSectors[u];
    if(!storedIds[dd.id] && dd.id!=='custom'){
      if(customIdx>=0){deduped.splice(customIdx,0,dd);customIdx++;}
      else{deduped.push(dd);}
    }
  }
  if(customIdx===-1){
    for(var v=0;v<defaultSectors.length;v++){
      if(defaultSectors[v].id==='custom'){deduped.push(defaultSectors[v]);break;}
    }
  }
  saveSectors(deduped);
  return deduped;
}
function saveSectors(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}

function getHistory(){
  try{var s=localStorage.getItem(HKEY);if(s)return JSON.parse(s);}catch(e){}
  return {records:[]};
}
function saveHistory(h){try{localStorage.setItem(HKEY,JSON.stringify(h));}catch(e){}}

function todayKey(){return new Date().toISOString().slice(0,10);}

function recordTodayScores(scores){
  var hist=getHistory();
  var key=todayKey();
  var idx=-1;
  for(var i=0;i<hist.records.length;i++){
    if(hist.records[i].date===key){idx=i;break;}
  }
  var record={date:key,scores:scores};
  if(idx>=0){hist.records[idx]=record;}else{hist.records.push(record);}
  if(hist.records.length>30){hist.records=hist.records.slice(-30);}
  saveHistory(hist);
}

function getScoreNDaysAgo(sectorId, n){
  var hist=getHistory();
  if(hist.records.length < n+2) return null;
  var rec=hist.records[hist.records.length-2-n];
  if(!rec || !rec.scores) return null;
  return rec.scores[sectorId];
}

function getTrendLabel(currentScore, score1d, score7d){
  if(score1d===null||score1d===undefined) return null;
  var change1d=currentScore-score1d;
  var change7d=score7d!==null&&score7d!==undefined?currentScore-score7d:null;
  if(currentScore>=70){
    if(change1d>=-2) return {label:'領先',cls:'tr-leading'};
    else return {label:'走弱',cls:'tr-weakening'};
  }else if(currentScore>=50){
    if(change1d>=3) return {label:'上升中',cls:'tr-improving'};
    else if(change1d<=-3) return {label:'走弱',cls:'tr-weakening'};
    else if(change7d!==null&&change7d>=5) return {label:'上升中',cls:'tr-improving'};
    else return null;
  }else{
    if(change1d>=3) return {label:'上升中',cls:'tr-improving'};
    else return {label:'落後',cls:'tr-lagging'};
  }
}

var cache={};
var currentSector=null;
// v7.1 變更：只有整輪掃完才寫入當日分數快照，避免中途關掉存到半載入的低分
var scanDone=false;

// ═══ v7.1 變更：Finnhub 已完全移除 ═══════════════════════
// 舊版每檔要發 2 次 Finnhub（/quote + /profile2），免費額度只有 60 次/分鐘，
// 60 多檔一路掃下去必爆 HTTP 429。現在改成：只打 Yahoo（走自建 Worker，無限制），
// 報價與漲跌幅直接從 Yahoo 的 meta 算。profile2 抱回來的 floatShares 原本就沒被用到。

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function fetchYahoo(t, retried){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?interval=1d&range=1y';
  var url=PROXY+encodeURIComponent(base);
  var r=await fetch(url);
  if(r.status===429 && !retried){
    await sleep(2000);
    return fetchYahoo(t, true);
  }
  if(!r.ok) throw new Error('Yahoo HTTP '+r.status);
  var data=await r.json();
  if(!data.chart||!data.chart.result||!data.chart.result[0])
    throw new Error('no yahoo data');
  return data.chart.result[0];
}

// 從 Yahoo 的 chart 回傳裡拼出報價（代替原本的 Finnhub /quote）
// ═══ v7.1 修正：不要用 meta.chartPreviousClose ═══════════════
// chartPreviousClose 是「整段 range 開始前那一根的收盤」：range=1y 時它是一年前的價，
// 拿它算漲跌幅會算成「近一年漲跌幅」（v7.1 出現 SMH +92%、LITE +556% 就是這個原因）。
// 正確做法：前一日收盤直接從 closes 陣列倒數第二根取，meta.previousClose 只當備援。
function quoteFromYahoo(result){
  var meta=result.meta||{};
  var arr=[];
  try{
    var cl=result.indicators.quote[0].close;
    for(var i=0;i<cl.length;i++) if(cl[i]) arr.push(cl[i]);
  }catch(e){}
  var price=meta.regularMarketPrice||arr[arr.length-1];
  var prev=arr.length>=2?arr[arr.length-2]:meta.previousClose;
  if(!price) return null;
  var dp=prev?((price/prev-1)*100):0;
  return {c:price, pc:prev||price, dp:dp};
}

// ═══ v7.1 新增：成本區量能桶的桶寬工具 ═════════════════
// niceStep：把任意數字靠到 1 / 2 / 5 的漂亮刻度（例 0.1968 -> 0.2、9.84 -> 10）
function niceStep(x){
  if(!(x>0)) return 1;
  var e=Math.pow(10,Math.floor(Math.log(x)/Math.LN10));
  var m=x/e;
  var f=m<1.5?1:(m<3.5?2:(m<7.5?5:10));
  return Math.round(f*e*10000)/10000;
}
// snap：把數字對齊到 step 的倍數（up=true 向上，否則向下）
function snap(v,step,up){
  if(!(step>0)) step=1;
  var k=up?Math.ceil(v/step):Math.floor(v/step);
  return Math.round(k*step*10000)/10000;
}

function analyzeYahoo(result, floatShares){
  try{
    var timestamps=result.timestamp;
    var q=result.indicators.quote[0];
    var closes=q.close,volumes=q.volume,highs=q.high,lows=q.low,opens=q.open;
    var n=closes.length;
    if(n<20) return null;
    var valid=[];
    for(var i=0;i<n;i++){
      if(closes[i]&&volumes[i]&&highs[i]&&lows[i]&&opens[i]){
        valid.push({c:closes[i],v:volumes[i],h:highs[i],l:lows[i],o:opens[i],t:timestamps[i]});
      }
    }
    if(valid.length<20) return null;
    var m=valid.length;
    function ma(k){
      var sl=valid.slice(-Math.min(k,m));
      return sl.reduce(function(s,d){return s+d.c;},0)/sl.length;
    }
    var ma5=ma(5),ma8=ma(8),ma10=ma(10),ma20=ma(20),ma21=ma(21),ma50=ma(50);
    var trArr=[];
    for(var ti=1;ti<m;ti++){
      var tr=Math.max(
        valid[ti].h-valid[ti].l,
        Math.abs(valid[ti].h-valid[ti-1].c),
        Math.abs(valid[ti].l-valid[ti-1].c)
      );
      trArr.push(tr);
    }
    var atr14=trArr.length>=14?trArr.slice(-14).reduce(function(a,b){return a+b;},0)/14:0;
    var obv=0,obvArr=[0];
    for(var i=1;i<m;i++){
      if(valid[i].c>valid[i-1].c) obv+=valid[i].v;
      else if(valid[i].c<valid[i-1].c) obv-=valid[i].v;
      obvArr.push(obv);
    }
    var obvRecent=obvArr.slice(-10).reduce(function(s,v){return s+v;},0)/10;
    var obvPrev=obvArr.slice(-20,-10).reduce(function(s,v){return s+v;},0)/10;
    var obvRising=obvRecent>obvPrev;
    var avgVol20=valid.slice(-20).reduce(function(s,d){return s+d.v;},0)/20;
    var recent60=valid.slice(-60);
    var fires=[];
    for(var i=0;i<recent60.length;i++){
      var d=recent60[i];
      var vr=d.v/avgVol20;
      if(vr>=2.0&&d.c>d.o){
        fires.push({date:new Date(d.t*1000).toISOString().slice(0,10),volRatio:vr.toFixed(1),close:d.c});
      }
    }
    var price=valid[m-1].c;
    var maUpTrend=ma5>ma10&&ma10>ma20&&ma20>ma50;
    var maBearish=ma5<ma20&&ma20<ma50;
    var aboveMA20=price>ma20;
    var distMA20=(price/ma20-1)*100;
    var phase;
    if(maUpTrend&&distMA20>30) phase=4;
    else if(maUpTrend&&aboveMA20) phase=3;
    else if(!maBearish&&fires.length>0&&aboveMA20) phase=2;
    else phase=1;
    // ═══ v7.1 修正：成本區的量能桶 ══════════════════════
    // 舊版固定 $5 一格：NOK 這種 $10 的股票整段價格只落進 2 個桶，成本區算成 $5-$15；
    // LITE 這種 $870 的又被切成上百個桶、取樣太稀薄。現在桶寬隨股價縮放（約 2%）。
    // 舊版又把「量最大的兩個桶」直接當成區間上下界，但兩桶未必相鄰
    // （DELL 的 $425 與 $490 被兜成一段）：現在只有相鄰的桶才合併。
    // 另排除最近 2 根 K，避免當日爆量把成本區拉到現價身上（DELL 財報那根）。
    var step=niceStep(price*0.02);
    var zoneBars=recent60.slice(0,Math.max(recent60.length-2,15));
    var zn={};
    zoneBars.forEach(function(d){
      var z=snap(d.c,step,false);
      if(!zn[z])zn[z]=0;
      zn[z]+=d.v;
    });
    var zKeys=Object.keys(zn).sort(function(a,b){return zn[b]-zn[a];}).map(Number);
    var cL,cH;
    if(zKeys.length){
      var zTop=zKeys[0], zMate=null;
      for(var zi=1;zi<zKeys.length;zi++){
        if(Math.abs(zKeys[zi]-zTop)<=step*1.5){zMate=zKeys[zi];break;}
      }
      cL=(zMate!==null)?Math.min(zTop,zMate):zTop;
      cH=((zMate!==null)?Math.max(zTop,zMate):zTop)+step;
    }else{
      cL=snap(price*0.9,step,false);
      cH=cL+step;
    }
    cL=Math.round(cL*10000)/10000;
    cH=Math.round(cH*10000)/10000;
    var tv=0,tw=0;
    recent60.forEach(function(d){tv+=d.v;tw+=d.c*d.v;});
    var wc=tv>0?Math.round(tw/tv*100)/100:price;
    var lowest=recent60[0];
    for(var i=1;i<recent60.length;i++){
      if(recent60[i].l<lowest.l) lowest=recent60[i];
    }
    var botP=lowest.l;
    var botD=new Date(lowest.t*1000).toISOString().slice(0,10);
    // ═══ v7.2 新增：週線位置（30 週線＝150 日線）與離 52 週高點 ═══════
    // 9/3 四檔實測抓到的結構性盲點：技術熱度只量「現在有幾項多頭條件成立」，
    // 完全沒有「這一波走到哪裡」的概念。DELL 漲了 7.2 倍、離 30 週線 +71%，
    // IREN 已經跌破 30 週線 9%、從高點跌 46% —— 兩檔的熱度都落在 30-60「⭐最佳」。
    // dna 判它們一個「延伸到末期」、一個「接刀」，靠的正是這兩個數字。
    // 這裡不新增任何判斷邏輯，只是把這兩個維度算出來給卡片顯示。
    // ═══ v7.6:【radar 從頭到尾沒有日期】═══════════════════════════
    // Jasmine(9/3):「捲到中間開始解釋的時候，並沒有辦法知道這是哪一檔股票、
    //   什麼價位、哪一天的資料。」
    // ⚠ 她說得對 —— dna 有「資料最後一根 26/09/03」那一格，radar 一個日期都沒有。
    //   資料是今天的還是三天前快取的，畫面上看不出來。
    // → 記下最後一根 K 棒的日期，讓每一段的標題都能蓋上「代號 · 價位 · 日期」。
    var lastT = new Date(valid[m-1].t*1000);
    var asOf = String(lastT.getFullYear()).slice(2)+'/'
             + ('0'+(lastT.getMonth()+1)).slice(-2)+'/'
             + ('0'+lastT.getDate()).slice(-2);
    var ma150 = (m>=150) ? valid.slice(-150).reduce(function(s,d){return s+d.c;},0)/150 : null;
    var dist150 = (ma150 && ma150>0) ? (price/ma150-1)*100 : null;
    var hi52 = valid[0].h;
    for(var hj=1;hj<m;hj++){ if(valid[hj].h>hi52) hi52=valid[hj].h; }
    var off52 = hi52>0 ? (price/hi52-1)*100 : null;
    var chip=0;
    chip+=phase*15;
    if(obvRising) chip+=20;
    chip+=Math.min(fires.length*5,15);
    if(aboveMA20) chip+=10;
    if(maUpTrend) chip+=15;
    chip=Math.min(chip,100);
    // ═══ v7.2:【技術熱度到底在量什麼 —— 把每一項攤開】═══════════════
    // Jasmine(9/3):「我也搞不清楚分數越高越好還是越低越好。」
    // ⚠ 她問對了：這個分數是【現在有幾項多頭條件成立】的加總，<b>沒有方向性</b>——
    //   不是越高越好，也不是越低越好。低分有兩種完全相反的原因：
    //   ①真的剛起步（條件正要一項一項亮起來）②條件根本沒過。
    //   IREN 45 分是後者（OBV 在下降、均線沒有多頭排列），卻被標成「⭐最佳進場區」。
    // → 把五項的成敗與各自得分列出來，讓 45 分是怎麼來的看得見。
    // ⚠ v7.3 修：Phase 是 1~4 的階段，不是「過／沒過」。舊版寫 ok:phase>=3，
    //   IREN 畫面上就出現「✗ Phase 2」卻給 +30 分 —— 打叉又給分，當然看不懂。
    //   → Phase 這一列改成中性標記（ok:null），只講它是第幾階段與 3 以上才算亮。
    var chipParts=[
      {n:'均線排列',ok:null,            txt:'均線排列 '+phase+'/4（3 以上才算亮・非 Weinstein 階段）',                  pts:phase*15},
      {n:'OBV',     ok:obvRising,       txt:obvRising?'OBV 上升':'OBV 下降',                    pts:obvRising?20:0},
      {n:'一把火',  ok:fires.length>0,  txt:'一把火 '+fires.length+' 次',                       pts:Math.min(fires.length*5,15)},
      {n:'MA20',    ok:aboveMA20,       txt:aboveMA20?'站上 MA20':'在 MA20 下方',               pts:aboveMA20?10:0},
      {n:'多頭排列',ok:maUpTrend,       txt:maUpTrend?'均線多頭排列':'均線未多頭排列',           pts:maUpTrend?15:0}
    ];
    // v7.3:「亮了幾項」才是這個數字真正的內容 —— 百分比只是它的包裝
    var chipLit = (phase>=3?1:0) + (obvRising?1:0) + (fires.length>0?1:0) + (aboveMA20?1:0) + (maUpTrend?1:0);
    var mainCostMid=(cL+cH)/2;
    // ═══ v7.7:【T1/T2/T3 兩個版本全部移除】════════════════════════
    // 舊固定倍數版 = 中位 × 1.3 / 1.5 / 1.8 —— 三個倍數是隨手定的。
    // ATR 版      = 中位 + 3 / 5 / 8 × ATR —— 錨在「量能密集區中位」而不是
    //   進場價，跟 v6.9 已經修掉的舊 ATR 停損是同一個錨點錯誤：停損改錨現價了，
    //   目標價沒跟著改。現價離密集區越遠，這三個數字越失真。
    // 另外舊版 R:R 是用固定倍數的 t2 算的，畫面上顯示 ATR 版 T2，同一頁兩條線。
    // → 兩版全拿掉，R:R 一起拿掉。出場一律回 dna / 跌破 20 日均線。
    // 只留下「離密集區中位 +30% / +50% / +80%」這三條乖離帶用來分級位置，
    // 名字改成 dev30/50/80，不再假裝是目標價。
    var dev30=mainCostMid*1.3;
    var dev50=mainCostMid*1.5;
    var dev80=mainCostMid*1.8;
    // ═══ v7.1 修正：ATR 停損改錨在現價，並以 -8% 為上限 ══════
    // 舊版是 mainCostMid - 1.5*ATR，錨在成本中位而不是進場價，導致同一條公式
    // 在 NOK 上只有 -2.3%（會被雜訊掃出場）、在 DELL 上却有 -21%（超出紀律）。
    // 現在改成「現價 - 1.5*ATR」與「現價 -8%」取較嚴（較高）的那個。
    var atrStopRaw=price-1.5*atr14;
    var atrStop=Math.max(atrStopRaw, price*0.92);
    var atrStopPct=price>0?((atrStop/price-1)*100):0;
    var atrPct=mainCostMid>0?(atr14/mainCostMid*100):0;
    return{phase:phase,ma5:ma5,ma8:ma8,ma10:ma10,ma20:ma20,ma21:ma21,ma50:ma50,
      atr14:atr14,atrPct:atrPct,
      atrStop:atrStop,atrStopPct:atrStopPct,
      obvRising:obvRising,fires:fires,avgVol20:avgVol20,
      cL:cL,cH:cH,step:step,wc:wc,distMA20:distMA20,
      maUpTrend:maUpTrend,maBearish:maBearish,aboveMA20:aboveMA20,
      botP:botP,botD:botD,chip:chip,chipParts:chipParts,chipLit:chipLit,
      ma150:ma150,dist150:dist150,hi52:hi52,off52:off52,asOf:asOf,
      dev30:dev30,dev50:dev50,dev80:dev80,mainCostMid:mainCostMid};
  }catch(e){return null;}
}

async function loadStock(t){
  if(cache[t]&&cache[t].ok) return cache[t];
  try{
    // v7.1 變更：只打一次 Yahoo，報價與線圖共用同一份回傳
    var yahoo=await fetchYahoo(t);
    var q=quoteFromYahoo(yahoo);
    if(!q) throw new Error('no price');
    var a=analyzeYahoo(yahoo);
    var ph=getPhase(q.c,a);
    // v7.1 修正：卡片上的「vs 成本」改用成本區中位，與客觀數據那行統一
    // （舊版用加權成本 wc，NOK 會同時出現 -14% 與 -3.5% 兩個數字）
    var dist=a&&a.mainCostMid>0?Math.round((q.c/a.mainCostMid-1)*100):0;
    cache[t]={ok:true,q:q,a:a,ph:ph,dist:dist,price:q.c,up:q.dp>=0};
  }catch(e){
    cache[t]={ok:true,err:true,msg:e.message||'failed'};
  }
  return cache[t];
}

// ═══ v7.4:【「Phase2」被讀成「Stage 2」—— 今天最危險的一個誤導】═══════
// Jasmine(9/3) 抓到：radar 對 IREN 印「Phase2 啟動訊號」，但那檔在 30 週線下方 8%、
// 從高點跌 46%，dna 與 Pine 都判 Stage 4 下跌。
// ⚠ 兩件事都沒算錯 —— radar 的 phase 量的是【均線排列到哪個程度】：
//     4＝多頭排列且離 MA20 >30%（最熱）／3＝多頭排列且站上 MA20
//     2＝非空頭排列＋有一把火＋站上 MA20／1＝以上皆非
//   IREN 確實有一把火、確實站上 20 日均線，所以 phase 2 是對的。
//   <b>錯的是命名</b>：它跟 Weinstein 的 Stage 1-4 用同一組數字，而且
//   <b>radar 的 4＝最熱（天花板），Weinstein 的 4＝崩跌（地板），意思剛好相反</b>。
//   Stage 2 是 Jasmine 整套方法論的核心詞，這個撞名比任何算錯都危險。
// → 數字全部拿掉，改用講它實際在量的東西的名字；並在畫面明講「這不是 Weinstein 階段」。
function getPhase(price,a){
  if(!a) return{ph:'wait',badge:'⚠️ 數據不足',sc:'sl-r',bd:'bd-r',ac:'adv-r',at:'at-r',icon:'⚠️',title:'數據不足',text:'無法分析'};
  if(a.phase===4) return{ph:'hot',badge:'🔴 均線多頭·離MA20過遠',sc:'sl-r',bd:'bd-r',ac:'adv-r',at:'at-r',icon:'⚡',title:'離 MA20 過遠',text:'均線多頭但離MA20超過30%，等回測MA20再考慮。（這是均線排列，不是 Weinstein 階段）'};
  if(a.phase===3) return{ph:'hold',badge:'🟢 均線多頭排列',sc:'sl-g',bd:'bd-g',ac:'adv-g',at:'at-g',icon:'✅',title:'均線多頭排列',text:'均線多頭排列，可持有。等回測MA20是加碼機會。（這是均線排列，不是 Weinstein 階段）'};
  if(a.phase===2) return{ph:'watch',badge:'🟠 有一把火·站上MA20',sc:'sl-o',bd:'bd-o',ac:'adv-o',at:'at-o',icon:'🚀',title:'有一把火·站上MA20',text:'有一把火＋收在 MA20 上方。<b>這只是均線與量的狀態，不代表週線在 Stage 2</b> —— 週線位置看上面的「離 30 週線」。'};
  if(a.obvRising) return{ph:'accum',badge:'🟡 空頭排列·但OBV上升',sc:'sl-b',bd:'bd-b',ac:'adv-b',at:'at-b',icon:'🐋',title:'空頭排列·OBV上升',text:'空頭排列但OBV上升。可能是吸籌，也可能只是跌深反彈 —— 這一格分不出來。'};
  return{ph:'wait',badge:'🔴 空頭排列',sc:'sl-r',bd:'bd-r',ac:'adv-r',at:'at-r',icon:'⏳',title:'空頭排列',text:'空頭排列，OBV未見異常，暫時觀望。'};
}

function ccls(c){return c>=100?'full':c>=60?'high':c>=30?'mid':'low';}
// ═══ v7.2:【級距文案從命令句改成描述句】════════════════════════════
// 舊文案：0-30 低溫（吸籌期）／30-60 升溫 ⭐ 最佳／60-85 高溫（謹慎）…
// ⚠ 問題出在中間那一段：30-60 被寫成「最佳進場區」，但機械上它的意思是
//   「五項裡有兩三項沒過」。9/3 實測：DELL 50%（漲了 7.2 倍）與 IREN 45%
//   （已跌破 30 週線）兩檔都落在這一段，兩檔都不該買。60% 以上反而都判對。
// → 只描述「幾項條件成立」，不再給進場許可；中間那段的顏色也從綠色改成中性，
//   綠色會被讀成「可以走」。這跟 dna V96.58 把體質燈從命令句改成描述句同一個修法。
function chipBand(c){
  if(c<30)  return {txt:'條件大多沒過',        col:'#888888'};
  if(c<60)  return {txt:'條件過一半',          col:'#8a7a4a'};
  if(c<85)  return {txt:'條件大多成立',        col:'#dd6600'};
  if(c<95)  return {txt:'幾乎全滿 · 過熱',     col:'#cc0000'};
  return           {txt:'全部滿格 · 極度過熱', col:'#cc0000'};
}
// ═══ v7.9:【要不要點進去，卡片上就要能決定】════════════════════════
// Jasmine(9/3):「假設有 10 檔，我是不是可以一眼就看出哪個不錯，而不是每一檔都點進去。
//   到底你需要怎樣的訊號給我，讓我知道我需要再點進去看詳細的？」
//
// 卡片上原本掛的是「技術熱度 %」—— 但 v7.5 已經因為那個數字沒有預測力，
// 把它從詳情頁整個刪掉了，卡片卻還留著，兩邊自相矛盾。這一版一併拿掉。
//
// 取而代之的判斷只問兩件事，而且都是這一頁真正算得準的東西：
//   ① 位置能不能用 —— 週線結構在不在、離支撐帶多遠（決定停損放不放得出來）
//   ② 條件成不成立 —— 五項亮了幾項
// 位置是硬關卡：位置不對，條件再滿也沒用（那正是 v7.4 的 IREN 與 DELL）。
//
// ⚠ 綠燈的意思是「值得點進去看」，不是「可以買」。買價與停損仍然以 dna 為準。
function clickTriage(a, price){
  if(!a) return null;
  var d150=a.dist150, o52=a.off52;
  // 現價離支撐帶的距離：在帶內＝0，帶上＝正，帶下＝負
  var band = price>a.cH ? ((price/a.cH-1)*100) : (price<a.cL ? ((price/a.cL-1)*100) : 0);
  if(d150!==null && d150<0)
    return {rank:3,ic:'⚫',t:'跳過',c:'#777',bg:'#f1f1f1',
            why:'在 30 週線下方 '+Math.abs(d150).toFixed(0)+'%，週線結構不成立'};
  if(o52!==null && o52<-30)
    return {rank:3,ic:'⚫',t:'跳過',c:'#777',bg:'#f1f1f1',
            why:'離 52 週高點 '+o52.toFixed(0)+'%，這一波已受損'};
  if(d150!==null && d150>50)
    return {rank:2,ic:'🔺',t:'太遠・等回測',c:'#dd6600',bg:'#fff3e0',
            why:'離 30 週線 +'+d150.toFixed(0)+'%，乖離過大'};
  if(band>20)
    return {rank:2,ic:'🔺',t:'太遠・等回測',c:'#dd6600',bg:'#fff3e0',
            why:'離支撐帶上緣 +'+band.toFixed(0)+'%，這裡買沒有結構可以放停損'};
  if(band<0)
    return {rank:1,ic:'🟡',t:'觀察',c:'#cc8800',bg:'#fff8e0',
            why:'跌破支撐帶 '+band.toFixed(0)+'%，等它站回去'};
  var lit=(a.chipLit!==undefined?a.chipLit:0);
  var miss=(a.chipParts||[]).filter(function(x){return x.ok===false;}).map(function(x){return x.n;});
  if(a.aboveMA20 && lit>=3)
    return {rank:0,ic:'🟢',t:'值得點進去',c:'#009944',bg:'#e8f8e8',
            why:'貼近支撐帶（'+(band>0?'+'+band.toFixed(0)+'%':'在帶內')+'）＋條件 '+lit+'/5'};
  return {rank:1,ic:'🟡',t:'觀察',c:'#cc8800',bg:'#fff8e0',
          why:'位置可用，但缺 '+(miss.join('、')||'啟動訊號')};
}

// v7.9: 板塊清單最上面的一行總結 —— 十檔不用一檔一檔點
function renderTriage(sectorId){
  var box=document.getElementById('triageSummary'); if(!box) return;
  var sec=getSectors().find(function(x){return x.id===sectorId;}); if(!sec) return;
  var go=[],watch=[],far=0,skip=0,pending=0,asOf=null;
  sec.tickers.forEach(function(t){
    var d=cache[t];
    if(!d||d.err||!d.a){pending++;return;}
    if(d.a.asOf) asOf=d.a.asOf;
    var tg=clickTriage(d.a,d.price);
    if(!tg){pending++;return;}
    if(tg.rank===0) go.push(t);
    else if(tg.rank===1) watch.push(t);
    else if(tg.rank===2) far++;
    else skip++;
  });
  var head='<div style="font-size:11px;color:#888;margin-bottom:4px;">'
    +'📋 這個板塊哪幾檔值得點進去　<span style="color:#aaa;">資料最後一根 '+(asOf||'—')+'</span></div>';
  var line;
  if(go.length){
    line='<div style="font-size:14px;font-weight:900;color:#009944;">🟢 值得點進去 '+go.length+' 檔：'+go.join('、')+'</div>';
  }else if(pending){
    line='<div style="font-size:13px;color:#888;">⏳ 還在載入…</div>';
  }else{
    line='<div style="font-size:13px;font-weight:700;color:#cc8800;">🟢 值得點進去 0 檔'
      +'<span style="font-weight:400;color:#888;">　—— 不是工具壞掉：位置可用的都缺條件，條件夠的都已經走遠了</span></div>';
  }
  var tail='<div style="font-size:11px;color:#666;margin-top:3px;">🟡 觀察 '+watch.length
    +(watch.length?'（'+watch.join('、')+'）':'')+'　🔺 太遠 '+far+'　⚫ 跳過 '+skip
    +(pending?'　⏳ '+pending:'')+'</div>';
  box.innerHTML='<div style="background:#fffdf5;border:2px solid #dd6600;border-radius:10px;padding:9px 11px;margin-bottom:10px;">'
    +head+line+tail+'</div>';
}

function pp(v,mn,mx){return Math.min(Math.max((v-mn)/(mx-mn)*100,2),96).toFixed(1);}

// ═══ v7.8:【當日漲跌幅的絕對值不再進分數】═══════════════════════════
// 舊版 chgScore 直接吃 d.q.dp，佔 30 分（滿分的三成）。後果是大盤好的那天所有板塊
// 一起墊高、大盤差的那天一起變「落後」—— 那量的是大盤方向，不是輪動。
// 新版改成兩層相對強弱：
//   個股 vs 該板塊 ETF   → 同業之內誰在領先
//   板塊 ETF vs SPY      → 這個板塊有沒有在被買
// 相對值 ±5% 映到 0~100，權重維持 0.3，總分刻度與舊版一致（0~90）。
// ⚠ 公式換了，v7.8 之前存下來的歷史分數與新分數不能直接比 —— 剛換版的頭幾天
//   「1日／7日變化」會失真，等新的紀錄累積起來才有意義。
function relScore(dp, base){
  return Math.min(Math.max(((dp-base)+5)*10,0),100)*0.3;
}
function heatScore(tickers, etfTicker){
  var spyDp=(cache['SPY']&&!cache['SPY'].err)?(cache['SPY'].q.dp||0):0;
  var etfDp=(etfTicker&&cache[etfTicker]&&!cache[etfTicker].err)?(cache[etfTicker].q.dp||0):spyDp;
  var stockScore=0;
  if(tickers&&tickers.length){
    var s=[];
    tickers.forEach(function(t){
      var d=cache[t];if(!d||d.err)return;
      var phaseScore=d.a?([0,20,50,80,60][d.a.phase]||20):20;
      var obvScore=d.a&&d.a.obvRising?20:0;
      s.push(phaseScore*0.5+relScore(d.q.dp||0, etfDp)+obvScore);
    });
    stockScore=s.length?s.reduce(function(a,b){return a+b;},0)/s.length:0;
  }
  if(etfTicker){
    var etfData=cache[etfTicker];
    if(etfData&&!etfData.err&&etfData.a){
      var etfPhase=([0,20,50,80,60][etfData.a.phase]||20);
      var etfObv=etfData.a.obvRising?20:0;
      var etfScore=etfPhase*0.5+relScore(etfData.q.dp||0, spyDp)+etfObv;
      return Math.round(etfScore*0.6+stockScore*0.4);
    }
  }
  return Math.round(stockScore);
}
function avgChg(tickers){
  var v=tickers.map(function(t){return cache[t]&&!cache[t].err?cache[t].q.dp:null;}).filter(function(x){return x!==null;});
  return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null;
}
function heatInfo(sc){
  if(sc>=70)return{cls:'hot3',fire:'🔥🔥🔥',col:'var(--red)'};
  if(sc>=50)return{cls:'hot2',fire:'🔥🔥',col:'var(--orange)'};
  if(sc>=30)return{cls:'hot1',fire:'🔥',col:'#aa8800'};
  return{cls:'cold',fire:'❄️',col:'var(--dim)'};
}

function renderHeatStrip(selId){
  var sectors=getSectors();
  var strip=document.getElementById('heatStrip');
  strip.innerHTML='';
  var todayScores={};
  sectors.forEach(function(sec){
    var sc=heatScore(sec.tickers, sec.etf);
    todayScores[sec.id]=sc;
    var hi=heatInfo(sc);
    var score1d=getScoreNDaysAgo(sec.id,0);
    var score7d=getScoreNDaysAgo(sec.id,6);
    var trend=getTrendLabel(sc,score1d,score7d);
    var change1d=score1d!==null&&score1d!==undefined?(sc-score1d):null;
    var changeStr=''; var changeCls='flat';
    if(change1d!==null){
      if(change1d>0){changeStr='↑'+change1d;changeCls='up';}
      else if(change1d<0){changeStr='↓'+Math.abs(change1d);changeCls='dn';}
      else{changeStr='--';changeCls='flat';}
    }
    var trendHtml=trend?'<div class="hc-trend '+trend.cls+'">'+trend.label+'</div>':'<div class="hc-trend" style="background:transparent;height:13px;"></div>';
    var changeHtml='<div class="hc-change '+changeCls+'">'+changeStr+'</div>';
    var chip=document.createElement('div');
    chip.className='heat-chip'+(sec.id===selId?' sel':'');
    var etfChgHtml='';
    if(sec.etf&&cache[sec.etf]&&!cache[sec.etf].err){
      var ed=cache[sec.etf];
      var edp=ed.q.dp||0;
      var ecol=edp>=0?'#009944':'#cc1133';
      etfChgHtml='<div style="font-size:8px;color:'+ecol+';font-weight:700;margin-top:1px;">'+sec.etf+' '+(edp>=0?'+':'')+edp.toFixed(1)+'%</div>';
    }
    chip.innerHTML='<div class="hc-icon">'+sec.icon+'</div>'+
      '<div class="hc-name">'+sec.name+'</div>'+
      '<div class="hc-score" style="color:'+hi.col+'">'+sc+'</div>'+
      etfChgHtml+changeHtml+trendHtml+
      '<div class="hc-bar"><div class="hc-fill '+hi.cls+'" style="width:0" data-w="'+sc+'%"></div></div>';
    chip.onclick=(function(id){return function(){showSector(id);};})(sec.id);
    strip.appendChild(chip);
  });
  if(scanDone) recordTodayScores(todayScores);
  updateHistoryInfo();
  renderUrgentList();
  renderDailyObserve();
  setTimeout(function(){
    document.querySelectorAll('.hc-fill[data-w]').forEach(function(el){
      el.style.width=el.dataset.w;
    });
  },100);
}

function renderUrgentList(){
  var box = document.getElementById('urgentList');
  if(!box) return;
  var holdings = getDiaryHoldings();
  if(!holdings.length){box.style.display = 'none';return;}
  var stopLossList = [],t3List = [],t2List = [],t1List = [],nearStopList = [],nearT1List = [],safeList = [];
  holdings.forEach(function(h){
    var d = cache[h.ticker];
    var price = d && !d.err ? d.price : (h.lastPrice || h.entryPrice);
    var remain = (h.shares || 0) - (h.soldShares || 0);
    function hasBatch(name){
      var bs = h.batches || [];
      for(var i=0;i<bs.length;i++) if(bs[i].name===name) return true;
      return false;
    }
    if(h.stopLoss && price <= h.stopLoss){
      stopLossList.push({h:h, price:price, shares:remain});
    } else if(h.t3 && price >= h.t3 && !hasBatch('T3')){
      t3List.push({h:h, price:price, shares:Math.floor(remain*0.5)});
    } else if(h.t2 && price >= h.t2 && !hasBatch('T2')){
      t2List.push({h:h, price:price, shares:Math.floor(remain*0.3)});
    } else if(h.t1 && price >= h.t1 && !hasBatch('T1')){
      t1List.push({h:h, price:price, shares:Math.floor(remain*0.2)});
    } else if(h.stopLoss){
      var distStop = (price - h.stopLoss) / price * 100;
      var distT1 = h.t1 ? ((h.t1 - price) / price * 100) : 999;
      if(distStop < 3){nearStopList.push({h:h, price:price, dist:distStop});}
      else if(distT1 > 0 && distT1 < 5){nearT1List.push({h:h, price:price, dist:distT1});}
      else {safeList.push({h:h, price:price});}
    } else {safeList.push({h:h, price:price});}
  });
  var totalUrgent = stopLossList.length + t3List.length + t2List.length + t1List.length;
  if(totalUrgent === 0 && nearStopList.length === 0 && nearT1List.length === 0){
    box.style.display = 'block';
    box.style.background = '#e8f8e8';
    box.style.borderBottom = '2px solid #009944';
    box.style.padding = '10px 14px';
    box.style.fontSize = '12px';
    box.innerHTML = '<div style="color:#009944;font-weight:700;">✅ 持倉狀況穩定（'+holdings.length+' 檔，無急迫項目）</div>';
    return;
  }
  box.style.display = 'block';
  box.style.background = '#fff';
  box.style.borderBottom = '3px solid #cc0000';
  box.style.padding = '12px 14px';
  var html = '<div style="font-size:14px;font-weight:900;color:#cc0000;margin-bottom:10px;">📋 今日必做清單（從你日記持倉）</div>';
  if(stopLossList.length > 0){
    html += '<div style="background:#ffe0e0;border:2px solid #cc0000;border-radius:8px;padding:10px;margin-bottom:8px;">';
    html += '<div style="color:#cc0000;font-weight:900;font-size:13px;margin-bottom:6px;">🚨 立刻處理（跌破停損）：</div>';
    stopLossList.forEach(function(item){
      html += '<div style="margin-left:8px;font-size:13px;color:#1a1a2e;font-weight:700;margin-bottom:3px;">• <span style="color:#cc0000;">'+item.h.ticker+'</span> $'+item.price.toFixed(2)+' < 停損 $'+item.h.stopLoss.toFixed(2)+' → <b>全部賣出 '+item.shares+' 股</b></div>';
    });
    html += '</div>';
  }
  if(t3List.length > 0){
    html += '<div style="background:#fff0d0;border:2px solid #dd6600;border-radius:8px;padding:10px;margin-bottom:8px;">';
    html += '<div style="color:#dd6600;font-weight:900;font-size:13px;margin-bottom:6px;">🎯 達 T3（必賣 50%）：</div>';
    t3List.forEach(function(item){
      html += '<div style="margin-left:8px;font-size:13px;color:#1a1a2e;font-weight:700;margin-bottom:3px;">• <span style="color:#dd6600;">'+item.h.ticker+'</span> $'+item.price.toFixed(2)+' ≥ T3 $'+item.h.t3.toFixed(2)+' → <b>賣 '+item.shares+' 股</b></div>';
    });
    html += '</div>';
  }
  if(t2List.length > 0){
    html += '<div style="background:#fff8d0;border:2px solid #dd9900;border-radius:8px;padding:10px;margin-bottom:8px;">';
    html += '<div style="color:#dd6600;font-weight:900;font-size:13px;margin-bottom:6px;">⚠️ 達 T2（必賣 30%）：</div>';
    t2List.forEach(function(item){
      html += '<div style="margin-left:8px;font-size:13px;color:#1a1a2e;font-weight:700;margin-bottom:3px;">• <span style="color:#dd6600;">'+item.h.ticker+'</span> $'+item.price.toFixed(2)+' ≥ T2 $'+item.h.t2.toFixed(2)+' → <b>賣 '+item.shares+' 股</b></div>';
    });
    html += '</div>';
  }
  if(t1List.length > 0){
    html += '<div style="background:#e8f8d0;border:2px solid #88aa00;border-radius:8px;padding:10px;margin-bottom:8px;">';
    html += '<div style="color:#5a7a2a;font-weight:900;font-size:13px;margin-bottom:6px;">🎯 達 T1（建議賣 20%）：</div>';
    t1List.forEach(function(item){
      html += '<div style="margin-left:8px;font-size:13px;color:#1a1a2e;font-weight:700;margin-bottom:3px;">• <span style="color:#5a7a2a;">'+item.h.ticker+'</span> $'+item.price.toFixed(2)+' ≥ T1 $'+item.h.t1.toFixed(2)+' → <b>賣 '+item.shares+' 股</b></div>';
    });

  }
  if(nearStopList.length > 0){

  if(nearT1List.length > 0){

    html += '<div style="color:#dd6600;font-weight:700;">⏳ 接近 T1（觀察中）：</div>';
    nearT1List.forEach(function(item){
      html += '<div style="margin-left:8px;color:#666;">• '+item.h.ticker+' 差 T1 '+item.dist.toFixed(1)+'%</div>';
    });
    html += '</div>';
  }
  if(safeList.length > 0){
    var tickers = safeList.map(function(item){return item.h.ticker;}).join('、');
    html += '<div style="font-size:12px;color:#666;margin-top:8px;">✅ 安全持有 '+safeList.length+' 檔：'+tickers+'</div>';
  }
  if(totalUrgent > 0){
    html += '<div style="margin-top:12px;text-align:center;font-size:11px;color:#666;">↑ 急迫項目請到「<a href="diary.html" style="color:#0066bb;font-weight:700;">📔 操作日記</a>」執行</div>';
  }
  box.innerHTML = html;

function updateHistoryInfo(){
  var hist=getHistory();
  var info=document.getElementById('historyInfo');
  if(!info) return;
  var days=hist.records.length;
  if(days<=1){
    info.innerHTML='📊 板塊輪動追蹤：<b>第 '+days+' 天</b>（持續打開累積數據，7 天後完整呈現輪動軌跡）';
    info.style.color='var(--orange)';
  }else if(days<7){
    info.innerHTML='📊 板塊輪動追蹤：<b>'+days+' 天</b>歷史（再 '+(7-days)+' 天可看完整輪動）';
    info.style.color='var(--orange)';
  }else{
    info.innerHTML='📊 板塊輪動追蹤：<b>'+days+' 天</b>歷史 ✅ 變化箭頭與趨勢標籤已啟用';
    info.style.color='var(--green)';
  }
}

function getDiaryHoldings(){
  try{
    var raw=localStorage.getItem('diary_v1_state');
    if(!raw) return [];
    var state=JSON.parse(raw);
    var all=[];
    if(state&&state.pools){
      ['old','new'].forEach(function(pk){
        var p=state.pools[pk];
        if(p&&p.holdings){
          p.holdings.forEach(function(h){
            if(h.ordType!=='plan'){
              var tgs = h.targets || {};
              all.push({
                ticker: h.ticker, pool: p.name,
                entryPrice: h.entryPrice, shares: h.shares,
                soldShares: h.soldShares || 0, stopLoss: h.stopLoss,
                t1: tgs.t1, t2: tgs.t2, t3: tgs.t3,
                lastPrice: h.lastPrice, batches: h.batches || []
              });
            }
          });
        }
      });
    }
    return all;
  }catch(e){return [];}
}

function renderDailyObserve(){
  var box=document.getElementById('dailyObserve');
  if(!box) return;
  var sectors=getSectors();
  var sectorData=[];
  sectors.forEach(function(sec){
    if(sec.id==='custom') return;
    var sc=heatScore(sec.tickers, sec.etf);
    var score1d=getScoreNDaysAgo(sec.id,0);
    var score7d=getScoreNDaysAgo(sec.id,6);
    var change1d=score1d!==null&&score1d!==undefined?(sc-score1d):null;
    var change7d=score7d!==null&&score7d!==undefined?(sc-score7d):null;
    var trend=getTrendLabel(sc,score1d,score7d);
    sectorData.push({sec:sec, score:sc, change1d:change1d, change7d:change7d, trend:trend});
  });
  var sorted=sectorData.slice().sort(function(a,b){return b.score-a.score;});
  var rising=sectorData.filter(function(d){return d.trend&&d.trend.label==='上升中';});
  rising.sort(function(a,b){return (b.change1d||0)-(a.change1d||0);});
  var weakening=sectorData.filter(function(d){return d.trend&&d.trend.label==='走弱';});
  weakening.sort(function(a,b){return (a.change1d||0)-(b.change1d||0);});

// ═══ v7.2:【板塊推薦與個股判決互相打架 —— 同一頁上就矛盾】═══════════
// 9/3 Jasmine 抓到：板塊觀察寫「無人機國防 ↑7　推薦：PLTR」，同一頁往下捲
// 就是滿版紅字「不要追高・技術熱度 100% 極度過熱」。
// ⚠ 病根：舊版這裡自己另外挑一次（Phase3 + OBV 上升，依一把火次數排序），
//   <b>完全沒有問卡片的判決</b> —— 跟 dna「可執行 1 檔 vs 今天 0 檔可以動」同一類病：
//   同一個概念有兩條程式路徑。
// → 改成直接重用 getTradingAdvice 的結果：只有卡片自己說可以進場（BUY / BUY_HALF）
//   才推薦。濾完沒人剩下就回 null，由呼叫端明說「沒有可以追的個股」，
//   不再因為板塊在漲就硬塞一個名字。
function getRecommendStock(sec){
  if(!sec.tickers||!sec.tickers.length) return null;
  var candidates=[];
  sec.tickers.forEach(function(t){
    var d=cache[t];
    if(!d||d.err||!d.a) return;
    var adv=getTradingAdvice(d.price, d.a, d.ph, null);
    if(!adv) return;
    if(adv.urgent!=='BUY' && adv.urgent!=='BUY_HALF') return;   // 卡片說不能進場就不推薦
    candidates.push({t:t, fires:d.a.fires.length});
  });
  candidates.sort(function(a,b){return b.fires-a.fires;});
  return candidates.length?candidates[0].t:null;
}

function getTradingAdvice(price, a, ph, holdingInfo){
  if(!a){
    return {urgent: 'NONE',icon:'⚠️', mainTitle:'數據不足', actionLine:'無法分析',
      bg:'#f5f5f5', border:'#ccc', titleColor:'#666',
      summary:'這檔股票歷史資料不足。', dataPoints:'<div>無法計算技術指標</div>', suggestion:''};
  }
  var costMid = a.mainCostMid;
  var pctVsCost = ((price/costMid - 1) * 100).toFixed(1);
  // ═══ v6.4 變更：「籌碼」改名為「技術熱度」══════════════════
  // a.chip 變數名稱保留（避免大改 code），但 UI 與 label 全部改成「技術熱度」
  // 邏輯不動：仍由 Phase + OBV + 一把火 + 均線 組成
  var chipLabel, chipMeaning, chipDanger;
  if(a.chip < 30){chipLabel='條件大多沒過'; chipMeaning='五項多頭條件只成立少數 —— 可能剛起步，也可能根本沒過，這個數字分不出來'; chipDanger=0;}
  else if(a.chip < 60){chipLabel='條件過一半'; chipMeaning='五項成立一半左右 —— <b>不是「最佳進場區」</b>，要看下面哪幾項沒過'; chipDanger=0;}
  else if(a.chip < 85){chipLabel='條件大多成立'; chipMeaning='多頭條件大多成立（續抱可，新進場謹慎）'; chipDanger=1;}
  else if(a.chip < 95){chipLabel='幾乎全滿 · 過熱 🚨'; chipMeaning='五項幾乎全滿，短期回檔風險升高'; chipDanger=2;}
  else {chipLabel='全部滿格 · 極度過熱 🚨🚨'; chipMeaning='五項全部滿格，等回測'; chipDanger=3;}
  var pricePos, advisory;
  // v7.7: 分級門檻不變（+30% / +50% / +80%），只是不再包裝成「T1/T2/T3」
  if(price < a.cL){pricePos='低於量能密集區'; advisory='low_cost';}
  else if(price <= a.cH){pricePos='在量能密集區內 ⭐'; advisory='in_cost';}
  else if(price < a.dev30){pricePos='在密集區上方・乖離未達 30%'; advisory='pre_t1';}
  else if(price < a.dev50){pricePos='離密集區中位 +30% 以上'; advisory='at_t1';}
  else if(price < a.dev80){pricePos='離密集區中位 +50% 以上'; advisory='at_t2';}
  else{pricePos='離密集區中位 +80% 以上 🚨'; advisory='past_t3';}
  // v7.1 變更：部位建議的停損與上面的 ATR 停損統一，不再各算各的
  var stopLoss = a.atrStop;
  var stopPct = a.atrStopPct;
  // v7.7: R:R 移除 —— reward 端是假的（來自固定倍數 t2），算出來的比值沒有意義
  var risk = price - stopLoss;
  // v7.1 修正：原本寫死 '+'，負數時會印成 「+-3.5%」
  var signCost = (price >= costMid ? '+' : '');
  var dataPoints = '<div>• 現價 vs 量能密集區：<b>'+signCost+pctVsCost+'%</b>（'+pricePos+'）</div>'+
    // v7.2: 位置維度 —— 這一行就是 DELL 與 IREN 當初該被擋下來的地方
    (a.dist150!==null?'<div>• <b>離 30 週線：'+(a.dist150>=0?'+':'')+a.dist150.toFixed(0)+'%</b>'
        +(a.dist150<0?'（<b style="color:#cc0000;">在 30 週線下方 → 不是 Stage 2</b>，週線結構不成立）'
                     :(a.dist150>50?'（<b style="color:#dd6600;">已經走很遠</b>）':''))+'</div>':'')+
    (a.off52!==null?'<div>• 離 52 週高點：<b>'+a.off52.toFixed(0)+'%</b>'
        +(a.off52<-30?'（<b style="color:#cc0000;">這一波已受損</b>）':'')+'</div>':'')+
    '<div>• 多頭條件：<b>'+(a.chipLit!==undefined?a.chipLit:'—')+'/5 亮</b>'
      +'<span style="color:#888;">　—— 看缺哪幾項，不要看亮幾項；五項全亮＝不要追</span></div>'+
    '<div>• 均線排列：<b>'+ph.title+'</b><span style="color:#888;">　—— 這不是 Weinstein 階段</span></div>'+
    '<div>• 量能密集區：<b>$'+a.cL+' - $'+a.cH+'</b>（中位 $'+costMid.toFixed(2)+'）</div>'+
    // v7.7: 目標價（固定倍數版與 ATR 版）與 R:R 全部移除，只留停損
    '<div>• 停損（1.5×ATR 與 −8% 取較嚴）：<b>$'+a.atrStop.toFixed(2)+'</b>（'+a.atrStopPct.toFixed(1)+'%）</div>'+
    '<div>• OBV 趨勢：<b>'+(a.obvRising?'上升（吸籌跡象）':'下降')+'</b></div>'+

  var holdingAction = '';

        summary:'現價 $'+price.toFixed(2)+' 已達 T2 目標 $'+holdingInfo.t2.toFixed(2)+'。紀律規則：達 T2 賣 30%。',
        dataPoints:dataPoints, suggestion:'⚠️ 跳到日記操作 → 自訂賣出 / T2'};

    if(price >= holdingInfo.t1 && !hasBatch('T1')){

        actionLine:'賣 '+t1Shares+' 股（剩 '+(shares-t1Shares)+' 股）',
        bg:'#e8f8d0', border:'#88aa00', titleColor:'#5a7a2a',
        summary:'現價 $'+price.toFixed(2)+' 已達 T1 目標 $'+holdingInfo.t1.toFixed(2)+'。紀律規則：達 T1 賣 20%。',
        dataPoints:dataPoints, suggestion:'🎯 跳到日記操作 → 自訂賣出 / T1'};
    }
    var distToStop = (price - holdingInfo.stopLoss) / price * 100;
    if(distToStop < 3){
      holdingAction = '<div style="font-weight:700;color:#cc1133;">⚠️ 接近停損（差 '+distToStop.toFixed(1)+'%）→ 密切關注</div>';
    }
    var distToT1 = (holdingInfo.t1 - price) / price * 100;
    if(distToT1 > 0 && distToT1 < 5){
      holdingAction = '<div style="font-weight:700;color:#dd9900;">⏳ 接近 T1（差 '+distToT1.toFixed(1)+'%）→ 觀察中</div>';
    }
  }
  // ═══ v8.0:【卡片與詳情頁改用同一個判斷】════════════════════════════
  // Jasmine(9/3) 抓到：卡片說 NVAX「🟢 值得點進去」，點進去卻是滿版紅字

  //   那是一個壞掉的過熱代理：它量的是條件成立幾項，不是這一波走了多遠。
  //   NVAX 五項全亮，但只在支撐帶上方 12%、離 30 週線 +16%、離高點 -14%

  var tg = clickTriage(a, price);

        actionLine:'在密集區但啟動訊號不足',

        summary:'現價在量能密集區內，但 Phase'+a.phase+' 還沒啟動或 OBV 沒上升。等啟動訊號。',
        dataPoints:dataPoints, suggestion:'🟡 暫不進場｜等待：1) Phase 提升 2) OBV 上升 3) 一把火'+(holdingAction?'<br><br>'+holdingAction:'')};
    }
  }
  if(advisory === 'pre_t1'){
    if(a.phase === 3 && a.obvRising){
      return {urgent:'BUY_HALF', icon:'🟢', mainTitle:'可控位進場',
        actionLine:'Phase3 但已離開密集區',
        bg:'#f0f8e8', border:'#88aa44', titleColor:'#5a7a2a',
        summary:'現價 $'+price.toFixed(2)+' 在量能密集區上方、乖離還不大，均線多頭排列。可進場但要控位。',
        dataPoints:dataPoints, suggestion:'🟢 部位減半（池子 3-5%）｜停損 $'+stopLoss.toFixed(2)+(holdingAction?'<br><br>'+holdingAction:'')};
    } else {
      return {urgent:'WAIT', icon:'⏳', mainTitle:'觀察為主',
        actionLine:'在密集區上方但訊號不足',
        bg:'#fff8e0', border:'#dd9900', titleColor:'#cc8800',
        summary:(function(){
          // v7.1：改用陣列 join，不再每項都接頓號（舊版結尾會多一個「、建議」）
          var miss=[];
          if(a.phase!==3) miss.push('均線還沒多頭排列（目前 '+ph.title+'）');
          if(!a.obvRising) miss.push('OBV 下降');
          return '現價在量能密集區上方、乖離還不大。'+
            (miss.length?'未通過的條件：'+miss.join('、')+'。':'')+
            '建議等回測或條件轉好。';
        })(),
        dataPoints:dataPoints, suggestion:'🟡 暫不進場｜等回測到 $'+a.cL+'-$'+a.cH+(holdingAction?'<br><br>'+holdingAction:'')};
    }
  }
  if(advisory === 'low_cost'){
    return {urgent:'AVOID', icon:'⛔', mainTitle:'不要進場',
      actionLine:'已跌破量能密集區',
      bg:'#ffe0e0', border:'#cc1133', titleColor:'#cc1133',
      summary:'現價 $'+price.toFixed(2)+' 已跌破量能密集區下緣 $'+a.cL+'。支撐帶失守，不該抄底。',
      dataPoints:dataPoints, suggestion:'⛔ 不要進場｜等待重新確認底部 + Phase 翻多'+(holdingAction?'<br><br>'+holdingAction:'')};
  }
  return {urgent:'NEUTRAL', icon:'⏳', mainTitle:'觀察中',
    actionLine:'狀況不明',
    bg:'#f5f5f5', border:'#999', titleColor:'#666',
    summary:'無法明確判斷進場時機。',
    dataPoints:dataPoints, suggestion:''+(holdingAction?holdingAction:'')};
}

  document.getElementById('stockListPage').classList.add('active');

  var score7d=getScoreNDaysAgo(sec.id,6);

  if(sec.etf){

      var etfChgColor=etfDp>=0?'#009944':'#cc1133';

        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'+
          '<div><span style="font-size:11px;color:#888;">📊 板塊代表 ETF</span> <b style="font-size:16px;color:#333;font-family:Orbitron,monospace;margin-left:6px;">'+sec.etf+'</b></div>'+
          '<div style="text-align:right;"><div style="font-size:16px;font-weight:700;color:'+etfChgColor+';">$'+etfPrice.toFixed(2)+'</div><div style="font-size:11px;color:'+etfChgColor+';">'+(etfDp>=0?'▲+':'▼')+Math.abs(etfDp).toFixed(2)+'%</div></div>'+
        '</div>'+
        '<div style="font-size:11px;color:#666;">'+etfPhaseLabel+'　<span style="color:#999;">點擊查看 ETF 詳情</span></div>'+
      '</div>';
    } else {
      etfHtml='<div style="background:#f9f9f9;border:1px dashed #ccc;border-radius:10px;padding:10px;margin-bottom:10px;font-size:11px;color:#999;text-align:center;">📊 板塊代表 ETF: '+sec.etf+'（資料載入中或無資料）</div>';
    }
    cont.innerHTML+=etfHtml;
  }
  if(!sec.tickers.length){
    cont.innerHTML+='<div class="empty-hint">這個板塊還沒有股票<br>用上方搜尋框輸入代號</div>';
    return;
  }
  cont.innerHTML+='<div id="triageSummary"></div>';   // v7.9: 一行總結，放在卡片上方
  sec.tickers.forEach(function(t){
    var div=document.createElement('div');
    div.className='stock-card';

    div.innerHTML='<div class="slbar sl-b"></div><div class="loading"><div class="spinner"></div></div>';
    cont.appendChild(div);
  });
  renderTriage(sectorId);
  (async function(){
    for(var i=0;i<sec.tickers.length;i++){
      var t=sec.tickers[i];
      if(!cache[t]||!cache[t].ok) await loadStock(t);
      var el=document.getElementById('sc-'+t);
      if(el) fillCard(t,el);
      renderTriage(sectorId);            // v7.9: 每載入一檔就更新總結
      if(i<sec.tickers.length-1) await sleep(250);
    }
  })();
}

    '<div style="font-size:11px;color:var(--dim);margin-bottom:4px;">均線: '+maStr+'</div>'+
    '<div style="font-size:10px;color:var(--dim);margin-bottom:3px;">📍 近期成本區 $'+(a?a.cL+'-$'+a.cH:'計算中...')+'</div>'+
    // ═══ v7.9:【技術熱度 % 從卡片移除，改成「要不要點進去」】══════════

  document.getElementById('topbar').innerHTML=

    '<div style="font-size:11px;color:'+(d.up?'var(--green)':'var(--red)')+';flex-shrink:0;">'+(d.up?'▲':'▼')+Math.abs(d.q.dp).toFixed(1)+'%</div>';
  var a=d.a,ph=d.ph,p=d.price;

  var pMn=snap((a&&a.botP?a.botP:p*0.7)*0.88,axS,false);
  var pMx=a?snap(Math.max(p*1.35,a.cH*1.25),axS,true):snap(p*1.4,axS,true);

  var cw=a?((a.cH-a.cL)/(pMx-pMn)*100).toFixed(1):'20';

  var cc=a?ccls(a.chip):'low';
  var cn=a?a.chip:0;
  var ds=(d.dist>=0?'+':'')+d.dist+'%';

  var inSec=null;
  if(currentSector){
    var s=sectors.find(function(x){return x.id===currentSector;});

  var secName=currentSector?(sectors.find(function(x){return x.id===currentSector;})||{}).name:'';

    '</div>'+
    // ═══ v6.4 變更：「綜合訊號強度」→「技術熱度」標題 ═════════
    '<div class="dc">'+
      '<div class="dtitle">📊 多頭條件清單（均線排列／OBV／一把火／MA20／多頭排列）'+stamp+'</div>'+
      '<div style="font-size:11.5px;color:#cc0000;background:#fff0f0;padding:6px 8px;border-radius:5px;margin-bottom:6px;border-left:3px solid #cc0000;">'+
        '⚠ <b>這裡的分級是「均線排列」，跟 Weinstein 的 Stage 1-4 完全無關</b>，'+
        '而且數字剛好相反 —— 這裡的最高級是<b>最熱</b>，Weinstein 的 Stage 4 是<b>崩跌</b>。'+
        '一檔已經跌破 30 週線的股票，只要有一把火＋站上 MA20，這裡照樣會亮。'+
        '<b>週線階段看上面的「離 30 週線」，或直接回 dna。</b>'+

        '原本這裡有一個 0~100% 的加權百分比，v7.5 拿掉了 —— 因為'+
        '<b style="color:#cc0000;">那五項全部都已經單獨顯示在這一頁上</b>，'+
        '加總只是製造一個看起來像結論的數字。<br><br>'+
        '<b>唯一穩定可讀的訊號是「五項全亮」</b> —— 那代表這一波該漲的都漲了，不要追。'+
        '亮 2~3 項則<b>無法判斷</b>：可能真的剛起步，也可能條件正在壞掉'+
        '（IREN 亮 2 項，缺的是 OBV 與多頭排列 —— 是後者）。<b>看缺哪幾項，不要看亮幾項。</b><br><br>'+
        '<b>而且這五項沒有「這一波走到哪裡」的概念</b> —— 一檔剛突破的和一檔已經漲了七倍的，'+
        '只要當下條件一樣，清單就一樣。位置看最上面總結的<b>離 30 週線</b>與<b>離 52 週高點</b>；'+
        '<b style="color:#cc0000;">該不該買、買在哪、停損放哪，回 dna。</b>'+
      '</div>'+
    '</div>'+
    (a?
    '<div class="dc">'+
      '<div class="dtitle">📍 量能密集區（近 60 天）'+stamp+'</div>'+
      '<div class="cost-big">$'+a.cL+' -- $'+a.cH+'</div>'+
      // ═══ v7.2:【固定倍數 T1/T2/T3 已移除】════════════════════════
      // 舊版：T1/T2/T3 = 成本中位 × 1.3 / 1.5 / 1.8。那三個倍數是四個月前隨手定的，
      // 與線型、個股波動度、Jasmine 的方法論全都無關。
      // 查證（Minervini）：他明確主張<b>不要設固定目標價</b>，改用上升中的 10 或 21 EMA
      // 跟蹤停利。而 Jasmine 自己的出場規則本來就是「跌破 20 日均線或離開 Stage 2」——
      // 固定倍數留著只會在畫面上跟她的紀律打架。
      // → 只保留 ATR 動態那一版（它至少跟個股波動度掛鉤），並改名叫「參考區間」。
      '<div style="font-size:10.5px;color:#888;margin-bottom:4px;">這是「近 60 天成交量最密集的價格帶」，'+
        '<b>不是主力真的在那裡買</b>。當支撐帶看，不要當成本讀。</div>'+
      '<div style="font-size:11px;color:#666;margin-bottom:10px;background:#f5f0ff;padding:5px 7px;border-radius:4px;border-left:3px solid #7c3aed;">⚡ 參考停損 <b style="color:#cc0000;">$'+a.atrStop.toFixed(2)+'</b><span style="color:#cc0000;font-size:10px;">（'+a.atrStopPct.toFixed(1)+'%）</span><span style="color:#888;">　取 1.5×ATR 與 −8% 較嚴者・ATR $'+a.atr14.toFixed(2)+'</span><br><span style="color:#7c3aed;font-size:10px;">→ v7.7 起不再顯示目標價：出場看 dna 或跌破 20 日均線，不看固定倍數</span></div>'+
      '<div class="arrow-row"><div class="arrow-lbl" style="left:'+np+'%">▼ $'+p.toFixed(2)+'</div></div>'+
      '<div class="cost-track" style="height:14px;position:relative;">'+
        '<div class="cost-zone" style="left:'+cl+'%;width:'+cw+'%;height:100%;"></div>'+
        '<div class="cost-pin" style="left:'+np+'%;height:100%;"></div>'+
        // v7.7: T1/T2/T3 三根標線移除。這條軸現在只有三個東西：
        //   藍塊 = 量能密集區、橘針 = 現價、紅針 = 參考停損。
        '<div style="position:absolute;left:'+pp(a.atrStop,pMn,pMx)+'%;top:0;bottom:0;width:2px;background:#cc0000;"></div>'+
      '</div>'+
      '<div style="position:relative;height:14px;margin-top:2px;font-size:9px;font-weight:700;">'+
        '<div style="position:absolute;left:'+pp(a.atrStop,pMn,pMx)+'%;color:#cc0000;transform:translateX(-50%);">停損</div>'+
      '</div>'+
      '<div class="cost-axis" style="margin-top:3px;"><span>$'+pMn+'</span><span style="color:var(--blue);font-weight:600;">現價'+ds+'於成本</span><span>$'+pMx+'</span></div>'+
    '</div>'+
    '<div class="dc">'+
      '<div class="dtitle">📊 詳細數據'+stamp+'</div>'+
      '<div class="dr"><span>底部確認</span><span class="dv-b">$'+a.botP.toFixed(2)+'（'+a.botD+'）</span></div>'+
      '<div class="dr"><span>量能密集區中位</span><span class="dv-b">$'+a.mainCostMid.toFixed(2)+'</span></div>'+
      '<div class="dr"><span>加權成本</span><span class="dv-b">$'+a.wc+'</span></div>'+
      '<div class="dr"><span>離 30 週線 / 離 52 週高點</span><span>'
        +(a.dist150!==null?'<span style="font-weight:700;color:'+(a.dist150<0?'#cc0000':a.dist150>50?'#dd6600':'#0066bb')+';">'+(a.dist150>=0?'+':'')+a.dist150.toFixed(0)+'%</span>':'—')
        +' / '+(a.off52!==null?'<span style="font-weight:700;color:'+(a.off52<-30?'#cc0000':'#666')+';">'+a.off52.toFixed(0)+'%</span>':'—')+'</span></div>'+
      '<div class="dr"><span>現價</span><span class="'+(d.up?'dv-g':'dv-r')+'">$'+p.toFixed(2)+'</span></div>'+
      '<div class="dr"><span>MA5 / MA8 / MA10 / MA21</span><span style="font-size:11px;">$'+a.ma5.toFixed(1)+' / <b style="color:#0066cc;">$'+a.ma8.toFixed(1)+'</b> / $'+a.ma10.toFixed(1)+' / <b style="color:#cc6600;">$'+a.ma21.toFixed(1)+'</b></span></div>'+
      '<div class="dr"><span>ATR(14) / 波動率</span><span><b style="color:#7c3aed;">$'+a.atr14.toFixed(2)+'</b> <span style="color:#888;font-size:11px;">('+a.atrPct.toFixed(1)+'%)</span></span></div>'+
      '<div class="dr"><span>今日漲跌</span><span class="'+(d.up?'dv-g':'dv-r')+'">'+(d.up?'▲':'▼')+Math.abs(d.q.dp).toFixed(2)+'%</span></div>'+
    '</div>'
    :'')+
    '<div class="dc">'+
      '<div class="dtitle">⚙️ 名單管理</div>'+
      (inSec?
        '<button class="btn-remove" onclick="removeStock(\''+t+'\')">➖ 從「'+secName+'」板塊移除</button>'
        :
        '<div style="font-size:11px;color:var(--dim);margin-bottom:8px;">加入到哪個板塊？</div>'+
        getSectors().map(function(s){
          return '<button class="btn-add btn-blue" style="margin-bottom:6px;" onclick="addStock(\''+t+'\',\''+s.id+'\')">'+s.icon+' '+s.name+'</button>';
        }).join('')
      )+
      '<div style="font-size:10px;color:var(--dim);margin-top:8px;text-align:center;">'+
        '總監控：'+getSectors().reduce(function(sum,s){return sum+s.tickers.length;},0)+'/200支'+
      '</div>'+

}

function goBack(){
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('stockListPage').classList.add('active');
  document.getElementById('topbar').innerHTML=
    '<div class="logo">飆股<span>RADAR</span> v8.1</div><div style="flex:1"></div>'+
    '<button class="refresh-btn" onclick="initApp()">🔄 更新</button>';
  if(currentSector) showSector(currentSector);
}

function addStock(ticker,sectorId){
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===sectorId;});
  if(!sec)return;
  if(!sec.tickers.includes(ticker)){
    var total=sectors.reduce(function(sum,s){return sum+s.tickers.length;},0);
    if(total>=200){alert('候補名單已達上限200支！');return;}
    sec.tickers.push(ticker);
    saveSectors(sectors);
    closeAddModal();
    alert('✅ '+ticker+' 已加入「'+sec.name+'」板塊！');
    if(currentSector===sectorId) showSector(sectorId);
    else goBack();
  }else{alert(ticker+' 已在「'+sec.name+'」中');}
}

function removeStock(ticker){
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===currentSector;});
  if(!sec||!confirm('確定將 '+ticker+' 從「'+sec.name+'」移除？'))return;
  sec.tickers=sec.tickers.filter(function(t){return t!==ticker;});
  saveSectors(sectors);
  goBack();
}

function reloadSector(){
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===currentSector;});
  if(!sec)return;
  sec.tickers.forEach(function(t){delete cache[t];});
  if(sec.etf) delete cache[sec.etf];
  showSector(currentSector);
}

async function searchStock(){
  var input=document.getElementById('searchInput');
  var t=input.value.toUpperCase().trim();
  if(!t)return;
  input.value='';
  delete cache[t];
  document.getElementById('stockListPage').classList.remove('active');
  document.getElementById('detailPage').classList.add('active');
  document.getElementById('topbar').innerHTML=
    '<div class="back-btn" onclick="goBack()">←</div>'+
    '<div class="topbar-title">搜尋 '+t+'...</div>';
  document.getElementById('detailPage').innerHTML=
    '<div class="loading"><div class="spinner"></div><br>分析中...</div>';
  await loadStock(t);
  var d=cache[t];
  if(!d||d.err){
    document.getElementById('detailPage').innerHTML=
      '<div style="padding:16px;">'+
      '<div class="err">⚠️ 找不到「'+t+'」<br>請確認股票代號是否正確</div>'+
      '<button class="btn-add" style="margin-top:10px;background:var(--blue);" onclick="goBack()">← 返回</button></div>';
    return;
  }
  showDetail(t);
}

function closeAddModal(){
  document.getElementById('addModal').classList.remove('show');
}

window.openBatchAdd = function(sectorId){
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===sectorId;});
  if(!sec) return;
  document.getElementById('addModalTitle').textContent='批量新增股票到「'+sec.icon+' '+sec.name+'」';
  document.getElementById('addModalBody').innerHTML=
    '<div style="font-size:12px;color:#666;margin-bottom:10px;line-height:1.6;">'+
      '請輸入股票代號，多個用<b>空格</b>或<b>逗號</b>分隔。<br>'+
      '例：<code style="background:#eee;padding:2px 6px;border-radius:4px;">IIJI ONDS APH</code>'+
    '</div>'+
    '<input id="batchInput" type="text" placeholder="輸入代號" style="width:100%;padding:11px;border:1.5px solid #ccc;border-radius:8px;font-size:15px;text-transform:uppercase;margin-bottom:10px;-webkit-appearance:none;">'+
    '<div style="font-size:11px;color:#999;margin-bottom:10px;">目前「'+sec.name+'」有 <b>'+sec.tickers.length+'</b> 檔　總監控：'+sectors.reduce(function(s,x){return s+x.tickers.length;},0)+'/200</div>'+
    '<button onclick="submitBatchAdd(\''+sectorId+'\')" style="width:100%;background:#009944;color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;">確認新增</button>';
  document.getElementById('addModal').classList.add('show');
};

window.submitBatchAdd = function(sectorId){
  var input=document.getElementById('batchInput');
  if(!input) return;
  var raw=(input.value||'').toUpperCase();
  var tickers=raw.split(/[\s,;]+/).filter(function(t){return t&&t.length>=1&&t.length<=8;});
  if(tickers.length===0){alert('請輸入至少 1 個股票代號');return;}
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===sectorId;});
  if(!sec){alert('找不到板塊');return;}
  var added=[], existed=[], total=sectors.reduce(function(s,x){return s+x.tickers.length;},0);
  tickers.forEach(function(t){
    if(sec.tickers.indexOf(t)>=0){existed.push(t);}
    else if(total>=200){}
    else {sec.tickers.push(t); added.push(t); total++;}
  });
  saveSectors(sectors);
  closeAddModal();
  var msg='';
  if(added.length>0) msg+='✅ 已加入：'+added.join('、')+'\n';
  if(existed.length>0) msg+='⚠️ 已存在：'+existed.join('、')+'\n';
  if(total>=200&&tickers.length>added.length+existed.length){msg+='❌ 部分未加：已達 200 支上限';}
  alert(msg||'沒有新增');
  if(currentSector===sectorId){showSector(sectorId);}
};

async function initApp(){
  cache={};
  currentSector=null;
  scanDone=false;
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('stockListPage').classList.add('active');
  document.getElementById('topbar').innerHTML=
    '<div class="logo">飆股<span>RADAR</span> v8.1</div><div style="flex:1"></div>'+
    '<button class="refresh-btn" onclick="initApp()">🔄 更新</button>';
  document.getElementById('listHeader').innerHTML=
    '<span style="color:var(--dim);">👆 點選上方板塊查看個股</span>';
  document.getElementById('cardContainer').innerHTML='';
  renderHeatStrip(null);
  migrateSectors();
  var sectors=getSectors();
  var allSet={};
  allSet['SPY']=1;   // v7.8: 市場基準，板塊 ETF 的相對強弱要拿它當分母
  sectors.forEach(function(s){
    s.tickers.forEach(function(t){allSet[t]=1;});
    if(s.etf) allSet[s.etf]=1;
  });
  var all=Object.keys(allSet);
  for(var i=0;i<all.length;i++){
    await loadStock(all[i]);
    renderHeatStrip(currentSector);
    if(currentSector){
      var sec=getSectors().find(function(s){return s.id===currentSector;});
      if(sec&&sec.tickers.includes(all[i])){
        var el=document.getElementById('sc-'+all[i]);
        if(el) fillCard(all[i],el);
      }
    }
    if(i<all.length-1) await sleep(250);
  }
  scanDone=true;
  renderHeatStrip(currentSector);
}

initApp();
</script>
