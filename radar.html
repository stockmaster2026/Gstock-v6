<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}

.topbar{background:rgba(245,232,140,0.97);border-bottom:2px solid var(–border);padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:200;}
.logo{font-family:‘Orbitron’,monospace;font-size:14px;font-weight:900;color:var(–orange);letter-spacing:2px;flex-shrink:0;}
.logo span{color:var(–blue);}
.back-btn{font-size:24px;color:var(–blue);cursor:pointer;flex-shrink:0;line-height:1;}
.topbar-title{flex:1;font-family:‘Orbitron’,monospace;font-size:15px;font-weight:900;text-align:center;}
.refresh-btn{background:var(–orange);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:900;cursor:pointer;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,0.2);}

.heat-strip{
background:#fff8e0;border-bottom:3px solid #d4b800;
padding:10px 8px;display:flex;gap:6px;overflow-x:auto;
-webkit-overflow-scrolling:touch;
}
.heat-strip::-webkit-scrollbar{display:none;}
.heat-chip{
flex-shrink:0;display:flex;flex-direction:column;align-items:center;
padding:6px 8px;border-radius:10px;cursor:pointer;
border:2px solid #d4b800;background:#fffde0;
transition:all 0.2s;width:78px;position:relative;
}
.heat-chip:active{transform:scale(0.95);}
.heat-chip.sel{border-color:var(–orange);background:rgba(221,102,0,0.12);}

.hc-change.dn{color:var(–red);}
.hc-change.flat{color:var(–dim);}

.btn-add{width:100%;background:var(–green);color:white;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px;font-family:‘Noto Sans TC’,sans-serif;}

<script>
var SKEY='biaoguo_sectors_v5';
var HKEY='biaoguo_history_v1';

var SECTORS_DEFAULT=[
  {id:'ai_giant',  icon:'🤖', name:'AI巨頭',    etf:'QQQ',  tickers:['NVDA','META','GOOGL','MSFT','AMZN']},
  {id:'ai_infra',  icon:'🏗️', name:'AI基礎設施', etf:'WCLD', tickers:['ANET','SMCI','DELL','CRWD','SNOW']},
  {id:'optical',   icon:'💡', name:'光通信',     etf:'PHO',  tickers:['COHR','LITE','AAOI','AXTI','APH']},
  {id:'power',     icon:'⚡', name:'AI電力散熱', etf:'XLU',  tickers:['VST','CEG','ETN','GNRC','AXON']},
  {id:'space',     icon:'🛰️', name:'太空衛星',   etf:'UFO',  tickers:['LUNR','RKLB','PL','BKSY','ASTS']},
  {id:'drone',     icon:'🚁', name:'無人機國防', etf:'ITA',  tickers:['ONDS','KTOS','PLTR','ACHR','JOBY']},
  {id:'quantum',   icon:'⚛️', name:'量子運算',   etf:'QTUM', tickers:['IONQ','RGTI','QBTS','QUBT']},
  {id:'storage',   icon:'💾', name:'儲存硬體',   etf:'SMH',  tickers:['MU','WDC','NTAP','STX','SNDK','P']},
  {id:'biotech',   icon:'🧬', name:'生技健康',   etf:'XBI',  tickers:['TEM','HIMS','RXRX','NVAX','CRSP']},
  {id:'satcom',    icon:'🌐', name:'衛星通信',   etf:'UFO',  tickers:['IRDM','SATS','GSAT','VSAT']},
  {id:'metals',    icon:'💰', name:'貴金屬礦業', etf:'GDX',  tickers:['GLD','SLV','NEM','AEM','WPM']},
  {id:'custom',    icon:'⭐', name:'自訂',       etf:null,   tickers:[]},
];

function getSectors(){
  try{var s=localStorage.getItem(SKEY);if(s)return JSON.parse(s);}catch(e){}
  return JSON.parse(JSON.stringify(SECTORS_DEFAULT));
}
function saveSectors(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}

// === 板塊歷史分數記錄 ===
function getHistory(){
  try{var s=localStorage.getItem(HKEY);if(s)return JSON.parse(s);}catch(e){}
  return {records:[]};
}
function saveHistory(h){try{localStorage.setItem(HKEY,JSON.stringify(h));}catch(e){}}

function todayKey(){return new Date().toISOString().slice(0,10);}

// 記錄今日分數（每天只記錄一次，後續更新覆蓋）
function recordTodayScores(scores){
  var hist=getHistory();
  var key=todayKey();
  // 找今日的紀錄
  var idx=-1;
  for(var i=0;i<hist.records.length;i++){
    if(hist.records[i].date===key){idx=i;break;}
  }
  var record={date:key,scores:scores};
  if(idx>=0){
    hist.records[idx]=record;
  }else{
    hist.records.push(record);
  }
  // 只保留最近 30 天
  if(hist.records.length>30){
    hist.records=hist.records.slice(-30);
  }
  saveHistory(hist);
}

// 取得 N 天前的分數
// 注意：n=0 表示「上一個交易日」，因為今日還沒記錄前才比較
// 但實際上 recordTodayScores 已經先記錄了今日，所以 records[length-1] 是今日
// records[length-2] 是昨日 → getScoreNDaysAgo(0) 應該取 records[length-2]
function getScoreNDaysAgo(sectorId, n){
  var hist=getHistory();
  // 至少要有 2 筆紀錄（今日 + 至少 1 天歷史）
  if(hist.records.length < n+2) return null;
  // 跳過今日（最後一筆），取昨日 / 前 n 天
  var rec=hist.records[hist.records.length-2-n];
  if(!rec || !rec.scores) return null;
  return rec.scores[sectorId];
}

// 計算趨勢標籤
function getTrendLabel(currentScore, score1d, score7d){
  // 沒歷史數據
  if(score1d===null||score1d===undefined) return null;
  
  var change1d=currentScore-score1d;
  var change7d=score7d!==null&&score7d!==undefined?currentScore-score7d:null;
  
  // 判斷邏輯
  // 上升中：score 中等且持續往上
  // 領先：score 高且持續強
  // 走弱：score 高但開始降
  // 落後：score 低且持續弱
  
  if(currentScore>=70){
    // 高分區
    if(change1d>=-2) return {label:'領先',cls:'tr-leading'};
    else return {label:'走弱',cls:'tr-weakening'};
  }else if(currentScore>=50){
    // 中分區
    if(change1d>=3) return {label:'上升中',cls:'tr-improving'};
    else if(change1d<=-3) return {label:'走弱',cls:'tr-weakening'};
    else if(change7d!==null&&change7d>=5) return {label:'上升中',cls:'tr-improving'};
    else return null;
  }else{
    // 低分區
    if(change1d>=3) return {label:'上升中',cls:'tr-improving'};
    else return {label:'落後',cls:'tr-lagging'};
  }
}

var cache={};
var currentSector=null;

const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';
async function api(ep){
  const r=await fetch('https://finnhub.io/api/v1'+ep+'&token='+K);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function fetchYahoo(t){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?interval=1d&range=1y';
  var url='https://corsproxy.io/?'+encodeURIComponent(base);
  var r=await fetch(url);
  if(!r.ok) throw new Error('Yahoo HTTP '+r.status);
  var data=await r.json();
  if(!data.chart||!data.chart.result||!data.chart.result[0])
    throw new Error('no yahoo data');
  return data.chart.result[0];
}

async function fetchFloat(t){
  try{
    var r=await api('/stock/profile2?symbol='+t);
    if(r&&r.shareOutstanding&&r.shareOutstanding>0)
      return r.shareOutstanding*1000000;
  }catch(e){}
  return null;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function fetchQ(t){
  return api('/quote?symbol='+t);
}

function analyzeYahoo(result, floatShares){
  try{
    var timestamps=result.timestamp;
    var q=result.indicators.quote[0];
    var closes=q.close,volumes=q.volume,highs=q.high,lows=q.low,opens=q.open;
    var n=closes.length;
    if(n<20) return null;

    var valid=[];
    for(var i=0;i<n;i++){
      if(closes[i]&&volumes[i]&&highs[i]&&lows[i]&&opens[i]){
        valid.push({c:closes[i],v:volumes[i],h:highs[i],l:lows[i],o:opens[i],t:timestamps[i]});
      }
    }
    if(valid.length<20) return null;
    var m=valid.length;

    function ma(k){
      var sl=valid.slice(-Math.min(k,m));
      return sl.reduce(function(s,d){return s+d.c;},0)/sl.length;
    }
    var ma5=ma(5),ma10=ma(10),ma20=ma(20),ma50=ma(50);

    var obv=0,obvArr=[0];
    for(var i=1;i<m;i++){
      if(valid[i].c>valid[i-1].c) obv+=valid[i].v;
      else if(valid[i].c<valid[i-1].c) obv-=valid[i].v;
      obvArr.push(obv);
    }
    var obvRecent=obvArr.slice(-10).reduce(function(s,v){return s+v;},0)/10;
    var obvPrev=obvArr.slice(-20,-10).reduce(function(s,v){return s+v;},0)/10;
    var obvRising=obvRecent>obvPrev;

    var avgVol20=valid.slice(-20).reduce(function(s,d){return s+d.v;},0)/20;

    var recent60=valid.slice(-60);
    var fires=[];
    for(var i=0;i<recent60.length;i++){
      var d=recent60[i];
      var vr=d.v/avgVol20;
      if(vr>=2.0&&d.c>d.o){
        fires.push({
          date:new Date(d.t*1000).toISOString().slice(0,10),
          volRatio:vr.toFixed(1),
          close:d.c
        });
      }
    }

    var price=valid[m-1].c;

    var maUpTrend=ma5>ma10&&ma10>ma20&&ma20>ma50;
    var maBearish=ma5<ma20&&ma20<ma50;
    var aboveMA20=price>ma20;
    var distMA20=(price/ma20-1)*100;

    var phase;
    if(maUpTrend&&distMA20>30) phase=4;
    else if(maUpTrend&&aboveMA20) phase=3;
    else if(!maBearish&&fires.length>0&&aboveMA20) phase=2;
    else phase=1;

    var zn={};
    recent60.forEach(function(d){
      var z=Math.floor(d.c/5)*5;
      if(!zn[z])zn[z]=0;
      zn[z]+=d.v;
    });
    var topZones=Object.keys(zn).sort(function(a,b){return zn[b]-zn[a];}).slice(0,2).map(Number).sort(function(a,b){return a-b;});
    var cL=topZones[0]||Math.floor(price*0.85/5)*5;
    var cH=(topZones[1]||cL)+5;

    var tv=0,tw=0;
    recent60.forEach(function(d){tv+=d.v;tw+=d.c*d.v;});
    var wc=tv>0?Math.round(tw/tv*100)/100:price;

    // === 補：底部確認價 botP / botD（近 60 天最低）===
    var lowest=recent60[0];
    for(var i=1;i<recent60.length;i++){
      if(recent60[i].l<lowest.l) lowest=recent60[i];
    }
    var botP=lowest.l;
    var botD=new Date(lowest.t*1000).toISOString().slice(0,10);

    // === 補：籌碼完成度 chip（0-100%）===
    // 邏輯：綜合 phase + obv 上升 + 一把火數量 + 站上 MA20
    var chip=0;
    chip+=phase*15;  // phase 1=15, 2=30, 3=45, 4=60
    if(obvRising) chip+=20;
    chip+=Math.min(fires.length*5,15);  // 一把火最多加 15
    if(aboveMA20) chip+=10;
    if(maUpTrend) chip+=15;
    chip=Math.min(chip,100);

    // 計算 T1/T2/T3（用主力成本中位數 × 1.3 / 1.5 / 1.8）
    var mainCostMid=(cL+cH)/2;
    var t1=mainCostMid*1.3;
    var t2=mainCostMid*1.5;
    var t3=mainCostMid*1.8;
    
    return{phase:phase,ma5:ma5,ma10:ma10,ma20:ma20,ma50:ma50,
      obvRising:obvRising,fires:fires,avgVol20:avgVol20,
      cL:cL,cH:cH,wc:wc,distMA20:distMA20,
      maUpTrend:maUpTrend,maBearish:maBearish,aboveMA20:aboveMA20,
      botP:botP,botD:botD,chip:chip,
      t1:t1,t2:t2,t3:t3,mainCostMid:mainCostMid};
  }catch(e){return null;}
}

async function loadStock(t){
  if(cache[t]&&cache[t].ok) return cache[t];
  try{
    var results=await Promise.all([
      fetchQ(t), fetchYahoo(t), fetchFloat(t)
    ]);
    var q=results[0];
    var yahoo=results[1];
    var floatShares=results[2];
    await sleep(150);

    var price=q.c||q.pc||0;
    if(!price) throw new Error('no price');
    if(!q.c&&q.pc) q.c=q.pc;
    if(!q.dp) q.dp=0;

    var a=analyzeYahoo(yahoo, floatShares);
    var ph=getPhase(q.c,a);
    var dist=a&&a.wc>0?Math.round((q.c/a.wc-1)*100):0;
    cache[t]={ok:true,q:q,a:a,ph:ph,dist:dist,price:q.c,up:q.dp>=0};
  }catch(e){
    cache[t]={ok:true,err:true,msg:e.message||'failed'};
  }
  return cache[t];
}

function getPhase(price,a){
  if(!a) return{ph:'wait',badge:'⚠️ 數據不足',sc:'sl-r',bd:'bd-r',ac:'adv-r',at:'at-r',icon:'⚠️',title:'數據不足',text:'無法分析'};
  if(a.phase===4)
    return{ph:'hot',badge:'🔴 Phase4 過熱·勿追買',sc:'sl-r',bd:'bd-r',ac:'adv-r',at:'at-r',icon:'⚡',title:'過熱，不追買',text:'均線多頭但離MA20超過30%，等回測MA20再考慮。'};
  if(a.phase===3)
    return{ph:'hold',badge:'🟢 Phase3 多頭進行中',sc:'sl-g',bd:'bd-g',ac:'adv-g',at:'at-g',icon:'✅',title:'多頭進行中',text:'均線多頭排列，可持有。等回測MA20是加碼機會。'};
  if(a.phase===2)
    return{ph:'watch',badge:'🟠 Phase2 啟動訊號',sc:'sl-o',bd:'bd-o',ac:'adv-o',at:'at-o',icon:'🚀',title:'啟動訊號出現',text:'有一把火確認！等量能持續+收盤站穩MA20進場。'};
  if(a.obvRising)
    return{ph:'accum',badge:'🟡 Phase1 主力吸籌中',sc:'sl-b',bd:'bd-b',ac:'adv-b',at:'at-b',icon:'🐋',title:'主力吸籌中',text:'空頭走勢但OBV上升，主力悄悄買入。等Phase2訊號。'};
  return{ph:'wait',badge:'🔴 Phase1 空頭整理',sc:'sl-r',bd:'bd-r',ac:'adv-r',at:'at-r',icon:'⏳',title:'觀望',text:'空頭排列，OBV未見異常，暫時觀望。'};
}

function ccls(c){return c>=100?'full':c>=60?'high':c>=30?'mid':'low';}
function pp(v,mn,mx){return Math.min(Math.max((v-mn)/(mx-mn)*100,2),96).toFixed(1);}

function heatScore(tickers, etfTicker){
  // ETF 分數佔 60%（如果有），個股平均佔 40%
  var stockScore=0;
  if(tickers&&tickers.length){
    var s=[];
    tickers.forEach(function(t){
      var d=cache[t];if(!d||d.err)return;
      var phaseScore=d.a?([0,20,50,80,60][d.a.phase]||20):20;
      var chgScore=Math.min(Math.max(((d.q.dp||0)+10)*4,0),100)*0.3;
      var obvScore=d.a&&d.a.obvRising?20:0;
      s.push(phaseScore*0.5+chgScore+obvScore);
    });
    stockScore=s.length?s.reduce(function(a,b){return a+b;},0)/s.length:0;
  }
  
  // ETF 分數
  if(etfTicker){
    var etfData=cache[etfTicker];
    if(etfData&&!etfData.err&&etfData.a){
      var etfPhase=([0,20,50,80,60][etfData.a.phase]||20);
      var etfChg=Math.min(Math.max(((etfData.q.dp||0)+10)*4,0),100)*0.3;
      var etfObv=etfData.a.obvRising?20:0;
      var etfScore=etfPhase*0.5+etfChg+etfObv;
      // ETF 60% + 個股 40%
      return Math.round(etfScore*0.6+stockScore*0.4);
    }
  }
  
  // 沒 ETF 資料 → 完全用個股
  return Math.round(stockScore);
}
function avgChg(tickers){
  var v=tickers.map(function(t){return cache[t]&&!cache[t].err?cache[t].q.dp:null;}).filter(function(x){return x!==null;});
  return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null;
}
function heatInfo(sc){
  if(sc>=70)return{cls:'hot3',fire:'🔥🔥🔥',col:'var(--red)'};
  if(sc>=50)return{cls:'hot2',fire:'🔥🔥',col:'var(--orange)'};
  if(sc>=30)return{cls:'hot1',fire:'🔥',col:'#aa8800'};
  return{cls:'cold',fire:'❄️',col:'var(--dim)'};
}

function getDiaryHoldings(){
  // 嘗試讀取日記的持倉資料（diary_v1_state）
  try{
    var raw=localStorage.getItem('diary_v1_state');
    if(!raw) return [];
    var state=JSON.parse(raw);
    var all=[];
    if(state&&state.pools){
      ['old','new'].forEach(function(pk){
        var p=state.pools[pk];
        if(p&&p.holdings){
          p.holdings.forEach(function(h){
            if(h.ordType!=='plan'){
              all.push({ticker:h.ticker, pool:p.name, entryPrice:h.entryPrice});
            }
          });
        }
      });
    }
    return all;
  }catch(e){return [];}
}

function renderDailyObserve(){
  var box=document.getElementById('dailyObserve');
  if(!box) return;
  
  var sectors=getSectors();
  var sectorData=[];
  
  // 收集每個板塊的數據
  sectors.forEach(function(sec){
    if(sec.id==='custom') return;
    var sc=heatScore(sec.tickers, sec.etf);
    var score1d=getScoreNDaysAgo(sec.id,0);
    var score7d=getScoreNDaysAgo(sec.id,6);
    var change1d=score1d!==null&&score1d!==undefined?(sc-score1d):null;
    var change7d=score7d!==null&&score7d!==undefined?(sc-score7d):null;
    var trend=getTrendLabel(sc,score1d,score7d);
    sectorData.push({
      sec:sec, score:sc, change1d:change1d, change7d:change7d, trend:trend
    });
  });
  
  // 排序：依分數降序
  var sorted=sectorData.slice().sort(function(a,b){return b.score-a.score;});
  
  // 找上升中（🔵）
  var rising=sectorData.filter(function(d){return d.trend&&d.trend.label==='上升中';});
  rising.sort(function(a,b){return (b.change1d||0)-(a.change1d||0);});
  
  // 找走弱（🟡）
  var weakening=sectorData.filter(function(d){return d.trend&&d.trend.label==='走弱';});
  weakening.sort(function(a,b){return (a.change1d||0)-(b.change1d||0);});
  
  // 找領先但要警戒（高分但持平）
  var leading=sectorData.filter(function(d){return d.trend&&d.trend.label==='領先';});
  leading.sort(function(a,b){return b.score-a.score;});
  
  // 你的持倉
  var holdings=getDiaryHoldings();
  
  var hist=getHistory();
  var hasHistory=hist.records.length>=2;
  
  var html='';
  
  if(!hasHistory){
    // 第 1 天：沒歷史
    html='<div style="font-weight:700;color:#dd6600;margin-bottom:6px;">📊 今日板塊觀察（第 1 天）</div>';
    html+='<div style="margin-bottom:6px;">最強板塊 Top 3（依當下分數）：</div>';
    sorted.slice(0,3).forEach(function(d,i){
      html+='<div style="margin-left:10px;margin-bottom:3px;">'+(i+1)+'. '+d.sec.icon+' <b>'+d.sec.name+'</b>　<span style="color:#dd6600;font-weight:700;">'+d.score+'分</span></div>';
    });
    html+='<div style="margin-top:6px;color:#8a8a6a;font-size:11px;">⚠ 今天是第一天，沒有歷史對比。明天起會出現↑↓變化箭頭，7 天後完整呈現輪動軌跡。</div>';
  }else{
    // 有歷史
    html='<div style="font-weight:700;color:#0066bb;margin-bottom:6px;">📊 今日板塊觀察</div>';
    
    // 上升中
    if(rising.length>0){
      html+='<div style="color:#3498db;font-weight:700;margin-top:4px;">🔵 上升中（建議關注）：</div>';
      rising.slice(0,3).forEach(function(d){
        var rec=getRecommendStock(d.sec);
        html+='<div style="margin-left:10px;margin-bottom:3px;">';
        html+='・'+d.sec.icon+' <b>'+d.sec.name+'</b> '+d.score+'分 ↑'+d.change1d;
        if(d.change7d!==null) html+='（7日 '+(d.change7d>=0?'+':'')+d.change7d+'）';
        if(rec) html+='　推薦：<span style="color:#009944;font-weight:700;">'+rec+'</span>';
        html+='</div>';
      });
    }
    
    // 走弱
    if(weakening.length>0){
      html+='<div style="color:#dd6600;font-weight:700;margin-top:6px;">🟡 走弱（避開或減碼）：</div>';
      weakening.slice(0,3).forEach(function(d){
        html+='<div style="margin-left:10px;margin-bottom:3px;">';
        html+='・'+d.sec.icon+' <b>'+d.sec.name+'</b> '+d.score+'分 ↓'+Math.abs(d.change1d);
        // 你的持倉是否在這板塊
        var inSec=holdings.filter(function(h){return d.sec.tickers.indexOf(h.ticker)>=0;});
        if(inSec.length>0){
          var tickers=inSec.map(function(h){return h.ticker;}).join('、');
          html+='　<span style="color:#cc1133;font-weight:700;">⚠ 你持有：'+tickers+'</span>';
        }
        html+='</div>';
      });
    }
    
    // 領先（小心追高）
    if(leading.length>0){
      html+='<div style="color:#27ae60;font-weight:700;margin-top:6px;">🟢 領先（持有，但勿追高）：</div>';
      leading.slice(0,3).forEach(function(d){
        html+='<div style="margin-left:10px;margin-bottom:3px;">';
        html+='・'+d.sec.icon+' <b>'+d.sec.name+'</b> '+d.score+'分';

        if(inSec.length>0){

// 從板塊找推薦個股（取 Phase3 + OBV 上升）
function getRecommendStock(sec){
  if(!sec.tickers||!sec.tickers.length) return null;
  var candidates=[];
  sec.tickers.forEach(function(t){
    var d=cache[t];
    if(d&&!d.err&&d.a&&d.a.phase===3&&d.a.obvRising){
      candidates.push({t:t, fires:d.a.fires.length});
    }
  });
  candidates.sort(function(a,b){return b.fires-a.fires;});
  return candidates.length?candidates[0].t:null;
}

// === 進場分析（核心邏輯）===
function getTradingAdvice(price, a, ph){
  if(!a){
    return {
      icon:'⚠️', title:'數據不足',
      bg:'#f5f5f5', border:'#ccc', titleColor:'#666',
      summary:'這檔股票歷史資料不足，無法進行完整分析。建議避開或等資料齊全後再評估。',
      dataPoints:'<div>無法計算技術指標</div>',
      suggestion:''
    };
  }
  
  // 計算關鍵比例
  var costMid = a.mainCostMid;
  var pctVsCost = ((price/costMid - 1) * 100).toFixed(1);
  var pctVsT3 = ((price/a.t3 - 1) * 100).toFixed(1);
  var pctVsT1 = ((price/a.t1 - 1) * 100).toFixed(1);
  
  // 籌碼解讀
  var chipLabel, chipMeaning;
  if(a.chip < 30){
    chipLabel = '吸籌期';
    chipMeaning = '主力剛開始累積，量能不足';
  } else if(a.chip < 60){
    chipLabel = '啟動期 ⭐';
    chipMeaning = '主力大量吸籌，準備拉抬（最佳進場區）';
  } else if(a.chip < 90){
    chipLabel = '末段';
    chipMeaning = '主力已吸夠，可能準備出貨';
  } else {
    chipLabel = '危險區 🚨';
    chipMeaning = '主力幾乎出貨完，可能準備下跌';
  }
  
  // 價格位置判斷
  var pricePos, advisory;
  if(price < a.cL){
    pricePos = '低於主力成本';
    advisory = 'low_cost';
  } else if(price <= a.cH){
    pricePos = '在主力成本區內 ⭐';
    advisory = 'in_cost';
  } else if(price < a.t1){
    pricePos = '高於成本但未達 T1';
    advisory = 'pre_t1';
  } else if(price < a.t2){
    pricePos = '已達 T1 區';
    advisory = 'at_t1';
  } else if(price < a.t3){
    pricePos = '已達 T2 區';
    advisory = 'at_t2';
  } else {
    pricePos = '超越 T3 出貨區 🚨';
    advisory = 'past_t3';
  }
  
  // 資料點（顯示在客觀數據區塊）
  var dataPoints = 
    '<div>• 現價 vs 主力成本：<b>+'+pctVsCost+'%</b>（'+pricePos+'）</div>'+
    '<div>• 籌碼完成度：<b>'+a.chip+'%</b>（'+chipLabel+'：'+chipMeaning+'）</div>'+
    '<div>• Phase 階段：<b>'+ph.title+'</b></div>'+
    '<div>• 主力成本區：<b>$'+a.cL+' - $'+a.cH+'</b>（中位 $'+costMid.toFixed(2)+'）</div>'+
    '<div>• T1/T2/T3：<b>$'+a.t1.toFixed(2)+' / $'+a.t2.toFixed(2)+' / $'+a.t3.toFixed(2)+'</b></div>'+
    '<div>• OBV 趨勢：<b>'+(a.obvRising?'上升（吸籌跡象）':'下降')+'</b></div>'+
    '<div>• 一把火（量增）：<b>近 60 天 '+a.fires.length+' 次</b></div>';
  
  // === 綜合建議邏輯 ===
  
  // 情境 1：超越 T3（過熱）
  if(advisory === 'past_t3'){
    return {
      icon:'🚨', title:'強烈不建議進場',
      bg:'#ffe8e8', border:'#cc1133', titleColor:'#cc1133',
      summary:'現價 $'+price.toFixed(2)+' 已超越 T3 出貨區 $'+a.t3.toFixed(2)+'（比 T3 還高 '+pctVsT3+'%）。這代表主力可能已經在出貨，現在進場等於接刀子。',
      dataPoints:dataPoints,
      suggestion:'⛔ 不要追高｜如果已持有：拉緊停損，達 T1 沒賣的就在現價附近出'
    };
  }
  
  // 情境 2：達 T2 區（已過半）
  if(advisory === 'at_t2'){
    return {
      icon:'⚠️', title:'進場價偏高',
      bg:'#fff4e0', border:'#dd6600', titleColor:'#dd6600',
      summary:'現價 $'+price.toFixed(2)+' 已達 T2 區（比 T1 高 '+pctVsT1+'%）。可能還有 T3 空間，但風險已大於報酬。',
      dataPoints:dataPoints,
      suggestion:'⚠️ 不建議新進場｜已持有：依紀律規則操作（達 T2 賣 30%）'
    };
  }
  
  // 情境 3：達 T1 區
  if(advisory === 'at_t1'){
    return {
      icon:'⚠️', title:'進場前需謹慎評估',
      bg:'#fff8e0', border:'#dd9900', titleColor:'#dd6600',
      summary:'現價 $'+price.toFixed(2)+' 接近或已達 T1 區。如果剛突破 T1 + 量增 + Phase3 = 可考慮，否則應該等回測。',
      dataPoints:dataPoints,
      suggestion:'⚠️ 條件性進場｜需確認：1) 突破 T1 後量增 2) 大盤環境 3) R:R >= 1:3'
    };
  }
  
  // 情境 4：在主力成本區（最佳進場）
  if(advisory === 'in_cost'){
    if(a.phase >= 2 && a.obvRising){
      return {
        icon:'✅', title:'可考慮進場',
        bg:'#e8f8e8', border:'#009944', titleColor:'#009944',
        summary:'現價 $'+price.toFixed(2)+' 在主力成本區內 + Phase'+a.phase+' + OBV 上升。這是最理想的進場區間，主力正在累積，向上空間大。',
        dataPoints:dataPoints,
        suggestion:'✅ 可進場｜停損設 $'+(price*0.92).toFixed(2)+' (-8%) | T1 $'+a.t1.toFixed(2)+' / T2 $'+a.t2.toFixed(2)+' / T3 $'+a.t3.toFixed(2)
      };
    } else {
      return {
        icon:'🟡', title:'觀察等待',
        bg:'#fff8e0', border:'#dd9900', titleColor:'#dd6600',
        summary:'現價 $'+price.toFixed(2)+' 在主力成本區內，但 Phase'+a.phase+' 還沒啟動或 OBV 沒上升。等啟動訊號出現再進場。',
        dataPoints:dataPoints,
        suggestion:'🟡 暫不進場｜等待：1) Phase 提升至 2 以上 2) OBV 開始上升 3) 一把火出現'
      };
    }
  }
  
  // 情境 5：高於成本但未達 T1（過渡區）
  if(advisory === 'pre_t1'){
    if(a.phase === 3 && a.obvRising){
      return {
        icon:'🟢', title:'可考慮但需控位',
        bg:'#f0f8e8', border:'#88aa44', titleColor:'#5a7a2a',
        summary:'現價 $'+price.toFixed(2)+' 高於成本但未達 T1，Phase3 多頭進行中。可進場但離成本較遠，停損空間較小。',
        dataPoints:dataPoints,
        suggestion:'🟢 可控位進場（部位減半）｜停損 $'+(price*0.92).toFixed(2)+'（如果跌破成本區更要果斷）'
      };
    } else {
      return {
        icon:'🟡', title:'觀察為主',
        bg:'#fff8e0', border:'#dd9900', titleColor:'#dd6600',
        summary:'現價 $'+price.toFixed(2)+' 高於主力成本但 Phase 不夠強。建議等回測到主力成本區或 Phase 提升。',
        dataPoints:dataPoints,
        suggestion:'🟡 暫不進場｜等回測到 $'+a.cL+'-$'+a.cH+' 或 Phase3 確認'
      };
    }
  }
  
  // 情境 6：低於主力成本（破底）
  if(advisory === 'low_cost'){
    return {
      icon:'⛔', title:'不建議進場',
      bg:'#ffe8e8', border:'#cc1133', titleColor:'#cc1133',
      summary:'現價 $'+price.toFixed(2)+' 已跌破主力成本 $'+a.cL+'。這代表股票進入空頭，主力可能在虧損出貨，不該抄底。',
      dataPoints:dataPoints,
      suggestion:'⛔ 不要進場｜等待：1) 重新確認底部 2) Phase1→2 重新啟動 3) OBV 翻多'
    };
  }
  
  // 預設
  return {
    icon:'🟡', title:'狀況不明',
    bg:'#f5f5f5', border:'#999', titleColor:'#666',
    summary:'無法明確判斷進場時機，建議觀察。',
    dataPoints:dataPoints,
    suggestion:''
  };
}

function showSector(sectorId){
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===sectorId;});
  if(!sec)return;
  currentSector=sectorId;

  renderHeatStrip(sectorId);

  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('stockListPage').classList.add('active');
  
  document.getElementById('topbar').innerHTML=
    '<div class="logo">飆股<span>RADAR</span></div><div style="flex:1"></div>'+
    '<button class="refresh-btn" onclick="reloadSector()">🔄</button>';

  var sc=heatScore(sec.tickers, sec.etf);
  var hi=heatInfo(sc);
  var chg=avgChg(sec.tickers);
  var chgStr=chg!==null?(chg>=0?'▲+':'▼')+Math.abs(chg).toFixed(1)+'%':'';
  var chgCol=chg===null?'var(--dim)':chg>=0?'var(--green)':'var(--red)';

  // 顯示變化資訊
  var score1d=getScoreNDaysAgo(sec.id,0);
  var score7d=getScoreNDaysAgo(sec.id,6);
  var trendInfo='';
  if(score1d!==null&&score1d!==undefined){
    var c1=sc-score1d;
    var c7=score7d!==null&&score7d!==undefined?sc-score7d:null;
    trendInfo='<span style="color:var(--dim);font-size:11px;">　1日：'+(c1>0?'+':'')+c1+(c7!==null?'　7日：'+(c7>0?'+':'')+c7:'')+'</span>';
  }

  document.getElementById('listHeader').innerHTML=
    sec.icon+' <strong>'+sec.name+'</strong>　'+
    '<span style="color:'+hi.col+'">'+hi.fire+' '+sc+'分</span>　'+
    '<span style="color:'+chgCol+'">'+chgStr+'</span>　'+
    '<span style="color:var(--dim);">'+sec.tickers.length+'支</span>'+
    trendInfo;

  var cont=document.getElementById('cardContainer');
  // 加「+ 批量新增」按鈕
  cont.innerHTML='<button onclick="openBatchAdd(\''+sectorId+'\')" style="width:100%;background:#fff;border:2px dashed var(--orange);color:var(--orange);padding:10px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:10px;cursor:pointer;">+ 批量新增股票到「'+sec.name+'」</button>';

  // 顯示 ETF 卡片
  if(sec.etf){
    var etfData=cache[sec.etf];
    var etfHtml='';
    if(etfData&&!etfData.err&&etfData.a){
      var etfPrice=etfData.price;
      var etfDp=etfData.q.dp||0;
      var etfPhaseLabel=etfData.ph?etfData.ph.badge:'分析中';
      var etfChgColor=etfDp>=0?'#009944':'#cc1133';
      etfHtml='<div onclick="showDetail(\''+sec.etf+'\')" style="background:linear-gradient(135deg,#fffae8,#fff8d5);border:2px solid #d4b800;border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'+
          '<div><span style="font-size:11px;color:#888;">📊 板塊代表 ETF</span> <b style="font-size:16px;color:#333;font-family:Orbitron,monospace;margin-left:6px;">'+sec.etf+'</b></div>'+
          '<div style="text-align:right;"><div style="font-size:16px;font-weight:700;color:'+etfChgColor+';">$'+etfPrice.toFixed(2)+'</div><div style="font-size:11px;color:'+etfChgColor+';">'+(etfDp>=0?'▲+':'▼')+Math.abs(etfDp).toFixed(2)+'%</div></div>'+
        '</div>'+
        '<div style="font-size:11px;color:#666;">'+etfPhaseLabel+'　<span style="color:#999;">點擊查看 ETF 詳情</span></div>'+
      '</div>';
    } else {
      etfHtml='<div style="background:#f9f9f9;border:1px dashed #ccc;border-radius:10px;padding:10px;margin-bottom:10px;font-size:11px;color:#999;text-align:center;">📊 板塊代表 ETF: '+sec.etf+'（資料載入中或無資料）</div>';
    }
    cont.innerHTML+=etfHtml;
  }

  if(!sec.tickers.length){
    cont.innerHTML='<div class="empty-hint">這個板塊還沒有股票<br>用上方搜尋框輸入代號</div>';
    return;
  }

  sec.tickers.forEach(function(t){
    var div=document.createElement('div');
    div.className='stock-card';
    div.id='sc-'+t;
    div.innerHTML='<div class="slbar sl-b"></div><div class="loading"><div class="spinner"></div></div>';
    cont.appendChild(div);
  });

  (async function(){
    for(var i=0;i<sec.tickers.length;i++){
      var t=sec.tickers[i];
      if(!cache[t]||!cache[t].ok) await loadStock(t);
      var el=document.getElementById('sc-'+t);
      if(el) fillCard(t,el);
      if(i<sec.tickers.length-1) await sleep(600);
    }
  })();
}

function fillCard(t,div){
  var d=cache[t];
  if(!d||d.err){
    var msg=d&&d.msg?d.msg:'未知錯誤';
    div.innerHTML='<div class="slbar sl-r"></div>'+
      '<div style="padding:10px;">'+
        '<div style="font-weight:700;color:var(--red);">⚠️ '+t+'</div>'+
        '<div style="font-size:11px;color:var(--dim);margin-top:3px;">'+msg+'</div>'+
      '</div>';
    return;
  }
  var a=d.a,ph=d.ph,p=d.price;
  var pMn=a?Math.floor(a.cL*0.85/5)*5:Math.floor(p*0.7/5)*5;
  var pMx=a?Math.ceil(p*1.4/5)*5:Math.ceil(p*1.5/5)*5;
  var cl=a?pp(a.cL,pMn,pMx):'35';
  var cw=a?((a.cH-a.cL)/(pMx-pMn)*100).toFixed(1):'20';
  var np=pp(p,pMn,pMx);
  var ds=(d.dist>=0?'+':'')+d.dist+'%';
  var tc=ph.sc==='sl-o'?'var(--orange)':ph.sc==='sl-b'?'var(--blue)':ph.sc==='sl-r'?'var(--red)':'var(--green)';

  var obvStr=a?(a.obvRising?'📈 上升（吸籌跡象）':'📉 下降'):'--';
  var fireStr=a&&a.fires&&a.fires.length>0?'🔥×'+a.fires.length+' 近60天':'無';
  var maStr=a?(a.maUpTrend?'多頭排列✅':a.maBearish?'空頭排列❌':'整理中⚪'):'--';

  div.innerHTML=
    '<div class="slbar '+ph.sc+'"></div>'+
    '<div class="srow">'+
      '<div><div class="sticker" style="color:'+tc+'">'+t+'</div>'+
      '<div class="stoday">'+(d.up?'▲':'▼')+Math.abs(d.q.dp).toFixed(1)+'% 今日</div></div>'+
      '<div class="sright">'+
        '<div class="sprice '+(d.up?'up':'dn')+'">$'+p.toFixed(2)+'</div>'+
        '<div class="sdist '+(a&&d.dist!==0?(d.dist>=0?'up':'dn'):'neu')+'">'+
          (a&&d.dist!==0?'vs成本 '+ds:'--')+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="sbadge '+ph.bd+'">'+ph.badge+'</div>'+
    '<div style="display:flex;gap:12px;font-size:11px;color:var(--dim);margin-bottom:6px;">'+
      '<span>OBV: '+obvStr+'</span>'+
      '<span>一把火: '+fireStr+'</span>'+
    '</div>'+
    '<div style="font-size:11px;color:var(--dim);margin-bottom:4px;">均線: '+maStr+'</div>'+
    '<div style="font-size:10px;color:var(--dim);margin-bottom:3px;">📍 近期成本區 $'+(a?a.cL+'-$'+a.cH:'計算中...')+(a?'　籌碼 '+a.chip+'%（'+(a.chip<30?'吸籌':a.chip<60?'啟動⭐':a.chip<90?'末段':'危險🚨')+'）':'')+'</div>'+
    '<div class="arrow-row"><div class="arrow-lbl" style="left:'+np+'%">▼$'+p.toFixed(1)+'</div></div>'+
    '<div class="cost-track">'+
      (a?'<div class="cost-zone" style="left:'+cl+'%;width:'+cw+'%"></div>':'')+
      '<div class="cost-pin" style="left:'+np+'%"></div>'+
    '</div>'+
    '<div class="cost-axis"><span>$'+pMn+'</span><span>成本區</span><span>$'+pMx+'</span></div>'+
    '<div class="shint">點擊查看完整分析 →</div>';

  div.onclick=(function(t){return function(){showDetail(t);};})(t);

function goBack(){
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('stockListPage').classList.add('active');
  
  document.getElementById('topbar').innerHTML=
    '<div class="logo">飆股<span>RADAR</span></div><div style="flex:1"></div>'+
    '<button class="refresh-btn" onclick="initApp()">🔄 更新</button>';
  if(currentSector) showSector(currentSector);
}

function addStock(ticker,sectorId){
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===sectorId;});
  if(!sec)return;
  if(!sec.tickers.includes(ticker)){
    var total=sectors.reduce(function(sum,s){return sum+s.tickers.length;},0);
    if(total>=100){alert('候補名單已達上限100支！');return;}
    sec.tickers.push(ticker);
    saveSectors(sectors);
    closeAddModal();
    alert('✅ '+ticker+' 已加入「'+sec.name+'」板塊！');
    if(currentSector===sectorId) showSector(sectorId);
    else goBack();
  }else{alert(ticker+' 已在「'+sec.name+'」中');}
}

function removeStock(ticker){
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===currentSector;});
  if(!sec||!confirm('確定將 '+ticker+' 從「'+sec.name+'」移除？'))return;
  sec.tickers=sec.tickers.filter(function(t){return t!==ticker;});
  saveSectors(sectors);
  goBack();
}

function reloadSector(){
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===currentSector;});
  if(!sec)return;
  sec.tickers.forEach(function(t){delete cache[t];});
  if(sec.etf) delete cache[sec.etf];
  showSector(currentSector);
}

// 搜尋直接加股
async function searchStock(){
  var input=document.getElementById('searchInput');
  var t=input.value.toUpperCase().trim();
  if(!t)return;
  input.value='';
  delete cache[t];

  // 先嘗試載入確認股票存在
  document.getElementById('stockListPage').classList.remove('active');
  document.getElementById('detailPage').classList.add('active');
  
  document.getElementById('topbar').innerHTML=
    '<div class="back-btn" onclick="goBack()">←</div>'+
    '<div class="topbar-title">搜尋 '+t+'...</div>';
  document.getElementById('detailPage').innerHTML=
    '<div class="loading"><div class="spinner"></div><br>分析中...</div>';

  await loadStock(t);
  var d=cache[t];
  if(!d||d.err){
    document.getElementById('detailPage').innerHTML=
      '<div style="padding:16px;">'+
      '<div class="err">⚠️ 找不到「'+t+'」<br>請確認股票代號是否正確</div>'+
      '<button class="btn-add" style="margin-top:10px;background:var(--blue);" onclick="goBack()">← 返回</button></div>';
    return;
  }
  // 找到股票，顯示詳情頁（含加入板塊選項）
  showDetail(t);
}

function closeAddModal(){
  document.getElementById('addModal').classList.remove('show');
}

// === 批量新增股票到指定板塊 ===
window.openBatchAdd = function(sectorId){
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===sectorId;});
  if(!sec) return;
  
  document.getElementById('addModalTitle').textContent='批量新增股票到「'+sec.icon+' '+sec.name+'」';
  document.getElementById('addModalBody').innerHTML=
    '<div style="font-size:12px;color:#666;margin-bottom:10px;line-height:1.6;">'+
      '請輸入股票代號，多個用<b>空格</b>或<b>逗號</b>分隔。<br>'+
      '例：<code style="background:#eee;padding:2px 6px;border-radius:4px;">IIJI ONDS APH</code>'+
    '</div>'+
    '<input id="batchInput" type="text" placeholder="輸入代號" style="width:100%;padding:11px;border:1.5px solid #ccc;border-radius:8px;font-size:15px;text-transform:uppercase;margin-bottom:10px;-webkit-appearance:none;">'+
    '<div style="font-size:11px;color:#999;margin-bottom:10px;">目前「'+sec.name+'」有 <b>'+sec.tickers.length+'</b> 檔　總監控：'+sectors.reduce(function(s,x){return s+x.tickers.length;},0)+'/100</div>'+
    '<button onclick="submitBatchAdd(\''+sectorId+'\')" style="width:100%;background:#009944;color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;">確認新增</button>';
  
  document.getElementById('addModal').classList.add('show');
};

window.submitBatchAdd = function(sectorId){
  var input=document.getElementById('batchInput');
  if(!input) return;
  var raw=(input.value||'').toUpperCase();
  // 用空格、逗號、分號、換行分割
  var tickers=raw.split(/[\s,;]+/).filter(function(t){return t&&t.length>=1&&t.length<=8;});
  
  if(tickers.length===0){
    alert('請輸入至少 1 個股票代號');
    return;
  }
  
  var sectors=getSectors();
  var sec=sectors.find(function(s){return s.id===sectorId;});
  if(!sec){alert('找不到板塊');return;}
  
  var added=[], existed=[], total=sectors.reduce(function(s,x){return s+x.tickers.length;},0);
  
  tickers.forEach(function(t){
    if(sec.tickers.indexOf(t)>=0){
      existed.push(t);
    } else if(total>=100){
      // 達上限
    } else {
      sec.tickers.push(t);
      added.push(t);
      total++;
    }
  });
  
  saveSectors(sectors);
  closeAddModal();
  
  var msg='';
  if(added.length>0) msg+='✅ 已加入：'+added.join('、')+'\n';
  if(existed.length>0) msg+='⚠️ 已存在：'+existed.join('、')+'\n';
  if(total>=100&&tickers.length>added.length+existed.length){
    msg+='❌ 部分未加：已達 100 支上限';
  }
  alert(msg||'沒有新增');
  
  // 重新整理板塊頁
  if(currentSector===sectorId){
    showSector(sectorId);
  }
};

async function initApp(){
  cache={};
  currentSector=null;
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('stockListPage').classList.add('active');
  
  document.getElementById('topbar').innerHTML=
    '<div class="logo">飆股<span>RADAR</span></div><div style="flex:1"></div>'+
    '<button class="refresh-btn" onclick="initApp()">🔄 更新</button>';
  document.getElementById('listHeader').innerHTML=
    '<span style="color:var(--dim);">👆 點選上方板塊查看個股</span>';
  document.getElementById('cardContainer').innerHTML='';

  renderHeatStrip(null);

  var sectors=getSectors();
  var allSet={};
  sectors.forEach(function(s){
    // 個股
    s.tickers.forEach(function(t){allSet[t]=1;});
    // ETF
    if(s.etf) allSet[s.etf]=1;
  });
  var all=Object.keys(allSet);

  for(var i=0;i<all.length;i++){
    await loadStock(all[i]);
    renderHeatStrip(currentSector);
    if(currentSector){
      var sec=getSectors().find(function(s){return s.id===currentSector;});
      if(sec&&sec.tickers.includes(all[i])){
        var el=document.getElementById('sc-'+all[i]);
        if(el) fillCard(all[i],el);
      }
    }
    if(i<all.length-1) await sleep(700);
  }
}

initApp();
</script>
