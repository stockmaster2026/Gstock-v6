
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飆股雷達</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
  --bg:#f5e8a0;--surface:#fffef2;--border:#e0cc70;
  --blue:#0066bb;--green:#009944;--orange:#dd6600;
  --red:#cc1133;--dim:#8a8a6a;--text:#1a1a2e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}

.topbar{background:rgba(245,232,140,0.97);border-bottom:2px solid var(–border);padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:200;}
.logo{font-family:‘Orbitron’,monospace;font-size:14px;font-weight:900;color:var(–orange);letter-spacing:2px;flex-shrink:0;}
.logo span{color:var(–blue);}
.back-btn{font-size:24px;color:var(–blue);cursor:pointer;flex-shrink:0;line-height:1;}
.topbar-title{flex:1;font-family:‘Orbitron’,monospace;font-size:12px;font-weight:700;text-align:center;}
.refresh-btn{background:var(–orange);color:white;border:none;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}

/* 板塊熱度橫條 */
.heat-strip{
background:#fff8e0;border-bottom:3px solid #d4b800;
padding:10px 8px;display:flex;gap:6px;overflow-x:auto;
-webkit-overflow-scrolling:touch;
}
.heat-strip::-webkit-scrollbar{display:none;}
.heat-chip{
flex-shrink:0;display:flex;flex-direction:column;align-items:center;
padding:6px 8px;border-radius:10px;cursor:pointer;
border:2px solid #d4b800;background:#fffde0;
transition:all 0.2s;width:72px;
}
.heat-chip:active{transform:scale(0.95);}
.heat-chip.sel{border-color:var(–orange);background:rgba(221,102,0,0.12);}
.hc-icon{font-size:20px;margin-bottom:2px;}
.hc-name{font-size:10px;color:#1a1a2e;margin-bottom:2px;font-weight:800;text-align:center;word-break:break-all;white-space:normal;width:100%;line-height:1.2;}
.hc-score{font-size:11px;font-weight:700;color:#444;}
.hc-bar{width:100%;height:4px;background:rgba(0,0,0,0.12);border-radius:2px;margin-top:3px;overflow:hidden;}
.hc-fill{height:100%;border-radius:2px;transition:width 1s ease;}
.hot3{background:linear-gradient(90deg,#ff4400,#ff8800);}
.hot2{background:linear-gradient(90deg,#ff8800,#ffcc00);}
.hot1{background:linear-gradient(90deg,#ccaa00,#99bb00);}
.cold{background:var(–dim);}

/* 搜尋 — 不再sticky，放在頁面內容裡 */
.search-wrap{padding:10px 14px 4px;display:flex;gap:8px;}
.search-input{flex:1;border:1.5px solid var(–border);border-radius:10px;padding:9px 12px;font-size:14px;background:var(–surface);outline:none;font-family:‘Noto Sans TC’,sans-serif;}
.search-input:focus{border-color:var(–blue);}
.search-btn{background:var(–blue);color:white;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;}

.page{display:none;padding:10px 14px 24px;flex-direction:column;}
.page.active{display:flex;}

/* 個股卡片 */
.stock-card{background:var(–surface);border:1.5px solid var(–border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:transform 0.15s;position:relative;margin-top:2px;}
.stock-card:active{transform:scale(0.98);}
.slbar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px;}
.sl-o{background:var(–orange);}.sl-b{background:var(–blue);}.sl-r{background:var(–red);}.sl-g{background:var(–green);}

.srow{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px;}
.sticker{font-family:‘Orbitron’,monospace;font-size:16px;font-weight:900;}
.stoday{font-size:10px;color:var(–dim);margin-top:2px;}
.sright{text-align:right;}
.sprice{font-family:‘Orbitron’,monospace;font-size:14px;font-weight:700;}
.sdist{font-size:10px;margin-top:1px;}
.up{color:var(–green);}.dn{color:var(–red);}

.sbadge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;margin-bottom:6px;}
.bd-o{background:rgba(221,102,0,0.12);color:var(–orange);border:1px solid rgba(221,102,0,0.3);}
.bd-b{background:rgba(0,102,187,0.12);color:var(–blue);border:1px solid rgba(0,102,187,0.3);}
.bd-r{background:rgba(204,17,51,0.1);color:var(–red);border:1px solid rgba(204,17,51,0.2);}
.bd-g{background:rgba(0,153,68,0.12);color:var(–green);border:1px solid rgba(0,153,68,0.3);}

.chip-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.chip-lbl{font-size:10px;color:var(–dim);flex-shrink:0;width:42px;}
.chip-track{flex:1;height:7px;background:rgba(0,0,0,0.07);border-radius:3px;overflow:hidden;}
.chip-fill{height:100%;border-radius:3px;transition:width 1.2s ease;}
.cf-full{background:linear-gradient(90deg,#0066bb,#00aa55);}
.cf-high{background:linear-gradient(90deg,#0088cc,#44aaff);}
.cf-mid{background:linear-gradient(90deg,#dd8800,#ffbb44);}
.cf-low{background:linear-gradient(90deg,#cc1133,#ff6688);}
.chip-num{font-family:‘Orbitron’,monospace;font-size:11px;font-weight:700;flex-shrink:0;width:34px;text-align:right;}

.arrow-row{position:relative;height:13px;}
.arrow-lbl{position:absolute;font-size:9px;font-weight:700;color:var(–orange);transform:translateX(-50%);white-space:nowrap;}
.cost-track{height:7px;background:rgba(0,0,0,0.07);border-radius:3px;position:relative;overflow:hidden;}
.cost-zone{position:absolute;top:0;bottom:0;background:rgba(0,102,187,0.3);}
.cost-pin{position:absolute;top:0;bottom:0;width:3px;background:var(–orange);}
.cost-axis{display:flex;justify-content:space-between;font-size:9px;color:var(–dim);margin-top:2px;}
.shint{text-align:center;font-size:10px;color:var(–dim);margin-top:5px;}

/* 詳情 */
.dc{background:var(–surface);border:1.5px solid var(–border);border-radius:12px;padding:13px;margin-bottom:10px;margin-top:2px;}
.dtitle{font-size:10px;color:var(–dim);letter-spacing:2px;margin-bottom:8px;}
.big-chip{font-family:‘Orbitron’,monospace;font-size:32px;font-weight:900;margin-bottom:6px;}
.bc-full{color:var(–green);}.bc-high{color:var(–blue);}.bc-mid{color:var(–orange);}.bc-low{color:var(–red);}
.cost-big{font-family:‘Orbitron’,monospace;font-size:20px;font-weight:700;color:var(–blue);margin-bottom:10px;}
.adv{display:flex;gap:8px;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.7;margin-top:8px;}
.adv-o{background:rgba(221,102,0,0.07);border:1px solid rgba(221,102,0,0.2);}
.adv-b{background:rgba(0,102,187,0.07);border:1px solid rgba(0,102,187,0.2);}
.adv-r{background:rgba(204,17,51,0.05);border:1px solid rgba(204,17,51,0.15);}
.adv-g{background:rgba(0,153,68,0.07);border:1px solid rgba(0,153,68,0.2);}
.adv-title{font-weight:700;display:block;margin-bottom:2px;}
.at-o{color:var(–orange);}.at-b{color:var(–blue);}.at-r{color:var(–red);}.at-g{color:var(–green);}
.dr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(0,0,0,0.05);font-size:12px;}
.dr:last-child{border:none;}
.dv-b{color:var(–blue);font-weight:600;}.dv-g{color:var(–green);font-weight:600;}
.dv-o{color:var(–orange);font-weight:600;}.dv-r{color:var(–red);font-weight:600;}

.btn-add{width:100%;background:var(–green);color:white;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px;font-family:‘Noto Sans TC’,sans-serif;}
.btn-blue{background:var(–blue);}
.btn-remove{width:100%;background:rgba(204,17,51,0.08);color:var(–red);border:1.5px solid rgba(204,17,51,0.3);border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px;font-family:‘Noto Sans TC’,sans-serif;}

.spinner{display:inline-block;width:20px;height:20px;border:3px solid var(–border);border-top:3px solid var(–blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{text-align:center;padding:20px;color:var(–dim);font-size:13px;}
.err{background:rgba(204,17,51,0.07);border:1px solid rgba(204,17,51,0.2);border-radius:10px;padding:10px;font-size:12px;color:var(–red);text-align:center;margin-bottom:8px;margin-top:2px;}
.pg-hdr{font-size:11px;color:var(–dim);padding:8px 0 4px;}
.empty-hint{text-align:center;padding:30px 20px;color:var(–dim);font-size:13px;line-height:1.8;}
</style>

</head>
<body>

<div class="topbar" id="topbar">
  <div class="logo">飆股<span>RADAR</span></div>
  <div style="flex:1"></div>
  <button class="refresh-btn" onclick="initApp()">🔄 更新</button>
</div>

<div class="heat-strip" id="heatStrip"></div>

<div class="page active" id="stockListPage">
  <div class="search-wrap" id="searchWrap">
    <input class="search-input" id="searchInput" placeholder="搜尋股票代號，如 ONDS、IRDM"
      onkeydown="if(event.key==='Enter')searchStock()">
    <button class="search-btn" onclick="searchStock()">搜尋</button>
  </div>
  <div class="pg-hdr" id="listHeader" style="padding:4px 0 6px;">👆 點選上方板塊查看個股</div>
  <div id="cardContainer"></div>
</div>

<div class="page" id="detailPage"></div>

<script>
var SKEY='biaoguo_sectors_v5';

var SECTORS_DEFAULT=[
  {id:'ai_giant',  icon:'🤖', name:'AI巨頭',    tickers:['NVDA','META','GOOGL','MSFT','AMZN']},
  {id:'ai_infra',  icon:'🏗️', name:'AI基礎設施', tickers:['ANET','SMCI','DELL','CRWD','SNOW']},
  {id:'optical',   icon:'💡', name:'光通信',     tickers:['COHR','LITE','AAOI','IIVI','FNSR']},
  {id:'power',     icon:'⚡', name:'AI電力散熱', tickers:['VST','CEG','ETN','GNRC','AXON']},
  {id:'space',     icon:'🛰️', name:'太空衛星',   tickers:['LUNR','RKLB','PL','BKSY','ASTS']},
  {id:'drone',     icon:'🚁', name:'無人機國防', tickers:['ONDS','KTOS','PLTR','ACHR','JOBY']},
  {id:'quantum',   icon:'⚛️', name:'量子運算',   tickers:['IONQ','RGTI','QBTS','QUBT']},
  {id:'storage',   icon:'💾', name:'儲存硬體',   tickers:['WDC','NTAP','PURE','STX','PSTG']},
  {id:'biotech',   icon:'🧬', name:'生技健康',   tickers:['TEM','HIMS','RXRX','NVAX','CRSP']},
  {id:'satcom',    icon:'🌐', name:'衛星通信',   tickers:['IRDM','ASTS','GSAT','VSAT']},
  {id:'metals',    icon:'💰', name:'貴金屬礦業', tickers:['GLD','SLV','NEM','AEM','WPM']},
  {id:'custom',    icon:'⭐', name:'自訂',       tickers:[]},
];

function getSectors(){
  try{var s=localStorage.getItem(SKEY);if(s)return JSON.parse(s);}catch(e){}
  return JSON.parse(JSON.stringify(SECTORS_DEFAULT));
}
function saveSectors(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}

var cache={};
var currentSector=null;

// Finnhub：即時報價
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';
async function api(ep){
  const r=await fetch('https://finnhub.io/api/v1'+ep+'&token='+K);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// Yahoo Finance via corsproxy：歷史K棒+成交量（完全免費）
async function fetchYahoo(t){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?interval=1d&range=1y';
  var url='https://corsproxy.io/?'+encodeURIComponent(base);
  var r=await fetch(url);
  if(!r.ok) throw new Error('Yahoo HTTP '+r.status);
  var data=await r.json();
  if(!data.chart||!data.chart.result||!data.chart.result[0])
    throw new Error('no yahoo data');
  return data.chart.result[0];
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function fetchQ(t){
  return api('/quote?symbol='+t);
}

// 用Yahoo Finance真實歷史數據計算籌碼
function analyzeYahoo(result){
  try{
    var timestamps=result.timestamp;
    var quote=result.indicators.quote[0];
    var closes=quote.close;
    var volumes=quote.volume;
    var n=closes.length;
    if(n<10) return null;

    // 過濾null值
    var valid=[];
    for(var i=0;i<n;i++){
      if(closes[i]&&volumes[i]){
        valid.push({c:closes[i],v:volumes[i],t:timestamps[i]});
      }
    }
    if(valid.length<10) return null;

    // 找底部
    var mi=0;
    for(var i=1;i<valid.length;i++)
      if(valid[i].c<valid[mi].c) mi=i;
    var botP=valid[mi].c;
    var botD=new Date(valid[mi].t*1000).toISOString().slice(0,10);

    // 從底部累積成交量計算籌碼
    var cum=0;
    for(var i=mi;i<valid.length;i++) cum+=valid[i].v;
    var avgVol=valid.reduce((s,d)=>s+d.v,0)/valid.length;
    var floatEst=Math.max(avgVol*60,1000000);
    var chip=Math.min(Math.round(cum/floatEst*100),100);

    // 成本密集區
    var zn={};
    for(var i=mi;i<valid.length;i++){
      var z=Math.floor(valid[i].c/5)*5;
      if(!zn[z])zn[z]=0;
      zn[z]+=valid[i].v;
    }
    var tz=Object.keys(zn).sort((a,b)=>zn[b]-zn[a])
      .slice(0,2).map(Number).sort((a,b)=>a-b);
    var cL=tz[0]||Math.floor(botP/5)*5;
    var cH=(tz[tz.length-1]||cL)+5;
    if(cH<=cL) cH=cL+5;

    // 加權平均成本
    var tv=0,tw=0;
    for(var i=mi;i<valid.length;i++){tv+=valid[i].v;tw+=valid[i].c*valid[i].v;}
    var wc=tv>0?Math.round(tw/tv*100)/100:botP;

    function ma(k){
      var sl=valid.slice(-Math.min(k,valid.length));
      return sl.reduce((s,d)=>s+d.c,0)/sl.length;
    }

    return{chip,cL,cH,wc,botP,botD,
      ma5:ma(5),ma10:ma(10),ma20:ma(20),ma50:ma(50)};
  }catch(e){return null;}
}

async function loadStock(t){
  if(cache[t]&&cache[t].ok) return cache[t];
  try{
    var[q,yahoo]=await Promise.all([fetchQ(t), fetchYahoo(t)]);
    await sleep(150);

    var price=q.c||q.pc||0;
    if(!price) throw new Error('no price');
    if(!q.c&&q.pc) q.c=q.pc;
    if(!q.dp) q.dp=0;

    var a=analyzeYahoo(yahoo);
    var ph=getPhase(q.c,a);
    var dist=a&&a.wc>0?Math.round((q.c/a.wc-1)*100):0;
    cache[t]={ok:true,q,a,ph,dist,price:q.c,up:q.dp>=0};
  }catch(e){
    cache[t]={ok:true,err:true,msg:e.message||'failed'};
  }
  return cache[t];
}

function maCalc(a,n){if(!a||a.length<n)return a?a[a.length-1]:0;return a.slice(-n).reduce((s,v)=>s+v,0)/n;}

function analyze(cd){
  if(!cd||!cd.c||cd.c.length<2)return null;
  var c=cd.c,v=cd.v,t=cd.t,n=c.length;
  var mi=0;for(var i=1;i<n;i++)if(c[i]<c[mi])mi=i;
  var botP=c[mi],botD=new Date(t[mi]*1000).toISOString().slice(0,10);
  var cum=0;for(var i=mi;i<n;i++)cum+=v[i];
  // 動態估算流通股：用平均量×60天估算
  var avgVol=v.reduce((a,b)=>a+b,0)/v.length;
  var floatEst=Math.max(avgVol*60,5000000);
  var chip=Math.min(Math.round(cum/floatEst*100),100);
  var zn={};
  for(var i=mi;i<n;i++){var z=Math.floor(c[i]/5)*5;if(!zn[z])zn[z]=0;zn[z]+=v[i];}
  var tz=Object.keys(zn).sort((a,b)=>zn[b]-zn[a]).slice(0,2).map(Number).sort((a,b)=>a-b);
  var cL=tz[0]||Math.floor(botP/5)*5,cH=(tz[tz.length-1]||cL)+5;
  if(cH<=cL)cH=cL+5;
  var tv=0,tw=0;for(var i=mi;i<n;i++){tv+=v[i];tw+=c[i]*v[i];}
  var wc=tv>0?Math.round(tw/tv*100)/100:botP;
  return{chip,cL,cH,wc,botP,botD,
    ma5:maCalc(c,5),ma10:maCalc(c,10),ma20:maCalc(c,20),ma50:maCalc(c,50)};
}

function getPhase(price,a){
  if(!a)return{ph:'wait',badge:'⚠️ 數據不足',sc:'sl-r',bd:'bd-r',ac:'adv-r',at:'at-r',icon:'⚠️',title:'數據不足',text:'無法分析'};
  if(a.chip>=100&&price>a.wc*1.05&&a.ma5>a.ma20)
    return{ph:'hold',badge:'🟠 籌碼滿格·攻擊中',sc:'sl-o',bd:'bd-o',ac:'adv-o',at:'at-o',icon:'✅',title:'持有，等突破',text:'主力籌碼滿格，均線多頭。量大收弱才減倉。'};
  if(a.chip>=100)
    return{ph:'watch',badge:'🔵 籌碼滿格·等一把火',sc:'sl-b',bd:'bd-b',ac:'adv-b',at:'at-b',icon:'👀',title:'監控，等一把火',text:'籌碼100%完成。等題材+量>3x+收強才進場。'};
  if(a.chip>=60)
    return{ph:'accum',badge:'🟢 吸籌中 '+a.chip+'%',sc:'sl-g',bd:'bd-g',ac:'adv-g',at:'at-g',icon:'📈',title:'吸籌進行中',text:'主力建倉中，籌碼'+a.chip+'%。等完成後再進場。'};
  if(a.ma5<a.ma20&&a.ma20<a.ma50)
    return{ph:'wait',badge:'🔴 空頭整理·觀望',sc:'sl-r',bd:'bd-r',ac:'adv-r',at:'at-r',icon:'⏳',title:'觀望，暫時忽略',text:'均線空頭排列，底部未確認。'};
  return{ph:'watch',badge:'🔵 監控中',sc:'sl-b',bd:'bd-b',ac:'adv-b',at:'at-b',icon:'👀',title:'監控中',text:'等待明確信號。'};
}

function ccls(c){return c>=100?'full':c>=60?'high':c>=30?'mid':'low';}
function ccol(c){return c>=100?'var(--green)':c>=60?'var(--blue)':c>=30?'var(--orange)':'var(--red)';}
function pp(v,mn,mx){return Math.min(Math.max((v-mn)/(mx-mn)*100,2),96).toFixed(1);}

function heatScore(tickers){
  var s=[];
  tickers.forEach(t=>{
    var d=cache[t];if(!d||d.err)return;
    var chipScore=d.a?d.a.chip*0.4:20;
    var chgScore=Math.min(Math.max(((d.q.dp||0)+10)*4,0),100)*0.3;
    var maScore=d.a&&d.a.ma5>d.a.ma20?70*0.3:30*0.3;
    s.push(chipScore+chgScore+maScore);
  });
  return s.length?Math.round(s.reduce((a,b)=>a+b,0)/s.length):0;
}
function avgChg(tickers){
  var v=tickers.map(t=>cache[t]&&!cache[t].err?cache[t].q.dp:null).filter(x=>x!==null);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
function heatInfo(sc){
  if(sc>=70)return{cls:'hot3',fire:'🔥🔥🔥',col:'var(--red)'};
  if(sc>=50)return{cls:'hot2',fire:'🔥🔥',col:'var(--orange)'};
  if(sc>=30)return{cls:'hot1',fire:'🔥',col:'#aa8800'};
  return{cls:'cold',fire:'❄️',col:'var(--dim)'};
}

function renderHeatStrip(selId){
  var sectors=getSectors();
  var strip=document.getElementById('heatStrip');
  strip.innerHTML='';
  sectors.forEach(sec=>{
    var sc=heatScore(sec.tickers);
    var hi=heatInfo(sc);
    var chip=document.createElement('div');
    chip.className='heat-chip'+(sec.id===selId?' sel':'');
    chip.innerHTML=
      '<div class="hc-icon">'+sec.icon+'</div>'+
      '<div class="hc-name">'+sec.name+'</div>'+
      '<div class="hc-score"style="color:'+hi.col+'">'+sc+'</div>'+
      '<div class="hc-bar"><div class="hc-fill '+hi.cls+'"style="width:0"data-w="'+sc+'%"></div></div>';
    chip.onclick=()=>showSector(sec.id);
    strip.appendChild(chip);
  });
  setTimeout(()=>{document.querySelectorAll('.hc-fill[data-w]').forEach(el=>{el.style.width=el.dataset.w;});},100);
}

function resetSectors(){
  if(confirm('重置板塊設定為預設值？'))  {
    localStorage.removeItem(SKEY);
    location.reload();
  }
}

function showSector(sectorId){
  var sectors=getSectors();
  var sec=sectors.find(s=>s.id===sectorId);
  if(!sec)return;
  currentSector=sectorId;

  renderHeatStrip(sectorId);

  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('stockListPage').classList.add('active');
  
  document.getElementById('topbar').innerHTML=
    '<div class="logo">飆股<span>RADAR</span></div><div style="flex:1"></div>'+
    '<button class="refresh-btn"onclick="reloadSector()">🔄</button>';

  var sc=heatScore(sec.tickers);
  var hi=heatInfo(sc);
  var chg=avgChg(sec.tickers);
  var chgStr=chg!==null?(chg>=0?'▲+':'▼')+Math.abs(chg).toFixed(1)+'%':'';
  var chgCol=chg===null?'var(--dim)':chg>=0?'var(--green)':'var(--red)';

  document.getElementById('listHeader').innerHTML=
    sec.icon+' <strong>'+sec.name+'</strong>　'+
    '<span style="color:'+hi.col+'">'+hi.fire+' '+sc+'分</span>　'+
    '<span style="color:'+chgCol+'">'+chgStr+'</span>　'+
    '<span style="color:var(--dim);">'+sec.tickers.length+'支個股</span>';

  var cont=document.getElementById('cardContainer');
  cont.innerHTML='';

  if(!sec.tickers.length){
    cont.innerHTML='<div class="empty-hint">這個板塊還沒有股票<br>用上方搜尋框輸入代號<br>在個股詳情頁點「加入板塊」</div>';
    return;
  }

  sec.tickers.forEach(t=>{
    var div=document.createElement('div');
    div.className='stock-card';
    div.id='sc-'+t;
    div.innerHTML='<div class="slbar sl-b"></div><div class="loading"><div class="spinner"></div></div>';
    cont.appendChild(div);
  });

  // 循序載入每支股票
  (async()=>{
    for(var i=0;i<sec.tickers.length;i++){
      var t=sec.tickers[i];
      if(!cache[t]||!cache[t].ok) await loadStock(t);
      var el=document.getElementById('sc-'+t);
      if(el) fillCard(t,el);
      if(i<sec.tickers.length-1) await sleep(600);
    }
  })();
}

function fillCard(t,div){
  var d=cache[t];
  if(!d||d.err){
    var msg=d&&d.msg?d.msg:'未知錯誤';
    div.innerHTML='<div class="slbar sl-r"></div>'+
      '<div style="padding:10px;">'+
        '<div style="font-weight:700;color:var(--red);">⚠️ '+t+'</div>'+
        '<div style="font-size:11px;color:var(--dim);margin-top:3px;">'+msg+'</div>'+
      '</div>';
    return;
  }
  var a=d.a,ph=d.ph,p=d.price;
  // 如果沒有歷史數據，用現價估算範圍
  var pMn=a?Math.floor(a.botP*0.88/5)*5:Math.floor(p*0.7/5)*5;
  var pMx=a?Math.ceil(p*1.4/5)*5:Math.ceil(p*1.5/5)*5;
  var cl=a?pp(a.cL,pMn,pMx):'35';
  var cw=a?((a.cH-a.cL)/(pMx-pMn)*100).toFixed(1):'20';
  var np=pp(p,pMn,pMx);
  var cc=a?ccls(a.chip):'low';
  var cn=a?a.chip:0;
  var ds=(d.dist>=0?'+':'')+d.dist+'%';
  var tc=ph.sc==='sl-o'?'var(--orange)':ph.sc==='sl-b'?'var(--blue)':ph.sc==='sl-r'?'var(--red)':'var(--green)';

  div.innerHTML=
    '<div class="slbar '+ph.sc+'"></div>'+
    '<div class="srow">'+
      '<div><div class="sticker"style="color:'+tc+'">'+t+'</div>'+
      '<div class="stoday">'+(d.up?'▲':'▼')+Math.abs(d.q.dp).toFixed(1)+'% 今日</div></div>'+
      '<div class="sright">'+
        '<div class="sprice '+(d.up?'up':'dn')+'">$'+p.toFixed(2)+'</div>'+
        '<div class="sdist '+(a&&d.dist!==0?(d.dist>=0?'up':'dn'):'neu')+'">'+
          (a&&d.dist!==0?'vs成本 '+ds:'等待分析')+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="sbadge '+ph.bd+'">'+ph.badge+'</div>'+
    '<div class="chip-row">'+
      '<span class="chip-lbl">🐋 籌碼</span>'+
      '<div class="chip-track"><div class="chip-fill cf-'+cc+'"style="width:0"data-w="'+cn+'%"></div></div>'+
      '<span class="chip-num"style="color:'+ccol(cn)+'">'+cn+'%</span>'+
    '</div>'+
    '<div style="font-size:10px;color:var(--dim);margin-bottom:3px;">📍 成本 $'+(a?a.cL+'-$'+a.cH:'計算中...')+'</div>'+
    '<div class="arrow-row"><div class="arrow-lbl"style="left:'+np+'%">▼$'+p.toFixed(1)+'</div></div>'+
    '<div class="cost-track">'+
      (a?'<div class="cost-zone"style="left:'+cl+'%;width:'+cw+'%"></div>':'')+
      '<div class="cost-pin"style="left:'+np+'%"></div>'+
    '</div>'+
    '<div class="cost-axis"><span>$'+pMn+'</span><span>'+(a?'成本區':'現價位置')+'</span><span>$'+pMx+'</span></div>'+
    '<div class="shint">點擊查看完整分析 →</div>';

  div.onclick=()=>showDetail(t);
  setTimeout(()=>{var f=div.querySelector('[data-w]');if(f)f.style.width=f.dataset.w;},80);
}

function showDetail(t){
  var d=cache[t];if(!d||d.err)return;
  document.getElementById('stockListPage').classList.remove('active');
  document.getElementById('detailPage').classList.add('active');
  

  document.getElementById('topbar').innerHTML=
    '<div class="back-btn"onclick="goBack()">←</div>'+
    '<div class="topbar-title"style="color:'+(d.up?'var(--green)':'var(--red)')+'">'+t+'　$'+d.price.toFixed(2)+'</div>'+
    '<div style="font-size:11px;color:'+(d.up?'var(--green)':'var(--red)')+';flex-shrink:0;">'+(d.up?'▲':'▼')+Math.abs(d.q.dp).toFixed(1)+'%</div>';

  var a=d.a,ph=d.ph,p=d.price;
  var pMn=Math.floor((a?a.botP:p*0.7)*0.88/5)*5;
  var pMx=Math.ceil(p*1.4/5)*5;
  var cl=a?pp(a.cL,pMn,pMx):'30';
  var cw=a?((a.cH-a.cL)/(pMx-pMn)*100).toFixed(1):'20';
  var np=pp(p,pMn,pMx);
  var cc=a?ccls(a.chip):'low';
  var cn=a?a.chip:0;
  var ds=(d.dist>=0?'+':'')+d.dist+'%';

  var sectors=getSectors();
  var inSec=currentSector&&sectors.find(s=>s.id===currentSector)?.tickers.includes(t);
  var secName=currentSector?sectors.find(s=>s.id===currentSector)?.name:'';

  document.getElementById('detailPage').innerHTML=
    '<div class="dc">'+
      '<div class="sbadge '+ph.bd+'"style="font-size:12px;">'+ph.badge+'</div>'+
      '<div class="adv '+ph.ac+'"><div style="font-size:16px;flex-shrink:0;">'+ph.icon+'</div>'+
      '<div><span class="adv-title '+ph.at+'">'+ph.title+'</span>'+ph.text+'</div></div>'+
    '</div>'+
    '<div class="dc">'+
      '<div class="dtitle">🐋 籌碼完成度</div>'+
      '<div class="big-chip bc-'+cc+'">'+cn+'%</div>'+
      '<div class="chip-track"style="height:12px;"><div class="chip-fill cf-'+cc+'"style="width:'+cn+'%;height:100%;"></div></div>'+
      '<div class="cost-axis"style="margin-top:5px;"><span>0%</span><span>50% 加速中</span><span>100% 滿格</span></div>'+
    '</div>'+
    (a?
    '<div class="dc">'+
      '<div class="dtitle">📍 主力成本密集區</div>'+
      '<div class="cost-big">$'+a.cL+' — $'+a.cH+'</div>'+
      '<div class="arrow-row"><div class="arrow-lbl"style="left:'+np+'%">▼ $'+p.toFixed(2)+'</div></div>'+
      '<div class="cost-track"style="height:12px;"><div class="cost-zone"style="left:'+cl+'%;width:'+cw+'%;height:100%;"></div><div class="cost-pin"style="left:'+np+'%;height:100%;"></div></div>'+
      '<div class="cost-axis"style="margin-top:5px;"><span>$'+pMn+'</span><span style="color:var(--blue);font-weight:600;">現價'+ds+'於成本</span><span>$'+pMx+'</span></div>'+
    '</div>'+
    '<div class="dc">'+
      '<div class="dtitle">📊 詳細數據</div>'+
      '<div class="dr"><span>底部確認</span><span class="dv-b">$'+a.botP.toFixed(2)+'（'+a.botD+'）</span></div>'+
      '<div class="dr"><span>加權成本</span><span class="dv-b">$'+a.wc+'</span></div>'+
      '<div class="dr"><span>現價</span><span class="'+(d.up?'dv-g':'dv-r')+'">$'+p.toFixed(2)+'</span></div>'+
      '<div class="dr"><span>MA5 / MA20 / MA50</span><span>$'+a.ma5.toFixed(1)+' / $'+a.ma20.toFixed(1)+' / $'+a.ma50.toFixed(1)+'</span></div>'+
      '<div class="dr"><span>今日漲跌</span><span class="'+(d.up?'dv-g':'dv-r')+'">'+(d.up?'▲':'▼')+Math.abs(d.q.dp).toFixed(2)+'%</span></div>'+
    '</div>'
    :'')+
    '<div class="dc">'+
      '<div class="dtitle">⚙️ 名單管理</div>'+
      (inSec?
        '<button class="btn-remove"onclick="removeStock(\''+t+'\')">➖ 從「'+secName+'」板塊移除</button>'
        :
        '<div style="font-size:11px;color:var(--dim);margin-bottom:8px;">加入到哪個板塊？</div>'+
        getSectors().filter(s=>s.id!=='custom'||true).map(s=>
          '<button class="btn-add btn-blue"style="margin-bottom:6px;"onclick="addStock(\''+t+'\',\''+s.id+'\')">'+s.icon+' '+s.name+'</button>'
        ).join('')
      )+
      '<div style="font-size:10px;color:var(--dim);margin-top:8px;text-align:center;">'+
        '總監控：'+getSectors().flatMap(s=>s.tickers).length+'/100支'+
      '</div>'+
    '</div>';
}

function goBack(){
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('stockListPage').classList.add('active');
  
  document.getElementById('topbar').innerHTML=
    '<div class="logo">飆股<span>RADAR</span></div><div style="flex:1"></div>'+
    '<button class="refresh-btn"onclick="initApp()">🔄 更新</button>';
  if(currentSector) showSector(currentSector);
}

function addStock(ticker,sectorId){
  var sectors=getSectors();
  var sec=sectors.find(s=>s.id===sectorId);
  if(!sec)return;
  if(!sec.tickers.includes(ticker)){
    var total=sectors.flatMap(s=>s.tickers).length;
    if(total>=100){alert('候補名單已達上限100支！');return;}
    sec.tickers.push(ticker);
    saveSectors(sectors);
    alert('✅ '+ticker+' 已加入「'+sec.name+'」板塊！');
  }else{alert(ticker+' 已在「'+sec.name+'」中');}
  goBack();
}

function removeStock(ticker){
  var sectors=getSectors();
  var sec=sectors.find(s=>s.id===currentSector);
  if(!sec||!confirm('確定將 '+ticker+' 從「'+sec.name+'」移除？'))return;
  sec.tickers=sec.tickers.filter(t=>t!==ticker);
  saveSectors(sectors);
  goBack();
}

function reloadSector(){
  var sectors=getSectors();
  var sec=sectors.find(s=>s.id===currentSector);
  if(!sec)return;
  sec.tickers.forEach(t=>{delete cache[t];});
  showSector(currentSector);
}

async function searchStock(){
  var input=document.getElementById('searchInput');
  var t=input.value.toUpperCase().trim();
  if(!t)return;
  input.value='';
  delete cache[t];

  document.getElementById('stockListPage').classList.remove('active');
  document.getElementById('detailPage').classList.add('active');
  
  document.getElementById('topbar').innerHTML=
    '<div class="back-btn"onclick="goBack()">←</div>'+
    '<div class="topbar-title">搜尋 '+t+'...</div>';
  document.getElementById('detailPage').innerHTML=
    '<div class="loading"><div class="spinner"></div><br>分析中...</div>';

  await loadStock(t);
  var d=cache[t];
  if(!d||d.err){
    document.getElementById('detailPage').innerHTML=
      '<div style="padding:16px;">'+
      '<div class="err">⚠️ 找不到「'+t+'」<br>請確認股票代號是否正確</div>'+
      '<button class="btn-add"style="margin-top:10px;background:var(--blue);"onclick="goBack()">← 返回</button></div>';
    return;
  }
  showDetail(t);
}

async function initApp(){
  cache={};
  currentSector=null;
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('stockListPage').classList.add('active');
  
  document.getElementById('topbar').innerHTML=
    '<div class="logo">飆股<span>RADAR</span></div><div style="flex:1"></div>'+
    '<button class="refresh-btn"onclick="initApp()">🔄 更新</button>';
  document.getElementById('listHeader').innerHTML=
    '<span style="color:var(--dim);">👆 點選上方板塊查看個股</span>';
  document.getElementById('cardContainer').innerHTML='';

  renderHeatStrip(null);

  var sectors=getSectors();
  var all=[...new Set(sectors.flatMap(s=>s.tickers))];

  // 完全循序載入，一次一支，每支間隔700ms
  // 避免Finnhub免費版限流（60次/分鐘）
  for(var i=0;i<all.length;i++){
    await loadStock(all[i]);
    renderHeatStrip(currentSector);
    // 每載入一支就更新一次畫面
    if(currentSector){
      var sec=getSectors().find(s=>s.id===currentSector);
      if(sec&&sec.tickers.includes(all[i])){
        var el=document.getElementById('sc-'+all[i]);
        if(el) fillCard(all[i],el);
      }
    }
    if(i<all.length-1) await sleep(700);
  }
}

initApp();
</script>

</body>
</html>
