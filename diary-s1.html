<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>diary step 1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#f5f0e8;padding:20px;}
h2{color:#8a6e2f;margin-bottom:10px;}
.box{background:#fff;padding:15px;border-radius:10px;margin:10px 0;border:1px solid #ddd;}
button{display:block;width:100%;padding:15px;margin:8px 0;background:#c8a84b;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;font-family:inherit;}
button:active{transform:scale(.98);}
#log{font-family:monospace;font-size:12px;line-height:1.8;}
#cp{font-family:monospace;font-size:11px;background:#222;color:#0f0;padding:10px;border-radius:8px;}
.ok{color:#2ea86e;}
.fail{color:#d94f4f;background:#fef0f0;padding:5px;border-left:3px solid #d94f4f;}
.info{color:#3a7bd5;}
</style>
</head>
<body>

<h2>📒 Diary Step 1:加上 state + loadData</h2>

<div class="box">
  <h3>🔍 啟動檢查點</h3>
  <div id="cp">等待 JS 執行...</div>
</div>

<div class="box">
  <button onclick="testBtn1()">📍 測試 1:讀取 state</button>
  <button onclick="testBtn2()">💾 測試 2:寫入 + 讀取 localStorage</button>
  <button onclick="testBtn3()">🔄 測試 3:loadData 重新載入</button>
</div>

<div class="box">
  <h3>📋 結果</h3>
  <div id="log">尚未點擊...</div>
</div>

<script>
// ============================
// CHECKPOINT 1: script 開始執行
// ============================
var cpEl = document.getElementById('cp');
cpEl.innerHTML = '✅ CP1: script 開始解析<br>';

try {
  // CHECKPOINT 2: 定義 state(模仿 diary.html)
  cpEl.innerHTML += '⏳ CP2: 定義 state...<br>';
  var state = {
    currentPool: 'new',
    trades: [],
    settings: {
      expCapital: 50000,
      expMaxPerTrade: 10000,
      expStartDate: '',
      expEndDate: '',
      rrMin: 3,
      stopPct: 8
    }
  };
  cpEl.innerHTML += '✅ CP2: state 定義成功<br>';

  // CHECKPOINT 3: 工具函數
  cpEl.innerHTML += '⏳ CP3: 定義工具函數...<br>';
  function $(id){ return document.getElementById(id); }
  function fmtDate(d){
    if(typeof d === 'string') return d;
    var y = d.getFullYear();
    var m = String(d.getMonth()+1);
    var day = String(d.getDate());
    if(m.length < 2) m = '0' + m;
    if(day.length < 2) day = '0' + day;
    return y + '-' + m + '-' + day;
  }
  cpEl.innerHTML += '✅ CP3: 工具函數定義成功<br>';

  // CHECKPOINT 4: loadData(從 diary.html 抄過來)
  cpEl.innerHTML += '⏳ CP4: 定義 loadData...<br>';
  function loadData(){
    try {
      var t = localStorage.getItem('diary_s1_trades');
      state.trades = t ? JSON.parse(t) : [];
    } catch(e) {
      state.trades = [];
    }
    try {
      var s = localStorage.getItem('diary_s1_settings');
      if(s) {
        var p = JSON.parse(s);
        for(var k in p) state.settings[k] = p[k];
      }
    } catch(e) {}

    if(!state.settings.expStartDate){
      var d = new Date();
      state.settings.expStartDate = fmtDate(d);
      var end = new Date(d);
      end.setMonth(end.getMonth() + 3);
      state.settings.expEndDate = fmtDate(end);
      saveSettings();
    }
  }

  function saveSettings(){
    localStorage.setItem('diary_s1_settings', JSON.stringify(state.settings));
  }
  cpEl.innerHTML += '✅ CP4: loadData 定義成功<br>';

  // CHECKPOINT 5: 呼叫 loadData
  cpEl.innerHTML += '⏳ CP5: 執行 loadData()...<br>';
  loadData();
  cpEl.innerHTML += '✅ CP5: loadData 執行成功 - settings.expStartDate=' + state.settings.expStartDate + '<br>';

  // 結束
  cpEl.innerHTML += '<b style="color:#2ea86e">🎉 全部成功!請點按鈕測試。</b>';

} catch(err) {
  cpEl.innerHTML += '<div class="fail">❌ 錯誤: ' + err.message + '<br>位置: ' + (err.stack||'').split('\n')[1] + '</div>';
}

// 按鈕函數(全域)
function log(msg, type) {
  var el = $('log');
  var cls = type || '';
  el.innerHTML = '<div class="' + cls + '">' + new Date().toLocaleTimeString() + ' ' + msg + '</div>' + (el.innerHTML === '尚未點擊...' ? '' : el.innerHTML);
}

function testBtn1() {
  log('✅ state.currentPool=' + state.currentPool + ', trades=' + state.trades.length + ' 筆', 'ok');
}

function testBtn2() {
  try {
    state.trades.push({id: Date.now(), msg: 'test_' + Date.now()});
    localStorage.setItem('diary_s1_trades', JSON.stringify(state.trades));
    var v = localStorage.getItem('diary_s1_trades');
    var parsed = JSON.parse(v);
    log('✅ 寫入+讀取 OK,目前 ' + parsed.length + ' 筆', 'ok');
  } catch(e) {
    log('❌ ' + e.message, 'fail');
  }
}

function testBtn3() {
  try {
    state.trades = [];
    loadData();
    log('✅ 重新 loadData OK,讀回 ' + state.trades.length + ' 筆', 'ok');
  } catch(e) {
    log('❌ ' + e.message, 'fail');
  }
}
</script>

</body>
</html>
