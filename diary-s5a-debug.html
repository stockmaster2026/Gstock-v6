<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 16px; background: #fdfaf3; }
h1 { font-size: 20px; }
#cpLog { background: #1a1a1a; color: #c8e6c9; padding: 12px; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 13px; min-height: 100px; }
button { padding: 14px; font-size: 16px; margin: 6px 0; width: 100%; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
.box { background: #fff; padding: 12px; border-radius: 10px; margin: 10px 0; border: 1px solid #e8d6a0; }
</style>
</head>
<body>

<h1>📔 Debug 版</h1>

<div class="box">
  <h3>啟動檢查點</h3>
  <div id="cpLog"></div>
</div>

<div class="box">
  <h3>互動測試</h3>
  <button onclick="testClick()">測試按鈕（應彈出 alert）</button>
  <button onclick="testState()">測試 state（應顯示現金）</button>
  <button onclick="testStorage()">測試 localStorage</button>
  <button onclick="testModal()">測試 Modal 顯示</button>
</div>

<div class="box">
  <h3>測試結果</h3>
  <div id="result">（按上面按鈕後顯示）</div>
</div>

<div id="testModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; padding:20px; border:2px solid #c89b3c; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.3); z-index:100;">
  <p>Modal 顯示成功！</p>
  <button onclick="closeTestModal()">關閉</button>
</div>

<script>
var cpLog = document.getElementById('cpLog');
function cp(msg, ok) {
  var icon = ok === true ? '✅' : ok === false ? '❌' : '⏳';
  cpLog.textContent += icon + ' ' + msg + '\n';
}

try {
  cp('CP1: script 執行', true);

  var state = {
    pool: 'new',
    cash: 50000
  };
  cp('CP2: state OK, cash = ' + state.cash, true);

  function $(id) { return document.getElementById(id); }
  cp('CP3: 工具 OK', true);

  try {
    var raw = localStorage.getItem('debug_test');
    cp('CP4: localStorage 可讀, 值 = ' + (raw || 'null'), true);
  } catch(e) {
    cp('CP4: localStorage 失敗 - ' + e.message, false);
  }

  window.testClick = function() {
    alert('按鈕能動！');
    $('result').textContent = '✅ 按鈕 onclick 正常';
  };

  window.testState = function() {
    $('result').textContent = '✅ state.cash = $' + state.cash.toLocaleString();
  };

  window.testStorage = function() {
    try {
      localStorage.setItem('debug_test', 'hello-' + Date.now());
      var v = localStorage.getItem('debug_test');
      $('result').textContent = '✅ localStorage 寫入讀取成功: ' + v;
    } catch(e) {
      $('result').textContent = '❌ localStorage 失敗: ' + e.message;
    }
  };

  window.testModal = function() {
    $('testModal').style.display = 'block';
    $('result').textContent = '✅ Modal 已顯示';
  };

  window.closeTestModal = function() {
    $('testModal').style.display = 'none';
    $('result').textContent = '✅ Modal 已關閉';
  };

  cp('CP5: 所有函式註冊完成', true);
  cp('🎉 Debug 版啟動成功！請按 4 個按鈕測試', true);

} catch(err) {
  cp('💥 錯誤: ' + err.message, false);
  document.body.style.background = '#fee';
}
</script>

</body>
</html>
