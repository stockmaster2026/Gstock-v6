
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>操作日記</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="操作日記">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#c8a84b">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"PingFang TC",sans-serif;background:#f5f0e8;color:#1a1a2e;padding:12px;padding-bottom:80px;min-height:100vh;}
.wrap{max-width:760px;margin:0 auto;}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px;}
.hdr h1{font-size:20px;color:#8a6e2f;font-weight:700;}
.hdr .sub{font-size:11px;color:#aa9a70;margin-top:2px;}
.hdr-btns{display:flex;gap:8px;}
.icon-btn{background:#fffdf5;border:1px solid #e8dfc0;border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.icon-btn:active{background:#f0e8d0;transform:scale(.95);}
.pool-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.pool-tab{background:#fffdf5;border:2px solid #e8dfc0;border-radius:12px;padding:12px;cursor:pointer;text-align:center;}
.pool-tab.active{border-color:#c8a84b;background:#fffbec;box-shadow:0 2px 8px rgba(200,168,75,.15);}
.pool-tab .pool-name{font-size:14px;font-weight:700;color:#5a4010;margin-bottom:4px;}
.pool-tab .pool-stats{font-size:11px;color:#888;}
.pool-tab.new{border-color:#2ea86e;}
.pool-tab.new.active{background:#edfaf3;}
.exp-info{background:#edfaf3;border-left:4px solid #2ea86e;padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:12px;color:#1e5a3f;line-height:1.6;}
.pool-summary{background:#fffdf5;border:1px solid #e8dfc0;border-radius:14px;padding:14px;margin-bottom:14px;}
.ps-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.ps-row:last-child{margin-bottom:0;}
.ps-cell{background:#f0e8d0;border-radius:8px;padding:8px;text-align:center;}
.ps-cell.green{background:#d5f2e2;}
.ps-cell.red{background:#fcdcdc;}
.ps-cell.blue{background:#d5e4f7;}
.ps-num{font-size:17px;font-weight:700;color:#5a4010;}
.ps-num.green{color:#2ea86e;}
.ps-num.red{color:#d94f4f;}
.ps-num.blue{color:#3a7bd5;}
.ps-label{font-size:10px;color:#8a8068;margin-top:2px;}
.sect-title{font-size:13px;color:#5a4010;font-weight:700;margin:16px 0 8px;padding-left:4px;display:flex;justify-content:space-between;align-items:center;}
.sect-title .count{font-size:11px;color:#aa9a70;font-weight:500;}
.card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;}
.card:active{transform:scale(.99);}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.card-sym{font-size:17px;font-weight:700;color:#1a1a2e;letter-spacing:.5px;}
.card-badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;}
.badge-profit{background:#d5f2e2;color:#1e7a4f;}
.badge-loss{background:#fcdcdc;color:#a03030;}
.badge-flat{background:#f0e8d0;color:#8a6e2f;}
.card-row{display:flex;justify-content:space-between;font-size:12px;color:#666;margin:3px 0;}
.card-row .lbl{color:#8a8068;}
.card-row .val{font-weight:600;color:#1a1a2e;}
.card-row .val.green{color:#2ea86e;}
.card-row .val.red{color:#d94f4f;}
.batch-progress{margin-top:8px;padding-top:8px;border-top:1px dashed #e8dfc0;}
.batch-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3px 0;}
.batch-row.done{color:#2ea86e;}
.batch-row.next{color:#c8a84b;font-weight:700;}
.batch-row.todo{color:#aaa;}
.empty{background:#fffdf5;border:1px dashed #d0c090;border-radius:12px;padding:30px 20px;text-align:center;color:#aa9a70;font-size:13px;line-height:1.7;}
.empty .big{font-size:36px;margin-bottom:8px;opacity:.5;}
.fab{position:fixed;bottom:20px;right:20px;width:58px;height:58px;border-radius:50%;background:#c8a84b;color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 14px rgba(200,168,75,.5);z-index:100;}
.fab:active{transform:scale(.92);}
.fab.new-pool{background:#2ea86e;box-shadow:0 4px 14px rgba(46,168,110,.5);}
.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,.5);z-index:999;display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:#fffdf5;border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fffbec;border-bottom:1px solid #e8dfc0;}
.modal-title{font-size:15px;font-weight:700;color:#8a6e2f;}
.modal-close{background:#f0e8d0;color:#8a6e2f;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;}
.modal-close:active{background:#c8a84b;color:#fff;}
.modal-body{flex:1;overflow-y:auto;padding:16px 18px;-webkit-overflow-scrolling:touch;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:12px;color:#5a4010;font-weight:700;margin-bottom:4px;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid #d0c090;border-radius:8px;font-size:14px;background:#fffbec;color:#1a1a2e;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#c8a84b;background:#fff;}
.fg .hint{font-size:11px;color:#aa9a70;margin-top:3px;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.target-box{background:#fffbec;border:1px solid #c8a84b;border-radius:10px;padding:12px;margin-bottom:12px;}
.target-box h4{font-size:13px;color:#8a6e2f;margin-bottom:8px;}
.target-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;margin:4px 0;border:1px solid transparent;}
.target-row .t-name{font-size:12px;font-weight:700;color:#5a4010;}
.target-row .t-val{font-size:13px;color:#1a1a2e;}
.target-row .t-rr{font-size:11px;color:#2ea86e;font-weight:700;}
.rr-result{background:#e8f0fe;border-left:4px solid #3a7bd5;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:12px;color:#1a4a70;line-height:1.6;}
.rr-result.ok{background:#edfaf3;border-color:#2ea86e;color:#1e5a3f;}
.rr-result.fail{background:#fef0f0;border-color:#d94f4f;color:#7a2020;}
.rr-big{font-size:18px;font-weight:700;margin:4px 0;}
.discipline{background:#fef4e6;border-left:4px solid #e8a940;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:12px;color:#7a5210;}
.disc-item{padding:3px 0;display:flex;align-items:center;gap:6px;}
.disc-item.pass{color:#1e5a3f;}
.disc-item.fail{color:#7a2020;}
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;}
.btn:active{transform:scale(.98);}
.btn-primary{background:#c8a84b;color:#fff;}
.btn-success{background:#2ea86e;color:#fff;}
.btn-danger{background:#d94f4f;color:#fff;}
.btn-ghost{background:#f0e8d0;color:#8a6e2f;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.detail-block{background:#faf5e8;border-radius:10px;padding:12px;margin-bottom:10px;}
.detail-block h3{font-size:13px;color:#8a6e2f;margin-bottom:8px;}
.dt-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px dotted #e8dfc0;}
.dt-row:last-child{border-bottom:none;}
.dt-row .lbl{color:#8a8068;}
.sell-opt{background:#fff;border:1px solid #e8dfc0;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;}
.sell-opt:active{background:#f0e8d0;}
.sell-opt.done{opacity:.5;background:#f5f5f5;}
.sell-opt.selected{border-color:#2ea86e;background:#d5f2e2;}
.so-row{display:flex;justify-content:space-between;font-size:13px;}
.so-name{font-weight:700;color:#5a4010;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:10px;padding:12px;}
.stat-card h4{font-size:11px;color:#8a8068;margin-bottom:4px;}
.stat-card .big-num{font-size:22px;font-weight:700;color:#5a4010;}
.stat-card .big-num.green{color:#2ea86e;}
.stat-card .big-num.red{color:#d94f4f;}
.exit-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:4px;}
.et-t1{background:#d5f2e2;color:#1e7a4f;}
.et-t2{background:#c5eedd;color:#1e5a3f;}
.et-t3{background:#b5e8d2;color:#0e4a2f;}
.et-stop{background:#fcdcdc;color:#7a2020;}
.et-weak{background:#fef4e6;color:#7a5210;}
.et-other{background:#e8dfc0;color:#5a4010;}
</style>
</head>
<body>
<div class="wrap">
<div class="hdr">
<div>
<h1>📒 操作日記</h1>
<div class="sub" id="todayInfo"></div>
</div>
<div class="hdr-btns">
<button class="icon-btn" id="btnStats" title="統計">📊</button>
<button class="icon-btn" id="btnSettings" title="設定">⚙️</button>
</div>
</div>
<div class="pool-tabs">
<div class="pool-tab" id="tabOld"><div class="pool-name">🟦 舊持倉</div><div class="pool-stats" id="oldStats">-</div></div>
<div class="pool-tab new active" id="tabNew"><div class="pool-name">🧪 實驗池</div><div class="pool-stats" id="newStats">-</div></div>
</div>
<div id="poolSummary"></div>
<div id="contentArea"></div>
</div>
<button class="fab" id="fabBtn" title="新增交易">+</button>

<div class="modal-overlay" id="addModal">
<div class="modal">
<div class="modal-hdr"><span class="modal-title">📝 新增交易</span><button class="modal-close" data-close="addModal">關閉</button></div>
<div class="modal-body" id="addBody"></div>
</div>
</div>

<div class="modal-overlay" id="detailModal">
<div class="modal">
<div class="modal-hdr"><span class="modal-title" id="detailTitle">持倉詳情</span><button class="modal-close" data-close="detailModal">關閉</button></div>
<div class="modal-body" id="detailBody"></div>
</div>
</div>

<div class="modal-overlay" id="sellModal">
<div class="modal">
<div class="modal-hdr"><span class="modal-title">📤 出場結算</span><button class="modal-close" data-close="sellModal">關閉</button></div>
<div class="modal-body" id="sellBody"></div>
</div>
</div>

<div class="modal-overlay" id="statsModal">
<div class="modal">
<div class="modal-hdr"><span class="modal-title">📊 績效統計</span><button class="modal-close" data-close="statsModal">關閉</button></div>
<div class="modal-body" id="statsBody"></div>
</div>
</div>

<div class="modal-overlay" id="settingsModal">
<div class="modal">
<div class="modal-hdr"><span class="modal-title">⚙️ 設定</span><button class="modal-close" data-close="settingsModal">關閉</button></div>
<div class="modal-body" id="settingsBody"></div>
</div>
</div>

<script>
(function(){
'use strict';

var state = {
  currentPool: 'new',
  trades: [],
  settings: {
    expCapital: 50000,
    expMaxPerTrade: 10000,
    expStartDate: '',
    expEndDate: '',
    rrMin: 3,
    stopPct: 8
  }
};

// ─── 工具 ───────────────────────────────
function fmtDate(d){ if(typeof d==='string')return d; var y=d.getFullYear(),m=String(d.getMonth()+1),day=String(d.getDate()); if(m.length<2)m='0'+m; if(day.length<2)day='0'+day; return y+'-'+m+'-'+day; }
function fmtMoney(n){ if(n===null||n===undefined||isNaN(n))return '-'; return '$'+n.toLocaleString('en-US',{maximumFractionDigits:2}); }
function fmtPct(n){ if(n===null||n===undefined||isNaN(n))return '-'; return (n>0?'+':'')+n.toFixed(1)+'%'; }
function daysBetween(d1,d2){ var a=new Date(d1),b=new Date(d2); return Math.floor((b-a)/86400000); }
function todayStr(){ return fmtDate(new Date()); }
function escapeHtml(s){ if(s===null||s===undefined)return ''; return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uuid(){ return Date.now().toString(36)+Math.random().toString(36).substr(2,5); }
function $(id){ return document.getElementById(id); }

// ─── 資料讀寫 ───────────────────────────
function loadData(){
  try{ var t=localStorage.getItem('diary_trades'); state.trades=t?JSON.parse(t):[]; }catch(e){ state.trades=[]; }
  try{ var s=localStorage.getItem('diary_settings'); if(s){ var p=JSON.parse(s); for(var k in p) state.settings[k]=p[k]; } }catch(e){}
  if(!state.settings.expStartDate){
    var d=new Date();
    state.settings.expStartDate=fmtDate(d);
    var end=new Date(d); end.setMonth(end.getMonth()+3);
    state.settings.expEndDate=fmtDate(end);
    saveSettings();
  }
}
function saveTrades(){ localStorage.setItem('diary_trades', JSON.stringify(state.trades)); }
function saveSettings(){ localStorage.setItem('diary_settings', JSON.stringify(state.settings)); }

// ─── 切換池 ───────────────────────────
function switchPool(pool){
  state.currentPool = pool;
  $('tabOld').className = 'pool-tab' + (pool==='old' ? ' active' : '');
  $('tabNew').className = 'pool-tab new' + (pool==='new' ? ' active' : '');
  $('fabBtn').className = 'fab' + (pool==='new' ? ' new-pool' : '');
  render();
}

// ─── 渲染 ───────────────────────────
function render(){ renderTabStats(); renderPoolSummary(); renderContent(); renderTodayInfo(); }

function renderTodayInfo(){
  var t=new Date(); var d=['日','一','二','三','四','五','六'][t.getDay()];
  $('todayInfo').textContent = (t.getMonth()+1)+'/'+t.getDate()+' 週'+d+'  •  波段交易紀錄';
}

function renderTabStats(){
  var old=state.trades.filter(function(t){return t.pool==='old';});
  var nu=state.trades.filter(function(t){return t.pool==='new';});
  $('oldStats').textContent='持有 '+old.filter(function(t){return t.status==='holding';}).length+' / 已出 '+old.filter(function(t){return t.status==='closed';}).length;
  $('newStats').textContent='持有 '+nu.filter(function(t){return t.status==='holding';}).length+' / 已出 '+nu.filter(function(t){return t.status==='closed';}).length;
}

function renderPoolSummary(){
  var pool=state.currentPool;
  var poolTrades=state.trades.filter(function(t){return t.pool===pool;});
  var holding=poolTrades.filter(function(t){return t.status==='holding';});
  var closed=poolTrades.filter(function(t){return t.status==='closed';});
  var totalCost=0, closedPnl=0, wins=0;
  holding.forEach(function(t){ totalCost+=(t.cost||0); });
  closed.forEach(function(t){ var p=calcClosedPnl(t); closedPnl+=p; if(p>0)wins++; });
  var winRate=closed.length>0?(wins/closed.length*100):0;
  var html='';

  if(pool==='new'){
    var cash=state.settings.expCapital+closedPnl-totalCost;
    var daysLeft=daysBetween(todayStr(), state.settings.expEndDate);
    html+='<div class="exp-info">🧪 <b>實驗池紀律模式</b><br>期間:'+state.settings.expStartDate+' ~ '+state.settings.expEndDate;
    if(daysLeft>0) html+='(剩 '+daysLeft+' 天)'; else if(daysLeft===0) html+='(今天到期!)'; else html+='(已結束)';
    html+='<br>紀律:R/R ≥ 1:3 · 停損 -8% · 分 3 批 · 單筆 ≤ '+fmtMoney(state.settings.expMaxPerTrade)+'</div>';
    html+='<div class="pool-summary">';
    html+='<div class="ps-row">';
    html+='<div class="ps-cell"><div class="ps-num">'+fmtMoney(state.settings.expCapital)+'</div><div class="ps-label">起始資金</div></div>';
    html+='<div class="ps-cell blue"><div class="ps-num blue">'+fmtMoney(cash)+'</div><div class="ps-label">剩餘現金</div></div>';
    html+='<div class="ps-cell '+(closedPnl>=0?'green':'red')+'"><div class="ps-num '+(closedPnl>=0?'green':'red')+'">'+fmtMoney(closedPnl)+'</div><div class="ps-label">已實現</div></div>';
    html+='</div><div class="ps-row">';
    html+='<div class="ps-cell"><div class="ps-num">'+holding.length+'</div><div class="ps-label">持有中</div></div>';
    html+='<div class="ps-cell"><div class="ps-num">'+closed.length+'</div><div class="ps-label">已出場</div></div>';
    html+='<div class="ps-cell"><div class="ps-num">'+winRate.toFixed(0)+'%</div><div class="ps-label">勝率</div></div>';
    html+='</div></div>';
  } else {
    html+='<div class="pool-summary"><div class="ps-row">';
    html+='<div class="ps-cell"><div class="ps-num">'+fmtMoney(totalCost)+'</div><div class="ps-label">持倉成本</div></div>';
    html+='<div class="ps-cell '+(closedPnl>=0?'green':'red')+'"><div class="ps-num '+(closedPnl>=0?'green':'red')+'">'+fmtMoney(closedPnl)+'</div><div class="ps-label">已實現</div></div>';
    html+='<div class="ps-cell"><div class="ps-num">'+winRate.toFixed(0)+'%</div><div class="ps-label">勝率</div></div>';
    html+='</div><div class="ps-row">';
    html+='<div class="ps-cell"><div class="ps-num">'+holding.length+'</div><div class="ps-label">持有中</div></div>';
    html+='<div class="ps-cell"><div class="ps-num">'+closed.length+'</div><div class="ps-label">已出場</div></div>';
    html+='<div class="ps-cell"><div class="ps-num">'+(holding.length+closed.length)+'</div><div class="ps-label">總交易</div></div>';
    html+='</div></div>';
  }
  $('poolSummary').innerHTML = html;
}

function renderContent(){
  var pool=state.currentPool;
  var poolTrades=state.trades.filter(function(t){return t.pool===pool;});
  var holding=poolTrades.filter(function(t){return t.status==='holding';}).sort(function(a,b){return (b.entryDate||'').localeCompare(a.entryDate||'');});
  var closed=poolTrades.filter(function(t){return t.status==='closed';}).sort(function(a,b){return (b.closedDate||'').localeCompare(a.closedDate||'');});
  var html='';
  html+='<div class="sect-title">🟢 持有中 <span class="count">共 '+holding.length+' 檔</span></div>';
  if(holding.length===0){
    html+='<div class="empty"><div class="big">📦</div>目前沒有持倉<br>點右下角 + 新增交易</div>';
  } else {
    holding.forEach(function(t){ html+=renderHoldingCard(t); });
  }
  if(closed.length>0){
    html+='<div class="sect-title">⚫ 已出場 <span class="count">共 '+closed.length+' 筆</span></div>';
    closed.slice(0,10).forEach(function(t){ html+=renderClosedCard(t); });
  }
  $('contentArea').innerHTML = html;
  // 綁定卡片點擊
  Array.prototype.forEach.call(document.querySelectorAll('[data-trade-id]'), function(el){
    el.addEventListener('click', function(){ openDetail(el.getAttribute('data-trade-id')); });
  });
}

function renderHoldingCard(t){
  var remaining=getRemainingShares(t);
  var totalSoldPnl=(t.exits||[]).reduce(function(s,e){return s+(e.pnl||0);},0);
  var batchHtml='';
  if(t.targets && t.targets.length>0){
    t.targets.forEach(function(tg,i){
      var label=['T1','T2','T3'][i]||('T'+(i+1));
      if(tg.sold){
        batchHtml+='<div class="batch-row done">✅ '+label+' '+fmtMoney(tg.price)+' ('+fmtPct(tg.pct)+')  已賣 '+tg.shares+' 股</div>';
      } else if(i===0||(t.targets[i-1]&&t.targets[i-1].sold)){
        batchHtml+='<div class="batch-row next">🎯 '+label+' '+fmtMoney(tg.price)+' ('+fmtPct(tg.pct)+')  待賣 '+tg.shares+' 股</div>';
      } else {
        batchHtml+='<div class="batch-row todo">⏳ '+label+' '+fmtMoney(tg.price)+' ('+fmtPct(tg.pct)+')</div>';
      }
    });
    batchHtml+='<div class="batch-row" style="color:#d94f4f;">🛑 停損 '+fmtMoney(t.stopLoss)+' (-8%)</div>';
  }
  var heldDays=daysBetween(t.entryDate,todayStr());
  var html='<div class="card" data-trade-id="'+t.id+'">';
  html+='<div class="card-top"><span class="card-sym">📌 '+escapeHtml(t.sym)+'</span>';
  if(totalSoldPnl>0) html+='<span class="card-badge badge-profit">已落袋 '+fmtMoney(totalSoldPnl)+'</span>';
  else html+='<span class="card-badge badge-flat">持有 '+heldDays+' 天</span>';
  html+='</div>';
  html+='<div class="card-row"><span class="lbl">買入成本</span><span class="val">'+fmtMoney(t.entryPrice)+' × '+remaining+' 股</span></div>';

// ─── 計算 ───────────────────────────
function getRemainingShares(t){ var s=(t.exits||[]).reduce(function(x,e){return x+e.shares;},0); return t.shares-s; }
function calcClosedPnl(t){ return (t.exits||[]).reduce(function(s,e){return s+(e.pnl||0);},0); }
function calcClosedPct(t){ if(!t.cost)return 0; return calcClosedPnl(t)/t.cost*100; }

function calcTargets(entryPrice, mainCost){
  if(!entryPrice) return [];
  var t1,t2,t3;
  if(mainCost && mainCost>0){
    t1=mainCost*1.3; t2=mainCost*1.5; t3=mainCost*1.8;
    if(t1 < entryPrice*1.10){
      t1=entryPrice*1.20; t2=entryPrice*1.30; t3=entryPrice*1.50;
    } else {
      if(t2 < t1*1.08) t2=t1*1.10;
      if(t3 < t2*1.08) t3=t2*1.15;
    }
  } else {
    t1=entryPrice*1.20; t2=entryPrice*1.30; t3=entryPrice*1.50;
  }
  var stopLoss=entryPrice*(1-state.settings.stopPct/100);
  var risk=entryPrice-stopLoss;
  return [t1,t2,t3].map(function(p){
    var pct=(p-entryPrice)/entryPrice*100;
    var reward=p-entryPrice;
    var rr=risk>0?reward/risk:0;
    return {price:p, pct:pct, rr:rr};
  });
}

html+=’<div class="fg"><label>賣出日期 *</label><input type="date" id="sell_date" value="'+todayStr()+'"></div>’;
html+=’</div>’;
html+=’<div class="fg"><label>賣出原因 *</label><select id="sell_reason"><option value="">– 請選擇 –</option>’;
[[‘t1’,‘🎯 達到 T1 目標’],[‘t2’,‘🎯 達到 T2 目標’],[‘t3’,‘🎯 達到 T3 目標’],[‘stop’,‘🛑 觸及停損’],[‘weak’,‘⚠️ 訊號轉弱’],[‘other’,‘📌 其他’]].forEach(function(r){
html+=’<option value="'+r[0]+'">’+r[1]+’</option>’;
});
html+=’</select></div>’;
html+=’<div class="fg"><label>筆記(選填)</label><textarea id="sell_note" rows="2" placeholder="這次出場的想法..."></textarea></div>’;
html+=’<button class="btn btn-success" id="btnConfirmSell">💾 確認出場</button>’;
$(‘sellBody’).innerHTML=html;

// 綁定
Array.prototype.forEach.call($(‘sellBody’).querySelectorAll(’[data-batch]’), function(el){
if(el.classList.contains(‘done’)) return;
el.addEventListener(‘click’, function(){
var b=el.getAttribute(‘data-batch’);
sellData.batchIdx=(b===‘custom’?‘custom’:parseInt(b));
Array.prototype.forEach.call($(‘sellBody’).querySelectorAll(’[data-batch]’), function(x){ x.classList.remove(‘selected’); });
el.classList.add(‘selected’);
if(b===‘custom’){
$(‘customSharesBox’).style.display=‘block’;
} else {
$(‘customSharesBox’).style.display=‘none’;
var tg=t.targets[parseInt(b)];
if(tg && !$(‘sell_price’).value){
$(‘sell_price’).value=tg.price.toFixed(2);
sellData.price=tg.price;
}
$(‘sell_reason’).value=‘t’+(parseInt(b)+1);
updateSellReason(‘t’+(parseInt(b)+1));
}
});
});
$(‘sell_shares’).addEventListener(‘input’, function(){ sellData.customShares=parseInt(this.value)||0; });
$(‘sell_price’).addEventListener(‘input’, function(){ sellData.price=parseFloat(this.value)||0; });
$(‘sell_date’).addEventListener(‘change’, function(){ sellData.exitDate=this.value; });
$(‘sell_reason’).addEventListener(‘change’, function(){ updateSellReason(this.value); });
$(‘sell_note’).addEventListener(‘input’, function(){ sellData.note=this.value; });
$(‘btnConfirmSell’).addEventListener(‘click’, function(){ confirmSell(t); });
}

function updateSellReason(v){
var map={‘t1’:‘🎯 達到 T1 目標’,‘t2’:‘🎯 達到 T2 目標’,‘t3’:‘🎯 達到 T3 目標’,‘stop’:‘🛑 觸及停損’,‘weak’:‘⚠️ 訊號轉弱’,‘other’:‘📌 其他’};
sellData.reason=map[v]||’’; sellData.reasonTag=v;
}

function confirmSell(t){
if(sellData.batchIdx===null||sellData.batchIdx===undefined){ alert(‘請選擇賣出批次’); return; }
if(!sellData.price||sellData.price<=0){ alert(‘請填賣出價’); return; }
if(!sellData.reason){ alert(‘請選擇賣出原因’); return; }
var shares;
if(sellData.batchIdx===‘custom’){
shares=sellData.customShares;
if(!shares||shares<=0){ alert(‘請填賣出股數’); return; }
var rem=getRemainingShares(t);
if(shares>rem){ alert(‘超過剩餘股數 ‘+rem); return; }
} else {
var tg=t.targets[sellData.batchIdx];
if(!tg||tg.sold){ alert(‘此批次已賣’); return; }
shares=tg.shares;
}
var pnl=(sellData.price-t.entryPrice)*shares;
var pct=(sellData.price-t.entryPrice)/t.entryPrice*100;
var tagMap={t1:‘T1’,t2:‘T2’,t3:‘T3’,stop:‘停損’,weak:‘轉弱’,other:‘其他’};
t.exits=t.exits||[];
t.exits.push({ date:sellData.exitDate||todayStr(), price:sellData.price, shares:shares, reason:sellData.reason, tag:sellData.reasonTag, tagLabel:tagMap[sellData.reasonTag]||’’, pnl:pnl, pct:pct, note:sellData.note||’’ });
if(sellData.batchIdx!==‘custom’ && t.targets[sellData.batchIdx]){
t.targets[sellData.batchIdx].sold=true;
t.targets[sellData.batchIdx].soldPrice=sellData.price;
t.targets[sellData.batchIdx].soldDate=sellData.exitDate;
}
var remaining=getRemainingShares(t);
if(remaining<=0){ t.status=‘closed’; t.closedDate=sellData.exitDate||todayStr(); }
saveTrades();
closeModal(‘sellModal’);
render();
alert(‘✅ 已記錄!\n\n賣 ‘+shares+’ 股 @ ‘+fmtMoney(sellData.price)+’\n損益:’+fmtMoney(pnl)+’ (’+fmtPct(pct)+’)’+(remaining<=0?’\n\n🎉 此筆全部出場!’:’\n剩餘:’+remaining+’ 股’));
}

// ─── 統計 ───────────────────────────
function showStats(){
var html=’’;
[‘new’,‘old’].forEach(function(pool){
var name=pool===‘new’?‘🧪 實驗池’:‘🟦 舊持倉’;
var trades=state.trades.filter(function(t){return t.pool===pool;});
var closed=trades.filter(function(t){return t.status===‘closed’;});
var holding=trades.filter(function(t){return t.status===‘holding’;});
var totalPnl=0, wins=0, losses=0, maxWin=0, maxLoss=0;
closed.forEach(function(t){
var p=calcClosedPnl(t);
totalPnl+=p;
if(p>0){ wins++; if(p>maxWin)maxWin=p; }
else if(p<0){ losses++; if(p<maxLoss)maxLoss=p; }
});
var winRate=closed.length>0?(wins/closed.length*100):0;
html+=’<div class="detail-block"><h3>’+name+’</h3><div class="stat-grid">’;
html+=’<div class="stat-card"><h4>持有中</h4><div class="big-num">’+holding.length+’</div></div>’;
html+=’<div class="stat-card"><h4>已出場</h4><div class="big-num">’+closed.length+’</div></div>’;
html+=’<div class="stat-card"><h4>勝率</h4><div class="big-num">’+winRate.toFixed(0)+’%</div></div>’;
html+=’<div class="stat-card"><h4>已實現</h4><div class="big-num '+(totalPnl>=0?'green':'red')+'">’+fmtMoney(totalPnl)+’</div></div>’;
html+=’<div class="stat-card"><h4>最大獲利</h4><div class="big-num green">’+fmtMoney(maxWin)+’</div></div>’;
html+=’<div class="stat-card"><h4>最大虧損</h4><div class="big-num red">’+fmtMoney(maxLoss)+’</div></div>’;
html+=’</div></div>’;
});
$(‘statsBody’).innerHTML=html;
openModal(‘statsModal’);
}

$(‘btnSaveSet’).addEventListener(‘click’, function(){

saveSettings();

alert(‘✅ 設定已儲存’);

// ─── 啟動 ───────────────────────────
function init(){
loadData();
render();
$(‘tabOld’).addEventListener(‘click’, function(){ switchPool(‘old’); });
$(‘tabNew’).addEventListener(‘click’, function(){ switchPool(‘new’); });
$(‘fabBtn’).addEventListener(‘click’, openAddTrade);
$(‘btnStats’).addEventListener(‘click’, showStats);
$(‘btnSettings’).addEventListener(‘click’, showSettings);
// 關閉按鈕
Array.prototype.forEach.call(document.querySelectorAll(’[data-close]’), function(btn){
btn.addEventListener(‘click’, function(){ closeModal(btn.getAttribute(‘data-close’)); });
});
// 點背景關閉
Array.prototype.forEach.call(document.querySelectorAll(’.modal-overlay’), function(el){
el.addEventListener(‘click’, function(e){ if(e.target===el) closeModal(el.id); });
});
}

if(document.readyState===‘loading’){
document.addEventListener(‘DOMContentLoaded’, init);
} else {
init();
}
})();
</script>
