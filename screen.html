function getSectors(){
  var stored=null;
  try{var s=localStorage.getItem(SKEY);if(s) stored=JSON.parse(s);}catch(e){}
  var defs=JSON.parse(JSON.stringify(SECTORS_DEFAULT));
  if(!stored||!Array.isArray(stored)) return defs.filter(function(x){return x.id!=='custom'||x.tickers.length;});
  var byName={},order=[];
  stored.forEach(function(sec){
    if(!sec||!sec.name) return;
    sec.tickers=sec.tickers||[];
    if(byName[sec.name]){ sec.tickers.forEach(function(t){ if(byName[sec.name].tickers.indexOf(t)<0) byName[sec.name].tickers.push(t); }); }
    else{ byName[sec.name]=sec; order.push(sec.name); }
  });
  var out=order.map(function(n){return byName[n];});
  var defByName={}; defs.forEach(function(d){defByName[d.name]=d;});
  out.forEach(function(sec){ var d=defByName[sec.name]; if(d){ sec.id=d.id; sec.icon=d.icon; } });
  var ids={}; out.forEach(function(sec){ids[sec.id]=true;});
  defs.forEach(function(d){ if(!ids[d.id] && d.id!=='custom') out.push(d); });
  return out.filter(function(sec){ return sec.id!=='custom' || (sec.tickers&&sec.tickers.length); });
}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function fetchYahoo(t,retried){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(t)+'?interval=1d&range=2y&_cb='+Date.now();   // 時間戳：避免代理或中間層回傳舊快取
  var r=await fetch(PROXY+encodeURIComponent(base),{cache:'no-store'});
  if(r.status===429 && !retried){ await sleep(2000); return fetchYahoo(t,true); }
  if(!r.ok) throw new Error('Yahoo HTTP '+r.status);
  var data=await r.json();
  if(!data.chart||!data.chart.result||!data.chart.result[0]) throw new Error('Yahoo 沒有這檔的資料');
  return data.chart.result[0];
}
function rd3(x){return Math.round(x*1000)/1000;}
function parseBars(res){
  var ts=res.timestamp||[], q=res.indicators.quote[0];
  var B={d:[],o:[],h:[],l:[],c:[],v:[]};
  for(var i=0;i<ts.length;i++){
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i]){
      B.d.push(new Date(ts[i]*1000).toISOString().slice(0,10));
      B.o.push(rd3(q.open[i]));B.h.push(rd3(q.high[i]));B.l.push(rd3(q.low[i]));B.c.push(rd3(q.close[i]));B.v.push(q.volume[i]);
    }
  }
  if(B.c.length<20) throw new Error('資料太少（'+B.c.length+' 天）');
  B.nm=(res.meta&&(res.meta.longName||res.meta.shortName))||null;
  // Yahoo 的日線最後一根有時還沒更新到今天：用 meta 的最新成交價補上或更新
  try{
    var m=res.meta||{};
    if(m.regularMarketPrice>0&&m.regularMarketTime){

function chip(ok,txt){ return '<span class="tag" style="background:'+(ok?'#0d8a3f':'#b3262e')+'">'+(ok?'✓ ':'✗ ')+txt+'</span>'; }
function fundHtml(t){
  var f=FUND[t]; if(!f) return '';
  if(f.err) return '<div class="sub">基本面：抓不到（'+esc(f.err)+'）</div>';
  var g=function(v){ return v==null?'—':(v>=0?'+':'')+v.toFixed(0)+'%'; };
  return '<div class="sub" style="margin-top:4px">基本面（只記錄）：最近一季 EPS 年增 '+g(f.epsQ)+'、營收年增 '+g(f.revQ)+'；近 12 個月 EPS 年增 '+g(f.epsT)+'；ROE '+(f.roe==null?'—':f.roe.toFixed(0)+'%')+'。<br>白話：'+fundRead(f)+'</div>';
}
function fundRead(f){
  if(f.epsQ==null&&f.revQ==null) return '資料不足，沒辦法判斷。';
  var good=(f.epsQ!=null&&f.epsQ>=25)&&(f.revQ==null||f.revQ>=15);
  if(good) return '獲利和營收都在明顯成長，常被引用的參考線（約 25%、15%）以上。';
  if((f.epsQ!=null&&f.epsQ<0)||(f.revQ!=null&&f.revQ<0)) return '獲利或營收在下滑，故事主要靠股價動能，不是業績。';
  return '有成長但不算突出，低於常被引用的參考線。';
}
function card(r,showMiss){
  var h='<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b style="font-size:17px">'+esc(r.t)+'</b> <span class="sub">'+esc(r.nm)+'</span></div><div>'+(showMiss?'':'<span class="tag" style="background:'+(r.bonus===2?'#0d8a3f':(r.bonus===1?'#dd6600':'#778'))+'">加分 '+r.bonus+'/2</span>')+'</div></div>';
  h+='<div style="margin:4px 0">'+chip(r.L1,'板塊')+chip(r.stage2,'Stage 2')+chip(r.posOK,r.pos)+chip(r.volOK,'量')+chip(r.rsOK,'比大盤強')+'</div>';
  h+='<div class="read" style="font-size:13.5px;margin-top:2px">'+(showMiss?'<b>卡在：'+r.miss.join('、')+'。</b> ':'')+plain(r)+(r.dna?' dna 觀察簿記過 '+r.dna.pass+' 關（'+esc(r.dna.date)+'）。':'')+'</div>'+fundHtml(r.t)+'</div>';
  return h;
}
function render(){
  var N=ROWS.length, a1=ROWS.filter(function(r){return r.L1;}), a2=a1.filter(function(r){return r.stage2;}), a3=a2.filter(function(r){return r.posOK;});
  var picks=ROWS.filter(function(r){return r.pass;}).sort(function(a,b){ return b.bonus-a.bonus || (a.pos==='突破中'?0:1)-(b.pos==='突破中'?0:1) || b.rs-a.rs; });
  var fn=[['全部股票（你的板塊名單）',N],['① 板塊不是逆風',a1.length],['② 再加：在 Stage 2',a2.length],['② 再加：位置在買點附近 ＝ 入選',a3.length],['　其中有量（≥1.3 倍）',a3.filter(function(r){return r.volOK;}).length],['　其中比大盤強',a3.filter(function(r){return r.rsOK;}).length],['　量與強度都有（加分 2）',a3.filter(function(r){return r.bonus===2;}).length]];
  el('funnel').innerHTML='<div class="tw"><table class="t"><tr><th>層</th><th>剩幾檔</th></tr>'+fn.map(function(x){return '<tr><td>'+x[0]+'</td><td><b>'+x[1]+'</b></td></tr>';}).join('')+'</table></div><div class="sub">白話：每往下一層就更挑剔；看哪一層刷掉最多，就是現在市場的瓶頸。'+bottleneck(N,a1,a2,a3)+'</div>';
  el('picks').innerHTML=picks.length?picks.map(function(r){return card(r,false);}).join(''):'<div class="read">今天沒有任何一檔同時過 ①② 兩層。不是壞事：你的買進規則本來就是 Stage 2 沒到不買，沒有就等。下面「差一關」可以看誰最接近。</div>';
  var near=ROWS.filter(function(r){return !r.pass&&r.miss.length===1&&(r.stage2||r.L1&&r.stg===22);}).sort(function(a,b){return b.bonus-a.bonus;}).slice(0,15);
  var near2=ROWS.filter(function(r){return !r.pass&&r.miss.length===1&&r.stage2;}).sort(function(a,b){return b.bonus-a.bonus;}).slice(0,15);
  el('near').innerHTML=near2.length?'<div class="sub">已在 Stage 2、只差板塊或位置的（最多 15 檔）：</div>'+near2.map(function(r){return card(r,true);}).join(''):'<div class="read">沒有「在 Stage 2 又只差一關」的股票。</div>';
  var v='';
  if(picks.length) v='今天入選 '+picks.length+' 檔：'+picks.slice(0,8).map(function(r){return r.t+(r.bonus===2?'★':'');}).join('、')+(picks.length>8?'…':'')+'。（★＝量與強度都有）';
  else v='今天沒有入選。Stage 2 且板塊不是逆風的只有 '+a2.length+' 檔，其中位置合適的 0 檔。';
  v+=' 大盤：SPY '+(CTX.m50?'在':'不在')+' 50 日線'+(CTX.m50?'上':'下')+'。';
  el('verdict').innerHTML=v;
  el('lim').innerHTML='⚠ 這一頁的門檻（Stage 2、離前 30 日高 5% 內、突破後不超過 8%、量 1.3 倍、63 日強度）都是我訂的，沒驗證；回測只證明「DNA ≥5 關＋板塊不逆風」有一點幫助，且強市時沒有幫助。基本面是即時快照，沒有歷史，所以只記錄不當門檻；「常被引用的參考線」是 O’Neil 的 EPS 約 25% 等說法，我尚未逐一查原文核對。價格資料來自 Yahoo，可能晚一天。入選不等於買進，買進還要你看 K 線與 dna。';
}
function bottleneck(N,a1,a2,a3){
  var d1=N-a1.length, d2=a1.length-a2.length, d3=a2.length-a3.length;
  var m=Math.max(d1,d2,d3);
  if(m===0) return '';
  if(m===d2) return ' 目前刷掉最多的是「Stage 2」那一層（'+d2+' 檔），也就是多數股票的長期趨勢還沒轉好。';
  if(m===d1) return ' 目前刷掉最多的是「板塊逆風」（'+d1+' 檔）。';
  return ' 目前刷掉最多的是「位置」（'+d3+' 檔在 Stage 2 但離買點太遠或已延伸）。';
}
function runAll(){
  var S=BARS['SPY'], k=S.d.length-1; SC={};
  var sma50=0; for(var q=k-49;q<=k;q++) sma50+=S.c[q]; sma50/=50; CTX.m50=S.c[k]>sma50;
  var tk=Object.keys(T2S).filter(function(t){return BARS[t];}); ROWS=[];
  tk.forEach(function(t){ try{ var r=judge(t,k); if(r) ROWS.push(r); }catch(e){} });
  render(); renderTrack();
}
// ── 快照（每天一份，之後追蹤入選股的表現）──
function snapLoad(){ try{ return JSON.parse(localStorage.getItem(SNAPK)||'{}')||{}; }catch(e){ return {}; } }
function saveSnap(){
  var S=BARS['SPY'], d=S.d[S.d.length-1], a=snapLoad();
  a[d]={spy:S.c[S.c.length-1],p:ROWS.filter(function(r){return r.pass;}).map(function(r){return {t:r.t,px:r.px,b:r.bonus,vx:r.vx!=null?+r.vx.toFixed(2):null,rs:r.rs!=null?+r.rs.toFixed(1):null,f:FUND[r.t]&&!FUND[r.t].err?FUND[r.t]:null};}),n2:ROWS.filter(function(r){return r.stage2;}).length};
  var ks=Object.keys(a).sort(); while(ks.length>90){ delete a[ks.shift()]; }
  try{ localStorage.setItem(SNAPK,JSON.stringify(a)); }catch(e){ alert('存檔失敗'); return; }
  el('btnSnap').textContent='已存 '+d+' 快照'; renderTrack();
}
function renderTrack(){
  var a=snapLoad(), ks=Object.keys(a).sort(), S=BARS['SPY']; if(!S) return;
  if(!ks.length){ el('track').innerHTML='<div class="read">還沒有快照。每天收盤後（美西下午 1:10 以後）開這頁，按「存今天快照」。累積一兩週後，這裡會算：當天入選的股票，到現在比大盤多漲多少；並分「有量／沒量」「強／弱」看哪一層真的有用。</div>'; return; }
  var rows=[], byL={vol:[[],[]],rs:[[],[]]}, allEx=[];
  ks.forEach(function(d){ var s=a[d], ex=[], rr=[]; s.p.forEach(function(p){ var B=BARS[p.t]; if(!B) return; var r=B.c[B.c.length-1]/p.px-1, sr=S.c[S.c.length-1]/s.spy-1; if(d===S.d[S.d.length-1]) return; rr.push(r*100); ex.push((r-sr)*100); allEx.push((r-sr)*100); (p.vx!=null&&p.vx>=1.3?byL.vol[0]:byL.vol[1]).push((r-sr)*100); (p.rs!=null&&p.rs>0?byL.rs[0]:byL.rs[1]).push((r-sr)*100); });
    rows.push('<tr><td>'+d+'</td><td>'+s.p.length+'</td><td>'+(rr.length?pc1(med(rr)):'—')+'</td><td>'+(ex.length?'<span class="'+(med(ex)>=0?'pos':'neg')+'">'+pc1(med(ex))+'</span>':'—')+'</td></tr>'); });
  var h='<div class="tw"><table class="t"><tr><th>快照日</th><th>入選數</th><th>至今中位數報酬</th><th>比大盤多</th></tr>'+rows.join('')+'</table></div>';
  var fx=function(x){ return x.length?pc1(med(x))+'（'+x.length+' 筆）':'—'; };
  h+='<div class="read">各層有沒有用（累積後才有意義，筆數少於 30 不要下結論）：有量 '+fx(byL.vol[0])+' vs 沒量 '+fx(byL.vol[1])+'；比大盤強 '+fx(byL.rs[0])+' vs 較弱 '+fx(byL.rs[1])+'。</div>';
  el('track').innerHTML=h;
}
// ── 基本面（Finnhub，只抓入選股）──
async function getFund(t){
  var k=''; try{ k=localStorage.getItem('finprobe_key')||''; }catch(e){}
  if(!k) throw new Error('沒有 Finnhub key（要先在 news.html 設定過，且同一個瀏覽器）');
  var r=await fetch('https://finnhub.io/api/v1/stock/metric?symbol='+encodeURIComponent(t)+'&metric=all&token='+k,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  var m=(await r.json()).metric||{};
  var pick=function(){ for(var i=0;i<arguments.length;i++){ var v=m[arguments[i]]; if(v!=null&&isFinite(v)) return +v; } return null; };
  return {epsQ:pick('epsGrowthQuarterlyYoy'),revQ:pick('revenueGrowthQuarterlyYoy'),epsT:pick('epsGrowthTTMYoy'),roe:pick('roeTTM','roeRfy')};
}
async function runFund(){
  var picks=ROWS.filter(function(r){return r.pass;}); var b=el('btnFund'); b.disabled=true;
  for(var i=0;i<picks.length;i++){ b.textContent='抓基本面 '+(i+1)+'／'+picks.length; var t=picks[i].t; try{ FUND[t]=await getFund(t); }catch(e){ FUND[t]={err:String(e.message||e)}; if(/key/.test(FUND[t].err)) break; } await sleep(1100); }
  b.textContent='重抓基本面'; b.disabled=false; render();
}
async function init(){
  try{ migrateNames2(); }catch(e){}
  SECS=getSectors().filter(function(s){return s.tickers&&s.tickers.length>=3;});
  var tick={'SPY':1}; SECS.forEach(function(s){ s.tickers.forEach(function(t){ tick[t]=1; }); });
  var list=Object.keys(tick).filter(function(t){ return !BARS[t]; });
  await loadMany(list,function(d,tot){ el('prog').textContent='載入價格 '+d+'／'+tot+' …（第一次要一兩分鐘；20 分鐘內開過 charts 會用同一份快取）'; });
  if(!BARS['SPY']){ el('prog').textContent='沒抓到大盤（SPY）資料，請稍後重新整理。'; el('verdict').textContent='資料載入失敗'; return; }
  SECS.forEach(function(s){ s.tickers.forEach(function(t){ (T2S[t]=T2S[t]||[]).push(s.name); }); var l=s.tickers.filter(function(t){return BARS[t];}).map(function(t){return {t:t,B:BARS[t],o:{}};}); if(l.length>=3) LISTS[s.name]=l; });
  var S=BARS['SPY']; el('prog').textContent='價格資料到 '+fd(S.d[S.d.length-1])+'，共 '+Object.keys(T2S).filter(function(t){return BARS[t];}).length+' 檔、'+Object.keys(LISTS).length+' 個板塊。';
  el('btnRun').disabled=false; el('btnFund').disabled=false; el('btnSnap').disabled=false;
  el('btnRun').onclick=function(){ runAll(); }; el('btnFund').onclick=runFund; el('btnSnap').onclick=saveSnap;
  runAll();
}
init();
