<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>操作日記 Step 5a：新增交易</title>
<style>
:root {
  --cream-50:#fdfaf3; --cream-100:#f9f1df; --cream-200:#f3e6c4; --cream-300:#e8d6a0;
  --ink-900:#3d2f15; --ink-700:#6b5230; --ink-500:#9a8456;
  --pool-old-bg:#e8f0fb; --pool-old-line:#4a78c8; --pool-old-ink:#1f3d75;
  --pool-new-bg:#e3f3e6; --pool-new-line:#2f9d4a; --pool-new-ink:#1a6b2f;
  --gold:#c89b3c; --gold-dk:#a37b22; --danger:#c3502f; --warn:#d97706;
  --shadow-sm:0 1px 3px rgba(80,55,15,.08);
  --shadow-lg:0 8px 24px rgba(80,55,15,.18);
  --radius:12px; --radius-lg:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--cream-50);color:var(--ink-900);font-family:-apple-system,"PingFang TC","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;}
body{padding:16px 16px 100px;max-width:880px;margin:0 auto;}

.page-title{font-size:22px;font-weight:700;color:var(–ink-900);padding:4px 0 14px;}

.cp-card{background:#fff;border-radius:var(–radius-lg);padding:14px;margin-bottom:16px;box-shadow:var(–shadow-sm);border:1px solid var(–cream-200);}
.cp-card h3{font-size:16px;color:var(–ink-700);margin-bottom:10px;}
#cpLog{background:#1a1a1a;color:#c8e6c9;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;padding:12px 14px;border-radius:10px;white-space:pre-wrap;max-height:240px;overflow-y:auto;}

.pool-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.pool-tab{background:var(–cream-100);border:2px solid transparent;border-radius:var(–radius);padding:16px 12px;font-size:16px;font-weight:600;color:var(–ink-500);cursor:pointer;text-align:center;-webkit-appearance:none;}
.pool-tab.active.old{background:var(–pool-old-bg);border-color:var(–pool-old-line);color:var(–pool-old-ink);}
.pool-tab.active.new{background:var(–pool-new-bg);border-color:var(–pool-new-line);color:var(–pool-new-ink);}

.pool-header{padding:10px 14px;border-radius:var(–radius);margin-bottom:12px;font-size:14px;font-weight:500;}
.pool-header.old{background:var(–pool-old-bg);color:var(–pool-old-ink);border-left:4px solid var(–pool-old-line);}
.pool-header.new{background:var(–pool-new-bg);color:var(–pool-new-ink);border-left:4px solid var(–pool-new-line);}

.summary-card{background:#fff;border-radius:var(–radius-lg);padding:14px;box-shadow:var(–shadow-sm);border:1px solid var(–cream-200);margin-bottom:16px;}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.summary-cell{background:var(–cream-100);border-radius:10px;padding:14px 8px;text-align:center;}
.summary-cell .num{font-size:20px;font-weight:700;color:var(–ink-900);line-height:1.2;}
.summary-cell .lbl{font-size:12px;color:var(–ink-500);margin-top:4px;}
.summary-cell.cash{background:#eaf0f9;}.summary-cell.cash .num{color:var(–pool-old-ink);}
.summary-cell.realized{background:#e8f3eb;}.summary-cell.realized .num{color:var(–pool-new-ink);}

.section{background:#fff;border-radius:var(–radius-lg);padding:14px;box-shadow:var(–shadow-sm);border:1px solid var(–cream-200);margin-bottom:14px;}
.section h3{font-size:15px;color:var(–ink-700);margin-bottom:10px;}
.section h3 .count{font-size:12px;color:var(–ink-500);font-weight:400;margin-left:6px;}

.holding{background:var(–cream-100);border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid var(–pool-new-line);}
.holding.old-pool{border-left-color:var(–pool-old-line);}
.holding-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.holding-tk{font-size:17px;font-weight:700;color:var(–ink-900);}
.holding-row2{font-size:12px;color:var(–ink-500);display:flex;flex-wrap:wrap;gap:8px;}
.holding-row2 b{color:var(–ink-700);font-weight:600;}

.empty{text-align:center;color:var(–ink-500);padding:20px 10px;font-size:14px;}

.fab{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#2f9d4a,#1a6b2f);color:#fff;font-size:32px;border:none;box-shadow:var(–shadow-lg);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:50;-webkit-appearance:none;}

.modal-mask{position:fixed;inset:0;background:rgba(40,28,10,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:16px;overflow-y:auto;}
.modal-mask.show{display:flex;}
.modal-card{background:#fdfaf3;border-radius:var(–radius-lg);width:100%;max-width:520px;box-shadow:var(–shadow-lg);border:1px solid var(–cream-200);margin:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(–cream-200);background:var(–cream-100);border-radius:var(–radius-lg) var(–radius-lg) 0 0;}
.modal-head h3{font-size:17px;color:var(–ink-900);font-weight:700;}
.modal-close{background:var(–cream-200);border:none;color:var(–ink-700);padding:8px 16px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;-webkit-appearance:none;}
.modal-body{padding:18px;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(–ink-700);margin-bottom:5px;font-weight:600;}
.field label .hint{color:var(–ink-500);font-weight:400;font-size:11px;}
.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(–cream-300);border-radius:8px;font-size:15px;background:#fff;color:var(–ink-900);-webkit-appearance:none;}
.field textarea{min-height:60px;resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.target-preview{background:var(–cream-100);border-radius:8px;padding:10px;font-size:12px;color:var(–ink-700);margin-top:6px;line-height:1.7;}
.target-preview b{color:var(–ink-900);}
.alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;}
.alert.warn{background:#fef3c7;color:#7c5400;border-left:4px solid var(–warn);}
.alert.danger{background:#fee2e2;color:#991b1b;border-left:4px solid var(–danger);}
.alert.info{background:var(–cream-100);color:var(–ink-700);border-left:4px solid var(–gold);}

.btn-primary{width:100%;background:linear-gradient(135deg,var(–gold),var(–gold-dk));color:#fff;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;-webkit-appearance:none;}

@media(max-width:480px){
.page-title{font-size:19px;}
.summary-cell .num{font-size:17px;}
.pool-tab{font-size:15px;padding:14px 8px;}
}
</style>

</head>
<body>

<h1 class="page-title">📔 操作日記 Step 5a：新增交易</h1>

<div class="cp-card">
  <h3>🔍 啟動檢查點</h3>
  <div id="cpLog"></div>
</div>

<div class="pool-tabs">
  <button class="pool-tab old" id="tabOld" onclick="switchPool('old')">🟦 舊持倉</button>
  <button class="pool-tab new" id="tabNew" onclick="switchPool('new')">🧪 實驗池</button>
</div>

<div class="pool-header new" id="poolHeader"></div>

<div class="summary-card">
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<div class="section">
  <h3>📦 持倉<span class="count" id="holdingsCount"></span></h3>
  <div id="holdingsList"></div>
</div>

<button class="fab" onclick="openAdd()">+</button>

<div class="modal-mask" id="modalMask">
  <div class="modal-card">
    <div class="modal-head">
      <h3>📝 新增交易</h3>
      <button class="modal-close" onclick="closeModal()">關閉</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
var cpLog = document.getElementById('cpLog');
function cp(msg, ok){
  var icon = ok === true ? '✅' : ok === false ? '❌' : '⏳';
  cpLog.textContent += icon + ' ' + msg + '\n';
  cpLog.scrollTop = cpLog.scrollHeight;
}

try {
  cp('CP1: script 開始', true);

  cp('CP2: state...');
  var state = {
    currentPool: 'new',
    pools: {
      old: {name:'舊持倉',startDate:'2025-01-01',endDate:'2099-12-31',startCash:0,cash:0,realized:0,holdings:[]},
      new: {name:'實驗池',startDate:'2026-04-25',endDate:'2026-07-25',startCash:50000,cash:50000,realized:0,holdings:[]}
    }
  };
  cp('CP2: state OK', true);

  cp('CP3: 工具...');
  function $(id){ return document.getElementById(id); }
  function fmt(n){ return '$' + Math.round(n).toLocaleString(); }
  function fmt2(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
  function daysLeft(endDate){
    var t = (new Date(endDate) - new Date()) / 86400000;
    return Math.max(0, Math.ceil(t));
  }
  function uid(){ return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  cp('CP3: 工具 OK', true);

  cp('CP4: loadData...');
  function loadData(){
    try {
      var raw = localStorage.getItem('diary_v5a_state');
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.pools) state = parsed;
      }
    } catch(e) {}
  }
  function saveData(){
    try { localStorage.setItem('diary_v5a_state', JSON.stringify(state)); } catch(e) {}
  }
  cp('CP4: loadData OK', true);

  cp('CP5: render...');
  function calcTargets(entry, main){
    if (main && main > 0) {
      return { t1: main*1.3, t2: main*1.5, t3: main*1.8, mode:'主力成本' };
    }
    return { t1: entry*1.20, t2: entry*1.30, t3: entry*1.50, mode:'進場 %' };
  }
  function calcRR(entry, stop, t2){
    var risk = entry - stop;
    var reward = t2 - entry;
    if (risk <= 0) return null;
    return reward / risk;
  }
  function renderHeader(){
    var p = state.pools[state.currentPool];
    var h = $('poolHeader');
    h.classList.remove('old','new');
    h.classList.add(state.currentPool);
    var icon = state.currentPool === 'new' ? '🧪' : '🟦';
    h.textContent = icon + ' ' + p.name + ' 期間：' + p.startDate + ' ~ ' + p.endDate + '（剩 ' + daysLeft(p.endDate) + ' 天）';
  }
  function renderSummary(){
    var p = state.pools[state.currentPool];
    var held = p.holdings.length;
    $('summaryGrid').innerHTML =
      '<div class="summary-cell"><div class="num">' + fmt(p.startCash) + '</div><div class="lbl">起始</div></div>' +
      '<div class="summary-cell cash"><div class="num">' + fmt(p.cash) + '</div><div class="lbl">現金</div></div>' +
      '<div class="summary-cell realized"><div class="num">' + fmt(p.realized) + '</div><div class="lbl">已實現</div></div>' +
      '<div class="summary-cell"><div class="num">' + held + '</div><div class="lbl">持有</div></div>' +
      '<div class="summary-cell"><div class="num">0</div><div class="lbl">已出</div></div>' +
      '<div class="summary-cell"><div class="num">0%</div><div class="lbl">勝率</div></div>';
  }
  function renderHoldings(){
    var p = state.pools[state.currentPool];
    $('holdingsCount').textContent = '(' + p.holdings.length + ')';
    var list = $('holdingsList');
    if (!p.holdings.length) {
      list.innerHTML = '<div class="empty">目前無持倉，按右下 + 新增交易</div>';
      return;
    }
    var poolCls = state.currentPool === 'old' ? 'old-pool' : '';
    var html = '';
    for (var i = 0; i < p.holdings.length; i++) {
      var h = p.holdings[i];
      var tgs = h.targets || {};
      html +=
        '<div class="holding ' + poolCls + '">' +
          '<div class="holding-row1">' +
            '<div class="holding-tk">' + h.ticker + '</div>' +
          '</div>' +
          '<div class="holding-row2">' +
            '<span><b>' + h.shares + '</b>股 @ ' + fmt2(h.entryPrice) + '</span>' +
            '<span>停損 <b>' + fmt2(h.stopLoss) + '</b></span>' +
            '<span>T1/T2/T3 ' + fmt2(tgs.t1||0) + ' / ' + fmt2(tgs.t2||0) + ' / ' + fmt2(tgs.t3||0) + '</span>' +
            '<span>進場日 ' + h.entryDate + '</span>' +
          '</div>' +
        '</div>';
    }
    list.innerHTML = html;
  }
  function render(){ renderHeader(); renderSummary(); renderHoldings(); }
  cp('CP5: render OK', true);

  cp('CP6: switchPool/Modal...');
  window.switchPool = function(pool){
    state.currentPool = pool;
    $('tabOld').classList.toggle('active', pool === 'old');
    $('tabNew').classList.toggle('active', pool === 'new');
    render();
    saveData();
  };
  window.closeModal = function(){
    $('modalMask').classList.remove('show');
  };
  window.openAdd = function(){
    var p = state.pools[state.currentPool];
    $('modalBody').innerHTML =
      '<div class="alert info">📌 池：<b>' + p.name + '</b>　現金：<b>' + fmt(p.cash) + '</b></div>' +
      '<div class="field"><label>股票代號</label><input id="f_ticker" type="text" placeholder="例如：PL" autocapitalize="characters"></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>進場價</label><input id="f_entry" type="number" step="0.01" placeholder="0.00"></div>' +
        '<div class="field"><label>股數</label><input id="f_shares" type="number" step="1" placeholder="0"></div>' +
      '</div>' +
      '<div class="field-row">' +
        '<div class="field"><label>停損價 <span class="hint">(預設-8%)</span></label><input id="f_stop" type="number" step="0.01" placeholder="自動算"></div>' +
        '<div class="field"><label>主力成本 <span class="hint">(可空)</span></label><input id="f_main" type="number" step="0.01" placeholder="可空"></div>' +
      '</div>' +
      '<div class="field"><label>進場日</label><input id="f_date" type="date" value="' + todayISO() + '"></div>' +
      '<div class="field"><label>備註</label><textarea id="f_note" placeholder="進場理由、訊號、預期..."></textarea></div>' +

```
  '<div class="target-preview" id="targetPreview">填入價格後自動算目標 / R:R</div>' +
  '<div id="addAlerts"></div>' +
  '<button class="btn-primary" onclick="submitAdd()">確認新增</button>';
var ids = ['f_ticker','f_entry','f_shares','f_stop','f_main'];
for (var i = 0; i < ids.length; i++) {
  var el = $(ids[i]);
  if (el) el.addEventListener('input', updateAddPreview);
}
$('modalMask').classList.add('show');
```

};
function updateAddPreview(){
var entry = parseFloat($(‘f_entry’).value) || 0;
var shares = parseFloat($(‘f_shares’).value) || 0;
var main = parseFloat($(‘f_main’).value) || 0;
var stop = parseFloat($(‘f_stop’).value);
if (!stop && entry) {
stop = entry * 0.92;
$(‘f_stop’).placeholder = stop.toFixed(2);
}
var t = calcTargets(entry, main);
var rr = calcRR(entry, stop || entry*0.92, t.t2);
var cost = entry * shares;
var html = ‘’;
if (entry) {
html += ‘<div>目標 (’ + t.mode + ’): <b>T1 ’ + fmt2(t.t1) + ‘</b> / <b>T2 ’ + fmt2(t.t2) + ‘</b> / <b>T3 ’ + fmt2(t.t3) + ‘</b></div>’;
}
if (rr) {
html += ‘<div>R:R = <b>1:’ + rr.toFixed(2) + ‘</b>’ + (rr < 3 ? ’ ⚠️ 低於 1:3’ : ‘’) + ‘</div>’;
}
if (cost) {
html += ‘<div>本筆成本: <b>’ + fmt(cost) + ‘</b>’ + (cost > 10000 ? ’ ⚠️ 超過 $10,000’ : ‘’) + ‘</div>’;
}
$(‘targetPreview’).innerHTML = html || ‘填入價格後自動算目標 / R:R’;

```
var alerts = [];
var p = state.pools[state.currentPool];
if (cost > p.cash) alerts.push('<div class="alert danger">❌ 現金不足（需 ' + fmt(cost) + '，剩 ' + fmt(p.cash) + '）</div>');
if (state.currentPool === 'new' && cost > 10000) alerts.push('<div class="alert warn">⚠️ 實驗池單筆建議 ≤ $10,000</div>');
if (rr && rr < 3) alerts.push('<div class="alert warn">⚠️ R:R 低於 1:3，建議重新評估</div>');
$('addAlerts').innerHTML = alerts.join('');
```

}
window.submitAdd = function(){
var ticker = ($(‘f_ticker’).value || ‘’).trim().toUpperCase();
var entry = parseFloat($(‘f_entry’).value);
var shares = parseFloat($(‘f_shares’).value);
var stop = parseFloat($(‘f_stop’).value);
var main = parseFloat($(‘f_main’).value) || 0;
var date = $(‘f_date’).value || todayISO();
var note = ($(‘f_note’).value || ‘’).trim();
if (!ticker) { alert(‘請輸入股票代號’); return; }
if (!entry || entry <= 0) { alert(‘請輸入進場價’); return; }
if (!shares || shares <= 0) { alert(‘請輸入股數’); return; }
if (!stop) stop = entry * 0.92;
var cost = entry * shares;
var p = state.pools[state.currentPool];
if (cost > p.cash) { alert(’現金不足，需 ’ + fmt(cost) + ’，剩 ’ + fmt(p.cash)); return; }
var tgs = calcTargets(entry, main);
p.holdings.push({
id: uid(),
ticker: ticker, entryPrice: entry, shares: shares,
stopLoss: stop, mainCost: main || null,
targets: { t1: tgs.t1, t2: tgs.t2, t3: tgs.t3, mode: tgs.mode },
entryDate: date, note: note
});
p.cash -= cost;
saveData(); render(); closeModal();
};
cp(‘CP6: switchPool/Modal OK’, true);

cp(‘CP7: 執行 loadData + render…’);
loadData();
$(‘tabOld’).classList.toggle(‘active’, state.currentPool === ‘old’);
$(‘tabNew’).classList.toggle(‘active’, state.currentPool === ‘new’);
render();
cp(‘CP7: 完成’, true);
cp(‘🎉 全部成功！按右下 + 新增交易’, true);

} catch (err) {
cp(‘💥 錯誤：’ + err.message, false);
console.error(err);
}
</script>

</body>
</html>
