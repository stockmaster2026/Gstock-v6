<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>操作日記 Step 5：完整功能</title>
<style>
:root {
  --cream-50:#fdfaf3; --cream-100:#f9f1df; --cream-200:#f3e6c4; --cream-300:#e8d6a0;
  --ink-900:#3d2f15; --ink-700:#6b5230; --ink-500:#9a8456; --ink-300:#c9b88a;
  --pool-old-bg:#e8f0fb; --pool-old-line:#4a78c8; --pool-old-ink:#1f3d75;
  --pool-new-bg:#e3f3e6; --pool-new-line:#2f9d4a; --pool-new-ink:#1a6b2f;
  --gold:#c89b3c; --gold-dk:#a37b22; --danger:#c3502f; --warn:#d97706;
  --shadow-sm:0 1px 3px rgba(80,55,15,.08); --shadow-md:0 4px 12px rgba(80,55,15,.12);
  --shadow-lg:0 8px 24px rgba(80,55,15,.18);
  --radius:12px; --radius-lg:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--cream-50);color:var(--ink-900);font-family:-apple-system,"PingFang TC","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;}
body{padding:16px 16px 100px;max-width:880px;margin:0 auto;}

.page-title{font-size:22px;font-weight:700;color:var(–ink-900);padding:4px 0 14px;letter-spacing:.5px;}

.cp-card{background:#fff;border-radius:var(–radius-lg);padding:14px;margin-bottom:16px;box-shadow:var(–shadow-sm);border:1px solid var(–cream-200);}
.cp-card h3{font-size:16px;color:var(–ink-700);margin-bottom:10px;}
#cpLog{background:#1a1a1a;color:#c8e6c9;font-family:ui-monospace,“SF Mono”,Menlo,monospace;font-size:13px;line-height:1.7;padding:12px 14px;border-radius:10px;white-space:pre-wrap;max-height:240px;overflow-y:auto;}

.pool-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.pool-tab{background:var(–cream-100);border:2px solid transparent;border-radius:var(–radius);padding:16px 12px;font-size:16px;font-weight:600;color:var(–ink-500);cursor:pointer;transition:all .18s ease;text-align:center;-webkit-appearance:none;}
.pool-tab.active.old{background:var(–pool-old-bg);border-color:var(–pool-old-line);color:var(–pool-old-ink);box-shadow:var(–shadow-sm);}
.pool-tab.active.new{background:var(–pool-new-bg);border-color:var(–pool-new-line);color:var(–pool-new-ink);box-shadow:var(–shadow-sm);}
.pool-tab:active{transform:scale(.98);}

.pool-header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(–radius);margin-bottom:12px;font-size:14px;font-weight:500;}
.pool-header.old{background:var(–pool-old-bg);color:var(–pool-old-ink);border-left:4px solid var(–pool-old-line);}
.pool-header.new{background:var(–pool-new-bg);color:var(–pool-new-ink);border-left:4px solid var(–pool-new-line);}

.summary-card{background:#fff;border-radius:var(–radius-lg);padding:14px;box-shadow:var(–shadow-sm);border:1px solid var(–cream-200);margin-bottom:16px;}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.summary-cell{background:var(–cream-100);border-radius:10px;padding:14px 8px;text-align:center;}
.summary-cell .num{font-size:20px;font-weight:700;color:var(–ink-900);line-height:1.2;}
.summary-cell .lbl{font-size:12px;color:var(–ink-500);margin-top:4px;}
.summary-cell.cash{background:#eaf0f9;}.summary-cell.cash .num{color:var(–pool-old-ink);}
.summary-cell.realized{background:#e8f3eb;}.summary-cell.realized .num{color:var(–pool-new-ink);}
.summary-cell.win .num.green{color:var(–pool-new-ink);}.summary-cell.win .num.red{color:var(–danger);}

.section{background:#fff;border-radius:var(–radius-lg);padding:14px;box-shadow:var(–shadow-sm);border:1px solid var(–cream-200);margin-bottom:14px;}
.section h3{font-size:15px;color:var(–ink-700);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.section h3 .count{font-size:12px;color:var(–ink-500);font-weight:400;}

/* Holding card */
.holding{background:var(–cream-100);border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid var(–pool-new-line);}
.holding.old-pool{border-left-color:var(–pool-old-line);}
.holding-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.holding-tk{font-size:17px;font-weight:700;color:var(–ink-900);}
.holding-pnl{font-size:14px;font-weight:600;}
.holding-pnl.up{color:var(–pool-new-ink);}.holding-pnl.dn{color:var(–danger);}
.holding-row2{font-size:12px;color:var(–ink-500);display:flex;flex-wrap:wrap;gap:8px;}
.holding-row2 b{color:var(–ink-700);font-weight:600;}
.holding-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.btn-mini{flex:1;min-width:60px;background:#fff;border:1px solid var(–cream-300);color:var(–ink-700);padding:8px 6px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;-webkit-appearance:none;}
.btn-mini.sell{background:var(–danger);color:#fff;border-color:var(–danger);}
.btn-mini.add{background:var(–pool-new-line);color:#fff;border-color:var(–pool-new-line);}
.btn-mini.edit{background:var(–cream-200);}
.btn-mini:active{transform:scale(.96);}

/* Closed entry */
.closed-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(–cream-100);border-radius:8px;margin-bottom:6px;font-size:13px;}
.closed-row .tk{font-weight:700;color:var(–ink-900);}
.closed-row .pnl.up{color:var(–pool-new-ink);font-weight:600;}
.closed-row .pnl.dn{color:var(–danger);font-weight:600;}

.empty{text-align:center;color:var(–ink-500);padding:20px 10px;font-size:14px;}

/* FAB */
.fab{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#2f9d4a,#1a6b2f);color:#fff;font-size:32px;font-weight:300;border:none;box-shadow:var(–shadow-lg);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:50;-webkit-appearance:none;}
.fab:active{transform:scale(.92);}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(40,28,10,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:16px;overflow-y:auto;}
.modal-mask.show{display:flex;}
.modal-card{background:#fdfaf3;border-radius:var(–radius-lg);width:100%;max-width:520px;box-shadow:var(–shadow-lg);border:1px solid var(–cream-200);margin:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(–cream-200);background:var(–cream-100);border-radius:var(–radius-lg) var(–radius-lg) 0 0;}
.modal-head h3{font-size:17px;color:var(–ink-900);font-weight:700;}
.modal-close{background:var(–cream-200);border:none;color:var(–ink-700);padding:8px 16px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;-webkit-appearance:none;}
.modal-close:active{background:var(–cream-300);}
.modal-body{padding:18px;}

/* Form */
.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(–ink-700);margin-bottom:5px;font-weight:600;}
.field label .hint{color:var(–ink-500);font-weight:400;font-size:11px;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(–cream-300);border-radius:8px;font-size:15px;background:#fff;color:var(–ink-900);-webkit-appearance:none;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(–gold);}
.field textarea{min-height:60px;resize:vertical;}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.target-preview{background:var(–cream-100);border-radius:8px;padding:10px;font-size:12px;color:var(–ink-700);margin-top:6px;}
.target-preview b{color:var(–ink-900);}

.alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;}
.alert.warn{background:#fef3c7;color:#7c5400;border-left:4px solid var(–warn);}
.alert.danger{background:#fee2e2;color:#991b1b;border-left:4px solid var(–danger);}
.alert.info{background:var(–cream-100);color:var(–ink-700);border-left:4px solid var(–gold);}

.btn-primary{width:100%;background:linear-gradient(135deg,var(–gold),var(–gold-dk));color:#fff;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;box-shadow:var(–shadow-sm);-webkit-appearance:none;}
.btn-primary:active{transform:scale(.98);}
.btn-secondary{width:100%;background:var(–cream-200);color:var(–ink-700);border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;-webkit-appearance:none;}

.sell-batch-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;background:var(–cream-100);border-radius:8px;margin-bottom:8px;}
.sell-batch-row .info{font-size:13px;color:var(–ink-700);}
.sell-batch-row .info b{color:var(–ink-900);font-size:14px;}
.sell-batch-row.done{opacity:.5;}
.sell-batch-row .btn-mini{padding:8px 14px;}

.detail-block{background:var(–cream-100);border-radius:8px;padding:12px;margin-bottom:10px;font-size:13px;}
.detail-block .row{display:flex;justify-content:space-between;padding:3px 0;}
.detail-block .row b{color:var(–ink-900);}

@media(max-width:480px){
.page-title{font-size:19px;}
.summary-cell .num{font-size:17px;}
.pool-tab{font-size:15px;padding:14px 8px;}
}
</style>

</head>
<body>

<h1 class="page-title">📔 操作日記 v5</h1>

<div class="cp-card">
  <h3>🔍 啟動檢查點</h3>
  <div id="cpLog"></div>
</div>

<div class="pool-tabs">
  <button class="pool-tab old" id="tabOld" onclick="switchPool('old')">🟦 舊持倉</button>
  <button class="pool-tab new" id="tabNew" onclick="switchPool('new')">🧪 實驗池</button>
</div>

<div class="pool-header new" id="poolHeader"></div>

<div class="summary-card">
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<div class="section">
  <h3>📦 持倉 <span class="count" id="holdingsCount"></span></h3>
  <div id="holdingsList"></div>
</div>

<div class="section">
  <h3>📋 已出場 <span class="count" id="closedCount"></span></h3>
  <div id="closedList"></div>
</div>

<button class="fab" onclick="openModal('add')">+</button>

<!-- Modal 容器 -->

<div class="modal-mask" id="modalMask">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">標題</h3>
      <button class="modal-close" onclick="closeModal()">關閉</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const cpLog = document.getElementById('cpLog');
function cp(msg, ok=null){
  const icon = ok===true?'✅':ok===false?'❌':'⏳';
  cpLog.textContent += `${icon} ${msg}\n`;
  cpLog.scrollTop = cpLog.scrollHeight;
}

try {
  cp('CP1: script 開始', true);

  /* ===== state ===== */
  cp('CP2: state...');
  let state = {
    currentPool: 'new',
    pools: {
      old: {name:'舊持倉',startDate:'2025-01-01',endDate:'2099-12-31',startCash:0,cash:0,realized:0,holdings:[],closed:[]},
      new: {name:'實驗池',startDate:'2026-04-25',endDate:'2026-07-25',startCash:50000,cash:50000,realized:0,holdings:[],closed:[]}
    }
  };
  let currentEditId = null; // 加碼/賣出/編輯時的目標 holding id
  cp('CP2: state OK', true);

  /* ===== utils ===== */
  cp('CP3: 工具...');
  const $ = id => document.getElementById(id);
  const fmt = n => '$' + Math.round(n).toLocaleString();
  const fmt2 = n => '$' + (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const pct = n => (n>=0?'+':'') + (Math.round(n*100)/100) + '%';
  function daysLeft(endDate){
    const t=(new Date(endDate)-new Date())/86400000;
    return Math.max(0,Math.ceil(t));
  }
  function uid(){ return 'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  cp('CP3: 工具 OK', true);

  /* ===== loadData / saveData ===== */
  cp('CP4: loadData...');
  function loadData(){
    try{
      const raw = localStorage.getItem('diary_v5_state');
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && parsed.pools) state = parsed;
      }
    }catch(e){console.warn('loadData',e);}
  }
  function saveData(){
    try{ localStorage.setItem('diary_v5_state', JSON.stringify(state)); }catch(e){}
  }
  cp('CP4: loadData OK', true);

  /* ===== 智慧目標價 ===== */
  // 有主力成本 → 1.3x/1.5x/1.8x；沒有 → 用 % (進場+20/+30/+50)
  function calcTargets(entry, mainCost){
    if(mainCost && mainCost>0){
      return {
        t1: mainCost*1.3, t2: mainCost*1.5, t3: mainCost*1.8,
        mode: '主力成本'
      };
    }
    return {
      t1: entry*1.20, t2: entry*1.30, t3: entry*1.50,
      mode: '進場 %'
    };
  }
  function calcRR(entry, stop, t2){
    // R/R = (t2-entry) / (entry-stop)
    const risk = entry - stop;
    const reward = t2 - entry;
    if(risk<=0) return null;
    return reward/risk;
  }

  /* ===== render ===== */
  cp('CP5: render...');
  function renderHeader(){
    const p = state.pools[state.currentPool];
    const h = $('poolHeader');
    h.classList.remove('old','new');
    h.classList.add(state.currentPool);
    const icon = state.currentPool==='new'?'🧪':'🟦';
    h.textContent = `${icon} ${p.name} 期間：${p.startDate} ~ ${p.endDate}（剩 ${daysLeft(p.endDate)} 天）`;
  }
  function renderSummary(){
    const p = state.pools[state.currentPool];
    const held = p.holdings.length;
    const closed = p.closed.length;
    const wins = p.closed.filter(c=>(c.pnl||0)>0).length;
    const winRate = closed?Math.round(wins/closed*100):0;
    const winColor = winRate>=50?'green':winRate>0?'red':'';
    $('summaryGrid').innerHTML = `
      <div class="summary-cell"><div class="num">${fmt(p.startCash)}</div><div class="lbl">起始</div></div>
      <div class="summary-cell cash"><div class="num">${fmt(p.cash)}</div><div class="lbl">現金</div></div>
      <div class="summary-cell realized"><div class="num">${fmt(p.realized)}</div><div class="lbl">已實現</div></div>
      <div class="summary-cell"><div class="num">${held}</div><div class="lbl">持有</div></div>
      <div class="summary-cell"><div class="num">${closed}</div><div class="lbl">已出</div></div>
      <div class="summary-cell win"><div class="num ${winColor}">${winRate}%</div><div class="lbl">勝率</div></div>
    `;
  }
  function renderHoldings(){
    const p = state.pools[state.currentPool];
    $('holdingsCount').textContent = `(${p.holdings.length})`;
    const list = $('holdingsList');
    if(!p.holdings.length){
      list.innerHTML = '<div class="empty">目前無持倉，按右下 + 新增交易</div>';
      return;
    }
    list.innerHTML = p.holdings.map(h=>{
      const cur = h.lastPrice || h.entryPrice;
      const pnlPct = ((cur - h.entryPrice)/h.entryPrice)*100;
      const upDn = pnlPct>=0?'up':'dn';
      const remainShares = h.shares - (h.soldShares||0);
      const cost = h.entryPrice * remainShares;
      const value = cur * remainShares;
      const pnlAmt = value - cost;
      const tgs = h.targets || {};
      const poolCls = state.currentPool==='old'?'old-pool':'';
      return `
        <div class="holding ${poolCls}">
          <div class="holding-row1">
            <div class="holding-tk">${h.ticker}</div>
            <div class="holding-pnl ${upDn}">${pct(pnlPct)} (${fmt(pnlAmt)})</div>
          </div>
          <div class="holding-row2">
            <span><b>${remainShares}</b>股 @ ${fmt2(h.entryPrice)}</span>
            <span>停損 <b>${fmt2(h.stopLoss)}</b></span>
            <span>T1/T2/T3 ${fmt2(tgs.t1||0)}/${fmt2(tgs.t2||0)}/${fmt2(tgs.t3||0)}</span>
            <span>進場日 ${h.entryDate}</span>
          </div>
          <div class="holding-actions">
            <button class="btn-mini add" onclick="openModal('addMore','${h.id}')">加碼</button>
            <button class="btn-mini sell" onclick="openModal('sell','${h.id}')">賣出</button>
            <button class="btn-mini edit" onclick="openModal('edit','${h.id}')">編輯</button>
            <button class="btn-mini" onclick="openModal('detail','${h.id}')">明細</button>
          </div>
        </div>
      `;
    }).join('');
  }
  function renderClosed(){
    const p = state.pools[state.currentPool];
    $('closedCount').textContent = `(${p.closed.length})`;
    const list = $('closedList');
    if(!p.closed.length){
      list.innerHTML = '<div class="empty">尚無已出場紀錄</div>';
      return;
    }
    list.innerHTML = p.closed.slice().reverse().map(c=>{
      const upDn = (c.pnl||0)>=0?'up':'dn';
      return `
        <div class="closed-row">
          <span class="tk">${c.ticker}</span>
          <span>${c.shares}股 @ ${fmt2(c.exitPrice)}</span>
          <span class="pnl ${upDn}">${fmt(c.pnl)} (${pct(c.pnlPct||0)})</span>
        </div>
      `;
    }).join('');
  }
  function render(){ renderHeader(); renderSummary(); renderHoldings(); renderClosed(); }
  cp('CP5: render OK', true);

  /* ===== switchPool ===== */
  cp('CP6: switchPool/Modal...');
  window.switchPool = function(pool){
    state.currentPool = pool;
    $('tabOld').classList.toggle('active', pool==='old');
    $('tabNew').classList.toggle('active', pool==='new');
    render();
    saveData();
  };

  /* ===== Modal 路由 ===== */
  window.openModal = function(type, id){
    currentEditId = id || null;
    const body = $('modalBody');
    const title = $('modalTitle');
    if(type==='add'){ title.textContent='📝 新增交易'; body.innerHTML = formAdd(); bindAddPreview(); }
    else if(type==='addMore'){ title.textContent='➕ 加碼'; body.innerHTML = formAddMore(id); }
    else if(type==='sell'){ title.textContent='💰 賣出（分批）'; body.innerHTML = formSell(id); }
    else if(type==='edit'){ title.textContent='✏️ 編輯持倉'; body.innerHTML = formEdit(id); }
    else if(type==='detail'){ title.textContent='📊 持倉明細'; body.innerHTML = formDetail(id); }
    $('modalMask').classList.add('show');
  };
  window.closeModal = function(){ $('modalMask').classList.remove('show'); currentEditId=null; };
  cp('CP6: switchPool/Modal OK', true);

  /* ===== Modal 1：新增交易 ===== */
  function formAdd(){
    return `
      <div class="alert info">📌 池：<b>${state.pools[state.currentPool].name}</b>　現金：<b>${fmt(state.pools[state.currentPool].cash)}</b></div>
      <div class="field"><label>股票代號</label><input id="f_ticker" type="text" placeholder="例如：PL" autocapitalize="characters"></div>
      <div class="field-row">
        <div class="field"><label>進場價</label><input id="f_entry" type="number" step="0.01" placeholder="0.00"></div>
        <div class="field"><label>股數</label><input id="f_shares" type="number" step="1" placeholder="0"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>停損價 <span class="hint">(預設-8%)</span></label><input id="f_stop" type="number" step="0.01" placeholder="自動算"></div>
        <div class="field"><label>主力成本 <span class="hint">(可空)</span></label><input id="f_main" type="number" step="0.01" placeholder="可空"></div>
      </div>
      <div class="field"><label>進場日</label><input id="f_date" type="date" value="${todayISO()}"></div>
      <div class="field"><label>備註</label><textarea id="f_note" placeholder="進場理由、訊號、預期..."></textarea></div>

```
  <div class="target-preview" id="targetPreview">填入價格後自動算目標 / R:R</div>
  <div id="addAlerts"></div>
  <button class="btn-primary" onclick="submitAdd()">確認新增</button>
`;
```

}
function bindAddPreview(){
[‘f_ticker’,‘f_entry’,‘f_shares’,‘f_stop’,‘f_main’].forEach(k=>{
const el = $(k);
if(el) el.addEventListener(‘input’, updateAddPreview);
});
}
function updateAddPreview(){
const entry = parseFloat($(‘f_entry’).value)||0;
const shares = parseFloat($(‘f_shares’).value)||0;
const main = parseFloat($(‘f_main’).value)||0;
let stop = parseFloat($(‘f_stop’).value);
if(!stop && entry){ stop = entry*0.92; $(‘f_stop’).placeholder = stop.toFixed(2); }
const t = calcTargets(entry, main);
const rr = calcRR(entry, stop || entry*0.92, t.t2);
const cost = entry * shares;
let html = ‘’;
if(entry){
html += `<div>目標 (${t.mode}): <b>T1 ${fmt2(t.t1)}</b> / <b>T2 ${fmt2(t.t2)}</b> / <b>T3 ${fmt2(t.t3)}</b></div>`;
}
if(rr){ html += `<div>R:R = <b>1:${rr.toFixed(2)}</b>${rr<3?' ⚠️ 低於 1:3':''}</div>`; }

window.submitAdd = function(){

const shares = parseFloat($(‘f_shares’).value);
let stop = parseFloat($(‘f_stop’).value);
const main = parseFloat($(‘f_main’).value)||0;
const date = $(‘f_date’).value || todayISO();
const note = ($(‘f_note’).value||’’).trim();
if(!ticker){ alert(‘請輸入股票代號’); return; }
if(!entry || entry<=0){ alert(‘請輸入進場價’); return; }
if(!shares || shares<=0){ alert(‘請輸入股數’); return; }
if(!stop) stop = entry*0.92;
const cost = entry*shares;

if(cost>p.cash){ alert(`現金不足，需 ${fmt(cost)}，剩 ${fmt(p.cash)}`); return; }
const tgs = calcTargets(entry, main);
const h = {
id: uid(),
ticker, entryPrice:entry, shares,
stopLoss:stop, mainCost:main||null,
targets:{t1:tgs.t1, t2:tgs.t2, t3:tgs.t3, mode:tgs.mode},

lastPrice:entry,
soldShares:0, batches:[], // 已出場批次

window.submitAddMore = function(id){
const p = state.pools[state.currentPool];
const h = p.holdings.find(x=>x.id===id);
if(!h){ alert(‘找不到持倉’); return; }
const price = parseFloat($(‘a_price’).value);
const shares = parseFloat($(‘a_shares’).value);
const note = ($(‘a_note’).value||’’).trim();
if(!price||price<=0){ alert(‘請輸入加碼價’); return; }
if(!shares||shares<=0){ alert(‘請輸入加碼股數’); return; }
const cost = price*shares;
if(cost>p.cash){ alert(`現金不足，需 ${fmt(cost)}，剩 ${fmt(p.cash)}`); return; }
// 重算平均成本
const remain = h.shares - (h.soldShares||0);
const totalCost = h.entryPrice*remain + cost;
const totalShares = remain + shares;
const newAvg = totalCost / totalShares;
h.entryPrice = newAvg;
h.shares = totalShares + (h.soldShares||0); // 累積股數含已賣出
h.addOns = h.addOns || [];
h.addOns.push({price, shares, date:todayISO(), note});
h.lastPrice = price;
p.cash -= cost;
saveData(); render(); closeModal();
};

/* ===== Modal 3：賣出（分批 T1/T2/T3） ===== */
function formSell(id){
const p = state.pools[state.currentPool];
const h = p.holdings.find(x=>x.id===id);
if(!h) return ‘<div class="empty">找不到持倉</div>’;
const remain = h.shares - (h.soldShares||0);
const tgs = h.targets || {};
const batches = h.batches || [];
const has = name => batches.some(b=>b.name===name);
// 各批建議股數：T1 20% / T2 30% / T3 50%（以原始股數計）
const baseShares = h.shares;
const t1Sh = Math.floor(baseShares*0.20);
const t2Sh = Math.floor(baseShares*0.30);
const t3Sh = baseShares - t1Sh - t2Sh; // 剩餘給 T3 確保整數
const rows = [
{name:‘T1’, price:tgs.t1, sh:t1Sh},
{name:‘T2’, price:tgs.t2, sh:t2Sh},
{name:‘T3’, price:tgs.t3, sh:t3Sh}
].map(r=>{
const done = has(r.name);
return `<div class="sell-batch-row ${done?'done':''}"> <div class="info"><b>${r.name}</b> 目標 ${fmt2(r.price||0)} × ${r.sh} 股</div> <button class="btn-mini sell" ${done?'disabled':''} onclick="sellBatch('${id}','${r.name}',${r.price||0},${r.sh})">${done?'已賣':'賣出'}</button> </div>`;
}).join(’’);
return `<div class="alert info">📌 <b>${h.ticker}</b>　剩 ${remain}股 @ 平均 ${fmt2(h.entryPrice)}</div> ${rows} <hr style="margin:14px 0;border:none;border-top:1px solid var(--cream-200)"> <div class="field"><label>自訂賣出 <span class="hint">(用實際成交價)</span></label></div> <div class="field-row"> <div class="field"><label>賣出價</label><input id="s_price" type="number" step="0.01"></div> <div class="field"><label>股數</label><input id="s_shares" type="number" step="1" placeholder="${remain}"></div> </div> <div class="field"><label>備註</label><textarea id="s_note" placeholder="出場理由..."></textarea></div> <button class="btn-primary" onclick="submitCustomSell('${id}')">確認賣出</button>`;
}
window.sellBatch = function(id, name, price, shares){
if(!price){ alert(`${name} 目標價未設定`); return; }
doSell(id, price, shares, name, ‘’);
};
window.submitCustomSell = function(id){
const p = state.pools[state.currentPool];
const h = p.holdings.find(x=>x.id===id);
if(!h){ alert(‘找不到持倉’); return; }
const price = parseFloat($(‘s_price’).value);
const remain = h.shares - (h.soldShares||0);
let shares = parseFloat($(‘s_shares’).value) || remain;
const note = ($(‘s_note’).value||’’).trim();
if(!price||price<=0){ alert(‘請輸入賣出價’); return; }
if(shares>remain){ alert(`股數超過剩餘 (${remain})`); return; }
doSell(id, price, shares, ‘自訂’, note);
};
function doSell(id, price, shares, batchName, note){
const p = state.pools[state.currentPool];
const h = p.holdings.find(x=>x.id===id);
if(!h) return;
const remain = h.shares - (h.soldShares||0);
if(shares > remain) shares = remain;
const proceeds = price*shares;
const costBasis = h.entryPrice*shares;
const pnl = proceeds - costBasis;
const pnlPct = (price - h.entryPrice)/h.entryPrice*100;
h.soldShares = (h.soldShares||0) + shares;
h.batches = h.batches || [];
h.batches.push({name:batchName, price, shares, pnl, date:todayISO(), note});
p.cash += proceeds;
p.realized += pnl;
h.lastPrice = price;
// 全部賣完 → 移到 closed
if(h.soldShares >= h.shares){
// 計算總 PnL
const totalPnl = (h.batches||[]).reduce((s,b)=>s+(b.pnl||0),0);
const avgExit = (h.batches||[]).reduce((s,b)=>s+b.price*b.shares,0) / (h.batches||[]).reduce((s,b)=>s+b.shares,0);
p.closed.push({
ticker:h.ticker, shares:h.shares, entryPrice:h.entryPrice, exitPrice:avgExit,
pnl:totalPnl, pnlPct:(avgExit-h.entryPrice)/h.entryPrice*100,
entryDate:h.entryDate, exitDate:todayISO(), batches:h.batches, note:h.note
});
p.holdings = p.holdings.filter(x=>x.id!==id);
}
saveData(); render(); closeModal();
}
