
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個股深度分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0f2f5;font-family:'Helvetica Neue',sans-serif;padding:16px;color:#1a1a2e;}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.hdr h2{font-size:16px;font-weight:700;letter-spacing:2px;color:#8a6e2f;}
.dot{width:8px;height:8px;border-radius:50%;background:#c8a84b;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* Tabs */
.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab{flex:1;padding:11px;border-radius:10px;border:1px solid #ddd;background:#fff;color:#aaa;font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.tab.active{background:#c8a84b;color:#fff;border-color:#c8a84b;box-shadow:0 2px 8px rgba(200,168,75,.3);}

/* Input */
.srow{display:flex;gap:8px;margin-bottom:16px;align-items:center;}
input.sym{background:#fff;border:1px solid #ddd;border-radius:10px;padding:11px 14px;font-size:16px;color:#1a1a2e;width:120px;text-transform:uppercase;outline:none;box-shadow:0 1px 4px rgba(0,0,0,.05);}
input.sym:focus{border-color:#c8a84b;}
input.num{background:#fff;border:1px solid #ddd;border-radius:8px;padding:7px 10px;font-size:13px;color:#1a1a2e;width:65px;text-align:center;outline:none;}
.btn{background:#c8a84b;color:#fff;border:none;border-radius:10px;padding:11px 24px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(200,168,75,.3);}
.btn-sm{background:#f0f0f5;color:#666;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;}

/* Card */
.card{background:#fff;border:1px solid #e8e8ec;border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);}
.ch{padding:14px 16px 12px;border-bottom:1px solid #f0f0f5;}
.tk{font-size:22px;font-weight:700;color:#1a1a2e;font-family:monospace;}
.px{font-size:15px;color:#aaa;margin-left:8px;}

/* 板塊按鈕 */
.sbts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.sbt{background:#fff;border:1px solid #e0e0e8;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;color:#888;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.sbt.active{background:#c8a84b;border-color:#c8a84b;color:#fff;box-shadow:0 2px 6px rgba(200,168,75,.25);}

/* 個股列表 */
.stock-list{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;}
.stock-chip{background:#f8f8fb;border:1px solid #e8e8ec;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;font-family:monospace;color:#333;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.stock-chip:active{background:#c8a84b;color:#fff;border-color:#c8a84b;}

/* 吸籌核心區塊 */
.accum-hero{padding:16px;background:#fffdf8;border-bottom:1px solid #f5e8c0;}
.accum-score-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.accum-emoji{font-size:24px;letter-spacing:3px;}
.accum-num{font-size:15px;color:#aaa;font-family:monospace;font-weight:700;}
.accum-pb{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin-bottom:6px;}
.accum-pf{height:100%;border-radius:3px;transition:width 1.2s;}
.accum-label{font-size:12px;color:#888;font-weight:600;}

/* 核心三行 */
.core-block{padding:14px 16px;background:#fafafa;border-bottom:1px solid #f0f0f5;}
.core-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f5f5f5;}
.core-row:last-child{border:none;}
.core-q{font-size:13px;color:#888;font-weight:600;}
.core-a{font-size:14px;font-weight:700;font-family:monospace;text-align:right;}
.ca-blue{color:#3a7bd5;}
.ca-green{color:#2ea86e;}
.ca-yellow{color:#c8952a;}
.ca-gray{color:#999;}

/* 技術標籤列 */
.tech-row{padding:10px 16px;background:#f8f8fb;border-bottom:1px solid #f0f0f5;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tech-lbl{font-size:11px;color:#ccc;font-weight:600;margin-right:2px;}
.tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;}
.tg{background:#edfaf3;color:#2ea86e;border:1px solid #c5eedd;}
.tr{background:#fef0f0;color:#d94f4f;border:1px solid #f5cccc;}
.ty{background:#fffbec;color:#c8952a;border:1px solid #f0dfa0;}
.tn{background:#f5f5f5;color:#aaa;border:1px solid #e8e8e8;}

/* 籌碼摘要行 */
.chip-summary-row{padding:10px 16px;background:#f5f8ff;border-bottom:1px solid #eef0f8;display:flex;justify-content:space-between;align-items:center;}
.chip-sum-lbl{font-size:11px;color:#bbb;font-weight:600;}
.chip-sum-val{font-size:12px;font-weight:700;}

/* 折疊區 */
.fold-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;border-top:1px solid #f0f0f5;background:#fafafa;-webkit-tap-highlight-color:transparent;}
.fold-title{font-size:11px;letter-spacing:1px;color:#aaa;font-weight:700;}
.fold-arrow{font-size:11px;color:#ccc;transition:transform .3s;}
.fold-arrow.open{transform:rotate(180deg);}
.fold-body{display:none;padding:14px 16px;border-top:1px solid #f5f5f5;background:#fff;}
.fold-body.open{display:block;}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid #fafafa;}
.rw:last-child{border:none;}
.lb{color:#aaa;font-weight:500;}
.vl{font-family:monospace;font-weight:700;color:#222;}
.bg{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;}
.gu{background:#edfaf3;color:#2ea86e;}
.gd{background:#fef0f0;color:#d94f4f;}
.gw{background:#fffbec;color:#c8952a;}
.gn{background:#f5f5f5;color:#aaa;}
.note{font-size:12px;color:#888;margin-top:6px;line-height:1.7;}

/* 籌碼條 */
.cb{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:10px 0;}
.ci2{background:#4a9eff;}.cn2{background:#c8a84b;}.cr2{background:#dc5050;}
.cl{display:flex;gap:16px;font-size:11px;color:#888;margin-bottom:6px;}
.cl span{display:flex;align-items:center;gap:4px;}
.cd{width:7px;height:7px;border-radius:50%;}

/* 內部人 */
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;}
.ib{background:#f8f8fb;border-radius:10px;padding:12px;text-align:center;border:1px solid #f0f0f5;}
.inn{font-size:26px;font-weight:700;font-family:monospace;}
.ib-b .inn{color:#2ea86e;}.ib-s .inn{color:#d94f4f;}
.is{font-size:11px;color:#bbb;margin-top:3px;}

/* ★ 結論區塊 */
.verdict-block{margin:0;border-top:2px solid #f5e6c0;background:linear-gradient(135deg,#fffdf5,#fffaf0);}
.verdict-inner{padding:18px 16px;}
.verdict-main{font-size:20px;font-weight:900;margin-bottom:8px;line-height:1.3;}
.vm-buy{color:#2ea86e;}.vm-watch{color:#c8952a;}.vm-wait{color:#d94f4f;}
.verdict-score{font-size:13px;color:#bbb;margin-bottom:10px;font-weight:600;}
.verdict-text{font-size:13px;color:#555;line-height:1.9;}
.verdict-text em{color:#1a1a2e;font-style:normal;font-weight:700;}
.verdict-warn{margin-top:10px;background:#fff5f5;border-left:3px solid #d94f4f;padding:10px 12px;border-radius:0 8px 8px 0;}
.verdict-warn-lbl{font-size:10px;color:#d94f4f;font-weight:700;letter-spacing:1px;margin-bottom:3px;}
.verdict-warn-txt{font-size:12px;color:#d94f4f;font-weight:600;line-height:1.6;}
.verdict-cond{margin-top:10px;background:#fff;border-left:3px solid #c8a84b;padding:10px 12px;border-radius:0 8px 8px 0;box-shadow:0 1px 4px rgba(200,168,75,.1);}
.verdict-cond-lbl{font-size:10px;color:#c8952a;font-weight:700;letter-spacing:1px;margin-bottom:3px;}
.verdict-cond-txt{font-size:13px;color:#444;font-weight:600;line-height:1.6;}

/* 板塊籌碼 */
.stk-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:13px;}
.stk-row:last-child{border:none;}
.stk-nm{font-family:monospace;font-weight:700;color:#1a1a2e;width:55px;}
.stk-bar{flex:1;margin:0 10px;}
.bar-wrap{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:1px;}
.bar-i{background:#4a9eff;}.bar-r{background:#dc5050;}
.stk-tag{font-size:11px;width:95px;text-align:right;font-weight:700;}

.spin{display:inline-block;width:16px;height:16px;border:2px solid #eee;border-top-color:#c8a84b;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{color:#aaa;font-size:14px;padding:30px;text-align:center;}
.err{color:#d94f4f;font-size:13px;padding:20px;text-align:center;background:#fff5f5;border-radius:10px;}
.hist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.hi{background:#f5f5f8;border-radius:5px;padding:4px 9px;font-size:11px;font-family:monospace;color:#888;}
.hi span{color:#333;font-weight:600;}
</style>

</head>
<body>
<div class="hdr"><div class="dot"></div><h2>個股深度分析</h2></div>
<div class="tabs">
  <div class="tab active" id="tab1">📈 技術與籌碼</div>
  <div class="tab" id="tab2">📊 板塊籌碼</div>
</div>

<!-- 技術與籌碼頁 -->

<div id="accumPage" style="display:block;">
  <!-- 板塊選擇 -->
  <div class="sbts" id="accumSectorBtns"></div>
  <!-- 個股快選 -->
  <div id="accumStockList"></div>
  <!-- 輸入框 -->
  <div class="srow">
    <input class="sym" id="sym" value="" placeholder="輸入代號">
    <button class="btn" onclick="runAccum()">分析</button>
  </div>
  <div id="accumOut"></div>
</div>

<!-- 板塊籌碼頁 -->

<div id="chipPage" style="display:none;">
  <div class="sbts" id="sectorBtns"></div>
  <div id="sectorOut"></div>
  <div class="card" style="margin-top:12px;">
    <div class="ch"><span style="font-size:13px;font-weight:700;color:#8a6e2f;">🔍 個股籌碼查詢</span></div>
    <div style="padding:12px 16px;">
      <div class="srow" style="margin-bottom:0;">
        <input class="sym" id="chipSym" value="LUNR" placeholder="代號">
        <button class="btn" onclick="showChipDetail()">查詢</button>
      </div>
    </div>
    <div id="chipDetailOut"></div>
  </div>
</div>

<script>
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';
var chipCache={};
var accumCurrentSector='太空衛星';
var chipCurrentSector='AI巨頭';

// ── iOS Safari修復 ──
document.getElementById('tab1').addEventListener('click',function(){ switchTab('accum'); });
document.getElementById('tab2').addEventListener('click',function(){ switchTab('chip'); });

function switchTab(t){
  document.getElementById('tab1').classList.toggle('active',t==='accum');
  document.getElementById('tab2').classList.toggle('active',t==='chip');
  document.getElementById('accumPage').style.display=t==='accum'?'block':'none';
  document.getElementById('chipPage').style.display=t==='chip'?'block':'none';
  if(t==='chip') initChipPage();
}

const SECTORS={
  'AI巨頭':     [{sym:'NVDA'},{sym:'META'},{sym:'GOOGL'},{sym:'MSFT'},{sym:'AMZN'}],
  'AI基礎設施': [{sym:'ANET'},{sym:'SMCI'},{sym:'DELL'},{sym:'CRWD'},{sym:'SNOW'}],
  '光通訊':     [{sym:'COHR'},{sym:'LITE'},{sym:'AAOI'},{sym:'IIVI'},{sym:'VECO'}],
  'AI電力散熱': [{sym:'VST'},{sym:'CEG'},{sym:'ETN'},{sym:'GNRC'},{sym:'VRT'}],
  '太空衛星':   [{sym:'LUNR'},{sym:'RKLB'},{sym:'PL'},{sym:'BKSY'},{sym:'ASTS'}],
  '無人機國防': [{sym:'ONDS'},{sym:'KTOS'},{sym:'PLTR'},{sym:'ACHR'},{sym:'RCAT'}],
  '量子運算':   [{sym:'IONQ'},{sym:'RGTI'},{sym:'QBTS'},{sym:'QUBT'}],
  '儲存硬體':   [{sym:'WDC'},{sym:'NTAP'},{sym:'PURE'},{sym:'STX'},{sym:'PSTG'}],
  '生技健康':   [{sym:'TEM'},{sym:'HIMS'},{sym:'RXRX'},{sym:'NVAX'},{sym:'CRSP'}],
  '衛星通信':   [{sym:'IRDM'},{sym:'ASTS'},{sym:'GSAT'},{sym:'VSAT'}],
  '貴金屬礦業': [{sym:'GLD'},{sym:'SLV'},{sym:'NEM'},{sym:'AEM'},{sym:'WPM'}],
  '自訂':       []
};

// ── 左Tab板塊初始化 ──
function initAccumSectors(){
  const btns=document.getElementById('accumSectorBtns');
  btns.innerHTML='';
  Object.keys(SECTORS).forEach(s=>{
    const b=document.createElement('div');
    b.className='sbt'+(s===accumCurrentSector?' active':'');
    b.textContent=s;
    b.addEventListener('click',function(){
      accumCurrentSector=s;
      document.querySelectorAll('#accumSectorBtns .sbt').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      showAccumStocks(s);
    });
    btns.appendChild(b);
  });
  showAccumStocks(accumCurrentSector);
}

function showAccumStocks(s){
  const el=document.getElementById('accumStockList');
  const stocks=SECTORS[s]||[];
  if(!stocks.length){
    el.innerHTML='';
    return;
  }
  let h='<div class="card" style="margin-bottom:14px;"><div style="padding:10px 14px 4px;"><div style="font-size:11px;color:#bbb;font-weight:700;letter-spacing:1px;margin-bottom:6px;">'+s+' — 點選個股快速分析</div><div class="stock-list">';
  stocks.forEach(st=>{
    h+='<div class="stock-chip" onclick="selectStock(\''+st.sym+'\')">'+st.sym+'</div>';
  });
  h+='</div></div></div>';
  el.innerHTML=h;
}

function selectStock(sym){
  document.getElementById('sym').value=sym;
  runAccum();
  // 滑到結果
  setTimeout(()=>{
    const el=document.getElementById('accumOut');
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },200);
}

// ── 籌碼分析 ──
function chipAnalysis(capB,inst,retail){
  var grade;
  if(capB<20) grade='S';
  else if(capB<100) grade='M';
  else if(capB<500) grade='L';
  else if(capB<2000) grade='XL';
  else grade='XXL';
  const limits={S:[15,25],M:[20,35],L:[15,25],XL:[12,20],XXL:[10,15]};
  const [rWarn,rDanger]=limits[grade];
  const gradeLabel={S:'S級(<20B)',M:'M級(20-100B)',L:'L級(100-500B)',XL:'XL級(500-2000B)',XXL:'XXL級(>2000B)'};
  var status,score,text,emoji;
  if(inst>90){status='⚠️ 機構過度集中';score=1;emoji='🟡';text='機構'+inst+'%過高，飆漲空間有限';}
  else if(inst>=60){
    if(retail<=rWarn){status='✅ 籌碼甜蜜點';score=3;emoji='🟢';text='機構'+inst+'%，散戶僅'+retail+'%，主力控盤良好';}
    else if(retail<=rDanger){status='🟡 尚可觀察';score=2;emoji='🟡';text='機構'+inst+'%，散戶'+retail+'%略偏高';}
    else{status='🟠 散戶偏多';score=1;emoji='🟠';text='散戶'+retail+'%超標，拉抬難度增加';}
  } else if(inst>=40){status='🟡 機構偏低';score=1;emoji='🟡';text='機構'+inst+'%偏低，主力介入不足';}
  else{status='❌ 主力缺席';score=0;emoji='🔴';text='機構僅'+inst+'%，主力幾乎不在場';}
  return{grade:gradeLabel[grade],status,score,text,emoji,rWarn,rDanger};
}

function chipLoad(sym){return chipCache[sym]||[];}
function chipSave(sym,inst,ret,ins){
  var hist=chipLoad(sym);
  var today=new Date().toISOString().slice(0,10);
  var f=hist.filter(h=>h.d!==today);
  f.push({d:today,i:inst,r:ret,n:ins});
  if(f.length>8) f.splice(0,f.length-8);
  chipCache[sym]=f;
  try{localStorage.setItem('chip_'+sym,JSON.stringify(f));}catch(e){}
  return f;
}
function chipLoadWithStorage(sym){
  try{var s=localStorage.getItem('chip_'+sym);if(s){var d=JSON.parse(s);chipCache[sym]=d;return d;}}catch(e){}
  return chipCache[sym]||[];
}

// ── Yahoo Finance 抓籌碼數據 ──
async function fetchOwnership(sym){
  try{
    const url='https://corsproxy.io/?'+encodeURIComponent(
      'https://query2.finance.yahoo.com/v10/finance/quoteSummary/'+sym+
      '?modules=majorHoldersBreakdown');
    const r=await fetch(url);
    const d=await r.json();
    const mh=d?.quoteSummary?.result?.[0]?.majorHoldersBreakdown;
    if(!mh) return null;
    const inst=Math.round((mh.institutionsPercentHeld?.raw||0)*100);
    const ins=Math.round((mh.insidersPercentHeld?.raw||0)*100);
    const retail=Math.max(0,100-inst-ins);
    return{inst,ins,retail};
  }catch(e){return null;}
}

// ── API ──
async function fYahoo(s){
  const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(
    'https://query1.finance.yahoo.com/v8/finance/chart/'+s+'?interval=1d&range=1y'));
  const d=await r.json();
  if(!d.chart||!d.chart.result||!d.chart.result[0]) throw new Error('無法取得'+s+'的股價數據');
  return d.chart.result[0];
}
async function fHub(ep){
  try{
    const r=await fetch('https://finnhub.io/api/v1'+ep+'&token='+K);
    if(!r.ok) return{};
    return r.json();
  }catch(e){return{};}
}

function mkValid(y){
  const ts=y.timestamp,q=y.indicators.quote[0],v=[];
  for(let i=0;i<ts.length;i++)
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i])
      v.push({c:q.close[i],o:q.open[i],h:q.high[i],l:q.low[i],v:q.volume[i],t:ts[i]});
  return v;
}
function calcOBV(va){
  let o=0;const a=[0];
  for(let i=1;i<va.length;i++){
    if(va[i].c>va[i-1].c)o+=va[i].v;
    else if(va[i].c<va[i-1].c)o-=va[i].v;
    a.push(o);
  }
  return a;
}
function calcMACD(va){
  const cl=va.map(d=>d.c);
  function ema(a,k){const r=[a[0]],m=2/(k+1);for(let i=1;i<a.length;i++)r.push(a[i]*m+r[i-1]*(1-m));return r;}
  const e12=ema(cl,12),e26=ema(cl,26),ml=e12.map((v,i)=>v-e26[i]),sg=ema(ml,9),ht=ml.map((v,i)=>v-sg[i]);
  const m=va.length;
  return{aboveZero:ml[m-1]>0,histShrink:Math.abs(ht[m-1])<Math.abs(ht[m-2]),macdDown:ml[m-1]<ml[Math.max(0,m-4)]};
}
function findTR(va){
  const m=va.length,cur=va[m-1].c;
  let dt=null;
  for(let i=Math.max(10,m-180);i<m-20;i++){
    let top=true;
    for(let j=i-5;j<=i+5;j++){if(j===i||j<0||j>=m)continue;if(va[j].h>va[i].h){top=false;break;}}
    if(!top)continue;
    const tp=va[i].h,slc=va.slice(i+1,Math.min(i+60,m));
    if(!slc.length)continue;
    const mn=Math.min(...slc.map(x=>x.l)),dd=(tp-mn)/tp*100;
    if(dd>=20&&tp>va[Math.max(0,i-30)].c*1.25)
      if(!dt||tp>dt.p)dt={idx:i,p:tp,date:new Date(va[i].t*1000).toISOString().slice(0,10)};
  }
  const st=dt?dt.idx:Math.max(0,m-90);
  let botIdx=st;
  for(let i=st;i<m;i++)if(va[i].l<va[botIdx].l)botIdx=i;
  const botP=va[botIdx].l;
  let newStart=botIdx;
  for(let i=botIdx+1;i<m-5;i++){
    if(va[i].h>botP*1.20){
      let nb=i;
      for(let j=i+1;j<m;j++)if(va[j].l<va[nb].l)nb=j;
      if(va[nb].l>botP*1.05){newStart=i;break;}
    }
  }
  let sc=null;
  for(let i=newStart;i<m-3;i++){
    const d=va[i],sl=va.slice(Math.max(0,i-20),i);
    if(sl.length<5)continue;
    const maxV=Math.max(...sl.map(x=>x.v));
    const drop=(d.c-va[i-1].c)/va[i-1].c*100,lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(d.v>maxV*0.45&&drop<-0.3&&rng>0&&lw>rng*0.08)
      if(!sc||d.l<sc.l)sc={idx:i,l:d.l,date:new Date(d.t*1000).toISOString().slice(0,10)};
  }
  if(!sc||cur<sc.l*0.88){
    let mi=newStart;
    for(let i=newStart;i<m;i++)if(va[i].l<va[mi].l)mi=i;
    sc={idx:mi,l:va[mi].l,date:new Date(va[mi].t*1000).toISOString().slice(0,10)};
  }
  let arH=sc.l*1.02;
  for(let i=sc.idx+1;i<Math.min(sc.idx+10,m);i++)if(va[i].h>arH)arH=va[i].h;
  const trTop=arH*1.15;
  let trEnd=m-1,trEnded=false,bc=0;
  for(let i=sc.idx+11;i<m;i++){
    if(va[i].c>trTop){bc++;if(bc>=2){trEnd=i-1;trEnded=true;break;}}else bc=0;
  }
  return{sc,trTop,trEnd,trEnded};
}
function detectAccum(va){
  const m=va.length,tr=findTR(va),ob=calcOBV(va);
  const avg60=va.slice(-60).reduce((s,d)=>s+d.v,0)/Math.min(60,m);
  let n=0;
  for(let i=tr.sc.idx+1;i<=tr.trEnd;i++){
    const d=va[i];
    if(d.c>tr.trTop||d.c<tr.sc.l*0.93)continue;
    let s=0;
    if(i>=3&&d.c<va[i-3].c&&ob[i]>ob[i-3])s++;
    const bd=Math.abs(d.c-d.o),lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(rng>0&&lw>bd*0.8&&(d.c-d.l)/rng>0.4)s++;
    if(d.v/avg60>0.8&&Math.abs(d.c-d.o)/d.o*100<3)s++;
    if(i>=10){
      const p=va.slice(i-10,i),mx=Math.max(...p.map(x=>x.h)),mn2=Math.min(...p.map(x=>x.l));
      if(mn2>0&&(mx-mn2)/mn2*100<25&&ob[i]>ob[i-10])s++;
    }
    if(d.l<tr.sc.l*1.08&&d.c>tr.sc.l*0.97&&i>=1&&ob[i]>=ob[i-1])s++;
    if(s>=2)n++;
  }
  const cur=va[m-1].c,obvUp=ob[m-1]>ob[Math.max(0,m-20)];
  let dA=0,pA=0,bP=0;
  if(tr.trEnded){dA=m-1-tr.trEnd;bP=va[Math.min(tr.trEnd+1,m-1)].c;pA=Math.round((cur/bP-1)*100);}
  let sm=0;
  if(tr.trEnded&&n>=6)sm=6;
  else if(tr.trEnded&&n>=3)sm=5;
  else if(tr.trEnded)sm=3;
  else if(!tr.trEnded&&n>=5&&obvUp)sm=4;
  else if(!tr.trEnded&&n>=2)sm=2;
  const ma5=va.slice(-5).reduce((s,d)=>s+d.c,0)/5;
  const ma5p=va.slice(-6,-1).reduce((s,d)=>s+d.c,0)/5;
  const av5=va.slice(-5).reduce((s,d)=>s+d.v,0)/5;
  const av20=va.slice(-20).reduce((s,d)=>s+d.v,0)/20;
  return{tr,sm,n,cur:cur.toFixed(2),scP:tr.sc.l.toFixed(2),scD:tr.sc.date,
    trTop:tr.trTop.toFixed(2),trEnded:tr.trEnded,dA,pA,bP:bP.toFixed(2),
    ma5up:ma5>ma5p,volShrink:av5<av20*0.75,macd:calcMACD(va),obvUp};
}

      fYahoo(sym),
      fHub('/stock/insider-transactions?symbol='+sym),
      fHub('/stock/insider-sentiment?symbol='+sym+'&from=2024-01-01&to=2099-01-01'),
      fetchOwnership(sym)

    if(yRaw.status!=='fulfilled') throw new Error('無法取得股價數據');
    const va=mkValid(yRaw.value);

    const msprData=(msprRaw.status==='fulfilled'?msprRaw.value:{})||{};
    const sixAgo=Date.now()/1000-180*86400;
    const trades=((insData.data)||[]).filter(t=>{
      try{return new Date(t.transactionDate).getTime()/1000>sixAgo;}catch(e){return false;}
    });
    const buys=trades.filter(t=>t.change>0).length;
    const sells=trades.filter(t=>t.change<0).length;
    const sellAmt=trades.filter(t=>t.change<0).reduce((s,t)=>s+Math.abs((t.change||0)*(t.transactionPrice||+a.cur)),0);

    const msprVal=msprArr.length?msprArr[msprArr.length-1].monthlyMSPR:null;
    const mspr=(typeof msprVal==='number'&&isFinite(msprVal))?msprVal:null;

    let inst=null,retail=null,insider=0,chipSource='';

function toggleFold(bodyId,arrowId){
  const body=document.getElementById(bodyId);
  const arrow=document.getElementById(arrowId);
  if(!body||!arrow)return;
  const open=body.classList.toggle('open');
  arrow.classList.toggle('open',open);
}

function saveChip(sym){
  const i=parseFloat(document.getElementById('ci').value);

  const n=parseFloat(document.getElementById('cn').value)||0;
  if(isNaN(i)||isNaN(r)){alert('請輸入有效的機構%和散戶%');return;}
  chipSave(sym,i,r,n);
  runAccum();
}

    h+='<span class="stk-bar"><div class="bar-wrap">';
    h+='<div class="bar-i" style="width:'+(own.inst/tot*100).toFixed(1)+'%;"></div>';
    h+='<div class="bar-r" style="width:'+(own.retail/tot*100).toFixed(1)+'%;"></div>';
    h+='</div></span>';
    h+='<span class="stk-tag" style="color:'+(chip.emoji==='🟢'?'#2ea86e':chip.emoji==='🟡'||chip.emoji==='🟠'?'#c8952a':'#d94f4f')+';">'+chip.emoji+' 機'+own.inst+'% 散'+own.retail+'%</span>';
    h+='</div>';
  });
  h+='</div></div></div>';
  el.innerHTML=h;
}

function filterSector(type){
  document.querySelectorAll('.stk-row').forEach(r=>{
    const em=r.dataset.status;
    if(type==='all')r.style.display='';
    else if(type==='safe')r.style.display=em==='🟢'?'':'none';
    else if(type==='warn')r.style.display=(em==='🟡'||em==='🟠')?'':'none';
    else if(type==='danger')r.style.display=em==='🔴'?'':'none';
  });
}

function showChipDetail(){
  const sym=document.getElementById('chipSym').value.toUpperCase().trim();
  if(!sym)return;
  const el=document.getElementById('chipDetailOut');
  const hist=chipLoadWithStorage(sym);
  const last=hist.length?hist[hist.length-1]:null;
  let h='<div style="padding:12px 16px;">';
  if(last){
    const chip=chipAnalysis(50,last.i,last.r);
    h+='<div class="rw"><span class="lb">機構</span><span class="vl">'+last.i+'%</span></div>';
    h+='<div class="rw"><span class="lb">散戶</span><span class="vl">'+last.r+'%</span></div>';
    h+='<div class="rw"><span class="lb">內部人</span><span class="vl">'+(last.n||0)+'%</span></div>';
    h+='<div class="rw"><span class="lb">籌碼評估</span><span class="bg '+(chip.emoji==='🟢'?'gu':chip.emoji==='🔴'?'gd':'gw')+'">'+chip.status+'</span></div>';
    h+='<div class="note" style="margin-top:6px;">'+chip.text+'</div>';
    if(hist.length>1){
      h+='<div style="font-size:11px;color:#bbb;margin-top:10px;margin-bottom:6px;">歷史趨勢（散戶%）</div>';
      hist.forEach((c,i)=>{
        const prev=hist[i-1];
        const diff=prev&&c.r!=null&&prev.r!=null?c.r-prev.r:null;
        const arr=diff===null?'':diff<0?'↓ -'+Math.abs(diff).toFixed(1)+'%':diff>0?'↑ +'+diff.toFixed(1)+'%':'→';
        const col=diff===null?'#aaa':diff<0?'#2ea86e':diff>0?'#d94f4f':'#888';
        h+='<div style="display:flex;gap:8px;padding:3px 0;font-size:12px;">';
        h+='<span style="color:#bbb;width:75px;">'+c.d+'</span>';
        h+='<span style="font-family:monospace;color:#333;font-weight:600;">散戶 '+c.r+'%</span>';
        h+='<span style="color:'+col+';font-weight:700;">'+arr+'</span></div>';
      });
    }
  } else {
    h+='<div class="note">尚無 '+sym+' 的籌碼記錄</div>';
  }
  h+='<div style="margin-top:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">';
  h+='<span style="font-size:12px;color:#aaa;">機構%</span><input class="num" id="dci" placeholder="75">';
  h+='<span style="font-size:12px;color:#aaa;">散戶%</span><input class="num" id="dcr" placeholder="15">';
  h+='<span style="font-size:12px;color:#aaa;">內部人%</span><input class="num" id="dcn" placeholder="10">';
  h+='<button class="btn-sm" onclick="saveChipDirect(\''+sym+'\')">儲存</button></div>';
  h+='</div>';
  el.innerHTML=h;
}

function saveChipDirect(sym){
  const i=parseFloat(document.getElementById('dci').value);
  const r=parseFloat(document.getElementById('dcr').value);
  const n=parseFloat(document.getElementById('dcn').value)||0;
  if(isNaN(i)||isNaN(r)){alert('請輸入有效數據');return;}
  chipSave(sym,i,r,n);
  showChipDetail();
}

// 初始化
initAccumSectors();
</script>
