<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吸籌偵測測試</title>
<style>
body{background:#f5e8a0;font-family:sans-serif;padding:16px;margin:0;}
h2{color:#1a1a2e;margin-bottom:12px;}
input{width:80px;border:1.5px solid #d4b800;border-radius:8px;padding:8px;font-size:15px;text-transform:uppercase;}
button{background:#0066bb;color:white;border:none;border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer;margin-left:8px;}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.zone{border-left:4px solid #0066bb;padding:10px 12px;background:rgba(0,102,187,0.05);border-radius:0 8px 8px 0;margin-bottom:8px;}
.zone-title{font-weight:700;color:#0066bb;font-size:14px;margin-bottom:4px;}
.zone-detail{font-size:12px;color:#666;line-height:1.8;}
.chip-bar{height:12px;background:#eee;border-radius:6px;overflow:hidden;margin:6px 0;}
.chip-fill{height:100%;background:linear-gradient(90deg,#0066bb,#00aa55);border-radius:6px;transition:width 1s;}
.total{background:#1a1a2e;color:white;border-radius:10px;padding:12px;margin-top:8px;text-align:center;}
.total-num{font-size:28px;font-weight:900;color:#00ff88;}
.err{color:red;font-size:13px;padding:10px;}
.loading{text-align:center;padding:20px;color:#666;}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid #ddd;border-top:3px solid #0066bb;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<h2>🐋 吸籌偵測測試</h2>
<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
  <input id="sym" value="LUNR" placeholder="股票">
  <button onclick="analyze()">分析</button>
</div>
<div id="result"></div>

<script>
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';

async function fetchYahoo(t){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?interval=1d&range=1y';
  var url='https://corsproxy.io/?'+encodeURIComponent(base);
  var r=await fetch(url);
  var data=await r.json();
  return data.chart.result[0];
}

async function fetchFloat(t){
  var r=await fetch('https://finnhub.io/api/v1/stock/profile2?symbol='+t+'&token='+K);
  var p=await r.json();
  return p.shareOutstanding?p.shareOutstanding*1e6:0;
}

function detectAccumulation(result, floatShares){
  var timestamps=result.timestamp;
  var q=result.indicators.quote[0];
  var closes=q.close,volumes=q.volume,highs=q.high,lows=q.low,opens=q.open;
  var n=closes.length;

  var valid=[];
  for(var i=0;i<n;i++){
    if(closes[i]&&volumes[i]&&highs[i]&&lows[i]&&opens[i]){
      valid.push({c:closes[i],v:volumes[i],h:highs[i],l:lows[i],o:opens[i],t:timestamps[i]});
    }
  }
  if(valid.length<20) return null;
  var m=valid.length;

  var avgVol20=valid.slice(-60).reduce((s,d)=>s+d.v,0)/Math.min(60,m);

  // OBV
  var obv=0,obvArr=[0];
  for(var i=1;i<m;i++){
    if(valid[i].c>valid[i-1].c) obv+=valid[i].v;
    else if(valid[i].c<valid[i-1].c) obv-=valid[i].v;
    obvArr.push(obv);
  }

  var startIdx=Math.max(0,m-180);
  var accumEvents=[];

  for(var i=startIdx+20;i<m;i++){
    var d=valid[i];
    var score=0;
    var reasons=[];

    // 條件1：OBV背離
    var priceDown=d.c<valid[i-5].c;
    var obvUp5=obvArr[i]>obvArr[i-5];
    if(priceDown&&obvUp5){score++;reasons.push('OBV背離');}

    // 條件2：長下影線
    var body=Math.abs(d.c-d.o);
    var lowerWick=Math.min(d.c,d.o)-d.l;
    var range=d.h-d.l;
    var closePos=range>0?(d.c-d.l)/range:0.5;
    if(lowerWick>body*1.5&&closePos>0.5&&range>0){score++;reasons.push('長下影線');}

    // 條件3：量大價穩
    var volRatio=d.v/avgVol20;
    var pctChange=(d.c-d.o)/d.o*100;
    if(volRatio>1.5&&pctChange>-2&&d.c<=valid[i-1].c*1.02){score++;reasons.push('量大價穩');}

    // 條件4：賣盤竭盡（大量+長下影+收跌）
    var maxVol=Math.max(...valid.slice(Math.max(0,i-120),i).map(x=>x.v));
    if(d.v>maxVol*0.75&&lowerWick>body&&d.c<valid[i-1].c){score++;reasons.push('賣盡反彈');}

    // 條件5：盤整OBV上升
    var recent20=valid.slice(i-20,i);
    var maxP20=Math.max(...recent20.map(x=>x.h));
    var minP20=Math.min(...recent20.map(x=>x.l));
    var range20=minP20>0?(maxP20-minP20)/minP20*100:100;
    if(range20<20&&obvArr[i]>obvArr[i-20]){score++;reasons.push('盤整OBV↑');}

    if(score>=2){
      accumEvents.push({
        date:new Date(d.t*1000).toISOString().slice(0,10),
        price:Math.round(d.c*100)/100,
        low:Math.round(d.l*100)/100,
        high:Math.round(d.h*100)/100,
        score,reasons:reasons.join('+'),
        volRatio:volRatio.toFixed(1)
      });
    }
  }

  // 聚合成區間
  var zones=[];
  var processed=new Set();
  for(var i=0;i<accumEvents.length;i++){
    if(processed.has(i)) continue;
    var ev=accumEvents[i];
    var zoneEvs=[ev];
    processed.add(i);
    for(var j=i+1;j<accumEvents.length;j++){
      if(processed.has(j)) continue;
      var ev2=accumEvents[j];
      var days=(new Date(ev2.date)-new Date(ev.date))/86400000;
      var pdiff=Math.abs(ev2.price-ev.price)/ev.price*100;
      if(days<=45&&pdiff<=20){zoneEvs.push(ev2);processed.add(j);}
    }
    var prices=zoneEvs.map(e=>e.price);
    var zL=Math.min(...zoneEvs.map(e=>e.low))*0.98;
    var zH=Math.max(...zoneEvs.map(e=>e.high))*1.02;
    var zoneVol=0;
    valid.forEach(d=>{if(d.c>=zL&&d.c<=zH)zoneVol+=d.v;});
    var chipPct=floatShares>0?Math.min(Math.round(zoneVol/floatShares*100),100):0;
    zones.push({
      startDate:zoneEvs[0].date,
      endDate:zoneEvs[zoneEvs.length-1].date,
      priceL:Math.round(zL*100)/100,
      priceH:Math.round(zH*100)/100,
      events:zoneEvs.length,
      chipPct,
      topReason:zoneEvs.sort((a,b)=>b.score-a.score)[0].reasons
    });
  }
  zones.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
  var totalChip=Math.min(zones.reduce((s,z)=>s+z.chipPct,0),100);
  return{zones,totalChip,count:accumEvents.length};
}

async function analyze(){
  var t=document.getElementById('sym').value.toUpperCase().trim();
  if(!t) return;
  var d=document.getElementById('result');
  d.innerHTML='<div class="loading"><div class="spinner"></div> 分析'+t+'中...</div>';

  try{
    var[yahoo,floatShares]=await Promise.all([fetchYahoo(t),fetchFloat(t)]);
    var res=detectAccumulation(yahoo,floatShares);

    if(!res||!res.zones.length){
      d.innerHTML='<div class="err">⚠️ 未偵測到明顯吸籌信號</div>';
      return;
    }

    var html='<div class="card">';
    html+='<div style="font-weight:700;font-size:16px;margin-bottom:10px;">📊 '+t+' 吸籌分析結果</div>';
    html+='<div style="font-size:12px;color:#666;margin-bottom:12px;">流通股：'+(floatShares/1e6).toFixed(1)+'M　偵測到'+res.count+'個吸籌訊號，聚合為'+res.zones.length+'個區間</div>';

    res.zones.forEach((z,i)=>{
      html+='<div class="zone">';
      html+='<div class="zone-title">第'+(i+1)+'次吸籌區間</div>';
      html+='<div class="zone-detail">';
      html+='📅 '+z.startDate+' ~ '+z.endDate+'<br>';
      html+='💰 價格區間：$'+z.priceL+' — $'+z.priceH+'<br>';
      html+='🔍 主要信號：'+z.topReason+'<br>';
      html+='📦 吸籌事件：'+z.events+'次';
      html+='</div>';
      html+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px;">';
      html+='<span style="font-size:11px;color:#666;">籌碼貢獻</span>';
      html+='<div class="chip-bar" style="flex:1"><div class="chip-fill" style="width:'+z.chipPct+'%"></div></div>';
      html+='<span style="font-weight:700;color:#0066bb;">'+z.chipPct+'%</span>';
      html+='</div>';
      html+='</div>';
    });

    html+='<div class="total">';
    html+='<div style="font-size:13px;margin-bottom:4px;">🐋 總籌碼完成度</div>';
    html+='<div class="total-num">'+res.totalChip+'%</div>';
    if(res.totalChip>=80) html+='<div style="font-size:12px;color:#00ff88;margin-top:4px;">籌碼高度集中，主力建倉接近完成</div>';
    else if(res.totalChip>=50) html+='<div style="font-size:12px;color:#ffcc00;margin-top:4px;">吸籌進行中，需繼續觀察</div>';
    else html+='<div style="font-size:12px;color:#ff8888;margin-top:4px;">吸籌初期或信號不明顯</div>';
    html+='</div>';
    html+='</div>';

    d.innerHTML=html;
  }catch(e){
    d.innerHTML='<div class="err">❌ 錯誤：'+e.message+'</div>';
  }
}

analyze();
</script>

</body>
</html>
