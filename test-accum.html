
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吸籌偵測 v2 - Wyckoff TR</title>
<style>
body{background:#f5e8a0;font-family:sans-serif;padding:16px;margin:0;}
h2{color:#1a1a2e;margin-bottom:12px;font-size:18px;}
.row{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
input{width:90px;border:1.5px solid #d4b800;border-radius:8px;padding:8px 10px;font-size:15px;text-transform:uppercase;}
button{background:#0066bb;color:white;border:none;border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer;}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.zone{border-left:4px solid #0066bb;padding:10px 12px;background:rgba(0,102,187,0.05);border-radius:0 8px 8px 0;margin-bottom:10px;}
.zone-title{font-weight:700;color:#0066bb;font-size:14px;margin-bottom:6px;}
.row2{display:flex;justify-content:space-between;font-size:12px;color:#555;padding:3px 0;border-bottom:1px solid #f0f0f0;}
.row2:last-child{border:none;}
.lbl{color:#999;}
.val{font-weight:600;color:#1a1a2e;}
.bar-wrap{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin:6px 0;}
.bar-fill{height:100%;border-radius:5px;transition:width 1s;}
.bf-hi{background:linear-gradient(90deg,#0066bb,#00aa55);}
.bf-md{background:linear-gradient(90deg,#dd8800,#ffbb00);}
.bf-lo{background:linear-gradient(90deg,#cc1133,#ff6688);}
.total{background:#1a1a2e;color:white;border-radius:10px;padding:14px;margin-top:8px;text-align:center;}
.total-num{font-size:32px;font-weight:900;color:#00ff88;}
.sub{font-size:12px;color:#aaa;margin-top:4px;}
.err{color:red;font-size:13px;padding:10px;}
.loading{text-align:center;padding:30px;color:#666;}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid #ddd;border-top:3px solid #0066bb;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:4px;}
.tag-b{background:rgba(0,102,187,0.12);color:#0066bb;}
.tag-g{background:rgba(0,153,68,0.12);color:#009944;}
.tag-o{background:rgba(221,102,0,0.12);color:#dd6600;}
</style>
</head>
<body>
<h2>🐋 吸籌偵測 v2（Wyckoff TR邏輯）</h2>
<div class="row">
  <input id="sym" value="IONQ" placeholder="股票代號">
  <button onclick="analyze()">分析</button>
</div>
<div id="result"></div>

<script>
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';

async function fetchYahoo(t){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?interval=1d&range=1y';
  var url='https://corsproxy.io/?'+encodeURIComponent(base);
  var r=await fetch(url);
  var data=await r.json();
  return data.chart.result[0];
}

async function fetchFloat(t){
  var r=await fetch('https://finnhub.io/api/v1/stock/profile2?symbol='+t+'&token='+K);
  var p=await r.json();
  return p.shareOutstanding?p.shareOutstanding*1e6:0;
}

// ── 核心邏輯：Wyckoff TR方法 ──
// 只看最近一個交易區間（TR），不累加歷史
function findCurrentTR(valid){
  var m=valid.length;
  if(m<30) return null;

  // 步驟1：找最近60天的最高點（分配頂部）
  var recent=valid.slice(-90);
  var peakIdx=0;
  for(var i=1;i<recent.length;i++)
    if(recent[i].h>recent[peakIdx].h) peakIdx=i;

  // 步驟2：從最高點之後找最低點（底部/Spring）
  var afterPeak=recent.slice(peakIdx);
  if(afterPeak.length<5) {
    // 高點太近，往前找
    recent=valid.slice(-180);
    peakIdx=0;
    for(var i=1;i<recent.length;i++)
      if(recent[i].h>recent[peakIdx].h) peakIdx=i;
    afterPeak=recent.slice(peakIdx);
  }

  var troughIdx=0;
  for(var i=1;i<afterPeak.length;i++)
    if(afterPeak[i].l<afterPeak[troughIdx].l) troughIdx=i;

  var troughBar=afterPeak[troughIdx];
  var peakBar=recent[peakIdx];

  // 步驟3：TR範圍 = 最高點 × 1.02 到 最低點 × 0.98
  var trHigh=peakBar.h*1.02;
  var trLow=troughBar.l*0.98;
  var trRange=(trHigh-trLow)/trLow*100;

  // TR必須有意義（震盪幅度>10%，且有下跌過程）
  if(trRange<10||peakBar.h<=troughBar.l) return null;

  // 步驟4：找TR內的吸籌事件
  // TR開始日 = 最高點之前5天（初步支撐）
  var trStartIdx=Math.max(0,valid.indexOf(peakBar)-5);
  var trBars=valid.slice(trStartIdx);

  // OBV計算（全段）
  var obv=0,obvArr=[0];
  for(var i=1;i<valid.length;i++){
    if(valid[i].c>valid[i-1].c) obv+=valid[i].v;
    else if(valid[i].c<valid[i-1].c) obv-=valid[i].v;
    obvArr.push(obv);
  }

  var avgVol=valid.slice(-20).reduce((s,d)=>s+d.v,0)/20;

  // 在TR內找吸籌信號
  var trStartGlobal=valid.length-trBars.length;
  var accumDays=[];

  for(var i=1;i<trBars.length;i++){
    var d=trBars[i];
    var gi=trStartGlobal+i; // 全局索引
    var score=0;
    var signals=[];

    // 只看TR範圍內的K棒
    if(d.c<trLow||d.c>trHigh) continue;

    // 信號1：OBV背離（價跌但OBV不跌）
    if(gi>=5&&d.c<valid[gi-5].c&&obvArr[gi]>obvArr[gi-5]){
      score++;signals.push('OBV背離');
    }

    // 信號2：長下影線（撐盤跡象）
    var body=Math.abs(d.c-d.o);
    var lowerW=Math.min(d.c,d.o)-d.l;
    var range=d.h-d.l;
    if(range>0&&lowerW>body*1.2&&(d.c-d.l)/range>0.45){
      score++;signals.push('長下影線');
    }

    // 信號3：量大價穩（主力接貨）
    var vr=d.v/avgVol;
    if(vr>1.3&&Math.abs(d.c-d.o)/d.o*100<2){
      score++;signals.push('量大價穩');
    }

    // 信號4：Selling Climax（大量+收低但反彈，賣盡）
    var maxV=Math.max(...valid.slice(Math.max(0,gi-60),gi).map(x=>x.v));
    if(d.v>maxV*0.7&&lowerW>range*0.3&&d.c<valid[gi-1].c){
      score++;signals.push('賣盤竭盡');
    }

    // 信號5：盤整中OBV持續上升
    if(gi>=15){
      var p15=valid.slice(gi-15,gi);
      var pMax=Math.max(...p15.map(x=>x.h));
      var pMin=Math.min(...p15.map(x=>x.l));
      if(pMin>0&&(pMax-pMin)/pMin*100<15&&obvArr[gi]>obvArr[gi-15]){
        score++;signals.push('盤整OBV↑');
      }
    }

    if(score>=2){
      accumDays.push({
        date:new Date(d.t*1000).toISOString().slice(0,10),
        price:Math.round(d.c*100)/100,
        low:Math.round(d.l*100)/100,
        high:Math.round(d.h*100)/100,
        vol:d.v,vr:vr.toFixed(1),
        score,signals:signals.join('+')
      });
    }
  }

  // 步驟5：計算TR內的吸籌量
  // 用「TR價格範圍內的所有成交量」作為吸籌量
  var accumVol=0;
  trBars.forEach(d=>{
    if(d.l>=trLow*0.98&&d.h<=trHigh*1.02) accumVol+=d.v;
  });

  return{
    trHigh:Math.round(trHigh*100)/100,
    trLow:Math.round(trLow*100)/100,
    trRange:Math.round(trRange),
    peakDate:new Date(peakBar.t*1000).toISOString().slice(0,10),
    troughDate:new Date(troughBar.t*1000).toISOString().slice(0,10),
    troughPrice:Math.round(troughBar.l*100)/100,
    accumDays,
    accumVol,
    trBars,
    currentPrice:valid[m-1].c,
    obvRising:obvArr[m-1]>obvArr[Math.max(0,m-20)]
  };
}

function calcChip(tr, floatShares){
  if(!floatShares||floatShares<=0) return 0;
  // 籌碼完成度 = TR內吸籌量 ÷ 流通股
  return Math.min(Math.round(tr.accumVol/floatShares*100),100);
}

async function analyze(){
  var t=document.getElementById('sym').value.toUpperCase().trim();
  if(!t) return;
  var d=document.getElementById('result');
  d.innerHTML='<div class="loading"><span class="spinner"></span>分析 '+t+' 中（抓取Yahoo Finance數據）...</div>';

  try{
    var[yahoo,floatShares]=await Promise.all([fetchYahoo(t),fetchFloat(t)]);

    var timestamps=yahoo.timestamp;
    var q=yahoo.indicators.quote[0];
    var valid=[];
    for(var i=0;i<timestamps.length;i++){
      if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i]){
        valid.push({c:q.close[i],v:q.volume[i],h:q.high[i],l:q.low[i],o:q.open[i],t:timestamps[i]});
      }
    }

    var tr=findCurrentTR(valid);
    if(!tr){
      d.innerHTML='<div class="err">⚠️ 無法找到有效的交易區間，可能股價走勢過於平緩</div>';
      return;
    }

    var chip=calcChip(tr,floatShares);
    var chipClass=chip>=70?'bf-hi':chip>=40?'bf-md':'bf-lo';
    var chipMsg=chip>=70?'籌碼集中，主力建倉進行中':chip>=40?'吸籌初期，持續觀察':'吸籌訊號不明顯';

    var priceVsTrough=Math.round((tr.currentPrice/tr.troughPrice-1)*100);

    var html='<div class="card">';
    html+='<div style="font-weight:700;font-size:16px;margin-bottom:4px;">📊 '+t+' — 當前TR分析</div>';
    html+='<div style="font-size:11px;color:#888;margin-bottom:12px;">流通股：'+(floatShares/1e6).toFixed(1)+'M　只看最近這一波交易區間</div>';

    // TR基本資訊
    html+='<div class="zone">';
    html+='<div class="zone-title">📦 當前交易區間（TR）</div>';
    html+='<div class="row2"><span class="lbl">TR頂部（分配高點）</span><span class="val">$'+tr.trHigh+'　'+tr.peakDate+'</span></div>';
    html+='<div class="row2"><span class="lbl">TR底部（Spring低點）</span><span class="val">$'+tr.trLow+'　'+tr.troughDate+'</span></div>';
    html+='<div class="row2"><span class="lbl">TR震盪幅度</span><span class="val">'+tr.trRange+'%</span></div>';
    html+='<div class="row2"><span class="lbl">現價距底部</span><span class="val">'+(priceVsTrough>=0?'+':'')+priceVsTrough+'%</span></div>';
    html+='<div class="row2"><span class="lbl">OBV趨勢</span><span class="val">'+(tr.obvRising?'📈 上升（吸籌跡象）':'📉 下降')+'</span></div>';
    html+='</div>';

    // 吸籌事件列表
    if(tr.accumDays.length>0){
      html+='<div style="font-weight:600;font-size:13px;color:#0066bb;margin:10px 0 6px;">🔍 TR內偵測到的吸籌訊號（'+tr.accumDays.length+'個）</div>';
      tr.accumDays.slice(-8).forEach(ev=>{
        html+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:12px;">';
        html+='<span style="color:#888;width:85px;">'+ev.date+'</span>';
        html+='<span style="font-weight:600;">$'+ev.price+'</span>';
        html+='<span style="color:#666;">量×'+ev.vr+'</span>';
        ev.signals.split('+').forEach(s=>{
          var cls=s.includes('OBV')?'tag-b':s.includes('下影')?'tag-g':'tag-o';
          html+='<span class="tag '+cls+'">'+s+'</span>';
        });
        html+='</div>';
      });
    } else {
      html+='<div style="font-size:12px;color:#999;padding:8px 0;">TR內尚未偵測到明確吸籌訊號</div>';
    }

    // 籌碼完成度
    html+='<div style="margin-top:12px;">';
    html+='<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">';
    html+='<span style="color:#666;">🐋 籌碼完成度（TR內吸籌量 ÷ 流通股）</span>';
    html+='<span style="font-weight:700;color:#0066bb;">'+chip+'%</span>';
    html+='</div>';
    html+='<div class="bar-wrap"><div class="bar-fill '+chipClass+'" style="width:'+chip+'%"></div></div>';
    html+='</div>';

    html+='<div class="total">';
    html+='<div class="total-num">'+chip+'%</div>';
    html+='<div class="sub">'+chipMsg+'</div>';
    if(tr.accumDays.length>0){
      html+='<div class="sub" style="margin-top:4px;">偵測到'+tr.accumDays.length+'個吸籌訊號，主要信號：'+tr.accumDays[tr.accumDays.length-1].signals+'</div>';
    }
    html+='</div>';
    html+='</div>';

    d.innerHTML=html;

  }catch(e){
    d.innerHTML='<div class="err">❌ 錯誤：'+e.message+'</div>';
  }
}

analyze();
</script>

</body>
</html>
