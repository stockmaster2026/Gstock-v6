
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個股深度分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f0e8;font-family:'Helvetica Neue',sans-serif;padding:16px;color:#1a1a2e;}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.hdr h2{font-size:16px;font-weight:700;letter-spacing:2px;color:#8a6e2f;}
.dot{width:8px;height:8px;border-radius:50%;background:#c8a84b;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab{flex:1;padding:11px;border-radius:10px;border:1px solid #e0d5b8;background:#fffbec;color:#aaa;font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none;}
.tab.active{background:#c8a84b;color:#fff;border-color:#c8a84b;}
.srow{display:flex;gap:8px;margin-bottom:16px;align-items:center;}
input.sym{background:#fffbec;border:1px solid #e0d5b8;border-radius:10px;padding:11px 14px;font-size:16px;color:#1a1a2e;width:120px;text-transform:uppercase;outline:none;}
input.sym:focus{border-color:#c8a84b;}
input.num{background:#fffbec;border:1px solid #e0d5b8;border-radius:8px;padding:7px 10px;font-size:13px;color:#1a1a2e;width:65px;text-align:center;outline:none;}
input.num:focus{border-color:#c8a84b;}
.btn{background:#c8a84b;color:#fff;border:none;border-radius:10px;padding:11px 24px;font-size:15px;font-weight:700;cursor:pointer;}
.btn-sm{background:#f0e8d0;color:#8a6e2f;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;}
.btn-green{background:#edfaf3;color:#2ea86e;border:1px solid #c5eedd;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:700;}
.btn-blue{background:#e8f0fe;color:#3a7bd5;border:1px solid #b8d0f8;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:700;}
.btn-red{background:#fef0f0;color:#d94f4f;border:1px solid #f5cccc;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:600;}
.btn-scan{background:#f0e8d0;color:#8a6e2f;border:1px solid #e0d5b8;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-scan:active{background:#c8a84b;color:#fff;}
.btn-scan-gold{background:#c8a84b;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;flex:1;text-align:center;box-shadow:0 2px 6px rgba(200,168,75,.3);}
.btn-scan-gold:active{background:#a8882b;}
.btn-manual{background:#3a7bd5;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;width:100%;text-align:center;box-shadow:0 2px 6px rgba(58,123,213,.3);}
.btn-manual:active{background:#2a5ba0;}
.manual-card{background:#fffdf5;border:1px solid #b8d0f8;border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.manual-title{font-size:13px;font-weight:700;color:#3a7bd5;margin-bottom:8px;border-bottom:1px solid #e0e8f0;padding-bottom:6px;}
.manual-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;color:#444;}
.manual-label{color:#666;font-weight:500;}
.manual-value{font-weight:700;color:#1a1a2e;}
.card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 12px rgba(200,168,75,.08);}
.ch{padding:14px 16px 12px;border-bottom:1px solid #f0e8d0;}
.tk{font-size:22px;font-weight:700;color:#1a1a2e;font-family:monospace;}
.px{font-size:15px;color:#aaa;margin-left:8px;}
.sbts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.sbt{background:#fffbec;border:1px solid #e0d5b8;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;color:#8a6e2f;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.sbt.active{background:#c8a84b;border-color:#c8a84b;color:#fff;}
.stock-list{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;}
.stock-chip{background:#fffbec;border:1px solid #e0d5b8;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;font-family:monospace;color:#5a4010;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.accum-hero{padding:16px;background:#fffbec;border-bottom:1px solid #f0e8d0;}
.accum-score-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.accum-emoji{font-size:22px;letter-spacing:3px;}
.accum-pb{height:5px;background:#f0e0b0;border-radius:3px;overflow:hidden;margin-bottom:5px;}
.accum-pf{height:100%;border-radius:3px;transition:width 1.2s;}
.accum-label{font-size:13px;color:#5a4010;font-weight:700;}
.signal-dates{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;}
.signal-date{background:#fff8e8;border:1px solid #e8d090;border-radius:5px;padding:3px 8px;font-size:11px;font-family:monospace;color:#8a6e2f;font-weight:600;}
.core-block{padding:14px 16px;background:#fffdf5;border-bottom:1px solid #f0e8d0;}
.core-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f5eed8;}
.core-row:last-child{border:none;}
.core-q{font-size:13px;color:#8a7050;font-weight:600;}
.core-a{font-size:14px;font-weight:700;font-family:monospace;text-align:right;}
.ca-blue{color:#3a7bd5;}.ca-green{color:#2ea86e;}.ca-yellow{color:#c8952a;}.ca-gray{color:#999;}
.tech-row{padding:10px 16px;background:#faf5e8;border-bottom:1px solid #f0e8d0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tech-lbl{font-size:12px;color:#a88d4a;font-weight:600;margin-right:2px;}
.tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;}
.tg{background:#edfaf3;color:#2ea86e;border:1px solid #c5eedd;}
.tr{background:#fef0f0;color:#d94f4f;border:1px solid #f5cccc;}
.ty{background:#fffbec;color:#c8952a;border:1px solid #f0dfa0;}
.bigorder-row{padding:10px 16px;border-bottom:1px solid #f0e8d0;display:flex;justify-content:space-between;align-items:center;}
.fold-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;border-top:1px solid #f0e8d0;background:#fffbec;-webkit-tap-highlight-color:transparent;}
.fold-title{font-size:12px;letter-spacing:1px;color:#5a4010;font-weight:700;}
.fold-arrow{font-size:12px;color:#a88d4a;transition:transform .3s;}
.fold-arrow.open{transform:rotate(180deg);}
.fold-body{display:none;padding:14px 16px;border-top:1px solid #f5eed8;background:#fffdf5;}
.fold-body.open{display:block;}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid #f8f0e0;}
.rw:last-child{border:none;}
.lb{color:#6a5030;font-weight:600;}
.vl{font-family:monospace;font-weight:700;color:#2a1a00;}
.bg{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;}
.gu{background:#edfaf3;color:#2ea86e;}
.gd{background:#fef0f0;color:#d94f4f;}
.gw{background:#fffbec;color:#c8952a;}
.gn{background:#f5f5f5;color:#aaa;}
.note{font-size:13px;color:#5a4010;margin-top:6px;line-height:1.7;}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;}
.ib{background:#faf5e8;border-radius:10px;padding:12px;text-align:center;border:1px solid #f0e0c0;}
.inn{font-size:26px;font-weight:700;font-family:monospace;}
.ib-b .inn{color:#2ea86e;}.ib-s .inn{color:#d94f4f;}
.is{font-size:12px;color:#a88d4a;margin-top:3px;}
.verdict-block{border-top:2px solid #e8d090;background:linear-gradient(135deg,#fffbec,#fff8e0);}
.verdict-inner{padding:18px 16px;}
.verdict-main{font-size:22px;font-weight:900;margin-bottom:8px;line-height:1.3;}
.vm-buy{color:#2ea86e;}.vm-watch{color:#c8952a;}.vm-wait{color:#d94f4f;}
.verdict-score{font-size:13px;color:#c0a870;margin-bottom:10px;font-weight:600;}
.verdict-warn{margin-top:10px;background:#fff5f5;border-left:3px solid #d94f4f;padding:10px 12px;border-radius:0 8px 8px 0;}
.verdict-warn-lbl{font-size:10px;color:#d94f4f;font-weight:700;letter-spacing:1px;margin-bottom:3px;}
.verdict-warn-txt{font-size:12px;color:#d94f4f;font-weight:600;line-height:1.6;}
.verdict-cond{margin-top:10px;background:#fffbec;border-left:3px solid #c8a84b;padding:10px 12px;border-radius:0 8px 8px 0;}
.verdict-cond-lbl{font-size:10px;color:#c8952a;font-weight:700;letter-spacing:1px;margin-bottom:3px;}
.verdict-cond-txt{font-size:13px;color:#5a4010;font-weight:600;line-height:1.6;}
.watchlist-btn{display:inline-flex;align-items:center;gap:5px;background:#fffbec;border:1px solid #e0d5b8;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:#8a6e2f;cursor:pointer;margin-top:10px;}
.watchlist-btn.active{background:#fff8e0;border-color:#c8a84b;color:#c8952a;}
/* 右邊籌碼頁 */
.chip-input-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 12px rgba(200,168,75,.08);}
.chip-stock-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f5eed8;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.chip-stock-row:last-child{border:none;}
.chip-sym{font-family:monospace;font-weight:700;font-size:14px;color:#1a1a2e;width:60px;}
.chip-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-g{background:#edfaf3;color:#2ea86e;border:1px solid #c5eedd;}
.badge-y{background:#fffbec;color:#c8952a;border:1px solid #f0dfa0;}
.badge-o{background:#fff5ec;color:#d97020;border:1px solid #f0cca0;}
.badge-r{background:#fef0f0;color:#d94f4f;border:1px solid #f5cccc;}
.badge-n{background:#f5f5f5;color:#bbb;border:1px solid #e8e8e8;}
.chip-score{font-size:13px;font-weight:700;font-family:monospace;color:#333;}
.chip-updated{font-size:11px;color:#999;}
.chip-input-panel{display:none;padding:14px 16px;background:#faf5e8;border-top:1px solid #f0e8d0;}
.chip-input-panel.open{display:block;}
.cap-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.cap-btn{padding:5px 10px;border-radius:6px;border:1px solid #e0d5b8;background:#fffbec;font-size:11px;font-weight:700;color:#8a6e2f;cursor:pointer;}
.cap-btn.active{background:#c8a84b;color:#fff;border-color:#c8a84b;}
.best-list{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;overflow:hidden;margin-bottom:14px;}
.best-hdr{padding:14px 16px;border-bottom:1px solid #f0e8d0;display:flex;justify-content:space-between;align-items:center;}
.add-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;padding:14px 16px;margin-bottom:14px;}
.sector-select{background:#fffbec;border:1px solid #e0d5b8;border-radius:10px;padding:10px;font-size:14px;color:#1a1a2e;outline:none;flex:1;}
.chip-hist-row{display:flex;gap:8px;padding:5px 0;font-size:12px;border-bottom:1px solid #f5eed8;color:#444;}
.chip-hist-row:last-child{border:none;}
/* 掃描結果 */
.scan-result-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;margin-bottom:8px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.scan-sym{font-family:monospace;font-weight:700;font-size:16px;color:#1a1a2e;}
.scan-sector{font-size:11px;color:#888;margin-left:6px;}
.watchlist-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;overflow:hidden;margin-bottom:14px;}
.wl-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f5eed8;}
.wl-row:last-child{border:none;}
/* 板塊管理 */
.sector-manage-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #f5eed8;}
.sector-manage-row:last-child{border:none;}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #e8d090;border-top-color:#c8a84b;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{color:#c0a870;font-size:14px;padding:30px;text-align:center;}
.err{color:#d94f4f;font-size:13px;padding:16px;text-align:center;background:#fff5f5;border-radius:10px;}
</style>
</head>
<body>
<div class="hdr"><div class="dot"></div><h2>個股深度分析</h2></div>
<div class="tabs">
  <div class="tab active" id="tab1">📈 技術與籌碼</div>
  <div class="tab" id="tab2">📊 板塊籌碼</div>
</div>

<!-- 左邊：技術與籌碼 -->

<div id="accumPage" style="display:block;">
  <!-- 操作手冊按鈕（藍色）-->
  <div style="margin-bottom:8px;">
    <button class="btn-manual" onclick="toggleManual()">📚 操作手冊（先看這個）</button>
    <div id="manualOut" style="display:none;margin-top:8px;"></div>
  </div>
  <!-- 掃描按鈕（金色）-->
  <div style="display:flex;gap:6px;margin-bottom:6px;">
    <button class="btn-scan-gold" onclick="showScanPanel('big')">🐋 大單掃描</button>
    <button class="btn-scan-gold" onclick="showScanPanel('accum')">📈 吸籌掃描</button>
    <button class="btn-scan-gold" onclick="showTodayBest()">🏆 今日精選</button>
  </div>
  <div style="margin-bottom:10px;">
    <button class="btn-scan-gold" onclick="runBigOrderAlert()" style="width:100%;background:#d94f4f;box-shadow:0 2px 6px rgba(217,79,79,.3);">🚨 今日大單警報（掃全部板塊）</button>
    <div id="bigOrderAlertOut" style="display:none;margin-top:8px;"></div>
  </div>
  <div id="scanPanel" style="display:none;"></div>
  <!-- 今日精選 -->
  <div id="todayBestOut" style="display:none;margin-bottom:14px;"></div>
  <!-- 觀察清單 -->
  <div style="margin-bottom:10px;">
    <button class="btn-sm" onclick="toggleWatchlist('accum')" style="width:100%;padding:9px;">⭐ 我的觀察清單</button>
    <div id="accumWatchlist" style="display:none;margin-top:8px;"></div>
  </div>
  <!-- 新增股票 -->
  <div class="add-card">
    <div style="font-size:12px;color:#8a6e2f;font-weight:700;margin-bottom:8px;">➕ 新增股票到板塊</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input class="sym" id="accumNewSym" placeholder="代號" style="width:90px;">
      <select class="sector-select" id="accumNewSector"></select>
      <button class="btn" onclick="addStockFromAccum()">新增</button>
    </div>
  </div>
  <div class="sbts" id="accumSectorBtns"></div>
  <div id="accumStockList"></div>
  <div class="srow">
    <input class="sym" id="sym" value="" placeholder="輸入代號分析">
    <button class="btn" onclick="runAccum()">分析</button>
  </div>
  <div id="accumOut"></div>
</div>

<!-- 右邊：板塊籌碼 -->

<div id="chipPage" style="display:none;">
  <div style="display:flex;gap:8px;margin-bottom:10px;">
    <button class="btn-green" onclick="showBestList()" style="flex:1;">🏆 最佳籌碼名單</button>
  </div>
  <!-- 觀察清單 -->
  <div style="margin-bottom:10px;">
    <button class="btn-sm" onclick="toggleWatchlist('chip')" style="width:100%;padding:9px;">⭐ 我的觀察清單</button>
    <div id="chipWatchlist" style="display:none;margin-top:8px;"></div>
  </div>
  <!-- 新增股票 -->
  <div class="add-card">
    <div style="font-size:12px;color:#8a6e2f;font-weight:700;margin-bottom:8px;">➕ 新增股票到板塊</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input class="sym" id="newSym" placeholder="代號" style="width:90px;">
      <select class="sector-select" id="newSector"></select>
      <button class="btn" onclick="addNewStock()">新增</button>
    </div>
  </div>
  <!-- 板塊管理 -->
  <div style="margin-bottom:10px;">
    <button class="btn-sm" onclick="toggleSectorManage()" style="width:100%;padding:9px;">⚙️ 板塊管理（新增/刪除板塊）</button>
    <div id="sectorManagePanel" style="display:none;margin-top:8px;"></div>
  </div>
  <div class="sbts" id="chipSectorBtns"></div>
  <div id="chipStockList"></div>
  <div id="bestListOut"></div>
</div>

<script>
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';
var chipCache={};
var accumCurrentSector='太空衛星';
var chipCurrentSector='太空衛星';
var expandedSym=null;
var selectedCap={};

document.getElementById('tab1').addEventListener('click',function(){ switchTab('accum'); });
document.getElementById('tab2').addEventListener('click',function(){ switchTab('chip'); });

function switchTab(t){
  document.getElementById('tab1').classList.toggle('active',t==='accum');
  document.getElementById('tab2').classList.toggle('active',t==='chip');
  document.getElementById('accumPage').style.display=t==='accum'?'block':'none';
  document.getElementById('chipPage').style.display=t==='chip'?'block':'none';
  if(t==='chip') initChipPage();
}

// ── 板塊數據 ──
var SECTORS={
  'AI巨頭':     [{sym:'NVDA'},{sym:'META'},{sym:'GOOGL'},{sym:'MSFT'},{sym:'AMZN'}],
  'AI基礎設施': [{sym:'ANET'},{sym:'SMCI'},{sym:'DELL'},{sym:'CRWD'},{sym:'SNOW'}],
  '光通訊':     [{sym:'COHR'},{sym:'LITE'},{sym:'AAOI'},{sym:'VECO'}],
  'AI電力散熱': [{sym:'VST'},{sym:'CEG'},{sym:'ETN'},{sym:'GNRC'},{sym:'VRT'}],
  '太空衛星':   [{sym:'LUNR'},{sym:'RKLB'},{sym:'PL'},{sym:'BKSY'},{sym:'ASTS'}],
  '無人機國防': [{sym:'ONDS'},{sym:'KTOS'},{sym:'PLTR'},{sym:'ACHR'},{sym:'RCAT'}],
  '量子運算':   [{sym:'IONQ'},{sym:'RGTI'},{sym:'QBTS'},{sym:'QUBT'}],
  '儲存硬體':   [{sym:'WDC'},{sym:'NTAP'},{sym:'PURE'},{sym:'STX'},{sym:'PSTG'}],
  '生技健康':   [{sym:'TEM'},{sym:'HIMS'},{sym:'RXRX'},{sym:'NVAX'},{sym:'CRSP'}],
  '衛星通信':   [{sym:'IRDM'},{sym:'ASTS'},{sym:'GSAT'},{sym:'VSAT'}],
  '貴金屬礦業': [{sym:'GLD'},{sym:'SLV'},{sym:'NEM'},{sym:'AEM'},{sym:'WPM'}],
  '自訂':       []
};

var DEFAULT_SECTORS={
  'AI巨頭':['NVDA','META','GOOGL','MSFT','AMZN'],
  'AI基礎設施':['ANET','SMCI','DELL','CRWD','SNOW'],
  '光通訊':['COHR','LITE','AAOI','VECO'],
  'AI電力散熱':['VST','CEG','ETN','GNRC','VRT'],
  '太空衛星':['LUNR','RKLB','PL','BKSY','ASTS'],
  '無人機國防':['ONDS','KTOS','PLTR','ACHR','RCAT'],
  '量子運算':['IONQ','RGTI','QBTS','QUBT'],
  '儲存硬體':['WDC','NTAP','PURE','STX','PSTG'],
  '生技健康':['TEM','HIMS','RXRX','NVAX','CRSP'],
  '衛星通信':['IRDM','ASTS','GSAT','VSAT'],
  '貴金屬礦業':['GLD','SLV','NEM','AEM','WPM'],
  '自訂':[]
};

// ── 資料存取 ──
function saveSectors(){
  try{
    var data={};
    Object.keys(SECTORS).forEach(function(s){
      var def=DEFAULT_SECTORS[s]||[];
      var extra=SECTORS[s].map(function(x){return x.sym;}).filter(function(sym){return def.indexOf(sym)===-1;});
      // 儲存自訂板塊名稱和所有股票
      if(!DEFAULT_SECTORS[s]||extra.length){
        data[s]=SECTORS[s].map(function(x){return x.sym;});
      }
    });
    localStorage.setItem('sectors_v3',JSON.stringify(data));
  }catch(e){}
}

function loadSectors(){
  try{
    var s=localStorage.getItem('sectors_v3');
    if(!s) return;
    var data=JSON.parse(s);
    Object.keys(data).forEach(function(sector){
      if(!SECTORS[sector]){
        // 新板塊
        SECTORS[sector]={};
        SECTORS[sector]=[];
      }
      data[sector].forEach(function(sym){
        if(!SECTORS[sector].find(function(x){return x.sym===sym;}))

async function runScan(sector){
  var el=document.getElementById('scanResult');
  var stocks=SECTORS[sector]||[];
  if(!stocks.length){el.innerHTML='<div class="err">此板塊無股票</div>';return;}
  el.innerHTML='<div class="loading"><span class="spin"></span>掃描 '+sector+' 板塊（'+stocks.length+'檔）...</div>';
  var results=[];
  for(var i=0;i<stocks.length;i++){
    var sym=stocks[i].sym;
    try{
      var yRaw=await fYahoo(sym);
      var va=mkValid(yRaw);
      if(va.length>=55){
        var a=detectAccum(va);
        var now15=Date.now()/1000-15*86400;
        var now30=Date.now()/1000-30*86400;
        var buy15=a.bigBuys.filter(function(s){return new Date(s.date).getTime()/1000>now15;});
        var buy30=a.bigBuys.filter(function(s){return new Date(s.date).getTime()/1000>now30;});
        var sell15=a.bigSells.filter(function(s){return new Date(s.date).getTime()/1000>now15;});
        results.push({sym:sym,a:a,buy15:buy15,buy30:buy30,sell15:sell15,sector:sector,bigBuys:a.bigBuys});
      }
    }catch(e){}
    await new Promise(function(r){setTimeout(r,300);});
  }
  // 排序
  if(scanType==='big'){
    results.sort(function(a,b){
      var sa=a.buy15.length*3+a.buy30.length-a.sell15.length*2;
      var sb=b.buy15.length*3+b.buy30.length-b.sell15.length*2;
      return sb-sa;
    });
  } else {
    results.sort(function(a,b){return b.a.sm-a.a.sm;});
  }
  renderScanResults(results);
}

var todayBestCache=[];

function calcScanScore(r){
  var s=0;
  var now=Date.now()/1000;
  // 近期大單權重
  var buy5=r.bigBuys?r.bigBuys.filter(function(b){return (now-new Date(b.date).getTime()/1000)<5*86400;}).length:0;
  var buy10=r.bigBuys?r.bigBuys.filter(function(b){return (now-new Date(b.date).getTime()/1000)<10*86400;}).length:0;
  if(buy5>=1)s+=3;
  else if(r.buy15.length>=2)s+=2;
  else if(r.buy15.length===1)s+=1;
  else if(r.buy30.length>=1)s+=0;
  s=Math.max(0,s-Math.min(r.sell15.length,2));
  if(r.a.sm>=5)s+=3;else if(r.a.sm>=3)s+=2;else if(r.a.sm>=1)s+=1;
  var macdOk=r.a.macd.aboveZero&&!r.a.macd.histShrink&&!r.a.macd.macdDown;
  if(r.a.ma5up)s+=1;
  if(macdOk)s+=1;
  if(!r.a.volShrink)s+=1;
  // ── 漲幅懲罰：避免已漲多的股票排第一 ──
  var diff=(+r.a.cur-+r.a.scP)/+r.a.scP*100;
  if(diff<=20)s+=2;       // +20%以內：最佳進場點，加2分
  else if(diff<=40)s+=0;  // 20-40%：不變
  else if(diff<=60)s-=2;  // 40-60%：扣2分
  else if(diff<=100){s-=3;s=Math.min(s,6);} // 60-100%：扣3分且封頂6分
  else s=Math.min(s,4);   // 100%+：封頂4分
  return Math.max(0,Math.min(s,10));
}

function getSignalDesc(r){
  var parts=[];
  var macdOk=r.a.macd.aboveZero&&!r.a.macd.histShrink&&!r.a.macd.macdDown;
  if(r.buy15.length>=2)parts.push('近期大單'+r.buy15.length+'次買入');
  else if(r.buy15.length===1)parts.push('近期大單買入');
  else if(r.buy30.length>=1)parts.push('30天內有大單');
  if(r.a.macd.aboveZero&&r.a.ma5up)parts.push('MACD翻正+MA5向上');
  else if(r.a.macd.aboveZero)parts.push('MACD已翻正');
  if(r.a.sm>=4)parts.push('吸籌訊號強');
  else if(r.a.sm>=2)parts.push('底部吸籌中');
  if(r.sell15.length>0)parts.push('⚠️有賣出訊號');
  return parts.length?parts.join('，'):'訊號待確認';
}

  if(!results.length){el.innerHTML='<div class="err">無法取得數據</div>';return;}
  results.forEach(function(r){ r.scanScore=calcScanScore(r); });
  results.sort(function(a,b){return b.scanScore-a.scanScore;});
  // 存入今日精選
  results.forEach(function(r){
    var idx=todayBestCache.findIndex(function(x){return x.sym===r.sym;});
    if(idx>=0)todayBestCache[idx]=r;
    else todayBestCache.push(r);
  });
  var RANKS=['🥇','🥈','🥉'];
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
  h+='<span style="font-size:12px;color:#8a6e2f;font-weight:700;">掃描結果（點擊分析，自動收起）</span>';
  h+='<button class="btn-sm" onclick="hideScanPanel()">收起</button></div>';
  results.forEach(function(r,idx){
    var score=r.scanScore;
    var stars=getStars(score);
    var desc=getSignalDesc(r);
    var rank=idx<3?RANKS[idx]:''+(idx+1)+'.';
    var macdTag=r.a.macd.aboveZero?'<span class="tag tg">MACD零軸上</span>':'<span class="tag tr">MACD零軸下</span>';
    var ma5Tag=r.a.ma5up?'<span class="tag tg">MA5↑</span>':'<span class="tag tr">MA5↓</span>';
    var bigTag='';
    if(r.buy15.length>=2)bigTag='<span class="tag tg">🔥 大單x'+r.buy15.length+'</span>';
    else if(r.buy15.length===1)bigTag='<span class="tag tg">📈 大單x1</span>';
    else if(r.buy30.length>0)bigTag='<span class="tag ty">👀 近30天</span>';
    if(r.sell15.length>0)bigTag+=' <span class="tag tr">⚠️賣x'+r.sell15.length+'</span>';
    var bg=idx===0?'#fffbec':'#fffdf5';
    h+='<div class="scan-result-card" style="background:'+bg+'" onclick="quickAnalyzeAndHide(\''+r.sym+'\')">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">';
    h+='<div style="display:flex;align-items:center;gap:8px;">';
    h+='<span style="font-size:18px;min-width:30px;">'+rank+'</span>';
    h+='<div><span class="scan-sym">'+r.sym+'</span><span class="scan-sector">'+r.sector+'</span></div></div>';
    h+='<div style="text-align:right;">';
    h+='<div style="font-size:14px;">'+stars+'</div>';
    h+='<div style="font-size:12px;font-weight:700;color:#8a6e2f;">'+score+'/10</div></div></div>';
    h+='<div style="font-size:13px;color:#555;margin-bottom:6px;">'+desc+'</div>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:4px;">'+bigTag+' '+macdTag+' '+ma5Tag+'</div>';
    h+='</div>';
  });
  el.innerHTML=h;
}

async function generateAISummary(results){
  var el=document.getElementById('aiSummaryOut');
  if(!el)return;
  try{
    // 整理數據給AI
    var topStocks=results.slice(0,5).map(function(r){
      return r.sym+'('+r.sector+' 評分'+r.scanScore+'/10 '+getSignalDesc(r)+')';
    }).join('、');
    var weakStocks=results.filter(function(r){return r.scanScore<=3;}).map(function(r){return r.sym;}).join('、');
    var prompt='你是專業美股技術分析師，用繁體中文白話文100-150字給出今日掃描總結。今日股票評分高到低：'+topStocks+(weakStocks?'。訊號較弱：'+weakStocks:'')+'. 請說明：1.最值得關注的股票 2.整體盤勢 3.操作建議。語氣直接實用。';
    var resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:300,
        messages:[{role:'user',content:prompt}]
      })
    });
    var data=await resp.json();
    var text=data.content&&data.content[0]?data.content[0].text:'無法生成分析';
    el.innerHTML=text;
  }catch(e){
    // fallback：用固定邏輯生成
    var top=results.slice(0,3);
    var txt='';
    if(top.length>0){
      var best=top[0];
      txt='今日掃描中，';
      txt+=best.sym+'（'+best.sector+'）表現最強，'+getSignalDesc(best)+'，評分'+best.scanScore+'/10。';
      if(top.length>1) txt+=' '+top[1].sym+'也值得關注，'+getSignalDesc(top[1])+'。';
      var goodCount=results.filter(function(r){return r.scanScore>=6;}).length;
      if(goodCount===0) txt+=' 整體盤勢訊號偏弱，建議輕倉觀望為主。';
      else if(goodCount>=3) txt+=' 今日有多檔強勢股，可選最強的1-2檔輕倉試探。';
      else txt+=' 訊號尚未全面啟動，建議等待確認再進場。';
    } else {
      txt='今日掃描結果整體偏弱，建議繼續觀望，等待更明確的訊號。';
    }
    el.innerHTML=txt;
  }
}

// ── 籌碼數據 ──
function chipLoad(sym){return chipCache[sym]||[];}
function chipSave(sym,inst,ret,ins,cap,shortFloat){
  var hist=chipLoad(sym);
  var today=new Date().toISOString().slice(0,10);
  var f=hist.filter(function(h){return h.d!==today;});
  f.push({d:today,i:inst,r:ret,n:ins,cap:cap||'M',sf:shortFloat||0});
  if(f.length>8) f.splice(0,f.length-8);
  chipCache[sym]=f;
  try{localStorage.setItem('chip_'+sym,JSON.stringify(f));}catch(e){}
  return f;
}
function chipLoadWithStorage(sym){
  try{var s=localStorage.getItem('chip_'+sym);if(s){var d=JSON.parse(s);chipCache[sym]=d;return d;}}catch(e){}
  return chipCache[sym]||[];
}

// 按籌碼評分排序股票（有評分的在前，無評分的在後）
function sortStocksByChipScore(stocks){
  return stocks.slice().sort(function(a,b){
    var histA=chipLoadWithStorage(a.sym);
    var histB=chipLoadWithStorage(b.sym);
    var scoreA=-1, scoreB=-1;
    if(histA.length){
      var lastA=histA[histA.length-1];
      scoreA=chipAnalysis(lastA.cap||'M',lastA.i,lastA.r,lastA.n||0).score;
    }
    if(histB.length){
      var lastB=histB[histB.length-1];
      scoreB=chipAnalysis(lastB.cap||'M',lastB.i,lastB.r,lastB.n||0).score;
    }
    return scoreB-scoreA;
  });
}
function chipAnalysis(cap,inst,retail,insiderPct){
  var insider=insiderPct||0;
  var control=Math.min(inst+insider,100);
  var limits={S:[15,25],M:[20,35],L:[15,25],XL:[12,20],XXL:[10,15]};
  var rWarn=limits[cap]?limits[cap][0]:20, rDanger=limits[cap]?limits[cap][1]:35;
  var status,score,text,emoji,light,levelText;
  var insiderNote=insider>=15?' (含內部人'+insider+'%)':'';
  if(control>90){status='⚠️ 籌碼高度集中';score=4;emoji='🟡';light='yellow';text='控盤合計'+control+'%過高，流動性有限';}
  else if(control>=60){
    if(retail<=rWarn){status='✅ 籌碼甜蜜點';score=10;emoji='🟢';light='green';text='控盤'+control+'%'+insiderNote+'，散戶僅'+retail+'%，結構良好 ✅';}
    else if(retail<=rDanger){status='🟡 尚可觀察';score=6;emoji='🟡';light='yellow';text='控盤'+control+'%'+insiderNote+'，散戶'+retail+'%略偏高（上限'+rDanger+'%）';}
    else{status='🟠 散戶偏多';score=4;emoji='🟠';light='orange';text='散戶'+retail+'%超標（上限'+rDanger+'%），拉抬難度增加';}
  } else if(control>=40){status='🟡 控盤偏低';score=3;emoji='🟡';light='yellow';text='控盤'+control+'%'+insiderNote+'偏低，需搭配技術指標確認';}
  else{status='❌ 主力缺席';score=1;emoji='🔴';light='red';text='控盤僅'+control+'%，主力幾乎不在場';}
  // 等級文字
  if(score>=9)levelText='優質';
  else if(score>=6)levelText='尚可';
  else if(score>=4)levelText='普通';
  else if(score>=3)levelText='偏弱';
  else levelText='危險';
  return{status,score,text,emoji,light,rWarn,rDanger,control,levelText};
}

function mkValid(y){
  var ts=y.timestamp,q=y.indicators.quote[0],v=[];
  for(var i=0;i<ts.length;i++)
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i])
      v.push({c:q.close[i],o:q.open[i],h:q.high[i],l:q.low[i],v:q.volume[i],t:ts[i]});
  return v;
}
function calcOBV(va){
  var o=0;var a=[0];
  for(var i=1;i<va.length;i++){
    if(va[i].c>va[i-1].c)o+=va[i].v;
    else if(va[i].c<va[i-1].c)o-=va[i].v;
    a.push(o);
  }
  return a;
}
function calcMACD(va){
  var cl=va.map(function(d){return d.c;});
  function ema(a,k){var r=[a[0]],m=2/(k+1);for(var i=1;i<a.length;i++)r.push(a[i]*m+r[i-1]*(1-m));return r;}
  var e12=ema(cl,12),e26=ema(cl,26),ml=e12.map(function(v,i){return v-e26[i];}),sg=ema(ml,9),ht=ml.map(function(v,i){return v-sg[i];});
  var m=va.length;
  return{aboveZero:ml[m-1]>0,histShrink:Math.abs(ht[m-1])<Math.abs(ht[m-2]),macdDown:ml[m-1]<ml[Math.max(0,m-4)]};
}
function findTR(va){
  var m=va.length;
  var dt=null;
  for(var i=Math.max(10,m-180);i<m-20;i++){
    var top=true;
    for(var j=i-5;j<=i+5;j++){if(j===i||j<0||j>=m)continue;if(va[j].h>va[i].h){top=false;break;}}
    if(!top)continue;
    var tp=va[i].h,slc=va.slice(i+1,Math.min(i+60,m));
    if(!slc.length)continue;
    var mn=Math.min.apply(null,slc.map(function(x){return x.l;})),dd=(tp-mn)/tp*100;
    if(dd>=20&&tp>va[Math.max(0,i-30)].c*1.25)
      if(!dt||tp>dt.p)dt={idx:i,p:tp};
  }
  var st=dt?dt.idx:Math.max(0,m-90);
  var botIdx=st;
  for(var i=st;i<m;i++)if(va[i].l<va[botIdx].l)botIdx=i;
  var botP=va[botIdx].l;
  var newStart=botIdx;
  for(var i=botIdx+1;i<m-5;i++){
    if(va[i].h>botP*1.20){
      var nb=i;
      for(var j=i+1;j<m;j++)if(va[j].l<va[nb].l)nb=j;
      if(va[nb].l>botP*1.05){newStart=i;break;}
    }
  }
  var sc=null;
  for(var i=newStart;i<m-3;i++){
    var d=va[i],sl=va.slice(Math.max(0,i-20),i);
    if(sl.length<5)continue;
    var maxV=Math.max.apply(null,sl.map(function(x){return x.v;}));
    var drop=(d.c-va[i-1].c)/va[i-1].c*100,lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(d.v>maxV*0.45&&drop<-0.3&&rng>0&&lw>rng*0.08)
      if(!sc||d.l<sc.l)sc={idx:i,l:d.l,date:new Date(d.t*1000).toISOString().slice(0,10)};
  }
  if(!sc||va[m-1].c<sc.l*0.88){
    var mi=newStart;
    for(var i=newStart;i<m;i++)if(va[i].l<va[mi].l)mi=i;
    sc={idx:mi,l:va[mi].l,date:new Date(va[mi].t*1000).toISOString().slice(0,10)};
  }
  var arH=sc.l*1.02;
  for(var i=sc.idx+1;i<Math.min(sc.idx+10,m);i++)if(va[i].h>arH)arH=va[i].h;
  var trTop=arH*1.15;
  var trEnd=m-1,trEnded=false,bc=0;
  for(var i=sc.idx+11;i<m;i++){
    if(va[i].c>trTop){bc++;if(bc>=2){trEnd=i-1;trEnded=true;break;}}else bc=0;
  }
  return{sc,trTop,trEnd,trEnded};
}
function detectAccum(va){
  var m=va.length,tr=findTR(va),ob=calcOBV(va);
  var avg60=va.slice(-60).reduce(function(s,d){return s+d.v;},0)/Math.min(60,m);
  var n=0;
  var signalDates=[];
  for(var i=tr.sc.idx+1;i<=tr.trEnd;i++){
    var d=va[i];
    if(d.c>tr.trTop||d.c<tr.sc.l*0.93)continue;
    var s=0;
    if(i>=3&&d.c<va[i-3].c&&ob[i]>ob[i-3])s++;
    var bd=Math.abs(d.c-d.o),lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(rng>0&&lw>bd*0.8&&(d.c-d.l)/rng>0.4)s++;
    if(d.v/avg60>0.8&&Math.abs(d.c-d.o)/d.o*100<3)s++;
    if(i>=10){
      var p=va.slice(i-10,i),mx=Math.max.apply(null,p.map(function(x){return x.h;})),mn2=Math.min.apply(null,p.map(function(x){return x.l;}));
      if(mn2>0&&(mx-mn2)/mn2*100<25&&ob[i]>ob[i-10])s++;
    }
    if(d.l<tr.sc.l*1.08&&d.c>tr.sc.l*0.97&&i>=1&&ob[i]>=ob[i-1])s++;
    if(s>=2){n++;signalDates.push(new Date(d.t*1000).toISOString().slice(0,10));}
  }
  var cur=va[m-1].c,obvUp=ob[m-1]>ob[Math.max(0,m-20)];
  var dA=0,pA=0,bP=0;
  if(tr.trEnded){dA=m-1-tr.trEnd;bP=va[Math.min(tr.trEnd+1,m-1)].c;pA=Math.round((cur/bP-1)*100);}
  var sm=0;
  if(tr.trEnded&&n>=6)sm=6;
  else if(tr.trEnded&&n>=3)sm=5;
  else if(tr.trEnded)sm=3;
  else if(!tr.trEnded&&n>=5&&obvUp)sm=4;
  else if(!tr.trEnded&&n>=2)sm=2;
  var ma5=va.slice(-5).reduce(function(s,d){return s+d.c;},0)/5;
  var ma5p=va.slice(-6,-1).reduce(function(s,d){return s+d.c;},0)/5;
  var av5=va.slice(-5).reduce(function(s,d){return s+d.v;},0)/5;
  var av20=va.slice(-20).reduce(function(s,d){return s+d.v;},0)/20;
  var bigBuys=[],bigSells=[];
  var startIdx=Math.max(55,m-60);
  for(var i=startIdx;i<m;i++){
    var d=va[i];
    var avg50=va.slice(i-50,i).reduce(function(s,x){return s+x.v;},0)/50;
    var volRatio=d.v/avg50;
    var rng=d.h-d.l;
    var closePos=rng>0?(d.c-d.l)/rng:0.5;
    var chg=(d.c-d.o)/d.o*100;
    var dt=new Date(d.t*1000).toISOString().slice(0,10);
    if(volRatio>=1.5&&d.c>d.o&&closePos>=0.6)
      bigBuys.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2)});
    if(volRatio>=1.5&&d.c<d.o&&closePos<=0.4)
      bigSells.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2)});
  }
  return{tr,sm,n,signalDates,bigBuys,bigSells,
    cur:cur.toFixed(2),scP:tr.sc.l.toFixed(2),scD:tr.sc.date,
    trTop:tr.trTop.toFixed(2),trEnded:tr.trEnded,dA,pA,bP:bP.toFixed(2),
    ma5up:ma5>ma5p,volShrink:av5<av20*0.75,macd:calcMACD(va),obvUp};
}

function buildCondTxt(a,macdOk,buy15,buy30){
  var trTop='$'+a.trTop;
  if(a.trEnded){
    if(a.ma5up&&macdOk&&buy15.length>0) return '突破後動能強勁且有大單支撐，可持倉續抱；量能持續放大可考慮加碼。';
    else if(a.ma5up&&macdOk) return '突破後動能仍在，可持倉觀察；若MA5下彎或量能萎縮，考慮減倉。';
    else if(a.macd.aboveZero&&!a.ma5up) return 'MACD仍在零軸上但MA5下彎，短期走弱整理，等MA5重新向上再加碼。';
    else if(!a.macd.aboveZero) return '突破後MACD跌回零軸下，動能轉弱，建議減倉觀望，等重新站上零軸。';
    else return '突破後動能減弱，等回測 '+trTop+' 附近量縮後放量確認，再考慮加碼。';
  } else {
    if(a.macd.aboveZero&&a.ma5up&&buy15.length>0) return 'MACD已翻上零軸、MA5向上且有大單買入，主力正在建倉！可考慮輕倉佈局，放量突破 '+trTop+' 後加碼。';
    else if(a.macd.aboveZero&&a.ma5up) return 'MACD已翻上零軸且MA5向上，動能轉強。等放量突破 '+trTop+' 確認主力發動後進場。';
    else if(a.macd.aboveZero&&!a.ma5up) return 'MACD已翻上零軸但MA5仍下彎，動能轉正初期。等MA5也向上後，放量突破 '+trTop+' 再進場。';
    else if(buy30.length>0) return '底部有大單買入痕跡，主力可能悄悄吸籌。但MACD尚未翻正，繼續等待：MACD翻上零軸＋放量突破 '+trTop+' 再進場。';
    else return 'MACD尚在零軸下，主力還未明顯發動。耐心等待：MACD翻上零軸＋放量突破 '+trTop+' 確認後再進場。';
  }
}

async function runAccum(){

  el.innerHTML='<div class="loading"><span class="spin"></span>分析 '+sym+' 中，請稍候...</div>';
  try{
    var results=await Promise.allSettled([
      fYahoo(sym),
      fHub('/stock/insider-transactions?symbol='+sym),
      fHub('/stock/insider-sentiment?symbol='+sym+'&from=2024-01-01&to=2099-01-01')
    ]);
    var yRaw=results[0],insRaw=results[1],msprRaw=results[2];
    if(yRaw.status!=='fulfilled')throw new Error('無法取得股價數據');
    var va=mkValid(yRaw.value);

    var a=detectAccum(va);

    var msprData=(msprRaw.status==='fulfilled'?msprRaw.value:{})||{};
    var sixAgo=Date.now()/1000-180*86400;
    var trades=((insData.data)||[]).filter(function(t){
      try{return new Date(t.transactionDate).getTime()/1000>sixAgo;}catch(e){return false;}
    });
    var buys=trades.filter(function(t){return t.change>0;}).length;
    var sells=trades.filter(function(t){return t.change<0;}).length;
    var sellAmt=trades.filter(function(t){return t.change<0;}).reduce(function(s,t){return s+Math.abs((t.change||0)*(t.transactionPrice||+a.cur));},0);
    var msprArr=(msprData&&msprData.data&&Array.isArray(msprData.data))?msprData.data:[];
    var msprVal=msprArr.length?msprArr[msprArr.length-1].monthlyMSPR:null;

    var macdOk=a.macd.aboveZero&&!a.macd.histShrink&&!a.macd.macdDown;
    var now15=Date.now()/1000-15*86400,now30=Date.now()/1000-30*86400;
    var buy15=a.bigBuys.filter(function(s){return new Date(s.date).getTime()/1000>now15;});

  var body=document.getElementById(bodyId);

  var open=body.classList.toggle('open');

    h+='</div>';
    h+='<div style="display:flex;gap:6px;align-items:center;margin-top:8px;">';
    h+='<span style="font-size:12px;color:#a09070;">放空比例%</span><input class="num" id="csf-'+st.sym+'" placeholder="0" value="'+sf+'" style="width:70px;">';
    h+='<span style="font-size:11px;color:#bbb;">Short Float %</span>';
    h+='</div>';
    h+='<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">';
    h+='<button class="btn" style="padding:7px 14px;font-size:12px;" onclick="saveChipStock(\''+st.sym+'\',\''+s+'\')">儲存</button>';
    h+='<button class="btn-sm" onclick="addToWatchlistFromChip(\''+st.sym+'\')">⭐ 加入觀察清單</button>';
    // 移動板塊
    h+='<select id="movesel-'+st.sym+'" class="sector-select" style="flex:1;padding:6px;font-size:12px;">';
    Object.keys(SECTORS).forEach(function(sec){
      h+='<option value="'+sec+'"'+(sec===s?' selected':'')+'>'+sec+'</option>';
    });
    h+='</select>';
    h+='<button class="btn-sm" onclick="moveStock(\''+st.sym+'\',\''+s+'\',document.getElementById(\'movesel-'+st.sym+'\').value)">移至</button>';
    h+='<button class="btn-red" onclick="deleteStock(\''+st.sym+'\',\''+s+'\')">刪除</button>';
    h+='</div>';
    if(last){
      var chip2=chipAnalysis(last.cap||'M',last.i,last.r,last.n||0);
      h+='<div style="margin-top:10px;padding:8px 10px;background:#fffbec;border-radius:8px;font-size:12px;color:#5a4010;">';
      h+='<b>'+chip2.emoji+' '+chip2.status+'</b> — '+chip2.text;
      if(sf>=15) h+=' | ⚡放空'+sf+'%有軋空潛力';
      h+='</div>';
    }
    if(hist.length>1){
      h+='<div style="margin-top:10px;">';
      h+='<div style="font-size:10px;color:#c0a870;font-weight:700;margin-bottom:5px;">📅 籌碼歷史記錄</div>';
      hist.slice().reverse().forEach(function(rec,idx){
        var prev=hist[hist.length-2-idx];
        var trend='',trendColor='#aaa';
        if(prev&&rec.r!=null&&prev.r!=null){
          var diff=rec.r-prev.r;
          if(diff<0){trend='散戶↓'+Math.abs(diff).toFixed(0)+'%';trendColor='#2ea86e';}
          else if(diff>0){trend='散戶↑'+diff.toFixed(0)+'%';trendColor='#d94f4f';}
          else{trend='持平';}
        }
        h+='<div class="chip-hist-row">';
        h+='<span style="color:#bbb;width:80px;">'+rec.d+'</span>';
        h+='<span style="color:#333;font-weight:600;">機'+rec.i+'% 散'+rec.r+'%</span>';
        if(rec.sf) h+='<span style="color:#888;margin-left:4px;">空'+rec.sf+'%</span>';
        h+='<span style="color:'+trendColor+';font-weight:600;margin-left:8px;">'+trend+'</span>';
        h+='</div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function toggleChipInput(sym){
  expandedSym=expandedSym===sym?null:sym;
  showChipStocks(chipCurrentSector);
}
function selectCap(sym,cap){
  selectedCap[sym]=cap;
  var btns=document.getElementById('capbtns-'+sym);
  if(btns){
    btns.querySelectorAll('.cap-btn').forEach(function(b,i){
      b.classList.toggle('active',['S','M','L','XL','XXL'][i]===cap);
    });
  }
}
function saveChipStock(sym,sector){
  var i=parseFloat(document.getElementById('ci-'+sym).value);
  var r=parseFloat(document.getElementById('cr-'+sym).value);
  var n=parseFloat(document.getElementById('cn-'+sym).value)||0;
  var sf=parseFloat(document.getElementById('csf-'+sym).value)||0;
  var cap=selectedCap[sym]||(function(){
    var hist=chipLoadWithStorage(sym);
    return hist.length?hist[hist.length-1].cap||'M':'M';
  })();
  if(isNaN(i)||isNaN(r)){alert('請輸入有效的機構%和散戶%');return;}
  chipSave(sym,i,r,n,cap,sf);
  expandedSym=null;
  showChipStocks(sector||chipCurrentSector);
}
function addToWatchlistFromChip(sym){
  var added=toggleWatchlistItem(sym);
  alert(added?'✅ 已將 '+sym+' 加入觀察清單':'已從觀察清單移除 '+sym);
}
function showBestList(){
  var el=document.getElementById('bestListOut');
  var all=[];
  Object.keys(SECTORS).forEach(function(s){
    SECTORS[s].forEach(function(st){
      var hist=chipLoadWithStorage(st.sym);
      if(!hist.length)return;
      var last=hist[hist.length-1];
      var chip=chipAnalysis(last.cap||'M',last.i,last.r,last.n||0);
      var daysAgo=Math.floor((Date.now()-new Date(last.d).getTime())/86400000);
      all.push({sym:st.sym,sector:s,score:chip.score,status:chip.status,levelText:chip.levelText,
        emoji:chip.emoji,light:chip.light,inst:last.i,retail:last.r,
        sf:last.sf||0,date:last.d,daysAgo,stale:daysAgo>90});
    });
  });
  var seen={};
  var uniq=all.filter(function(x){if(seen[x.sym])return false;seen[x.sym]=true;return true;});
  uniq.sort(function(a,b){return b.score-a.score;});
  if(!uniq.length){
    el.innerHTML='<div class="card"><div style="padding:20px;text-align:center;color:#aaa;font-size:13px;">尚無籌碼數據</div></div>';
    return;
  }
  var h='<div class="best-list">';
  h+='<div class="best-hdr"><span style="font-size:13px;font-weight:700;color:#8a6e2f;">🏆 籌碼最佳名單</span>';
  h+='<span style="font-size:11px;color:#bbb;">共'+uniq.length+'檔，按評分排序</span></div>';
  uniq.forEach(function(x){
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f5eed8;">';
    h+='<div><span style="font-family:monospace;font-weight:700;font-size:14px;color:#1a1a2e;cursor:pointer;" onclick="quickAnalyze(\''+x.sym+'\')">'+x.sym+'</span>';
    h+='<span style="font-size:11px;color:#888;margin-left:6px;">'+x.sector+'</span>';
    if(x.sf>=15) h+='<span style="font-size:10px;color:#c8952a;margin-left:4px;">⚡空'+x.sf+'%</span>';
    h+='</div>';
    h+='<span class="chip-badge badge-'+x.light+'">'+x.emoji+' '+x.score+'/10 '+(x.levelText||'')+'</span>';
    h+='<span style="font-size:11px;color:#a09070;">機'+x.inst+'% 散'+x.retail+'%</span>';
    h+='<span style="font-size:10px;color:'+(x.stale?'#d94f4f':'#ccc')+';">'+x.date+'</span>';
    h+='</div>';
  });
  h+='</div>';
  el.innerHTML=h;
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

initAccumSectors();
</script>
