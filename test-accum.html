var currentSector='太空衛星';

// ── 五等級市值籌碼分析 ──
function chipAnalysis(capB, inst, retail){
  var grade;
  if(capB<20) grade='S';
  else if(capB<100) grade='M';
  else if(capB<500) grade='L';
  else if(capB<2000) grade='XL';
  else grade='XXL';
  const limits={S:[15,25],M:[20,35],L:[15,25],XL:[12,20],XXL:[10,15]};
  const [rWarn,rDanger]=limits[grade];
  const gradeLabel={S:'S級(<20B)',M:'M級(20-100B)',L:'L級(100-500B)',XL:'XL級(500-2000B)',XXL:'XXL級(>2000B)'};
  var status,score,text,emoji;
  if(inst>90){
    status='⚠️ 機構過度集中';score=1;emoji='🟡';
    text='機構'+inst+'%過高，已被充分發掘，飆漲空間有限';
  } else if(inst>=60){
    if(retail<=rWarn){status='✅ 籌碼甜蜜點';score=3;emoji='🟢';text='機構'+inst+'%在甜蜜點，散戶僅'+retail+'%，主力控盤良好 ✅';}
    else if(retail<=rDanger){status='🟡 尚可觀察';score=2;emoji='🟡';text='機構'+inst+'%尚可，散戶'+retail+'%略偏高，需觀察';}
    else{status='🟠 散戶偏多';score=1;emoji='🟠';text='機構'+inst+'%但散戶'+retail+'%已超標（'+gradeLabel[grade]+'上限'+rDanger+'%），拉抬難度增加';}
  } else if(inst>=40){
    status='🟡 機構偏低';score=1;emoji='🟡';
    text='機構'+inst+'%偏低，主力介入不足，需搭配技術指標確認';
  } else {
    status='❌ 主力缺席';score=0;emoji='🔴';
    text='機構僅'+inst+'%，散戶'+retail+'%，主力幾乎不在場，難以拉抬';
  }
  return{grade:gradeLabel[grade],status,score,text,emoji,rWarn,rDanger};
}

// ── 籌碼存取（記憶體快取，不用localStorage）──
function chipLoad(sym){
  return chipCache[sym]||[];
}
function chipSave(sym,inst,ret,ins){
  var hist=chipLoad(sym);
  var today=new Date().toISOString().slice(0,10);
  var f=hist.filter(h=>h.d!==today);
  f.push({d:today,i:inst,r:ret,n:ins});
  if(f.length>8) f.splice(0,f.length-8);
  chipCache[sym]=f;
  // 嘗試localStorage，失敗也不影響功能
  try{ localStorage.setItem('chip_'+sym, JSON.stringify(f)); }catch(e){}
  return f;
}
function chipLoadWithStorage(sym){
  // 先從localStorage讀（有的話），再fallback到記憶體
  try{
    var s=localStorage.getItem('chip_'+sym);
    if(s){ var d=JSON.parse(s); chipCache[sym]=d; return d; }
  }catch(e){}
  return chipCache[sym]||[];
}

// ── API ──
async function fYahoo(s){
  const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(
    'https://query1.finance.yahoo.com/v8/finance/chart/'+s+'?interval=1d&range=1y'));
  const d=await r.json();
  if(!d.chart||!d.chart.result||!d.chart.result[0]) throw new Error('無法取得'+s+'的股價數據');
  return d.chart.result[0];
}
async function fHub(ep){
  try{
    const r=await fetch('https://finnhub.io/api/v1'+ep+'&token='+K);
    if(!r.ok) return{};
    return r.json();
  }catch(e){return{};}
}

function mkValid(y){
  const ts=y.timestamp,q=y.indicators.quote[0],v=[];
  for(let i=0;i<ts.length;i++)
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i])
      v.push({c:q.close[i],o:q.open[i],h:q.high[i],l:q.low[i],v:q.volume[i],t:ts[i]});
  return v;
}

function calcOBV(va){
  let o=0;const a=[0];
  for(let i=1;i<va.length;i++){
    if(va[i].c>va[i-1].c) o+=va[i].v;
    else if(va[i].c<va[i-1].c) o-=va[i].v;
    a.push(o);
  }
  return a;
}

function calcMACD(va){
  const cl=va.map(d=>d.c);
  function ema(a,k){const r=[a[0]],m=2/(k+1);for(let i=1;i<a.length;i++)r.push(a[i]*m+r[i-1]*(1-m));return r;}
  const e12=ema(cl,12),e26=ema(cl,26),ml=e12.map((v,i)=>v-e26[i]),sg=ema(ml,9),ht=ml.map((v,i)=>v-sg[i]);
  const m=va.length;
  return{
    aboveZero:ml[m-1]>0,
    histShrink:Math.abs(ht[m-1])<Math.abs(ht[m-2]),
    macdDown:ml[m-1]<ml[Math.max(0,m-4)]
  };
}

function findTR(va){
  const m=va.length,cur=va[m-1].c;
  let dt=null;
  for(let i=Math.max(10,m-180);i<m-20;i++){
    let top=true;
    for(let j=i-5;j<=i+5;j++){if(j===i||j<0||j>=m)continue;if(va[j].h>va[i].h){top=false;break;}}
    if(!top)continue;
    const tp=va[i].h,slc=va.slice(i+1,Math.min(i+60,m));
    if(!slc.length)continue;
    const mn=Math.min(...slc.map(x=>x.l)),dd=(tp-mn)/tp*100;
    if(dd>=20&&tp>va[Math.max(0,i-30)].c*1.25)
      if(!dt||tp>dt.p) dt={idx:i,p:tp,date:new Date(va[i].t*1000).toISOString().slice(0,10)};
  }
  const st=dt?dt.idx:Math.max(0,m-90);
  let botIdx=st;
  for(let i=st;i<m;i++) if(va[i].l<va[botIdx].l) botIdx=i;
  const botP=va[botIdx].l;
  let newStart=botIdx;
  for(let i=botIdx+1;i<m-5;i++){
    if(va[i].h>botP*1.20){
      let nb=i;
      for(let j=i+1;j<m;j++) if(va[j].l<va[nb].l) nb=j;
      if(va[nb].l>botP*1.05){newStart=i;break;}
    }
  }
  let sc=null;
  for(let i=newStart;i<m-3;i++){
    const d=va[i],sl=va.slice(Math.max(0,i-20),i);
    if(sl.length<5)continue;
    const maxV=Math.max(...sl.map(x=>x.v));
    const drop=(d.c-va[i-1].c)/va[i-1].c*100,lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(d.v>maxV*0.45&&drop<-0.3&&rng>0&&lw>rng*0.08)
      if(!sc||d.l<sc.l) sc={idx:i,l:d.l,date:new Date(d.t*1000).toISOString().slice(0,10)};
  }
  if(!sc||cur<sc.l*0.88){
    let mi=newStart;
    for(let i=newStart;i<m;i++) if(va[i].l<va[mi].l) mi=i;
    sc={idx:mi,l:va[mi].l,date:new Date(va[mi].t*1000).toISOString().slice(0,10)};
  }
  let arH=sc.l*1.02;
  for(let i=sc.idx+1;i<Math.min(sc.idx+10,m);i++) if(va[i].h>arH) arH=va[i].h;
  const trTop=arH*1.15;
  let trEnd=m-1,trEnded=false,bc=0;
  for(let i=sc.idx+11;i<m;i++){
    if(va[i].c>trTop){bc++;if(bc>=2){trEnd=i-1;trEnded=true;break;}}else bc=0;
  }
  return{sc,trTop,trEnd,trEnded};
}

function detectAccum(va){
  const m=va.length,tr=findTR(va),ob=calcOBV(va);
  const avg60=va.slice(-60).reduce((s,d)=>s+d.v,0)/Math.min(60,m);
  let n=0;
  for(let i=tr.sc.idx+1;i<=tr.trEnd;i++){
    const d=va[i];
    if(d.c>tr.trTop||d.c<tr.sc.l*0.93)continue;
    let s=0;
    if(i>=3&&d.c<va[i-3].c&&ob[i]>ob[i-3])s++;
    const bd=Math.abs(d.c-d.o),lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(rng>0&&lw>bd*0.8&&(d.c-d.l)/rng>0.4)s++;
    if(d.v/avg60>0.8&&Math.abs(d.c-d.o)/d.o*100<3)s++;
    if(i>=10){
      const p=va.slice(i-10,i),mx=Math.max(...p.map(x=>x.h)),mn2=Math.min(...p.map(x=>x.l));
      if(mn2>0&&(mx-mn2)/mn2*100<25&&ob[i]>ob[i-10])s++;
    }
    if(d.l<tr.sc.l*1.08&&d.c>tr.sc.l*0.97&&i>=1&&ob[i]>=ob[i-1])s++;
    if(s>=2)n++;
  }
  const cur=va[m-1].c,obvUp=ob[m-1]>ob[Math.max(0,m-20)];
  let dA=0,pA=0,bP=0;
  if(tr.trEnded){
    dA=m-1-tr.trEnd;
    bP=va[Math.min(tr.trEnd+1,m-1)].c;
    pA=Math.round((cur/bP-1)*100);
  }
  let sm=0;
  if(tr.trEnded&&n>=6)sm=6;
  else if(tr.trEnded&&n>=3)sm=5;
  else if(tr.trEnded)sm=3;
  else if(!tr.trEnded&&n>=5&&obvUp)sm=4;
  else if(!tr.trEnded&&n>=2)sm=2;
  const ma5=va.slice(-5).reduce((s,d)=>s+d.c,0)/5;
  const ma5p=va.slice(-6,-1).reduce((s,d)=>s+d.c,0)/5;
  const av5=va.slice(-5).reduce((s,d)=>s+d.v,0)/5;
  const av20=va.slice(-20).reduce((s,d)=>s+d.v,0)/20;
  return{
    tr,sm,n,cur:cur.toFixed(2),
    scP:tr.sc.l.toFixed(2),scD:tr.sc.date,
    trTop:tr.trTop.toFixed(2),
    trEnded:tr.trEnded,dA,
    pA,bP:bP.toFixed(2),
    ma5up:ma5>ma5p,
    volShrink:av5<av20*0.75,
    macd:calcMACD(va),
    obvUp
  };
}

function calcScore(sm,ma5up,macdOk,volOk,chipScore,buys,sells){
  let s=0;
  if(sm>=5)s+=3;else if(sm>=3)s+=2;else if(sm>=1)s+=1;
  s+=[ma5up,macdOk,volOk].filter(Boolean).length;
  s+=chipScore;
  if(buys>sells&&buys>0)s+=1;
  else if(!(sells>buys*3))s+=1;
  return Math.min(s,10);
}

// ── 吸籌分析主函數 ──
async function runAccum(){
  const sym=document.getElementById('sym').value.toUpperCase().trim();
  if(!sym)return;
  const el=document.getElementById('accumOut');
  el.innerHTML='<div class="loading"><span class="spin"></span>分析 '+sym+'...</div>';
  try{
    const [yRaw,insRaw,msprRaw]=await Promise.allSettled([
      fYahoo(sym),
      fHub('/stock/insider-transactions?symbol='+sym),
      fHub('/stock/insider-sentiment?symbol='+sym+'&from=2024-01-01&to=2099-01-01')
    ]);
    if(yRaw.status!=='fulfilled') throw new Error('無法取得股價數據');
    const va=mkValid(yRaw.value);
    if(va.length<30) throw new Error('數據不足');
    const a=detectAccum(va);
    const insData=(insRaw.status==='fulfilled'?insRaw.value:{})||{};
    const msprData=(msprRaw.status==='fulfilled'?msprRaw.value:{})||{};
    const sixAgo=Date.now()/1000-180*86400;
    const trades=((insData.data)||[]).filter(t=>{
      try{return new Date(t.transactionDate).getTime()/1000>sixAgo;}catch(e){return false;}
    });
    const buys=trades.filter(t=>t.change>0).length;
    const sells=trades.filter(t=>t.change<0).length;
    const sellAmt=trades.filter(t=>t.change<0).reduce((s,t)=>s+Math.abs((t.change||0)*(t.transactionPrice||+a.cur)),0);

    // 修復：mspr 安全取值，避免 undefined.toFixed 錯誤
    const msprArr=(msprData&&msprData.data&&Array.isArray(msprData.data))?msprData.data:[];
    const msprVal=msprArr.length?msprArr[msprArr.length-1].monthlyMSPR:null;
    const mspr=(typeof msprVal==='number'&&isFinite(msprVal))?msprVal:null;

    const chipHist=chipLoadWithStorage(sym);
    const lastChip=chipHist.length?chipHist[chipHist.length-1]:null;
    const retail=lastChip?lastChip.r:null;
    const inst=lastChip?lastChip.i:null;
    const insider=lastChip?lastChip.n:0;
    let chip=null,chipScore=1;
    if(inst!==null&&retail!==null){
      chip=chipAnalysis(50,inst,retail);
      chipScore=chip.score;
    }
    const macdOk=a.macd.aboveZero&&!a.macd.histShrink&&!a.macd.macdDown;
    const score=calcScore(a.sm,a.ma5up,macdOk,!a.volShrink,chipScore,buys,sells);
    let vc,vt,vtc,vs;
    if(score>=8){vc='vb-g';vt='✅ 強力信號，建倉 50–70%';vtc='vt-g';vs='四項指標正面，主力控盤籌碼乾淨，可積極佈局。';}
    else if(score>=6){vc='vb-y';vt='🟡 偏多，輕倉試探 20–30%';vtc='vt-y';vs='多數指標正面，可小量試探，等確認訊號再加碼。';}
    else if(score>=4){vc='vb-o';vt='⚠️ 訊號混亂，最多試水 10%';vtc='vt-o';vs='正負訊號混雜，若參與控制一成以內，嚴設停損。';}
    else{vc='vb-r';vt='❌ 暫時觀望，空手等待';vtc='vt-r';vs='多項警訊出現，目前不宜進場，等待訊號改善。';}
    let moTxt='';
    if(a.ma5up&&macdOk&&!a.volShrink)moTxt='主力持續推升，動能強勁';
    else if(!a.ma5up&&a.volShrink&&a.macd.histShrink)moTxt='MA5下彎+量縮+MACD走弱，主力暫停觀望';
    else if(!a.ma5up)moTxt='MA5下彎，短期走弱，等待企穩';
    else moTxt='動能中性，持續觀察';
    let insTxt='近半年無明顯內部人交易';
    if(buys>0||sells>0){
      if(buys>sells)insTxt='買入'+buys+'次 > 賣出'+sells+'次，高層看好 ✅';
      else if(sells>buys*3)insTxt='賣出'+sells+'次遠多於買入'+buys+'次，高層大量出脫 ❌';
      else insTxt='買入'+buys+'次，賣出'+sells+'次，偏中性';
    }
    const smStr=a.sm>0?'😊'.repeat(a.sm):'—';
    const smLabel=['無明顯吸籌','','輕微吸籌','突破但吸籌少','吸籌進行中','吸籌後突破','吸籌滿格'][a.sm];
    const smColor=a.sm>=5?'#50c878':a.sm>=3?'#c8a84b':'#dc5050';
    let h='<div class="card">';
    h+='<div class="ch"><span class="tk">'+sym+'</span><span class="px">$'+a.cur+'</span></div>';
    h+='<div class="sf"><div class="sm">'+smStr+' <span style="font-size:13px;color:#555;font-family:monospace;">'+a.sm+'/6</span></div>';
    h+='<div class="sl">吸籌強度：'+smLabel+'（TR內偵測到 '+a.n+' 個主力買入訊號）</div>';
    h+='<div class="pb"><div class="pf" style="width:'+Math.round(a.sm/6*100)+'%;background:'+smColor+';"></div></div></div>';
    h+='<div class="sc"><div class="st">📈 技術動能</div>';
    h+='<div class="rw"><span class="lb">主力成本底部</span><span class="vl">$'+a.scP+' <span style="color:#444;font-size:10px;">'+a.scD+'</span></span></div>';
    h+='<div class="rw"><span class="lb">TR突破上限</span><span class="vl">$'+a.trTop+'</span></div>';
    h+='<div class="rw"><span class="lb">TR狀態</span><span class="vl">'+(a.trEnded?'✅ 突破後第'+a.dA+'天 +'+a.pA+'%':'🔄 底部震盪中')+'</span></div>';
    h+='<div class="rw"><span class="lb">MA5</span><span class="bg '+(a.ma5up?'gu':'gd')+'">'+(a.ma5up?'↑ 向上':'↓ 下彎')+'</span></div>';
    h+='<div class="rw"><span class="lb">MACD動能</span><span class="bg '+(macdOk?'gu':a.macd.histShrink?'gw':'gd')+'">'+(a.macd.aboveZero?(a.macd.histShrink?'零軸上柱縮':'強勢'):'零軸下走弱')+'</span></div>';
    h+='<div class="rw"><span class="lb">量能</span><span class="bg '+(a.volShrink?'gw':'gu')+'">'+(a.volShrink?'量縮（主力觀望）':'量能正常')+'</span></div>';
    h+='<div class="note">'+moTxt+'</div></div>';
    h+='<div class="sc"><div class="st">📊 籌碼結構</div>';
    if(chip&&inst!==null){
      const tot=Math.min((inst||0)+(retail||0)+(insider||0),100)||100;
      h+='<div class="cb"><div class="ci2" style="width:'+(inst/tot*100).toFixed(1)+'%;"></div>';
      h+='<div class="cn2" style="width:'+((insider||0)/tot*100).toFixed(1)+'%;"></div>';
      h+='<div class="cr2" style="width:'+((retail||0)/tot*100).toFixed(1)+'%;"></div></div>';
      h+='<div class="cl"><span><div class="cd" style="background:#4a9eff;"></div>機構 '+inst+'%</span>';
      h+='<span><div class="cd" style="background:#c8a84b;"></div>內部人 '+(insider||0)+'%</span>';
      h+='<span><div class="cd" style="background:#dc5050;"></div>散戶 '+retail+'%</span></div>';
      h+='<div class="note" style="margin-top:6px;">'+chip.status+' — '+chip.text+'</div>';
      if(chipHist.length>1){
        h+='<div class="hist">';
        chipHist.slice(-6).forEach((c,i)=>{
          const prev=chipHist[i-1];
          const arr=prev&&c.r!=null&&prev.r!=null?(c.r<prev.r?' ↓':c.r>prev.r?' ↑':' →'):'';
          h+='<div class="hi">'+c.d.slice(5)+' <span>散戶'+c.r+'%'+arr+'</span></div>';
        });
        h+='</div>';
      }
    } else {
      h+='<div class="note">尚無籌碼數據，請至 <a href="https://www.wallstreetzen.com/stocks/us/nasdaq/'+sym.toLowerCase()+'/ownership" target="_blank" style="color:#c8a84b;">WallStreetZen</a> 查詢後輸入：</div>';
    }
    h+='<div style="margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">';
    h+='<span style="font-size:11px;color:#555;">機構%</span><input class="num" id="ci" placeholder="75">';
    h+='<span style="font-size:11px;color:#555;">散戶%</span><input class="num" id="cr" placeholder="15">';
    h+='<span style="font-size:11px;color:#555;">內部人%</span><input class="num" id="cn" placeholder="10">';
    h+='<button class="btn-sm" onclick="saveChip(\''+sym+'\')">儲存</button></div></div>';
    h+='<div class="sc"><div class="st">👔 內部人士交易（近6個月）</div>';
    h+='<div class="ig"><div class="ib ib-b"><div class="inn">'+buys+'</div><div class="is">買入次數</div></div>';
    h+='<div class="ib ib-s"><div class="inn">'+sells+'</div><div class="is">賣出次數</div></div></div>';
    if(sellAmt>1000) h+='<div class="rw" style="margin-top:6px;"><span class="lb">估計套現</span><span class="vl" style="color:#dc5050;">$'+(sellAmt/1e6).toFixed(1)+'M</span></div>';
    // 修復：mspr 安全顯示
    if(mspr!==null) h+='<div class="rw"><span class="lb">MSPR情緒</span><span class="bg '+(mspr>10?'gu':mspr<-10?'gd':'gn')+'">'+(mspr>10?'看多':mspr<-10?'看空':'中性')+' ('+mspr.toFixed(0)+')</span></div>';
    h+='<div class="note" style="margin-top:6px;">'+insTxt+'</div></div>';
    h+='<div class="vd"><div class="vb '+vc+'">';
    h+='<div class="vt '+vtc+'">'+vt+'</div>';
    h+='<div style="font-size:13px;color:#888;margin-bottom:4px;">總評分：'+score+'/10</div>';
    h+='<div class="vs">'+vs+'</div></div></div>';
    h+='</div>';
    el.innerHTML=h;
  }catch(e){
    el.innerHTML='<div class="err">❌ '+e.message+'</div>';
  }
}

function saveChip(sym){
  const i=parseFloat(document.getElementById('ci').value);
  const r=parseFloat(document.getElementById('cr').value);
  const n=parseFloat(document.getElementById('cn').value)||0;
  if(isNaN(i)||isNaN(r)){alert('請輸入有效的機構%和散戶%');return;}
  chipSave(sym,i,r,n);
  runAccum();
}

// ── 籌碼雷達 ──
function initChipPage(){
  const btns=document.getElementById('sectorBtns');
  btns.innerHTML='';
  Object.keys(SECTORS).forEach(s=>{
    const b=document.createElement('div');
    b.className='sbt'+(s===currentSector?' active':'');
    b.textContent=s;
    b.onclick=()=>{
      currentSector=s;
      document.querySelectorAll('.sbt').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      showSector(s);
    };
    btns.appendChild(b);
  });
  showSector(currentSector);
}

function showSector(s){
  const el=document.getElementById('sectorOut');
  const stocks=SECTORS[s]||[];
  if(!stocks.length){
    el.innerHTML='<div class="card"><div style="padding:16px;color:#666;font-size:13px;">此板塊暫無數據</div></div>';
    return;
  }
  let h='<div class="card"><div class="ch"><span style="font-size:13px;font-weight:700;color:#c8a84b;">'+s+'板塊</span></div><div style="padding:4px 16px;">';
  h+='<div style="display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;">';
  h+='<button class="btn-sm" onclick="filterSector(\'all\')">全部</button>';
  h+='<button class="btn-sm" onclick="filterSector(\'safe\')">✅ 合格</button>';
  h+='<button class="btn-sm" onclick="filterSector(\'warn\')">🟡 警戒</button>';
  h+='<button class="btn-sm" onclick="filterSector(\'danger\')">❌ 危險</button>';
  h+='</div><div id="stockList">';
  stocks.forEach(st=>{
    const chip=chipAnalysis(50,st.inst,st.ret);
    h+='<div class="stk-row" data-status="'+chip.emoji+'">';
    h+='<span class="stk-nm">'+st.sym+'</span>';
    h+='<span class="stk-bar"><div class="bar-wrap">';
    const tot=Math.min(st.inst+st.ret,100)||100;
    h+='<div class="bar-i" style="width:'+(st.inst/tot*100).toFixed(1)+'%;"></div>';
    h+='<div class="bar-r" style="width:'+(st.ret/tot*100).toFixed(1)+'%;"></div>';
    h+='</div></span>';
    h+='<span class="stk-tag" style="color:'+(chip.emoji==='🟢'?'#50c878':chip.emoji==='🟡'?'#c8a84b':'#dc5050')+';">'+chip.emoji+' 機'+st.inst+'% 散'+st.ret+'%</span>';
    h+='</div>';
  });
  h+='</div></div></div>';
  el.innerHTML=h;
}

function filterSector(type){
  document.querySelectorAll('.stk-row').forEach(r=>{
    const em=r.dataset.status;
    if(type==='all') r.style.display='';
    else if(type==='safe') r.style.display=em==='🟢'?'':'none';
    else if(type==='warn') r.style.display=(em==='🟡'||em==='🟠')?'':'none';
    else if(type==='danger') r.style.display=em==='🔴'?'':'none';
  });
}

// ── 個股籌碼查詢（修復：使用chipLoadWithStorage）──
function showChipDetail(){
  const sym=document.getElementById('chipSym').value.toUpperCase().trim();
  if(!sym)return;
  const el=document.getElementById('chipDetailOut');
  const hist=chipLoadWithStorage(sym);
  const last=hist.length?hist[hist.length-1]:null;
  let h='<div style="padding:12px 16px;">';
  if(last){
    const chip=chipAnalysis(50,last.i,last.r);
    h+='<div class="rw"><span class="lb">機構</span><span class="vl">'+last.i+'%</span></div>';
    h+='<div class="rw"><span class="lb">散戶</span><span class="vl">'+last.r+'%</span></div>';
    h+='<div class="rw"><span class="lb">內部人</span><span class="vl">'+(last.n||0)+'%</span></div>';
    h+='<div class="rw"><span class="lb">籌碼評估</span><span class="bg '+(chip.emoji==='🟢'?'gu':chip.emoji==='🔴'?'gd':'gw')+'">'+chip.status+'</span></div>';
    h+='<div class="note" style="margin-top:6px;">'+chip.text+'</div>';
    if(hist.length>1){
      h+='<div style="font-size:10px;color:#555;margin-top:10px;margin-bottom:6px;">歷史趨勢（散戶%）</div>';
      hist.forEach((c,i)=>{
        const prev=hist[i-1];
        const diff=prev&&c.r!=null&&prev.r!=null?c.r-prev.r:null;
        const arr=diff===null?'':diff<0?'↓ -'+Math.abs(diff).toFixed(1)+'%':diff>0?'↑ +'+diff.toFixed(1)+'%':'→';
        const col=diff===null?'#666':diff<0?'#50c878':diff>0?'#dc5050':'#888';
        h+='<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px;">';
        h+='<span style="color:#555;width:70px;">'+c.d+'</span>';
        h+='<span style="font-family:monospace;color:#c8c8d8;">散戶 '+c.r+'%</span>';
        h+='<span style="color:'+col+';">'+arr+'</span></div>';
      });
    }
  } else {
    h+='<div class="note">尚無 '+sym+' 的籌碼記錄，請先在吸籌分析頁輸入數據後儲存</div>';
  }
  h+='<div style="margin-top:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">';
  h+='<span style="font-size:11px;color:#555;">更新籌碼 機構%</span><input class="num" id="dci" placeholder="75">';
  h+='<span style="font-size:11px;color:#555;">散戶%</span><input class="num" id="dcr" placeholder="15">';
  h+='<span style="font-size:11px;color:#555;">內部人%</span><input class="num" id="dcn" placeholder="10">';
  h+='<button class="btn-sm" onclick="saveChipDirect(\''+sym+'\')">儲存</button></div>';
  h+='</div>';
  el.innerHTML=h;
}

function saveChipDirect(sym){
  const i=parseFloat(document.getElementById('dci').value);
  const r=parseFloat(document.getElementById('dcr').value);
  const n=parseFloat(document.getElementById('dcn').value)||0;
  if(isNaN(i)||isNaN(r)){alert('請輸入有效數據');return;}
  chipSave(sym,i,r,n);
  showChipDetail();
}

// 頁面載入時自動跑LUNR
runAccum();
</script>
