<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#f5f0e8;font-family:'Helvetica Neue',sans-serif;padding:16px;color:#1a1a2e;}

<body>
<div class="hdr"><div class="dot"></div><h2>吸籌集中度排行榜</h2></div>
<div class="sub">一籃 watchlist 的主力吸籌排名 + 持續性記憶。引擎沿用個股分析的累積訊號數、大單品質、CMF — 同一套算法,只是一次看全部、並且記得住。</div>

<div class="histinfo" id="histInfo">載入中...</div>

<!-- watchlist 籃子 -->
<div class="basket-card">
  <div class="basket-lbl">📋 watchlist 籃子（代號用空格或逗號分隔）</div>
  <textarea class="basket" id="basketInput" placeholder="NVDA AVGO MRVL ..."></textarea>
  <div class="basket-meta" id="basketMeta"></div>
  <div class="io-row">
    <button class="btn-sm" onclick="saveBasket()" style="flex:1;padding:9px;">💾 儲存籃子</button>

</div>

  <input type="file" id="impFile" accept=".json" style="display:none;" onchange="importHist(this)">
</div>

<div id="out" style="margin-top:14px;"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   引擎區：以下函式整組搬自 test-accum.html，一字不改。
   保證 accum-rank 跑出來的 n / 大單 / CMF / isTopping
   與個股分析頁完全一致（同一顆心臟）。
   ═══════════════════════════════════════════════════════════ */
async function fYahoo(s){
  var r=await fetch('https://corsproxy.io/?'+encodeURIComponent(
    'https://query1.finance.yahoo.com/v8/finance/chart/'+s+'?interval=1d&range=1y'));
  var d=await r.json();
  if(!d.chart||!d.chart.result||!d.chart.result[0])throw new Error('無法取得'+s+'的股價數據');
  return d.chart.result[0];
}
function mkValid(y){
  var ts=y.timestamp,q=y.indicators.quote[0],v=[];
  for(var i=0;i<ts.length;i++)
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i])
      v.push({c:q.close[i],o:q.open[i],h:q.high[i],l:q.low[i],v:q.volume[i],t:ts[i]});
  return v;
}
async function fYahooRetry(s,tries){
  tries=tries||3;
  for(var attempt=0;attempt<tries;attempt++){
    try{
      var yRaw=await fYahoo(s);
      var va=mkValid(yRaw);
      if(va.length>=55) return va;
    }catch(e){}
    if(attempt<tries-1) await new Promise(function(r){setTimeout(r,1500);});
  }
  return null;
}
function calcOBV(va){
  var o=0;var a=[0];
  for(var i=1;i<va.length;i++){
    if(va[i].c>va[i-1].c)o+=va[i].v;
    else if(va[i].c<va[i-1].c)o-=va[i].v;
    a.push(o);
  }
  return a;
}
function calcMACD(va){
  var cl=va.map(function(d){return d.c;});
  function ema(a,k){var r=[a[0]],m=2/(k+1);for(var i=1;i<a.length;i++)r.push(a[i]*m+r[i-1]*(1-m));return r;}
  var e12=ema(cl,12),e26=ema(cl,26),ml=e12.map(function(v,i){return v-e26[i];}),sg=ema(ml,9),ht=ml.map(function(v,i){return v-sg[i];});
  var m=va.length;
  return{aboveZero:ml[m-1]>0,histShrink:Math.abs(ht[m-1])<Math.abs(ht[m-2]),macdDown:ml[m-1]<ml[Math.max(0,m-4)]};
}
function findTR(va){
  var m=va.length;
  var dt=null;
  for(var i=Math.max(10,m-180);i<m-20;i++){
    var top=true;
    for(var j=i-5;j<=i+5;j++){if(j===i||j<0||j>=m)continue;if(va[j].h>va[i].h){top=false;break;}}
    if(!top)continue;
    var tp=va[i].h,slc=va.slice(i+1,Math.min(i+60,m));
    if(!slc.length)continue;
    var mn=Math.min.apply(null,slc.map(function(x){return x.l;})),dd=(tp-mn)/tp*100;
    if(dd>=20&&tp>va[Math.max(0,i-30)].c*1.25)
      if(!dt||tp>dt.p)dt={idx:i,p:tp};
  }
  var st=dt?dt.idx:Math.max(0,m-90);
  var botIdx=st;
  for(var i=st;i<m;i++)if(va[i].l<va[botIdx].l)botIdx=i;
  var botP=va[botIdx].l;
  var newStart=botIdx;
  for(var i=botIdx+1;i<m-5;i++){
    if(va[i].h>botP*1.20){
      var nb=i;
      for(var j=i+1;j<m;j++)if(va[j].l<va[nb].l)nb=j;
      if(va[nb].l>botP*1.05){newStart=i;break;}
    }
  }
  var sc=null;
  for(var i=newStart;i<m-3;i++){
    var d=va[i],sl=va.slice(Math.max(0,i-20),i);
    if(sl.length<5)continue;
    var maxV=Math.max.apply(null,sl.map(function(x){return x.v;}));
    var drop=(d.c-va[i-1].c)/va[i-1].c*100,lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(d.v>maxV*0.45&&drop<-0.3&&rng>0&&lw>rng*0.08)
      if(!sc||d.l<sc.l)sc={idx:i,l:d.l,date:new Date(d.t*1000).toISOString().slice(0,10)};
  }
  if(!sc||va[m-1].c<sc.l*0.88){
    var mi=newStart;
    for(var i=newStart;i<m;i++)if(va[i].l<va[mi].l)mi=i;
    sc={idx:mi,l:va[mi].l,date:new Date(va[mi].t*1000).toISOString().slice(0,10)};
  }
  var arH=sc.l*1.02;
  for(var i=sc.idx+1;i<Math.min(sc.idx+10,m);i++)if(va[i].h>arH)arH=va[i].h;
  var trTop=arH*1.15;
  var trEnd=m-1,trEnded=false,bc=0;
  for(var i=sc.idx+11;i<m;i++){
    if(va[i].c>trTop){bc++;if(bc>=2){trEnd=i-1;trEnded=true;break;}}else bc=0;
  }
  return{sc:sc,trTop:trTop,trEnd:trEnd,trEnded:trEnded};
}
function aggWeekly(va){
  var weeks=[],cur=null,curKey=-1;
  va.forEach(function(d){
    var dt=new Date(d.t*1000);
    var onejan=new Date(dt.getFullYear(),0,1);
    var wk=Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7);
    var key=dt.getFullYear()*100+wk;
    if(key!==curKey){ if(cur)weeks.push(cur); cur={t:d.t,o:d.o,h:d.h,l:d.l,c:d.c,v:d.v}; curKey=key; }
    else { cur.h=Math.max(cur.h,d.h); cur.l=Math.min(cur.l,d.l); cur.c=d.c; cur.v+=d.v; }
  });
  if(cur)weeks.push(cur);
  return weeks;
}
function findRealPivots(va, opt){
  opt=opt||{};
  var volMin=opt.volMin||1.5, tightMax=opt.tightMax||20, dedupDays=opt.dedupDays||15;
  var lateMult=opt.lateMult||2, lookbackDays=opt.lookbackDays||126, holdDays=opt.holdDays||10, holdMin=opt.holdMin||0.7;
  var m=va.length, raw=[];
  var startI=Math.max(60, m-lookbackDays);
  for(var i=startI;i<m;i++){
    var pw=va.slice(i-20,i);
    var prevHighClose=Math.max.apply(null,pw.map(function(d){return d.c;}));
    var av=pw.reduce(function(s,d){return s+d.v;},0)/20;
    var vr=av>0?va[i].v/av:0;
    if(!(va[i].c>prevHighClose && vr>=volMin)) continue;
    var everTight=false;
    for(var j=i-60;j<=i-5;j++){
      var w=va.slice(j-20,j); if(w.length<20)continue;
      var h=Math.max.apply(null,w.map(function(x){return x.h;})),l=Math.min.apply(null,w.map(function(x){return x.l;}));
      if(h>0&&(h-l)/h*100<=tightMax){everTight=true;break;}
    }
    if(!everTight) continue;
    var held=0,tot=0;
    for(var k=i+1;k<=Math.min(i+holdDays,m-1);k++){tot++;if(va[k].c>=prevHighClose)held++;}
    var holdRatio=tot>0?held/tot:0;
    var confirm = (tot<holdDays)?'pending':(holdRatio>=holdMin?'confirmed':'failed');
    raw.push({idx:i, date:new Date(va[i].t*1000).toISOString().slice(0,10),
      price:+va[i].c.toFixed(2), pivotLevel:+prevHighClose.toFixed(2), vol:+vr.toFixed(1),
      confirm:confirm, holdPct:Math.round(holdRatio*100), daysAfter:tot});
  }
  var clean=[];
  raw.forEach(function(p){ if(clean.length===0||p.idx-clean[clean.length-1].idx>=dedupDays) clean.push(p); });
  var baseConfirmed=clean.filter(function(p){return p.confirm==='confirmed';});
  if(baseConfirmed.length){
    var launchPivot=baseConfirmed[0];
    var first=launchPivot.pivotLevel;
    clean.forEach(function(p){
      var mult=first>0?p.pivotLevel/first:1;
      p.mult=+mult.toFixed(2);
      p.stage = (p===launchPivot)?'launch' : (mult<=lateMult?'main':'late');
    });
  } else {
    clean.forEach(function(p){p.mult=1;p.stage='launch';});
  }
  var weekly=aggWeekly(va);
  clean.forEach(function(p){
    var cs=Math.max(0,p.idx-20), zone=va.slice(cs,p.idx);
    if(zone.length>=3){
      var sum=0; zone.forEach(function(d){ sum+=(d.h+d.l+d.c)/3; });
      p.cost=+(sum/zone.length).toFixed(2);
      var sD=new Date(zone[0].t*1000).toISOString().slice(5,10);
      var eD=new Date(zone[zone.length-1].t*1000).toISOString().slice(5,10);
      p.costRange=sD+'~'+eD;
      p.costDate=new Date(zone[Math.floor(zone.length/2)].t*1000).toISOString().slice(0,10);
    } else { p.cost=p.pivotLevel; p.costRange=''; p.costDate=p.date; }
    var bt=va[p.idx].t, wi=-1;
    for(var wj=0;wj<weekly.length;wj++){ if(weekly[wj].t>=bt){wi=wj;break;} }
    if(wi<0)wi=weekly.length-1;
    var ws=Math.max(0,wi-8), wzone=weekly.slice(ws,wi);
    if(wzone.length>=3){
      var whi=Math.max.apply(null,wzone.map(function(x){return x.h;}));
      var wlo=Math.min.apply(null,wzone.map(function(x){return x.l;}));
      var rng=wlo>0?(whi-wlo)/wlo*100:999;
      p.weeklyRange=+rng.toFixed(0);
      p.weeklyGrade = rng<=35?'tight' : (rng<=60?'ok' : (rng<=100?'wide':'fake'));
    } else { p.weeklyRange=null; p.weeklyGrade='na'; }
  });
  return clean;
}
function detectAccum(va){
  var m=va.length,tr=findTR(va),ob=calcOBV(va);
  var avg60=va.slice(-60).reduce(function(s,d){return s+d.v;},0)/Math.min(60,m);
  var n=0;
  var signalDates=[];
  for(var i=tr.sc.idx+1;i<=tr.trEnd;i++){
    var d=va[i];
    if(d.c>tr.trTop||d.c<tr.sc.l*0.93)continue;
    var s=0;
    if(i>=3&&d.c<va[i-3].c&&ob[i]>ob[i-3])s++;
    var bd=Math.abs(d.c-d.o),lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(rng>0&&lw>bd*0.8&&(d.c-d.l)/rng>0.4)s++;
    if(d.v/avg60>0.8&&Math.abs(d.c-d.o)/d.o*100<3)s++;
    if(i>=10){
      var p=va.slice(i-10,i),mx=Math.max.apply(null,p.map(function(x){return x.h;})),mn2=Math.min.apply(null,p.map(function(x){return x.l;}));
      if(mn2>0&&(mx-mn2)/mn2*100<25&&ob[i]>ob[i-10])s++;
    }
    if(d.l<tr.sc.l*1.08&&d.c>tr.sc.l*0.97&&i>=1&&ob[i]>=ob[i-1])s++;
    if(s>=2){n++;signalDates.push(new Date(d.t*1000).toISOString().slice(0,10));}
  }
  var cur=va[m-1].c,obvUp=ob[m-1]>ob[Math.max(0,m-20)];
  var dA=0,pA=0,bP=0,breakoutVolRatio=null,breakoutDate=null;
  if(tr.trEnded){
    dA=m-1-tr.trEnd;bP=va[Math.min(tr.trEnd+1,m-1)].c;pA=Math.round((cur/bP-1)*100);
    var boIdx=Math.min(tr.trEnd+1,m-1);
    breakoutDate=new Date(va[boIdx].t*1000).toISOString().slice(0,10);
    var volStart=Math.max(0,boIdx-20);
    if(boIdx>volStart){
      var avgVolBefore=va.slice(volStart,boIdx).reduce(function(s,d){return s+d.v;},0)/(boIdx-volStart);
      if(avgVolBefore>0) breakoutVolRatio=+(va[boIdx].v/avgVolBefore).toFixed(1);
    }
  }
  var sm=0;
  if(tr.trEnded&&n>=6)sm=6;
  else if(tr.trEnded&&n>=3)sm=5;
  else if(tr.trEnded)sm=3;
  else if(!tr.trEnded&&n>=5&&obvUp)sm=4;
  else if(!tr.trEnded&&n>=2)sm=2;
  var dn=0,distDates=[],dm=0,distCmf=null,isTopping=false,distReasons=[];
  var ma5=va.slice(-5).reduce(function(s,d){return s+d.c;},0)/5;
  var ma5p=va.slice(-6,-1).reduce(function(s,d){return s+d.c;},0)/5;
  var av5=va.slice(-5).reduce(function(s,d){return s+d.v;},0)/5;
  var av20=va.slice(-20).reduce(function(s,d){return s+d.v;},0)/20;
  var bigBuys=[],bigSells=[],bigNeutrals=[];
  var startIdx=Math.max(55,m-60);
  for(var i=startIdx;i<m;i++){
    var d=va[i];
    var avg50=va.slice(i-50,i).reduce(function(s,x){return s+x.v;},0)/50;
    var volRatio=d.v/avg50;
    var rng=d.h-d.l;
    var closePos=rng>0?(d.c-d.l)/rng:0.5;
    var chg=(d.c-d.o)/d.o*100;
    var dt=new Date(d.t*1000).toISOString().slice(0,10);
    if(volRatio>=1.5&&d.c>d.o&&closePos>=0.6)
      bigBuys.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2),volume:d.v,idx:i});
    if(volRatio>=1.5&&d.c<d.o&&closePos<=0.4)
      bigSells.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2),volume:d.v,idx:i});
    if(volRatio>=1.5){
      var alreadyBuy=(d.c>d.o&&closePos>=0.6);
      var alreadySell=(d.c<d.o&&closePos<=0.4);
      if(!alreadyBuy&&!alreadySell){
        var upperShadow=rng>0?(d.h-Math.max(d.o,d.c))/rng:0;
        var inMiddle=closePos>=0.3&&closePos<=0.7;
        if(upperShadow>=0.4){
          bigNeutrals.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2),volume:d.v,idx:i,type:'rejection',high:+d.h.toFixed(2)});
        } else if(inMiddle){
          bigNeutrals.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2),volume:d.v,idx:i,type:'middle',high:+d.h.toFixed(2)});
        }
      }
    }
  }
  bigBuys.forEach(function(b){
    var cmfStart=Math.max(0,b.idx-2);
    var cmfEnd=Math.min(m-1,b.idx+2);
    var sumMFV=0,sumV=0;
    for(var k=cmfStart;k<=cmfEnd;k++){
      var dd=va[k];
      var r2=dd.h-dd.l;
      if(r2<=0)continue;
      var mfm=((dd.c-dd.l)-(dd.h-dd.c))/r2;
      sumMFV+=mfm*dd.v;
      sumV+=dd.v;
    }
    b.cmf=sumV>0?+(sumMFV/sumV).toFixed(3):null;
    b.brokenDown=false;
    var lowThisDay=va[b.idx].l;
    for(var j=b.idx+1;j<=Math.min(b.idx+3,m-1);j++){
      if(va[j].c<lowThisDay){b.brokenDown=true;break;}
    }
    var futureDays=m-1-b.idx;
    if(b.brokenDown){
      b.quality='bad';
      b.qualityNote='❌ 後續被打下，可能誘多';
    } else if(b.cmf!==null&&b.cmf<-0.05){
      b.quality='bad';
      b.qualityNote='❌ 資金流負向，可疑';
    } else if(b.cmf!==null&&b.cmf>0.1){
      b.quality='good';
      b.qualityNote='✅ 資金流正向，真實買盤';
    } else if(futureDays<3){
      b.quality='pending';
      b.qualityNote='⏳ 太新，待 '+(3-futureDays)+' 天後驗證';
    } else {
      b.quality='neutral';
      b.qualityNote='⚠️ 資金流中性，普通大單';
    }
  });
  bigSells.forEach(function(b){
    b.bouncedBack=false;
    var highThisDay=va[b.idx].h;
    for(var j=b.idx+1;j<=Math.min(b.idx+3,m-1);j++){
      if(va[j].c>highThisDay){b.bouncedBack=true;break;}
    }
    b.quality=b.bouncedBack?'neutral':'bad';
    b.qualityNote=b.bouncedBack?'⚠️ 後續反彈，可能洗盤':'❌ 後續未反彈，主力出貨';
  });
  bigNeutrals.forEach(function(b){
    var cmfStart=Math.max(0,b.idx-2);
    var cmfEnd=Math.min(m-1,b.idx+2);
    var sumMFV=0,sumV=0;
    for(var k=cmfStart;k<=cmfEnd;k++){
      var dd=va[k];
      var r2=dd.h-dd.l;
      if(r2<=0)continue;
      var mfm=((dd.c-dd.l)-(dd.h-dd.c))/r2;
      sumMFV+=mfm*dd.v;
      sumV+=dd.v;
    }
    b.cmf=sumV>0?+(sumMFV/sumV).toFixed(3):null;
    b.brokenDown=false;
    var lowThisDay=va[b.idx].l;
    for(var j=b.idx+1;j<=Math.min(b.idx+3,m-1);j++){
      if(va[j].c<lowThisDay){b.brokenDown=true;break;}
    }
    if(b.type==='rejection'){
      if(b.brokenDown||(b.cmf!==null&&b.cmf<0)){
        b.quality='bad';
      } else if(b.cmf!==null&&b.cmf<0.1){
        b.quality='warn';
      } else {
        b.quality='warn';
      }
    } else {
      if(b.brokenDown||(b.cmf!==null&&b.cmf<-0.05)){
        b.quality='bad';
      } else if(b.cmf!==null&&b.cmf>0.2){
        b.quality='good';
      } else {
        b.quality='warn';
      }
    }
  });
  (function(){
    var winN=Math.min(60,m);
    var winSlice=va.slice(-winN);
    var hi60=Math.max.apply(null,winSlice.map(function(x){return x.h;}));
    var lo60=Math.min.apply(null,winSlice.map(function(x){return x.l;}));
    if(hi60<=lo60)return;
    var curC=va[m-1].c;
    var inHighZone=curC>=lo60+(hi60-lo60)*0.5;
    var highZone=lo60+(hi60-lo60)*0.55;
    var startI=Math.max(10,m-40);
    var c1=0,c2=0,c3=0,c5=0;
    for(var i=startI;i<m;i++){
      var d=va[i];
      if(d.c<highZone)continue;
      var s=0;
      if(i>=3&&d.c>va[i-3].c&&ob[i]<ob[i-3]){s++;c1++;}
      var body=Math.abs(d.c-d.o),uw=d.h-Math.max(d.c,d.o),rng=d.h-d.l;
      if(rng>0&&uw>body*0.8&&(d.h-d.c)/rng>0.4){s++;c2++;}
      if(d.v/avg60>1.2&&Math.abs(d.c-d.o)/d.o*100<2){s++;c3++;}
      if(i>=10){var p=va.slice(i-10,i),mx=Math.max.apply(null,p.map(function(x){return x.h;})),mn=Math.min.apply(null,p.map(function(x){return x.l;}));if(mn>0&&(mx-mn)/mn*100<25&&ob[i]<ob[i-10])s++;}
      if(d.h>hi60*0.97&&i>=1&&ob[i]<=ob[i-1]){s++;c5++;}
      if(s>=2){dn++;distDates.push(new Date(d.t*1000).toISOString().slice(0,10));}
    }
    var cs=Math.max(0,m-20),sumMFV=0,sumV=0;
    for(var k=cs;k<m;k++){var dd=va[k],r2=dd.h-dd.l;if(r2<=0)continue;sumMFV+=(((dd.c-dd.l)-(dd.h-dd.c))/r2)*dd.v;sumV+=dd.v;}
    distCmf=sumV>0?+(sumMFV/sumV).toFixed(3):null;
    var now30=Date.now()/1000-30*86400;
    var now15=Date.now()/1000-15*86400;
    var badSells=bigSells.filter(function(b){return b.quality==='bad'&&new Date(b.date).getTime()/1000>now30;}).length;
    var badHighVol=bigNeutrals.filter(function(b){return b.quality==='bad';}).length;
    var recentBuys15=bigBuys.filter(function(b){return new Date(b.date).getTime()/1000>now15;}).length;
    var recentBadSells15=bigSells.filter(function(b){return b.quality==='bad'&&new Date(b.date).getTime()/1000>now15;}).length;
    var netDistribution=(recentBadSells15>=1||badSells>=2)&&recentBuys15===0;
    var hasStrongBuySupport=recentBuys15>=2;
    var evidence=dn+badSells*2+badHighVol;
    if(evidence>=6)dm=6;else if(evidence>=4)dm=5;else if(evidence>=2)dm=3;else if(evidence>=1)dm=2;
    var healthyStrong=(ma5>ma5p)&&distCmf!==null&&distCmf>0.15&&badSells===0;
    isTopping=inHighZone&&!healthyStrong&&!hasStrongBuySupport&&((dn>=2&&distCmf!==null&&distCmf<0.1)||netDistribution);
    if(netDistribution&&recentBuys15===0)distReasons.push('主力近15天無買盤、卻有真出貨');
    if(badSells>0)distReasons.push('近30天 '+badSells+' 次主力真出貨（賣後未反彈）');
    if(badHighVol>0)distReasons.push('高量震盪資金流轉負 '+badHighVol+' 次');
    if(c1>0)distReasons.push('價漲量縮背離 '+c1+' 次');
    if(c2>0)distReasons.push('高檔長上影 '+c2+' 次');
    if(c3>0)distReasons.push('高量滯漲 '+c3+' 次');
    if(c5>0)distReasons.push('衝頂無力 '+c5+' 次');
  })();
  return{tr:tr,sm:sm,n:n,signalDates:signalDates,bigBuys:bigBuys,bigSells:bigSells,bigNeutrals:bigNeutrals,
    cur:cur.toFixed(2),trTop:tr.trTop.toFixed(2),trEnded:tr.trEnded,dA:dA,pA:pA,bP:bP.toFixed(2),
    breakoutVolRatio:breakoutVolRatio,breakoutDate:breakoutDate,
    dn:dn,distDates:distDates,dm:dm,distCmf:distCmf,isTopping:isTopping,distReasons:distReasons,
    ma5up:ma5>ma5p,volShrink:av5<av20*0.75,macd:calcMACD(va),obvUp:obvUp};
}

/* ═══════════════════════════════════════════════════════════
   聚合層：吸籌集中度分數（0-100）
   不是新指標 — 純粹把 detectAccum 已有的訊號重新加總：
   n(累積訊號數，最強預測因子) + 吸籌成熟度 + 真實大單 + CMF + 大單連續性
   − 誘多/出貨/派發 扣分
   ═══════════════════════════════════════════════════════════ */
function calcAccumConcentration(a){
  var now=Date.now()/1000;
  function dAgo(x){ return (now - new Date(x.date).getTime()/1000)/86400; }
  var buys30=a.bigBuys.filter(function(b){return dAgo(b)<=30;});
  var buys15=a.bigBuys.filter(function(b){return dAgo(b)<=15;});
  var buys5 =a.bigBuys.filter(function(b){return dAgo(b)<=5;});
  var goodBuys30=buys30.filter(function(b){return b.quality==='good';});
  var badBuys30 =buys30.filter(function(b){return b.quality==='bad';});
  var sells15=a.bigSells.filter(function(s){return dAgo(s)<=15;});
  var badSells15=sells15.filter(function(s){return s.quality==='bad';});
  var cmfVals=buys30.map(function(b){return b.cmf;}).filter(function(v){return v!==null&&v!==undefined;});
  var avgCmf=cmfVals.length?cmfVals.reduce(function(s,v){return s+v;},0)/cmfVals.length:null;

  var nPts=Math.min(a.n,8)*5;                    // 累積訊號數，最高 40
  var smPts=a.sm>=5?8:a.sm>=3?4:a.sm>=1?2:0;     // 吸籌成熟度，最高 8
  var buyPts=Math.min(goodBuys30.length,4)*6;    // 真實大單買入，最高 24
  var cmfPts=0;                                  // 資金流，最高 16（負向扣分）
  if(avgCmf!==null){
    if(avgCmf>=0.15)cmfPts=16; else if(avgCmf>=0.05)cmfPts=10; else if(avgCmf>=0)cmfPts=5; else cmfPts=-8;
  }
  var contPts=0;                                 // 大單連續性，最高 12
  if(buys5.length>=1)contPts+=6;                 // 近5天仍有大單（還在吃）
  if(buys15.length>=2)contPts+=6;                // 近15天多日大單（連續）

  var penalty=0;
  penalty+=Math.min(badBuys30.length,3)*4;       // 誘多大單
  penalty+=Math.min(badSells15.length,2)*8;      // 真出貨
  if(a.isTopping)penalty+=15;                    // 頭部派發

  var score=nPts+smPts+buyPts+cmfPts+contPts-penalty;
  score=Math.max(0,Math.min(100,Math.round(score)));
  return {score:score,n:a.n,sm:a.sm,goodBuys:goodBuys30.length,badBuys:badBuys30.length,
    buys15:buys15.length,buys5:buys5.length,badSells15:badSells15.length,
    avgCmf:avgCmf,isTopping:a.isTopping,
    parts:{nPts:nPts,smPts:smPts,buyPts:buyPts,cmfPts:cmfPts,contPts:contPts,penalty:penalty}};
}

/* ═══════════════════════════════════════════════════════════
   持續性記憶：存檔/排名機制 — 沿用 radar.html 的 history 結構
   record = {date, items:{sym:{score,rank}}}；同日覆蓋；上限 30 天
   與 radar 板塊時間序列同一套哲學，只是對象換成個股。
   ═══════════════════════════════════════════════════════════ */
var HKEY='accumrank_history_v1';
var BKEY='accumrank_basket_v1';
var TOP_TIER=5;          // 前段班 = 前 5 名（一籃 20 檔約前 1/4）
var WIN=10;              // 持續性視窗（天）
var DEFAULT_BASKET=['NVDA','AVGO','MRVL','MU','AMD','TSM','ASML','COHR','LITE','AAOI','CRDO','ALAB','CIEN','FN','POET','GFS','AMKR','AEHR','NOK','AXTI'];

function todayKey(){ return new Date().toISOString().slice(0,10); }
function getHistory(){ try{var s=localStorage.getItem(HKEY);if(s)return JSON.parse(s);}catch(e){} return {records:[]}; }
function saveHistory(h){ try{localStorage.setItem(HKEY,JSON.stringify(h));}catch(e){} }
function recordToday(items){
  var hist=getHistory();
  var key=todayKey();
  var idx=-1;
  for(var i=0;i<hist.records.length;i++){ if(hist.records[i].date===key){idx=i;break;} }
  var rec={date:key,items:items};
  if(idx>=0)hist.records[idx]=rec; else hist.records.push(rec);
  if(hist.records.length>30)hist.records=hist.records.slice(-30);
  saveHistory(hist);
}
function computePersistence(sym,windowDays){
  var hist=getHistory();
  var recs=hist.records.slice(-windowDays);
  var ranks=[];
  recs.forEach(function(r){
    if(r.items&&r.items[sym]!==undefined&&r.items[sym]!==null)
      ranks.push({date:r.date,rank:r.items[sym].rank,score:r.items[sym].score});
  });
  if(!ranks.length)return null;
  var avgRank=ranks.reduce(function(s,x){return s+x.rank;},0)/ranks.length;
  var inTierDays=ranks.filter(function(x){return x.rank<=TOP_TIER;}).length;
  var streak=0;
  for(var i=ranks.length-1;i>=0;i--){ if(ranks[i].rank<=TOP_TIER)streak++; else break; }
  return {avgRank:avgRank,inTierDays:inTierDays,streak:streak,appearDays:ranks.length,ranks:ranks};
}

/* ═══════════════════════ 籃子管理 ═══════════════════════ */
function getBasket(){
  try{var s=localStorage.getItem(BKEY);if(s){var a=JSON.parse(s);if(Array.isArray(a)&&a.length)return a;}}catch(e){}
  return DEFAULT_BASKET.slice();
}
function parseBasket(txt){
  return (txt||'').toUpperCase().split(/[\s,;]+/).filter(function(t){return t&&t.length>=1&&t.length<=6;});
}
function saveBasket(){
  var arr=parseBasket(document.getElementById('basketInput').value);
  if(!arr.length){alert('籃子是空的，請至少輸入 1 檔');return;}
  var seen={},uniq=[];
  arr.forEach(function(t){if(!seen[t]){seen[t]=1;uniq.push(t);}});
  try{localStorage.setItem(BKEY,JSON.stringify(uniq));}catch(e){}
  document.getElementById('basketInput').value=uniq.join(' ');
  updateBasketMeta();
  alert('✅ 已儲存籃子（'+uniq.length+' 檔）');
}
function resetBasket(){
  if(!confirm('還原成預設籃子（半導體+光通訊 20 檔）？'))return;
  try{localStorage.removeItem(BKEY);}catch(e){}
  document.getElementById('basketInput').value=DEFAULT_BASKET.join(' ');
  updateBasketMeta();
}
function updateBasketMeta(){
  var arr=parseBasket(document.getElementById('basketInput').value);
  document.getElementById('basketMeta').textContent='目前 '+arr.length+' 檔　·　預估更新耗時約 '+Math.ceil(arr.length*0.9)+' 秒（含限流間隔）';
}

}

/* ═══════════════════════ 主流程：更新排行 ═══════════════════════ */
async function runRanking(){
  var basket=parseBasket(document.getElementById('basketInput').value);
  if(!basket.length){alert('籃子是空的');return;}
  var out=document.getElementById('out');
  var rows=[],failed=[];
  for(var i=0;i<basket.length;i++){
    var sym=basket[i];
    out.innerHTML='<div class="card"><div class="loading"><span class="spin"></span>抓取吸籌數據中… '+(i+1)+' / '+basket.length+'<div class="prog">'+sym+(failed.length?'　·　失敗 '+failed.length:'')+'</div></div></div>';
    var va=await fYahooRetry(sym);
    if(va){
      try{
        var a=detectAccum(va);
        var c=calcAccumConcentration(a);
        rows.push({sym:sym,c:c,cur:a.cur,isTopping:a.isTopping});
      }catch(e){ failed.push(sym); }
    } else { failed.push(sym); }
    await new Promise(function(r){setTimeout(r,700);});
  }
  // 排名：集中度高 → 主力吸籌最凶
  rows.sort(function(x,y){ return y.c.score-x.c.score; });
  var items={};
  rows.forEach(function(r,idx){ r.rank=idx+1; items[r.sym]={score:r.c.score,rank:idx+1}; });
  recordToday(items);            // 存今天的快照（分數+排名）
  window._lastResults={rows:rows,failed:failed};
  updateHistInfo();
  renderLeaderboard(window._lastResults);
}

/* ═══════════════════════ 渲染排行榜 ═══════════════════════ */
function rankSparkline(ranks,total){
  if(!ranks||ranks.length<2)return '';
  var w=66,h=20,n=ranks.length,denom=Math.max(total-1,1);
  var pts=ranks.map(function(x,i){
    var px=(i/(n-1))*w;
    var py=((x.rank-1)/denom)*(h-4)+2;   // rank1 → 頂端
    return px.toFixed(1)+','+py.toFixed(1);
  }).join(' ');
  var last=ranks[ranks.length-1];
  var lx=w, ly=((last.rank-1)/denom)*(h-4)+2;
  return '<svg width="'+w+'" height="'+h+'" style="overflow:visible;"><polyline points="'+pts+'" fill="none" stroke="#c8a84b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2.5" fill="#d97020"/></svg>';
}
function scoreColor(s){ return s>=70?'#2ea86e':s>=45?'#c8952a':s>=25?'#d97020':'#d94f4f'; }

function renderLeaderboard(data){
  var out=document.getElementById('out');
  if(!data||!data.rows){ out.innerHTML=''; return; }
  var rows=data.rows,failed=data.failed||[];
  var total=rows.length;
  if(!total){
    out.innerHTML='<div class="card"><div style="padding:18px;text-align:center;color:#aaa;font-size:13px;">沒有成功讀到任何一檔，可能是網路限流，稍後再試一次。</div></div>';
    return;
  }
  var RI=['🥇','🥈','🥉'];
  var h='<div class="card">';
  h+='<div class="ch"><span class="ch-title">🐋 今日吸籌集中度排行（'+total+'檔）</span><span style="font-size:11px;color:#bbb;">'+todayKey()+'</span></div>';
  rows.forEach(function(r,idx){
    var c=r.c;
    var col=scoreColor(c.score);
    var rank=idx<3?RI[idx]:(idx+1)+'.';
    var pst=computePersistence(r.sym,WIN);
    h+='<div class="rank-row">';
    // 頂列
    h+='<div class="rr-top">';
    h+='<span class="rr-rank">'+rank+'</span>';
    h+='<div><span class="rr-sym">'+r.sym+'</span><span style="font-size:12px;color:#999;margin-left:6px;">$'+r.cur+'</span>';
    if(pst&&pst.streak>=2)h+='<span class="tier-badge tb-streak">🔥 連續'+pst.streak+'天前段班</span>';
    h+='</div>';
    h+='<div class="rr-score-wrap"><div class="rr-score" style="color:'+col+';">'+c.score+'</div><div class="rr-score-lbl">集中度 /100</div></div>';
    h+='</div>';
    // 分數條
    h+='<div class="rr-bar"><div class="rr-fill" style="width:'+c.score+'%;background:'+col+';"></div></div>';
    // 分數組成（透明化：看得到分數從哪來）
    h+='<div class="rr-parts">';
    h+='<span class="pchip">吸籌訊號 '+c.n+'個</span>';
    h+='<span class="pchip">成熟度 '+c.sm+'/6</span>';
    if(c.goodBuys>0)h+='<span class="pchip good">真實大單 '+c.goodBuys+'次</span>';
    if(c.avgCmf!==null)h+='<span class="pchip'+(c.avgCmf>=0.05?' good':(c.avgCmf<0?' warn':''))+'">CMF '+(c.avgCmf>=0?'+':'')+c.avgCmf.toFixed(2)+'</span>';
    if(c.buys5>=1)h+='<span class="pchip good">近5天仍在吃</span>';
    if(c.badBuys>0)h+='<span class="pchip warn">誘多 '+c.badBuys+'次</span>';
    if(c.badSells15>0)h+='<span class="pchip warn">真出貨 '+c.badSells15+'次</span>';
    if(c.isTopping)h+='<span class="pchip warn">🔻 頭部派發</span>';
    h+='</div>';
    // 持續性
    if(pst){
      h+='<div class="persist">';
      h+='<div class="persist-stat"><div class="persist-num">'+pst.avgRank.toFixed(1)+'</div><div class="persist-cap">平均排名</div></div>';
      h+='<div class="persist-stat"><div class="persist-num" style="color:'+(pst.streak>=3?'#d97020':'#5a4010')+';">'+pst.streak+'</div><div class="persist-cap">連續前段班</div></div>';
      h+='<div class="persist-stat"><div class="persist-num">'+pst.inTierDays+'/'+pst.appearDays+'</div><div class="persist-cap">上榜/打卡</div></div>';
      h+='<div class="persist-spark" title="排名走勢（上=排名高）">'+rankSparkline(pst.ranks,total)+'</div>';
      h+='</div>';
    } else {
      h+='<div class="persist-empty">尚無歷史 — 今天是這檔第一次入榜，明天起會出現平均排名與走勢</div>';
    }
    h+='</div>';
  });
  if(failed.length){
    h+='<div class="err">⚠️ '+failed.length+' 檔讀取失敗（網路限流，未納入排名）：'+failed.join('、')+'　— 可稍後再跑一次</div>';
  }
  h+='<div class="note">「集中度」= 主力吸籌的明顯程度（n + 成熟度 + 真實大單 + CMF + 連續性 − 誘多/出貨/派發）。「連續前段班」= 連續幾次打卡都待在前 '+TOP_TIER+' 名 → 區分<b>真持續吸籌</b>（霸榜）vs <b>一日脈衝</b>（曇花一現）。持續性靠每天盤前開一次累積（對應 sop.html Node 1 更新 watchlist 打卡）。</div>';
  h+='</div>';
  out.innerHTML=h;
}

/* ═══════════════════════ 匯出 / 匯入 ═══════════════════════ */
function exportHist(){
  var hist=getHistory();
  if(!hist.records.length){alert('目前沒有歷史可匯出');return;}
  var blob=new Blob([JSON.stringify(hist,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='accum-rank-history-'+todayKey()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},500);
}
function importHist(input){
  var file=input.files&&input.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.records||!Array.isArray(data.records))throw new Error('格式不對');
      // 以日期合併，匯入的不覆蓋已存在的同日記錄
      var cur=getHistory();
      var byDate={};
      cur.records.forEach(function(r){byDate[r.date]=r;});
      data.records.forEach(function(r){ if(r.date&&!byDate[r.date]){byDate[r.date]=r;} });
      var merged=Object.keys(byDate).sort().map(function(d){return byDate[d];});
      if(merged.length>30)merged=merged.slice(-30);
      saveHistory({records:merged});
      alert('✅ 匯入成功，目前共 '+merged.length+' 天歷史');
      updateHistInfo();
    }catch(err){ alert('❌ 匯入失敗：檔案格式不正確'); }
    input.value='';
  };
  reader.readAsText(file);
}

  document.getElementById('basketInput').value=getBasket().join(' ');
  updateBasketMeta();
  document.getElementById('basketInput').addEventListener('input',updateBasketMeta);

})();
