        h+='<span class="vl">量比 <b>'+s.ratio+'x</b> &nbsp;+'+s.chg+'% &nbsp;$'+s.price+'</span></div>';
        h+='<div style="margin-top:4px;padding:4px 8px;background:'+qBg+';border-radius:4px;font-size:11px;color:'+qColor+';font-weight:600;display:inline-block;">'+s.qualityNote;
        if(s.cmf!==null&&s.cmf!==undefined)h+=' (CMF '+(s.cmf>=0?'+':'')+s.cmf+')';
        h+='</div></div>';
      });
      a.bigSells.slice().reverse().forEach(function(s){
        var qColor=s.quality==='bad'?'#d94f4f':'#c8952a';
        var qBg=s.quality==='bad'?'#fef0f0':'#fffbec';
        h+='<div style="padding:8px 0;border-bottom:1px solid #f8f0e0;">';
        h+='<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">';
        h+='<span style="color:#d94f4f;font-weight:700;">⚠️ 賣出 '+s.date+'</span>';
        h+='<span class="vl">量比 <b>'+s.ratio+'x</b> &nbsp;'+s.chg+'% &nbsp;$'+s.price+'</span></div>';
        h+='<div style="margin-top:4px;padding:4px 8px;background:'+qBg+';border-radius:4px;font-size:11px;color:'+qColor+';font-weight:600;display:inline-block;">'+s.qualityNote+'</div></div>';
      });
      // 🆕 v3 新增：高量警示
      if(hasNeutrals){
        a.bigNeutrals.slice().reverse().forEach(function(s){
          var qColor=s.quality==='bad'?'#d94f4f':s.quality==='good'?'#2ea86e':'#d97020';
          var qBg=s.quality==='bad'?'#fef0f0':s.quality==='good'?'#edfaf3':'#fff5ec';
          var emoji=s.type==='rejection'?'⚡':'🔍';
          var typeLabel=s.type==='rejection'?'高量衝高':'高量震盪';
          h+='<div style="padding:8px 0;border-bottom:1px solid #f8f0e0;">';
          h+='<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">';
          h+='<span style="color:#d97020;font-weight:700;">'+emoji+' '+typeLabel+' '+s.date+'</span>';
          h+='<span class="vl">量比 <b>'+s.ratio+'x</b> &nbsp;'+(s.chg>=0?'+':'')+s.chg+'% &nbsp;最高$'+s.high+'</span></div>';
          h+='<div style="margin-top:4px;padding:4px 8px;background:'+qBg+';border-radius:4px;font-size:11px;color:'+qColor+';font-weight:600;display:inline-block;">'+s.qualityNote;
          if(s.cmf!==null&&s.cmf!==undefined)h+=' (CMF '+(s.cmf>=0?'+':'')+s.cmf+')';
          h+='</div></div>';
        });
      }
    }
    h+='</div>';
    h+='<div class="fold-hdr" id="fh-ins"><span class="fold-title">👔 內部人交易（近6個月）</span><span class="fold-arrow" id="fa-ins">▼</span></div>';
    h+='<div class="fold-body" id="fb-ins">';
    h+='<div class="ig"><div class="ib ib-b"><div class="inn">'+buys+'</div><div class="is">買入次數</div></div>';
    h+='<div class="ib ib-s"><div class="inn">'+sells+'</div><div class="is">賣出次數</div></div></div>';
    if(sellAmt>1000)h+='<div class="rw"><span class="lb">估計套現</span><span class="vl" style="color:#d94f4f;">$'+(sellAmt/1e6).toFixed(1)+'M</span></div>';
    if(mspr!==null)h+='<div class="rw"><span class="lb">MSPR情緒</span><span class="bg '+(mspr>10?'gu':mspr<-10?'gd':'gn')+'">'+(mspr>10?'看多':mspr<-10?'看空':'中性')+' ('+mspr.toFixed(0)+')</span></div>';
    h+='<div class="note">'+insTxt+'</div></div>';
    h+='<div class="verdict-block"><div class="verdict-inner">';
    h+='<div class="verdict-main '+vClass+'">'+vText+'</div>';
    h+='<div class="verdict-score">綜合評分：'+score+' / 10</div>';
    if(warnings.length>0){
      h+='<div class="verdict-warn"><div class="verdict-warn-lbl">⚠️ 警訊</div>';
      h+='<div class="verdict-warn-txt">'+warnings.join('<br>')+'</div></div>';
    }
    
    // ═══════════════════════════════════════════════
    //  改良版白話文判讀（v2）
    // ═══════════════════════════════════════════════
    var diffPct=+((+a.cur-+a.scP)/+a.scP*100).toFixed(0);
    var diffStr=(diffPct>=0?'+':'')+diffPct+'%';
    var fullAdvice='';
    
    // 1. RS 強度描述
    var rsDesc='';
    if(rsRating!==null){
      if(rsRating>=85&&rsNewHigh){
        rsDesc='📊 近期表現非常強勢（RS '+rsRating+'，跑贏'+rsRating+'%股票），✨ RS創3月新高代表主力加速推升中';
      } else if(rsRating>=85){
        rsDesc='📊 近期表現強勢（RS '+rsRating+'，跑贏'+rsRating+'%股票）'+(rsTrend==='up'?'，動能持續擴大':rsTrend==='down'?'，但動能開始衰退':'');
      } else if(rsRating>=70){
        rsDesc='📊 近期表現合格（RS '+rsRating+'）'+(rsTrend==='up'?'，動能上升中':rsTrend==='down'?'，但動能下降':'')+(rsNewHigh?'，✨RS創新高':'');
      } else if(rsRating>=50){
        rsDesc='📊 近期表現普通（RS '+rsRating+'）'+(rsTrend==='up'?'，動能上升中可觀察':'');
      } else {
        rsDesc='📊 近期跑輸大盤（RS '+rsRating+'）'+(rsTrend==='up'?'，但動能開始上升':'，Minervini 法則：RS<50 不建議買入');
      }
    }
    
    // 2. 大單進場描述
    var bigDesc='';
    if(buy15.length>=2){
      bigDesc='🐋 近15天內出現'+buy15.length+'次大單買入，主力明確進場';
    } else if(buy15.length===1){
      var daysAgo=Math.floor((Date.now()/1000-new Date(buy15[0].date).getTime()/1000)/86400);
      bigDesc='🐋 '+daysAgo+'天前有大單買入（量比'+buy15[0].ratio+'倍）';
    } else if(buy30.length>=1){
      bigDesc='👀 近30天內有大單進場（可能剛吸籌完成）';
    } else {
      bigDesc='🔍 近期無明顯大單進場';
    }
    
    // 3. 漲幅與成本距離描述（含第二次成本對比）
    var priceDesc='';
    if(diffPct<-15){
      priceDesc='💎 已跌破主力成本 '+diffStr+'（超過-15%），主力可能已撤退';
    } else if(diffPct<0){
      priceDesc='💎 略低於主力成本（'+diffStr+'），可能是洗盤或回測';
    } else if(diffPct<=20){
      priceDesc='💰 目前距主力成本僅'+diffStr+'，進場位置良好';
    } else if(diffPct<=40){
      priceDesc='💰 距主力成本'+diffStr+'，建議倉位減半';
    } else if(diffPct<=60){
      priceDesc='⚠️ 距主力成本'+diffStr+'，已漲多請輕倉';
    } else {
      priceDesc='🚫 距主力成本'+diffStr+'，已嚴重追高，不建議買入';
    }
    
    // 🆕 第二次成本（波段成本）參考
    var wc2Desc='';
    if(a.wc2){
      var wc2Diff=+((+a.cur-+a.wc2.p)/+a.wc2.p*100).toFixed(0);
      var wc2DiffStr=(wc2Diff>=0?'+':'')+wc2Diff+'%';
      var scWc2Gap=+((+a.wc2.p-+a.scP)/+a.scP*100).toFixed(0);
      if(scWc2Gap>=30){
        wc2Desc='🌊 近30天波段成本 $'+a.wc2.p+'（比第一次成本高 '+scWc2Gap+'%）— 這是「短期主力」的真實進場價，距現價 '+wc2DiffStr+'，是更貼近實戰的參考';
      } else if(scWc2Gap>=10){
        wc2Desc='🌊 近30天波段成本 $'+a.wc2.p+'（距現價 '+wc2DiffStr+'）';
      } else if(scWc2Gap>=0){
        wc2Desc='🌊 近30天波段成本 $'+a.wc2.p+' 與第一次成本相近，主力沒有「換手」';
      }
    }
    
    // 4. 綜合操作建議（含負值情境處理）
    var finalAction='';
    if(diffPct<-15){
      finalAction='⚠️ 綜合判斷：已嚴重跌破主力成本，主力可能已撤退。除非近期有大量大單回補，否則不建議進場';
    } else if(diffPct<0){
      if(buy15.length>=1 && rsRating>=70){
        finalAction='🎯 綜合判斷：略跌破成本但近期有大單買入且RS合格，可能是主力洗盤，可輕倉試探 10-15%，停損設成本下方-8%';
      } else if(buy15.length>=1){
        finalAction='👀 綜合判斷：略跌破成本但有大單支撐，需確認RS是否回升，先觀察 1-2 週';
      } else {
        finalAction='⏸ 綜合判斷：跌破成本且無大單支撐，建議觀望，等企穩或RS回升';
      }
    } else if(diffPct>60){
      finalAction='❌ 綜合判斷：不建議追高，等回測主力成本附近再考慮';
    } else if(diffPct>=40){
      if(rsRating>=70){
        finalAction='⚠️ 綜合判斷：雖強勢但已漲多，可輕倉10-15%試探，停損設在成本下方8%';
      } else {
        finalAction='⏸ 綜合判斷：已漲多且強度不夠，建議觀望';
      }
    } else if(diffPct>=20){
      if(rsRating>=85&&rsNewHigh){
        finalAction='🚀 綜合判斷：強勢股+新高+有回調空間，倉位15-25%，停損設在-8%';
      } else if(rsRating>=70){
        finalAction='👀 綜合判斷：表現合格但已漲一段，倉位減半15-20%';
      } else {
        finalAction='⏸ 綜合判斷：雖仍在可追範圍但強度不足，建議觀望';
      }
    } else {
      if(rsRating>=85&&rsNewHigh){
        finalAction='🚀 綜合判斷：最佳進場組合（強勢+新高+低漲幅），可標準倉位30-50%，停損-7%，目標+20-30%';
      } else if(rsRating>=70){
        finalAction='🚀 綜合判斷：表現合格且成本接近，倉位25-35%，停損-8%';
      } else if(rsRating>=50){
        finalAction='👀 綜合判斷：成本接近但強度一般，倉位15-20%觀察突破';
      } else if(rsRating!==null){
        finalAction='⏸ 綜合判斷：RS偏弱不建議進場，等RS回升到70以上再考慮';
      } else {
        finalAction='⏸ 綜合判斷：RS 資料不足，建議先觀察';
      }
    }
    
    // 🆕 v2 新增：大單品質總結
    var qualityDesc='';
    var recent30Buys=buy30;
    if(recent30Buys.length>0){
      var goodCount=recent30Buys.filter(function(b){return b.quality==='good';}).length;
      var badCount=recent30Buys.filter(function(b){return b.quality==='bad';}).length;
      var neutralCount=recent30Buys.filter(function(b){return b.quality==='neutral';}).length;
      var pendingCount=recent30Buys.filter(function(b){return b.quality==='pending';}).length;
      qualityDesc='🔍 大單品質檢查（近30天 '+recent30Buys.length+' 次買入）：';
      var parts=[];
      if(goodCount>0)parts.push(goodCount+' 次真實買盤 ✅');
      if(neutralCount>0)parts.push(neutralCount+' 次普通 ⚠️');
      if(badCount>0)parts.push(badCount+' 次可疑誘多 ❌');
      if(pendingCount>0)parts.push(pendingCount+' 次待驗證 ⏳');
      qualityDesc+=parts.join('、');
      if(badCount>=goodCount&&badCount>0){
        qualityDesc+='。<b style="color:#d94f4f;">⚠️ 可疑大單較多，建議謹慎，不要因為「有大單」就追高</b>';
      } else if(goodCount>=2){
        qualityDesc+='。<b style="color:#2ea86e;">✅ 多次真實買盤，主力進場可信度高</b>';
      } else if(goodCount===1&&badCount===0){
        qualityDesc+='。<b style="color:#c8952a;">主力可能在進場，但訊號還需累積</b>';
      }
    }
    
    // 🆕 v3 新增：高量警示總結
    var neutralDesc='';
    if(a.bigNeutrals&&a.bigNeutrals.length>0){
      var now30n=Date.now()/1000-30*86400;
      var recent30N=a.bigNeutrals.filter(function(s){return new Date(s.date).getTime()/1000>now30n;});
      if(recent30N.length>0){
        var rejectCount=recent30N.filter(function(b){return b.type==='rejection';}).length;
        var badNCount=recent30N.filter(function(b){return b.quality==='bad';}).length;
        if(rejectCount>0||badNCount>0){
          neutralDesc='⚡ 高量警示：近30天有 '+recent30N.length+' 次「高量但方向不明」';
          if(rejectCount>0)neutralDesc+='（含 '+rejectCount+' 次衝高被打下）';
          if(badNCount>0){
            neutralDesc+='。<b style="color:#d94f4f;">⚠️ 其中 '+badNCount+' 次可能是誘多或主力派發，務必小心</b>';
          } else {
            neutralDesc+='。請對照 K 線確認方向';
          }
        }
      }
    }

    // 5. 賣出訊號警示
    var warnDesc='';
    if(sell15.length>=2){
      warnDesc='🚨 警示：近15天出現'+sell15.length+'次大單賣出，主力可能在出貨！若進場務必嚴格停損';
    } else if(sell15.length===1){
      warnDesc='⚠️ 注意：近15天有1次大單賣出訊號，進場需謹慎分批';
    }
    
    // 組合白話文
    if(rsDesc) fullAdvice+=rsDesc+'。';
    if(bigDesc) fullAdvice+='<br>'+bigDesc+'。';
    if(priceDesc) fullAdvice+='<br>'+priceDesc+'。';
    if(wc2Desc) fullAdvice+='<br>'+wc2Desc+'。';
    if(qualityDesc) fullAdvice+='<br>'+qualityDesc+'。';
    if(neutralDesc) fullAdvice+='<br>'+neutralDesc+'。';
    if(warnDesc) fullAdvice+='<br><span style="color:#d94f4f;">'+warnDesc+'</span>';
    if(finalAction) fullAdvice+='<br><b style="color:#3a7bd5;">'+finalAction+'</b>';
    
    h+='<div class="verdict-cond"><div class="verdict-cond-lbl">📌 操作建議</div>';
    h+='<div class="verdict-cond-txt">'+condTxt+'</div></div>';
    if(fullAdvice){
      h+='<div style="margin-top:10px;background:#f0f8ff;border-left:3px solid #3a7bd5;padding:12px 14px;border-radius:0 8px 8px 0;">';
      h+='<div style="font-size:11px;color:#3a7bd5;font-weight:700;letter-spacing:1px;margin-bottom:6px;">📊 綜合判讀</div>';
      h+='<div style="font-size:13px;color:#1a3a5c;font-weight:500;line-height:1.9;">'+fullAdvice+'</div></div>';
    }
    h+='<button class="watchlist-btn'+(inWL?' active':'')+'" id="wlBtn-'+sym+'" onclick="handleWatchlist(\''+sym+'\')">';
    h+=(inWL?'⭐ 已在觀察清單':'☆ 加入觀察清單')+'</button>';
    h+='</div></div></div>';
    el.innerHTML=h;
    ['tech','big','ins'].forEach(function(id){
      var hdr=document.getElementById('fh-'+id);
      if(hdr)hdr.addEventListener('click',function(){toggleFold('fb-'+id,'fa-'+id);});
    });
  }catch(e){
    el.innerHTML='<div class="err">❌ '+e.message+'</div>';
  }
}

function handleWatchlist(sym){
  var added=toggleWatchlistItem(sym);
  var btn=document.getElementById('wlBtn-'+sym);
  if(btn){
    btn.textContent=added?'⭐ 已在觀察清單':'☆ 加入觀察清單';
    btn.className='watchlist-btn'+(added?' active':'');
  }
}

function toggleFold(bodyId,arrowId){
  var body=document.getElementById(bodyId);
  var arrow=document.getElementById(arrowId);
  if(!body||!arrow)return;
  var open=body.classList.toggle('open');
  arrow.classList.toggle('open',open);
}

// ── 右邊：籌碼系統 ──
function initChipPage(){
  loadSectors();
  fillSectorSelects();
  var btns=document.getElementById('chipSectorBtns');
  btns.innerHTML='';
  Object.keys(SECTORS).forEach(function(s){
    var b=document.createElement('div');
    b.className='sbt'+(s===chipCurrentSector?' active':'');
    b.textContent=s;
    b.addEventListener('click',function(){
      chipCurrentSector=s;
      document.querySelectorAll('#chipSectorBtns .sbt').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      showChipStocks(s);
    });
    btns.appendChild(b);
  });
  document.getElementById('bestListOut').innerHTML='';
  showChipStocks(chipCurrentSector);
}

function showChipStocks(s){
  var el=document.getElementById('chipStockList');
  var stocks=sortStocksByChipScore(SECTORS[s]||[]);
  if(!stocks.length){
    el.innerHTML='<div class="card"><div style="padding:16px;color:#aaa;font-size:13px;">此板塊暫無股票</div></div>';
    return;
  }
  var h='<div class="chip-input-card">';
  h+='<div class="ch"><span style="font-size:13px;font-weight:700;color:#8a6e2f;">'+s+'板塊 — 點股票輸入籌碼</span></div>';
  stocks.forEach(function(st){
    var hist=chipLoadWithStorage(st.sym);
    var last=hist.length?hist[hist.length-1]:null;
    var isOpen=expandedSym===st.sym;
    if(last){
      var cap=last.cap||'M';
      var chip=chipAnalysis(cap,last.i,last.r,last.n||0);
      var daysAgo=Math.floor((Date.now()-new Date(last.d).getTime())/86400000);
      var stale=daysAgo>90;
      h+='<div class="chip-stock-row" onclick="toggleChipInput(\''+st.sym+'\')">';
      h+='<span class="chip-sym">'+st.sym+'</span>';
      h+='<span class="chip-badge badge-'+chip.light+'">'+chip.emoji+' '+chip.status.replace(/[⚠️✅❌🟡🟠🔴]/g,'').trim()+'</span>';
      h+='<span class="chip-score">'+chip.score+'/10 <span style="font-size:11px;color:#888;font-weight:600;">'+chip.levelText+'</span></span>';
      h+='<span class="chip-updated" style="'+(stale?'color:#d94f4f;':'')+'">'+last.d+(stale?' ⚠️':'')+'</span>';
      h+='</div>';
    } else {
      h+='<div class="chip-stock-row" onclick="toggleChipInput(\''+st.sym+'\')">';
      h+='<span class="chip-sym">'+st.sym+'</span>';
      h+='<span class="chip-badge badge-n">待輸入</span>';
      h+='<span class="chip-score" style="color:#ccc;">—</span>';
      h+='<span class="chip-updated">尚無數據</span>';
      h+='</div>';
    }
    var cap=last?last.cap||'M':'M';
    var sf=last?last.sf||0:0;
    h+='<div class="chip-input-panel'+(isOpen?' open':'')+'" id="panel-'+st.sym+'">';
    h+='<div style="font-size:12px;color:#a88d4a;margin-bottom:6px;">市值等級：</div>';
    h+='<div class="cap-btns" id="capbtns-'+st.sym+'">';
    ['S','M','L','XL','XXL'].forEach(function(c){
      var labels={S:'S <20B',M:'M 20-100B',L:'L 100-500B',XL:'XL 500-2000B',XXL:'XXL >2000B'};
      h+='<div class="cap-btn'+(cap===c?' active':'')+'" onclick="selectCap(\''+st.sym+'\',\''+c+'\')">'+labels[c]+'</div>';
    });
    h+='</div>';
    h+='<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;">';
    h+='<span style="font-size:12px;color:#a09070;">機構%</span><input class="num" id="ci-'+st.sym+'" placeholder="60" value="'+(last?last.i:'')+'">';
    h+='<span style="font-size:12px;color:#a09070;">散戶%</span><input class="num" id="cr-'+st.sym+'" placeholder="25" value="'+(last?last.r:'')+'">';
    h+='<span style="font-size:12px;color:#a09070;">內部人%</span><input class="num" id="cn-'+st.sym+'" placeholder="5" value="'+(last?last.n||0:'')+'">';
    h+='</div>';
    h+='<div style="display:flex;gap:6px;align-items:center;margin-top:8px;">';
    h+='<span style="font-size:12px;color:#a09070;">放空比例%</span><input class="num" id="csf-'+st.sym+'" placeholder="0" value="'+sf+'" style="width:70px;">';
    h+='<span style="font-size:11px;color:#bbb;">Short Float %</span>';
    h+='</div>';
    h+='<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">';
    h+='<button class="btn" style="padding:7px 14px;font-size:12px;" onclick="saveChipStock(\''+st.sym+'\',\''+s+'\')">儲存</button>';
    h+='<button class="btn-sm" onclick="addToWatchlistFromChip(\''+st.sym+'\')">⭐ 加入觀察清單</button>';
    h+='<select id="movesel-'+st.sym+'" class="sector-select" style="flex:1;padding:6px;font-size:12px;">';
    Object.keys(SECTORS).forEach(function(sec){
      h+='<option value="'+sec+'"'+(sec===s?' selected':'')+'>'+sec+'</option>';
    });
    h+='</select>';
    h+='<button class="btn-sm" onclick="moveStock(\''+st.sym+'\',\''+s+'\',document.getElementById(\'movesel-'+st.sym+'\').value)">移至</button>';
    h+='<button class="btn-red" onclick="deleteStock(\''+st.sym+'\',\''+s+'\')">刪除</button>';
    h+='</div>';
    if(last){
      var chip2=chipAnalysis(last.cap||'M',last.i,last.r,last.n||0);
      h+='<div style="margin-top:10px;padding:8px 10px;background:#fffbec;border-radius:8px;font-size:12px;color:#5a4010;">';
      h+='<b>'+chip2.emoji+' '+chip2.status+'</b> — '+chip2.text;
      if(sf>=15) h+=' | ⚡放空'+sf+'%有軋空潛力';
      h+='</div>';
    }
    if(hist.length>1){
      h+='<div style="margin-top:10px;">';
      h+='<div style="font-size:10px;color:#c0a870;font-weight:700;margin-bottom:5px;">📅 籌碼歷史記錄</div>';
      hist.slice().reverse().forEach(function(rec,idx){
        var prev=hist[hist.length-2-idx];
        var trend='',trendColor='#aaa';
        if(prev&&rec.r!=null&&prev.r!=null){
          var dif=rec.r-prev.r;
          if(dif<0){trend='散戶↓'+Math.abs(dif).toFixed(0)+'%';trendColor='#2ea86e';}
          else if(dif>0){trend='散戶↑'+dif.toFixed(0)+'%';trendColor='#d94f4f';}
          else{trend='持平';}
        }
        h+='<div class="chip-hist-row">';
        h+='<span style="color:#bbb;width:80px;">'+rec.d+'</span>';
        h+='<span style="color:#333;font-weight:600;">機'+rec.i+'% 散'+rec.r+'%</span>';
        if(rec.sf) h+='<span style="color:#888;margin-left:4px;">空'+rec.sf+'%</span>';
        h+='<span style="color:'+trendColor+';font-weight:600;margin-left:8px;">'+trend+'</span>';
        h+='</div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function toggleChipInput(sym){
  expandedSym=expandedSym===sym?null:sym;
  showChipStocks(chipCurrentSector);
}
function selectCap(sym,cap){
  selectedCap[sym]=cap;
  var btns=document.getElementById('capbtns-'+sym);
  if(btns){
    btns.querySelectorAll('.cap-btn').forEach(function(b,i){
      b.classList.toggle('active',['S','M','L','XL','XXL'][i]===cap);
    });
  }
}
function saveChipStock(sym,sector){
  var i=parseFloat(document.getElementById('ci-'+sym).value);
  var r=parseFloat(document.getElementById('cr-'+sym).value);
  var n=parseFloat(document.getElementById('cn-'+sym).value)||0;
  var sf=parseFloat(document.getElementById('csf-'+sym).value)||0;
  var cap=selectedCap[sym]||(function(){
    var hist=chipLoadWithStorage(sym);
    return hist.length?hist[hist.length-1].cap||'M':'M';
  })();
  if(isNaN(i)||isNaN(r)){alert('請輸入有效的機構%和散戶%');return;}
  chipSave(sym,i,r,n,cap,sf);
  expandedSym=null;
  showChipStocks(sector||chipCurrentSector);
}
function addToWatchlistFromChip(sym){
  var added=toggleWatchlistItem(sym);
  alert(added?'✅ 已將 '+sym+' 加入觀察清單':'已從觀察清單移除 '+sym);
}
function showBestList(){
  var el=document.getElementById('bestListOut');
  var all=[];
  Object.keys(SECTORS).forEach(function(s){
    SECTORS[s].forEach(function(st){
      var hist=chipLoadWithStorage(st.sym);
      if(!hist.length)return;
      var last=hist[hist.length-1];
      var chip=chipAnalysis(last.cap||'M',last.i,last.r,last.n||0);
      var daysAgo=Math.floor((Date.now()-new Date(last.d).getTime())/86400000);
      all.push({sym:st.sym,sector:s,score:chip.score,status:chip.status,levelText:chip.levelText,
        emoji:chip.emoji,light:chip.light,inst:last.i,retail:last.r,
        sf:last.sf||0,date:last.d,daysAgo:daysAgo,stale:daysAgo>90});
    });
  });
  var seen={};
  var uniq=all.filter(function(x){if(seen[x.sym])return false;seen[x.sym]=true;return true;});
  uniq.sort(function(a,b){return b.score-a.score;});
  if(!uniq.length){
    el.innerHTML='<div class="card"><div style="padding:20px;text-align:center;color:#aaa;font-size:13px;">尚無籌碼數據</div></div>';
    return;
  }
  var h='<div class="best-list">';
  h+='<div class="best-hdr"><span style="font-size:13px;font-weight:700;color:#8a6e2f;">🏆 籌碼最佳名單</span>';
  h+='<span style="font-size:11px;color:#bbb;">共'+uniq.length+'檔，按評分排序</span></div>';
  uniq.forEach(function(x){
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f5eed8;">';
    h+='<div><span style="font-family:monospace;font-weight:700;font-size:14px;color:#1a1a2e;cursor:pointer;" onclick="quickAnalyze(\''+x.sym+'\')">'+x.sym+'</span>';
    h+='<span style="font-size:11px;color:#888;margin-left:6px;">'+x.sector+'</span>';
    if(x.sf>=15) h+='<span style="font-size:10px;color:#c8952a;margin-left:4px;">⚡空'+x.sf+'%</span>';
    h+='</div>';
    h+='<span class="chip-badge badge-'+x.light+'">'+x.emoji+' '+x.score+'/10 '+(x.levelText||'')+'</span>';
    h+='<span style="font-size:11px;color:#a09070;">機'+x.inst+'% 散'+x.retail+'%</span>';
    h+='<span style="font-size:10px;color:'+(x.stale?'#d94f4f':'#ccc')+';">'+x.date+'</span>';
    h+='</div>';
  });
  h+='</div>';
  el.innerHTML=h;
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

initAccumSectors();
</script>

<style>
.dt-overlay{position:fixed;inset:0;background:rgba(26,26,46,.6);z-index:9999;display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow-y:auto;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.dt-overlay.open{display:flex;}
.dt-modal{background:#fffdf5;border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;position:relative;}
.dt-modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(135deg,#fffbec,#fff8e0);border-bottom:1px solid #e8dfc0;}
.dt-modal-title{font-size:14px;font-weight:700;color:#8a6e2f;letter-spacing:1px;}
.dt-modal-close{background:#f0e8d0;color:#8a6e2f;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.dt-modal-close:active{background:#c8a84b;color:#fff;}
.dt-modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.dt-iframe{width:100%;min-height:600px;border:none;display:block;}
.dt-launch-btn{display:block;width:100%;margin-top:12px;padding:14px;background:linear-gradient(135deg,#3a7bd5,#5b21b6);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(58,123,213,.3);-webkit-tap-highlight-color:transparent;}
.dt-launch-btn:active{transform:scale(.98);box-shadow:0 1px 4px rgba(58,123,213,.3);}
.dt-launch-hint{text-align:center;font-size:11px;color:#888;margin-top:6px;}
.sync-fab{position:fixed;top:12px;right:12px;background:linear-gradient(135deg,#c8a84b,#8a6e2f);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:9998;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;}
.sync-fab:active{transform:scale(.92);}
</style>

<div class="dt-overlay" id="dtOverlay">
<div class="dt-modal" onclick="event.stopPropagation()">
<div class="dt-modal-hdr">
<span class="dt-modal-title">快速判斷決策樹</span>
<button class="dt-modal-close" onclick="dtClose()">關閉</button>
</div>
<div class="dt-modal-body">
<iframe id="dtFrame" class="dt-iframe" src="about:blank"></iframe>
</div>
</div>
</div>

<button class="sync-fab" onclick="location.href='sync.html'" title="資料同步">🔄</button>

<script>
(function(){
  var ol = document.getElementById('dtOverlay');
  ol.addEventListener('click', function(e){
    if(e.target === ol) dtClose();
  });

  window.dtOpen = function(params){
    var url = 'decision.html';
    if(params){
      var qs = [];
      for(var k in params){
        var v = params[k];
        if(v === null || v === undefined || v === '') continue;
        qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
      }
      if(qs.length) url += '?' + qs.join('&');
    }
    document.getElementById('dtFrame').src = url;
    document.getElementById('dtOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.dtClose = function(){
    var ol = document.getElementById('dtOverlay');
    ol.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function(){
      if(!ol.classList.contains('open')){
        document.getElementById('dtFrame').src = 'about:blank';
      }
    }, 300);
  };

  function extractData(sym){
    var params = {sym: sym};
    var root = document.getElementById('accumOut');
    if(!root) return params;
    var txt = root.innerText || root.textContent || '';

    var m;
    m = txt.match(/\+(\d+)%/);
    if(m) params.gain = parseInt(m[1]);
    if(!params.gain){
      m = txt.match(/距主力成本\s*\+?(\-?\d+)%/);
      if(m) params.gain = parseInt(m[1]);
    }

    m = txt.match(/RS\s+(\d+)/);
    if(m) params.rs = parseInt(m[1]);

    var sellCount = (txt.match(/⚠️\s*賣出/g) || []).length;
    if(sellCount >= 2) params.sell = 'heavy';
    else if(sellCount === 1) params.sell = 'light';
    else params.sell = 'no';

    params.newhigh = /✨\s*RS\s*創/.test(txt) || /✨\s*新高/.test(txt) || /RS\s*創3月新高/.test(txt) ? 1 : 0;

    if(/🔥\s*RS\s*上升/.test(txt) || /RS上升/.test(txt)) params.trend = 'up';
    else if(/⚠️\s*RS\s*走弱/.test(txt) || /RS走弱/.test(txt)) params.trend = 'down';
    else params.trend = 'stable';

    m = txt.match(/突破後第\s*(\d+)\s*天/);
    if(m) params.break = parseInt(m[1]);
    else if(/底部震盪中/.test(txt)) params.break = 'pre';

    if(/MACD\s*強勢/.test(txt)) params.macd = 'strong';
    else if(/MACD\s*柱縮/.test(txt)) params.macd = 'weak';
    else if(/MACD\s*零軸下/.test(txt)) params.macd = 'down';

    return params;
  }

  function injectBtn(){
    var root = document.getElementById('accumOut');
    if(!root) return;
    var blocks = root.querySelectorAll('.verdict-block');
    for(var i = 0; i < blocks.length; i++){
      var block = blocks[i];
      if(block.querySelector('.dt-launch-btn')) continue;
      var card = block.closest('.card');
      if(!card) continue;
      var tk = card.querySelector('.tk');
      if(!tk) continue;
      var sym = (tk.textContent || '').trim().toUpperCase();
      if(!sym) continue;

      var btn = document.createElement('button');
      btn.className = 'dt-launch-btn';
      btn.textContent = '🎯 用決策樹快速判斷';
      (function(s){
        btn.onclick = function(){
          var p = extractData(s);
          window.dtOpen(p);
        };
      })(sym);

      var hint = document.createElement('div');
      hint.className = 'dt-launch-hint';
      hint.textContent = '自動帶入此頁數據,可手動修改';

      var inner = block.querySelector('.verdict-inner');
      if(inner){
        inner.appendChild(btn);
        inner.appendChild(hint);
      } else {
        block.appendChild(btn);
        block.appendChild(hint);
      }
    }
  }

  function start(){
    var root = document.getElementById('accumOut');
    if(!root){
      setTimeout(start, 500);
      return;
    }
    var obs = new MutationObserver(function(){
      setTimeout(injectBtn, 50);
    });
    obs.observe(root, {childList: true, subtree: true});
    injectBtn();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
