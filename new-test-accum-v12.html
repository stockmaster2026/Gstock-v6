<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個股深度分析</title>
  <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="決策樹">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="theme-color" content="#c8a84b">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f0e8;font-family:'Helvetica Neue',sans-serif;padding:16px;color:#1a1a2e;}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.hdr h2{font-size:16px;font-weight:700;letter-spacing:2px;color:#8a6e2f;}
.dot{width:8px;height:8px;border-radius:50%;background:#c8a84b;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab{flex:1;padding:11px;border-radius:10px;border:1px solid #e0d5b8;background:#fffbec;color:#aaa;font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none;}
.tab.active{background:#c8a84b;color:#fff;border-color:#c8a84b;}
.srow{display:flex;gap:8px;margin-bottom:16px;align-items:center;}
input.sym{background:#fffbec;border:1px solid #e0d5b8;border-radius:10px;padding:11px 14px;font-size:16px;color:#1a1a2e;width:120px;text-transform:uppercase;outline:none;}
input.sym:focus{border-color:#c8a84b;}
input.num{background:#fffbec;border:1px solid #e0d5b8;border-radius:8px;padding:7px 10px;font-size:13px;color:#1a1a2e;width:65px;text-align:center;outline:none;}
input.num:focus{border-color:#c8a84b;}
.btn{background:#c8a84b;color:#fff;border:none;border-radius:10px;padding:11px 24px;font-size:15px;font-weight:700;cursor:pointer;}
.btn-sm{background:#f0e8d0;color:#8a6e2f;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;}
.btn-green{background:#edfaf3;color:#2ea86e;border:1px solid #c5eedd;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:700;}
.btn-blue{background:#e8f0fe;color:#3a7bd5;border:1px solid #b8d0f8;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:700;}
.btn-red{background:#fef0f0;color:#d94f4f;border:1px solid #f5cccc;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:600;}
.btn-scan{background:#f0e8d0;color:#8a6e2f;border:1px solid #e0d5b8;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-scan:active{background:#c8a84b;color:#fff;}
.btn-scan-gold{background:#c8a84b;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;flex:1;text-align:center;box-shadow:0 2px 6px rgba(200,168,75,.3);}
.btn-scan-gold:active{background:#a8882b;}
.btn-manual{background:#3a7bd5;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;width:100%;text-align:center;box-shadow:0 2px 6px rgba(58,123,213,.3);}
.btn-manual:active{background:#2a5ba0;}
.btn-rs{background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;width:100%;text-align:center;box-shadow:0 2px 6px rgba(124,58,237,.3);}
.btn-rs:active{background:#5b21b6;}
.manual-card{background:#fffdf5;border:1px solid #b8d0f8;border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.manual-title{font-size:13px;font-weight:700;color:#3a7bd5;margin-bottom:8px;border-bottom:1px solid #e0e8f0;padding-bottom:6px;}
.manual-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;color:#444;}
.manual-label{color:#666;font-weight:500;}
.manual-value{font-weight:700;color:#1a1a2e;}
.card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 12px rgba(200,168,75,.08);}
.ch{padding:14px 16px 12px;border-bottom:1px solid #f0e8d0;}
.tk{font-size:22px;font-weight:700;color:#1a1a2e;font-family:monospace;}
.px{font-size:15px;color:#aaa;margin-left:8px;}
.sbts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.sbt{background:#fffbec;border:1px solid #e0d5b8;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;color:#8a6e2f;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.sbt.active{background:#c8a84b;border-color:#c8a84b;color:#fff;}
.stock-list{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;}
.stock-chip{background:#fffbec;border:1px solid #e0d5b8;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;font-family:monospace;color:#5a4010;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.accum-hero{padding:16px;background:#fffbec;border-bottom:1px solid #f0e8d0;}
.accum-score-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.accum-emoji{font-size:22px;letter-spacing:3px;}
.accum-pb{height:5px;background:#f0e0b0;border-radius:3px;overflow:hidden;margin-bottom:5px;}
.accum-pf{height:100%;border-radius:3px;transition:width 1.2s;}
.accum-label{font-size:13px;color:#5a4010;font-weight:700;}
.signal-dates{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;}
.signal-date{background:#fff8e8;border:1px solid #e8d090;border-radius:5px;padding:3px 8px;font-size:11px;font-family:monospace;color:#8a6e2f;font-weight:600;}
.core-block{padding:14px 16px;background:#fffdf5;border-bottom:1px solid #f0e8d0;}
.core-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f5eed8;}
.core-row:last-child{border:none;}
.core-q{font-size:13px;color:#8a7050;font-weight:600;}
.core-a{font-size:14px;font-weight:700;font-family:monospace;text-align:right;}
.ca-blue{color:#3a7bd5;}.ca-green{color:#2ea86e;}.ca-yellow{color:#c8952a;}.ca-gray{color:#999;}
.tech-row{padding:10px 16px;background:#faf5e8;border-bottom:1px solid #f0e8d0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tech-lbl{font-size:12px;color:#a88d4a;font-weight:600;margin-right:2px;}
.tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;}
.tg{background:#edfaf3;color:#2ea86e;border:1px solid #c5eedd;}
.tr{background:#fef0f0;color:#d94f4f;border:1px solid #f5cccc;}
.ty{background:#fffbec;color:#c8952a;border:1px solid #f0dfa0;}
.bigorder-row{padding:10px 16px;border-bottom:1px solid #f0e8d0;display:flex;justify-content:space-between;align-items:center;}
.fold-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;border-top:1px solid #f0e8d0;background:#fffbec;-webkit-tap-highlight-color:transparent;}
.fold-title{font-size:12px;letter-spacing:1px;color:#5a4010;font-weight:700;}
.fold-arrow{font-size:12px;color:#a88d4a;transition:transform .3s;}
.fold-arrow.open{transform:rotate(180deg);}
.fold-body{display:none;padding:14px 16px;border-top:1px solid #f5eed8;background:#fffdf5;}
.fold-body.open{display:block;}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid #f8f0e0;}
.rw:last-child{border:none;}
.lb{color:#6a5030;font-weight:600;}
.vl{font-family:monospace;font-weight:700;color:#2a1a00;}
.bg{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;}
.gu{background:#edfaf3;color:#2ea86e;}
.gd{background:#fef0f0;color:#d94f4f;}
.gw{background:#fffbec;color:#c8952a;}
.gn{background:#f5f5f5;color:#aaa;}
.note{font-size:13px;color:#5a4010;margin-top:6px;line-height:1.7;}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;}
.ib{background:#faf5e8;border-radius:10px;padding:12px;text-align:center;border:1px solid #f0e0c0;}
.inn{font-size:26px;font-weight:700;font-family:monospace;}
.ib-b .inn{color:#2ea86e;}.ib-s .inn{color:#d94f4f;}
.is{font-size:12px;color:#a88d4a;margin-top:3px;}
.verdict-block{border-top:2px solid #e8d090;background:linear-gradient(135deg,#fffbec,#fff8e0);}
.verdict-inner{padding:18px 16px;}
.verdict-main{font-size:22px;font-weight:900;margin-bottom:8px;line-height:1.3;}
.vm-buy{color:#2ea86e;}.vm-watch{color:#c8952a;}.vm-wait{color:#d94f4f;}
.verdict-score{font-size:13px;color:#c0a870;margin-bottom:10px;font-weight:600;}
.verdict-warn{margin-top:10px;background:#fff5f5;border-left:3px solid #d94f4f;padding:10px 12px;border-radius:0 8px 8px 0;}
.verdict-warn-lbl{font-size:10px;color:#d94f4f;font-weight:700;letter-spacing:1px;margin-bottom:3px;}
.verdict-warn-txt{font-size:12px;color:#d94f4f;font-weight:600;line-height:1.6;}
.verdict-cond{margin-top:10px;background:#fffbec;border-left:3px solid #c8a84b;padding:10px 12px;border-radius:0 8px 8px 0;}
.verdict-cond-lbl{font-size:10px;color:#c8952a;font-weight:700;letter-spacing:1px;margin-bottom:3px;}
.verdict-cond-txt{font-size:13px;color:#5a4010;font-weight:600;line-height:1.6;}
.watchlist-btn{display:inline-flex;align-items:center;gap:5px;background:#fffbec;border:1px solid #e0d5b8;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:#8a6e2f;cursor:pointer;margin-top:10px;}
.watchlist-btn.active{background:#fff8e0;border-color:#c8a84b;color:#c8952a;}
/* 右邊籌碼頁 */
.chip-input-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 12px rgba(200,168,75,.08);}
.chip-stock-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f5eed8;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.chip-stock-row:last-child{border:none;}
.chip-sym{font-family:monospace;font-weight:700;font-size:14px;color:#1a1a2e;width:60px;}
.chip-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-g{background:#edfaf3;color:#2ea86e;border:1px solid #c5eedd;}
.badge-y{background:#fffbec;color:#c8952a;border:1px solid #f0dfa0;}
.badge-o{background:#fff5ec;color:#d97020;border:1px solid #f0cca0;}
.badge-r{background:#fef0f0;color:#d94f4f;border:1px solid #f5cccc;}
.badge-n{background:#f5f5f5;color:#bbb;border:1px solid #e8e8e8;}
.chip-score{font-size:13px;font-weight:700;font-family:monospace;color:#333;}
.chip-updated{font-size:11px;color:#999;}
.chip-input-panel{display:none;padding:14px 16px;background:#faf5e8;border-top:1px solid #f0e8d0;}
.chip-input-panel.open{display:block;}
.cap-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.cap-btn{padding:5px 10px;border-radius:6px;border:1px solid #e0d5b8;background:#fffbec;font-size:11px;font-weight:700;color:#8a6e2f;cursor:pointer;}
.cap-btn.active{background:#c8a84b;color:#fff;border-color:#c8a84b;}
.best-list{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;overflow:hidden;margin-bottom:14px;}
.best-hdr{padding:14px 16px;border-bottom:1px solid #f0e8d0;display:flex;justify-content:space-between;align-items:center;}
.add-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;padding:14px 16px;margin-bottom:14px;}
.sector-select{background:#fffbec;border:1px solid #e0d5b8;border-radius:10px;padding:10px;font-size:14px;color:#1a1a2e;outline:none;flex:1;}
.chip-hist-row{display:flex;gap:8px;padding:5px 0;font-size:12px;border-bottom:1px solid #f5eed8;color:#444;}
.chip-hist-row:last-child{border:none;}
/* 掃描結果 */
.scan-result-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;margin-bottom:8px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.scan-sym{font-family:monospace;font-weight:700;font-size:16px;color:#1a1a2e;}
.scan-sector{font-size:11px;color:#888;margin-left:6px;}
.watchlist-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;overflow:hidden;margin-bottom:14px;}
.wl-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f5eed8;}
.wl-row:last-child{border:none;}
/* 板塊管理 */
.sector-manage-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #f5eed8;}
.sector-manage-row:last-child{border:none;}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #e8d090;border-top-color:#c8a84b;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{color:#c0a870;font-size:14px;padding:30px;text-align:center;}
.err{color:#d94f4f;font-size:13px;padding:16px;text-align:center;background:#fff5f5;border-radius:10px;}
</style>
</head>
<body>
<div class="hdr"><div class="dot"></div><h2>個股深度分析</h2></div>
<div class="tabs">
  <div class="tab active" id="tab1">📈 技術與籌碼</div>
  <div class="tab" id="tab2">📊 板塊籌碼</div>
</div>

<!-- 左邊：技術與籌碼 -->

<div id="accumPage" style="display:block;">
  <!-- 操作手冊按鈕（藍色）-->
  <div style="margin-bottom:8px;">
    <button class="btn-manual" onclick="toggleManual()">📚 操作手冊（先看這個）</button>
    <div id="manualOut" style="display:none;margin-top:8px;"></div>
  </div>
  <!-- 掃描按鈕（金色）-->
  <div style="display:flex;gap:6px;margin-bottom:6px;">
    <button class="btn-scan-gold" onclick="showScanPanel('big')">🐋 大單掃描</button>
    <button class="btn-scan-gold" onclick="showScanPanel('accum')">📈 吸籌掃描</button>
    <button class="btn-scan-gold" onclick="showTodayBest()">🏆 今日精選</button>
  </div>
  <!-- RS強度排名按鈕（紫色）-->
  <div style="margin-bottom:6px;">
    <button class="btn-rs" onclick="showScanPanel('rs')">📊 RS 強度排名（Minervini法則）</button>
  </div>
  <div style="margin-bottom:10px;">
    <div style="display:flex;gap:6px;">
      <button class="btn-scan-gold" onclick="runBigOrderAlert('core')" style="flex:1;background:#d94f4f;box-shadow:0 2px 6px rgba(217,79,79,.3);">🐋 核心大單</button>
      <button class="btn-scan-gold" onclick="runBigOrderAlert('explore')" style="flex:1;background:#7c3aed;box-shadow:0 2px 6px rgba(124,58,237,.3);">🔭 探索大單</button>
    </div>
    <div id="bigOrderAlertOut" style="display:none;margin-top:8px;"></div>
  </div>
  <div style="margin-bottom:10px;">
    <div style="display:flex;gap:6px;">
      <button class="btn-scan-gold" onclick="runSellAlert('core')" style="flex:1;background:#8a2020;box-shadow:0 2px 6px rgba(138,32,32,.3);">🐋 核心賣出</button>
      <button class="btn-scan-gold" onclick="runSellAlert('explore')" style="flex:1;background:#4a1d6e;box-shadow:0 2px 6px rgba(74,29,110,.3);">🔭 探索賣出</button>
    </div>
    <div id="sellAlertOut" style="display:none;margin-top:8px;"></div>
  </div>
  <div style="margin-bottom:10px;">
    <div style="display:flex;gap:6px;">
      <button class="btn-scan-gold" onclick="runPivotScan('approach')" style="flex:1;background:#3a7bd5;box-shadow:0 2px 6px rgba(58,123,213,.3);">🔜 即將突破</button>
      <button class="btn-scan-gold" onclick="runPivotScan('fresh')" style="flex:1;background:#2ea86e;box-shadow:0 2px 6px rgba(46,168,110,.3);">🚀 剛突破</button>
    </div>
    <div id="pivotScanOut" style="display:none;margin-top:8px;"></div>
  </div>
  <div style="margin-bottom:10px;">
    <div style="display:flex;gap:6px;margin-bottom:6px;">
      <button class="btn-scan-gold" onclick="recordBreakouts()" style="flex:1;background:#c8952a;box-shadow:0 2px 6px rgba(200,149,42,.3);">📌 記錄突破股</button>
      <button class="btn-scan-gold" onclick="showBreakoutTracking()" style="flex:1;background:#5a4010;box-shadow:0 2px 6px rgba(90,64,16,.3);">📊 我的突破追蹤</button>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn-sm" onclick="exportTracking()" style="flex:1;padding:8px;">💾 匯出備份</button>
      <button class="btn-sm" onclick="document.getElementById('importTrackFile').click()" style="flex:1;padding:8px;">📥 匯入備份</button>
      <input type="file" id="importTrackFile" accept=".json" style="display:none;" onchange="importTracking(this)">
    </div>
    <div id="trackingOut" style="display:none;margin-top:8px;"></div>
  </div>
  <div id="scanPanel" style="display:none;"></div>
  <!-- 今日精選 -->
  <div id="todayBestOut" style="display:none;margin-bottom:14px;"></div>
  <!-- 觀察清單 -->
  <div style="margin-bottom:10px;">
    <button class="btn-sm" onclick="toggleWatchlist('accum')" style="width:100%;padding:9px;">⭐ 我的觀察清單</button>
    <div id="accumWatchlist" style="display:none;margin-top:8px;"></div>
  </div>
  <!-- 新增股票 -->
  <div class="add-card">
    <div style="font-size:12px;color:#8a6e2f;font-weight:700;margin-bottom:8px;">➕ 新增股票到板塊</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input class="sym" id="accumNewSym" placeholder="代號" style="width:90px;">
      <select class="sector-select" id="accumNewSector"></select>
      <button class="btn" onclick="addStockFromAccum()">新增</button>
    </div>
  </div>
  <div class="sbts" id="accumSectorBtns"></div>
  <div id="accumStockList"></div>
  <div class="srow">
    <input class="sym" id="sym" value="" placeholder="輸入代號分析">
    <button class="btn" onclick="runAccum()">分析</button>
  </div>
  <div id="accumOut"></div>
</div>

<!-- 右邊：板塊籌碼 -->

<div id="chipPage" style="display:none;">
  <div style="display:flex;gap:8px;margin-bottom:10px;">
    <button class="btn-green" onclick="showBestList()" style="flex:1;">🏆 最佳籌碼名單</button>
  </div>
  <!-- 觀察清單 -->
  <div style="margin-bottom:10px;">
    <button class="btn-sm" onclick="toggleWatchlist('chip')" style="width:100%;padding:9px;">⭐ 我的觀察清單</button>
    <div id="chipWatchlist" style="display:none;margin-top:8px;"></div>
  </div>
  <!-- 新增股票 -->
  <div class="add-card">
    <div style="font-size:12px;color:#8a6e2f;font-weight:700;margin-bottom:8px;">➕ 新增股票到板塊</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input class="sym" id="newSym" placeholder="代號" style="width:90px;">
      <select class="sector-select" id="newSector"></select>
      <button class="btn" onclick="addNewStock()">新增</button>
    </div>
  </div>
  <!-- 板塊管理 -->
  <div style="margin-bottom:10px;">
    <button class="btn-sm" onclick="toggleSectorManage()" style="width:100%;padding:9px;">⚙️ 板塊管理（新增/刪除板塊）</button>
    <div id="sectorManagePanel" style="display:none;margin-top:8px;"></div>
  </div>
  <div class="sbts" id="chipSectorBtns"></div>
  <div id="chipStockList"></div>
  <div id="bestListOut"></div>
</div>

<script>
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';
var chipCache={};
var accumCurrentSector='太空衛星';
var chipCurrentSector='太空衛星';
var expandedSym=null;
var selectedCap={};

document.getElementById('tab1').addEventListener('click',function(){ switchTab('accum'); });
document.getElementById('tab2').addEventListener('click',function(){ switchTab('chip'); });

function switchTab(t){

// ── 資料存取 ──
function saveSectors(){
  try{
    var data={};
    Object.keys(SECTORS).forEach(function(s){
      var def=DEFAULT_SECTORS[s]||[];
      var extra=SECTORS[s].map(function(x){return x.sym;}).filter(function(sym){return def.indexOf(sym)===-1;});
      // 儲存自訂板塊名稱和所有股票
      if(!DEFAULT_SECTORS[s]||extra.length){
        data[s]=SECTORS[s].map(function(x){return x.sym;});
      }
    });
    localStorage.setItem('sectors_v3',JSON.stringify(data));
  }catch(e){}
}

function loadSectors(){
  try{
    var s=localStorage.getItem('sectors_v3');
    if(!s) return;
    var data=JSON.parse(s);
    Object.keys(data).forEach(function(sector){
      if(!SECTORS[sector]){
        // 新板塊
        SECTORS[sector]={};
        SECTORS[sector]=[];
      }
      data[sector].forEach(function(sym){
        if(!SECTORS[sector].find(function(x){return x.sym===sym;}))
          SECTORS[sector].push({sym:sym});
      });
    });
    // 還原自訂板塊名稱
    try{
      var names=localStorage.getItem('sector_names');
      if(names){
        var namesData=JSON.parse(names);
        namesData.forEach(function(item){
          if(!SECTORS[item.name]){
            SECTORS[item.name]=[];
          }
        });
      }
    }catch(e){}
  }catch(e){}
}

//   v4 修訂：今日大單警報加入「失敗重試」對抗 corsproxy 限流
//   1. fYahooRetry：失敗等 1.5 秒重試，最多 3 次
//   2. 掃描間隔 250ms → 700ms
//   3. 窗口 5/10 天 → 15/30 天（與個股頁對齊）
//   4. 失敗清單透明顯示，不再默默吞掉
// ══════════════════════════════════════════════════
async function fYahooRetry(s,tries){
  tries=tries||3;
  for(var attempt=0;attempt<tries;attempt++){
    try{
      var yRaw=await fYahoo(s);
      var va=mkValid(yRaw);
      if(va.length>=55) return va;
    }catch(e){}
    if(attempt<tries-1) await new Promise(function(r){setTimeout(r,1500);});
  }
  return null;
}

// 核心池板塊名單（舊 11 板塊）。不在這名單的板塊（測試星池、探索、自訂…）一律算「探索池」
var CORE_SECTORS=['AI巨頭','AI基礎設施','光通訊','AI電力散熱','太空衛星','無人機國防','量子運算','儲存硬體','生技健康','衛星通信','貴金屬礦業'];

  var allSyms=[];
  Object.keys(SECTORS).forEach(function(s){
    var isCore=CORE_SECTORS.indexOf(s)!==-1;
    if(mode==='core'&&!isCore) return;
    if(mode==='explore'&&isCore) return;
    SECTORS[s].forEach(function(st){
      if(!allSyms.find(function(x){return x.sym===st.sym;}))
        allSyms.push({sym:st.sym,sector:s});
    });
  });
  if(!allSyms.length){
    el.innerHTML='<div class="card"><div style="padding:16px;text-align:center;color:#aaa;font-size:13px;">'+poolName+' 目前沒有股票，請先到下方板塊用「➕ 新增股票到板塊」加入</div></div>';

    var item=allSyms[i];
    var va=await fYahooRetry(item.sym);
    if(va){
      try{
        var a=detectAccum(va);
        var lastT=va[va.length-1].t;          // 最近一根 K 棒的時間 → 當「0 天前」基準
        var nowS=Date.now()/1000;
        var buy15=a.bigBuys.filter(function(b){return (nowS-new Date(b.date).getTime()/1000)<15*86400;});
        var buy30=a.bigBuys.filter(function(b){return (nowS-new Date(b.date).getTime()/1000)<30*86400;});

          var bb=buy15[buy15.length-1];
          var daysAgo=Math.max(0,Math.round((lastT-va[bb.idx].t)/86400));  // 用 K 棒時間算，最近一根=0天前
          alerts.push({sym:item.sym,sector:item.sector,daysAgo:daysAgo,ratio:bb.ratio,level:'🔥'});
        } else if(buy30.length>0){
          var bb=buy30[buy30.length-1];
          var daysAgo=Math.max(0,Math.round((lastT-va[bb.idx].t)/86400));
          alerts.push({sym:item.sym,sector:item.sector,daysAgo:daysAgo,ratio:bb.ratio,level:'📈'});

  alerts.sort(function(a,b){return a.daysAgo-b.daysAgo;});

    var emptyH='<div class="card"><div style="padding:16px;text-align:center;color:#aaa;font-size:13px;">'+poolName+' 今日無明顯大單買入訊號</div>';

    }
    emptyH+='</div>';
    el.innerHTML=emptyH;
    return;
  }
  var h='<div class="card">';
  h+='<div class="ch" style="display:flex;justify-content:space-between;align-items:center;">';
  h+='<span style="font-size:13px;font-weight:700;color:'+poolColor+';">'+poolName+' 大單警報</span>';

    h+='</div>';
  });

// ══════════════════════════════════════════════════
//   v9 新增：大單賣出警報（出貨偵測）
//   賣出很少造假，全部列出，用品質+背離分級：
//   🔴 真出貨（後續未反彈）  🟡 可能洗盤（後續反彈）
//   ⚠️ 背離：股價沒跌但大單在賣 = 出貨前兆（最危險）
// ══════════════════════════════════════════════════
async function runSellAlert(mode){
  mode=mode||'core';
  var el=document.getElementById('sellAlertOut');
  el.style.display='block';
  var poolName=mode==='core'?'🐋 核心池（舊板塊）':'🔭 探索池';
  var poolColor=mode==='core'?'#8a2020':'#4a1d6e';
  el.innerHTML='<div class="loading"><span class="spin"></span>掃描 '+poolName+' 大單賣出中，請稍候...</div>';
  var allSyms=[];
  Object.keys(SECTORS).forEach(function(s){
    var isCore=CORE_SECTORS.indexOf(s)!==-1;
    if(mode==='core'&&!isCore) return;
    if(mode==='explore'&&isCore) return;
    SECTORS[s].forEach(function(st){
      if(!allSyms.find(function(x){return x.sym===st.sym;})) allSyms.push({sym:st.sym,sector:s});
    });
  });
  if(!allSyms.length){
    el.innerHTML='<div class="card"><div style="padding:16px;text-align:center;color:#aaa;font-size:13px;">'+poolName+' 目前沒有股票</div></div>';
    return;
  }
  var alerts=[],failed=[];
  for(var i=0;i<allSyms.length;i++){
    var item=allSyms[i];
    var va=await fYahooRetry(item.sym);
    if(va){
      try{
        var a=detectAccum(va);
        var lastT=va[va.length-1].t;
        var nowS=Date.now()/1000;
        var sell15=a.bigSells.filter(function(s){return (nowS-new Date(s.date).getTime()/1000)<15*86400;});
        if(sell15.length>0){
          var ss=sell15[sell15.length-1];
          var daysAgo=Math.max(0,Math.round((lastT-va[ss.idx].t)/86400));
          var cur=+a.cur;
          // 背離：必須是「過去式」賣單（≥3天前，要有後續資料才能比），且賣出後股價不跌反漲 ≥+2%
          var priceVsSell=((cur-ss.price)/ss.price*100);
          var diverge=(daysAgo>=3 && priceVsSell>=2); // 賣出≥3天 且 股價反而漲≥2% 才算真背離
          alerts.push({sym:item.sym,sector:item.sector,daysAgo:daysAgo,ratio:ss.ratio,
            quality:ss.quality,priceVsSell:+priceVsSell.toFixed(1),diverge:diverge,sellCount:sell15.length});
        }
      }catch(e){ failed.push(item.sym); }
    } else { failed.push(item.sym); }
    await new Promise(function(r){setTimeout(r,700);});
  }
  // 排序：確認真出貨+背離最前 → 確認真出貨 → 剛賣出待觀察 → 洗盤
  alerts.sort(function(a,b){
    function score(x){
      var fresh=(x.daysAgo<3);
      if(!fresh && x.quality==='bad' && x.diverge) return 0;
      if(!fresh && x.quality==='bad') return 1;
      if(fresh) return 2;
      return 3;
    }
    return score(a)-score(b)||a.daysAgo-b.daysAgo;
  });
  if(!alerts.length){
    var eh='<div class="card"><div style="padding:16px;text-align:center;color:#aaa;font-size:13px;">'+poolName+' 近 15 天無明顯大單賣出</div>';

// ══════════════════════════════════════════════════
//   v6 新增：起漲關鍵價掃描
//   type='approach' 即將突破（還沒突破、接近起漲關鍵價，由近到遠）
//   type='fresh'    剛突破（已站上、突破後≤10天且≤15%，仍在買進區）
//   掃描全部板塊（核心+探索）
// ══════════════════════════════════════════════════
async function runPivotScan(type){
  var el=document.getElementById('pivotScanOut');
  el.style.display='block';
  var isApproach=(type==='approach');
  var title=isApproach?'🔜 即將突破（接近起漲關鍵價）':'🚀 剛突破（仍在買進區）';
  var titleColor=isApproach?'#3a7bd5':'#2ea86e';
  el.innerHTML='<div class="loading"><span class="spin"></span>掃描 '+title+'，請稍候（約3分鐘）...</div>';
  var allSyms=[];
  Object.keys(SECTORS).forEach(function(s){
    SECTORS[s].forEach(function(st){
      if(!allSyms.find(function(x){return x.sym===st.sym;}))
        allSyms.push({sym:st.sym,sector:s});
    });
  });
  var results=[];
  var failed=[];
  for(var i=0;i<allSyms.length;i++){
    var item=allSyms[i];
    var va=await fYahooRetry(item.sym);
    if(va){
      try{
        var a=detectAccum(va);
        var cur=+a.cur, pivot=+a.trTop;
        if(isApproach){
          // 還沒突破、現價在起漲關鍵價下方、距離 ≤15%
          if(!a.trEnded && cur>0 && cur<pivot){
            var distPct=+((pivot-cur)/cur*100).toFixed(1);
            if(distPct<=15) results.push({sym:item.sym,sector:item.sector,cur:cur,pivot:pivot,distPct:distPct});
          }
        } else {
          // 已突破、突破後 ≤10 天且漲幅 0~15%（仍在買進區）
          if(a.trEnded && a.dA>=0 && a.dA<=10 && a.pA>=0 && a.pA<=15){
            results.push({sym:item.sym,sector:item.sector,cur:cur,pivot:pivot,dA:a.dA,pA:a.pA,bvr:a.breakoutVolRatio});
          }
        }
      }catch(e){ failed.push(item.sym); }
    } else {
      failed.push(item.sym);
    }
    await new Promise(function(r){setTimeout(r,700);});
  }
  // 排序：即將突破→距離由近到遠；剛突破→天數由新到舊、再漲幅由小到大
  if(isApproach) results.sort(function(a,b){return a.distPct-b.distPct;});
  else results.sort(function(a,b){return a.dA-b.dA||a.pA-b.pA;});
  results=results.slice(0,20);
  if(!results.length){
    var emptyH='<div class="card"><div style="padding:16px;text-align:center;color:#aaa;font-size:13px;">'+title+'：目前池子裡無符合的股票</div>';
    if(failed.length) emptyH+='<div style="padding:10px 16px;background:#fff5f5;border-top:1px solid #f5eed8;font-size:11px;color:#d94f4f;">⚠️ '+failed.length+' 檔讀取失敗（限流）：'+failed.join('、')+'</div>';
    emptyH+='</div>';
    el.innerHTML=emptyH;
    return;
  }
  var h='<div class="card">';
  h+='<div class="ch" style="display:flex;justify-content:space-between;align-items:center;">';
  h+='<span style="font-size:13px;font-weight:700;color:'+titleColor+';">'+title+'</span>';
  h+='<button class="btn-sm" onclick="document.getElementById(\'pivotScanOut\').style.display=\'none\'">收起</button></div>';
  results.forEach(function(r){
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f5eed8;cursor:pointer;" onclick="quickAnalyze(\''+r.sym+'\')">';
    h+='<div style="display:flex;align-items:center;gap:8px;">';
    h+='<div><span style="font-family:monospace;font-weight:700;font-size:15px;color:#1a1a2e;">'+r.sym+'</span>';
    h+='<span style="font-size:11px;color:#888;margin-left:5px;">'+r.sector+'</span></div></div>';
    if(isApproach){
      var dc=r.distPct<=3?'#d94f4f':r.distPct<=7?'#d97020':'#8a6e2f';
      h+='<div style="text-align:right;"><div style="font-size:13px;font-weight:700;color:'+dc+';">還差 '+r.distPct+'%</div>';
      h+='<div style="font-size:11px;color:#999;">現價$'+r.cur.toFixed(2)+' → 關鍵價$'+r.pivot.toFixed(2)+'</div></div>';
    } else {
      var bvrTxt='';
      if(r.bvr!==null&&r.bvr!==undefined) bvrTxt=r.bvr>=1.5?' · 量'+r.bvr+'x✅':' · 量'+r.bvr+'x⚠️';
      h+='<div style="text-align:right;"><div style="font-size:13px;font-weight:700;color:#2ea86e;">突破'+r.dA+'天 +'+r.pA+'%</div>';
      h+='<div style="font-size:11px;color:#999;">關鍵價$'+r.pivot.toFixed(2)+bvrTxt+'</div></div>';
    }
    h+='</div>';
  });
  if(failed.length) h+='<div style="padding:10px 16px;background:#fff5f5;border-top:1px solid #f5eed8;font-size:11px;color:#d94f4f;">⚠️ '+failed.length+' 檔讀取失敗（限流）：'+failed.join('、')+'</div>';
  h+='</div>';
  el.innerHTML=h;
}

// ══════════════════════════════════════════════════
//   v7 新增：突破追蹤系統（路線 B，從今天起累積）
//   📌 記錄：把目前所有「剛突破」的股自動存起來（突破日、突破價、量能）
//   📊 追蹤：每次打開即時抓股價，更新漲幅、最高漲幅、健康判讀；每≥5天存一筆快照
//   💾 匯出 / 📥 匯入：避免 localStorage 掉了
// ══════════════════════════════════════════════════
function loadTrack(){ try{var s=localStorage.getItem('breakout_track_v1');return s?JSON.parse(s):[];}catch(e){return [];} }
function saveTrack(arr){ try{localStorage.setItem('breakout_track_v1',JSON.stringify(arr));}catch(e){} }
function todayStr(){ return new Date().toISOString().slice(0,10); }

// 健康判讀（白話文）：依突破後天數 + 目前漲幅
function getTrackHealth(dA,gain,brokeBreakout){
  if(brokeBreakout) return {txt:'🔴 跌破突破點，第一波可能結束',color:'#d94f4f',bg:'#fef0f0'};
  if(gain>=60) return {txt:'🚫 漲幅過大（主升段尾聲），別追、該想出場',color:'#d94f4f',bg:'#fef0f0'};
  if(dA<=3&&gain>=20) return {txt:'⚠️ 突破才 '+dA+' 天就 +'+gain.toFixed(0)+'%，噴太快，小心過熱回測',color:'#d97020',bg:'#fff5ec'};
  if(dA>=6&&dA<=15&&gain>=5&&gain<=30) return {txt:'✅ 健康拉升，走在主升段正常軌道',color:'#2ea86e',bg:'#edfaf3'};
  if(dA>=5&&gain<5) return {txt:'⚠️ 突破 '+dA+' 天漲幅 <5%，動能不足，留意假突破',color:'#d97020',bg:'#fff5ec'};
  if(gain>30&&gain<60) return {txt:'📈 漲幅 +'+gain.toFixed(0)+'%，主升段中後段，可考慮分批/移動停利',color:'#c8952a',bg:'#fffbec'};
  return {txt:'⏳ 突破 '+dA+' 天 +'+gain.toFixed(0)+'%，發展中，持續觀察',color:'#8a6e2f',bg:'#fffbec'};
}

async function recordBreakouts(){
  var el=document.getElementById('trackingOut');
  el.style.display='block';
  el.innerHTML='<div class="loading"><span class="spin"></span>掃描目前「剛突破」的股並記錄中（約3分鐘）...</div>';
  var allSyms=[];
  Object.keys(SECTORS).forEach(function(s){
    SECTORS[s].forEach(function(st){
      if(!allSyms.find(function(x){return x.sym===st.sym;})) allSyms.push({sym:st.sym,sector:s});
    });
  });
  var track=loadTrack();
  var existing={}; track.forEach(function(t){existing[t.sym]=true;});
  var added=0, already=0, failed=[];
  for(var i=0;i<allSyms.length;i++){
    var item=allSyms[i];
    var va=await fYahooRetry(item.sym);
    if(va){
      try{
        var a=detectAccum(va);
        // 「剛突破」條件：已突破、突破後 0~10 天、漲幅 0~15%
        if(a.trEnded && a.dA>=0 && a.dA<=10 && a.pA>=0 && a.pA<=15){
          if(existing[item.sym]){ already++; }
          else{
            var m=va.length;
            var boIdx=Math.max(0,Math.min(m-a.dA,m-1));
            var bDate=new Date(va[boIdx].t*1000).toISOString().slice(0,10);
            var bPrice=+a.bP;
            track.push({
              sym:item.sym, sector:item.sector,
              breakoutDate:bDate, breakoutPrice:bPrice,
              breakoutVol:(a.breakoutVolRatio!==null&&a.breakoutVolRatio!==undefined)?a.breakoutVolRatio:null,
              recordedDate:todayStr(),
              maxGain:a.pA,
              snapshots:[{date:todayStr(),gain:a.pA}]
            });
            existing[item.sym]=true; added++;
          }
        }
      }catch(e){ failed.push(item.sym); }
    } else { failed.push(item.sym); }
    await new Promise(function(r){setTimeout(r,700);});
  }
  saveTrack(track);
  var h='<div class="card"><div style="padding:16px;text-align:center;">';
  h+='<div style="font-size:14px;font-weight:700;color:#5a4010;margin-bottom:6px;">📌 記錄完成</div>';
  h+='<div style="font-size:13px;color:#666;">新增 <b style="color:#2ea86e;">'+added+'</b> 檔，已在追蹤 '+already+' 檔，目前共追蹤 <b>'+track.length+'</b> 檔</div>';
  if(failed.length) h+='<div style="font-size:11px;color:#d94f4f;margin-top:8px;">⚠️ '+failed.length+' 檔讀取失敗：'+failed.join('、')+'</div>';
  h+='<div style="font-size:12px;color:#3a7bd5;margin-top:10px;">👉 按「📊 我的突破追蹤」查看，記得「💾 匯出備份」</div>';
  h+='</div></div>';
  el.innerHTML=h;
}

async function showBreakoutTracking(){
  var el=document.getElementById('trackingOut');
  el.style.display='block';
  var track=loadTrack();
  if(!track.length){
    el.innerHTML='<div class="card"><div style="padding:16px;text-align:center;color:#aaa;font-size:13px;">尚無追蹤記錄。先按「📌 記錄突破股」開始累積</div></div>';
    return;
  }
  el.innerHTML='<div class="loading"><span class="spin"></span>更新 '+track.length+' 檔追蹤股的最新股價中...</div>';
  var failed=[];
  for(var i=0;i<track.length;i++){
    var t=track[i];
    var va=await fYahooRetry(t.sym);
    if(va){
      try{
        var a=detectAccum(va);
        var cur=+a.cur;
        t._cur=cur;
        t._gain=+((cur-t.breakoutPrice)/t.breakoutPrice*100).toFixed(1);
        t._dA=a.dA;
        t._broke=cur<t.breakoutPrice;
        if(t._gain>(t.maxGain||0)) t.maxGain=t._gain;
        // 每 ≥5 天存一筆快照（週線概念）
        var snaps=t.snapshots||[];
        var last=snaps.length?snaps[snaps.length-1]:null;
        var daysSinceSnap=last?Math.round((Date.now()/1000-new Date(last.date).getTime()/1000)/86400):999;
        if(!last||daysSinceSnap>=5){ snaps.push({date:todayStr(),gain:t._gain}); t.snapshots=snaps; }
      }catch(e){ t._err=true; failed.push(t.sym); }
    } else { t._err=true; failed.push(t.sym); }
    await new Promise(function(r){setTimeout(r,700);});
  }
  saveTrack(track);
  // 統計
  var valid=track.filter(function(t){return !t._err;});
  var winCnt=valid.filter(function(t){return (t.maxGain||0)>=20;}).length;
  var brokeCnt=valid.filter(function(t){return t._broke;}).length;
  var avgGain=valid.length?(valid.reduce(function(s,t){return s+(t._gain||0);},0)/valid.length).toFixed(1):0;
  var avgMax=valid.length?(valid.reduce(function(s,t){return s+(t.maxGain||0);},0)/valid.length).toFixed(1):0;
  var h='<div class="card">';
  h+='<div class="ch" style="display:flex;justify-content:space-between;align-items:center;">';
  h+='<span style="font-size:13px;font-weight:700;color:#5a4010;">📊 我的突破追蹤（'+track.length+'檔）</span>';
  h+='<button class="btn-sm" onclick="document.getElementById(\'trackingOut\').style.display=\'none\'">收起</button></div>';
  // 統計摘要
  h+='<div style="padding:12px 16px;background:#fffbec;border-bottom:1px solid #f0e8d0;">';
  h+='<div style="font-size:11px;color:#c8952a;font-weight:700;letter-spacing:1px;margin-bottom:6px;">📈 系統體檢摘要</div>';
  h+='<div style="font-size:13px;color:#5a4010;line-height:1.8;">';
  h+='曾達 +20% 的：<b style="color:#2ea86e;">'+winCnt+'</b> / '+valid.length+' 檔　跌破突破點：<b style="color:#d94f4f;">'+brokeCnt+'</b> 檔<br>';
  h+='目前平均漲幅 <b>'+avgGain+'%</b>　平均最高漲幅 <b style="color:#2ea86e;">'+avgMax+'%</b>';
  h+='</div>';
  h+='<div style="font-size:11px;color:#999;margin-top:6px;">※ 樣本還少時數字僅供參考，累積越多越準</div>';
  h+='</div>';
  // 逐檔（依目前漲幅排序）
  valid.sort(function(a,b){return (b._gain||0)-(a._gain||0);});
  valid.forEach(function(t){
    var hv=getTrackHealth(t._dA||0,t._gain||0,t._broke);
    var gColor=t._gain>=0?'#2ea86e':'#d94f4f';
    h+='<div style="padding:12px 16px;border-bottom:1px solid #f5eed8;">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="quickAnalyze(\''+t.sym+'\')">';
    h+='<div><span style="font-family:monospace;font-weight:700;font-size:15px;color:#1a1a2e;">'+t.sym+'</span>';
    h+='<span style="font-size:11px;color:#888;margin-left:5px;">'+t.sector+'</span></div>';
    h+='<div style="text-align:right;"><span style="font-size:15px;font-weight:700;color:'+gColor+';">'+(t._gain>=0?'+':'')+t._gain+'%</span>';
    h+='<div style="font-size:11px;color:#999;">最高 +'+(t.maxGain||0)+'% · 突破'+(t._dA||0)+'天</div></div>';
    h+='</div>';
    h+='<div style="font-size:11px;color:#888;margin-top:4px;">突破日 '+t.breakoutDate+' · 突破價 $'+(+t.breakoutPrice).toFixed(2)+(t.breakoutVol!==null?' · 量'+t.breakoutVol+'x':'')+'</div>';
    h+='<div style="margin-top:6px;padding:6px 10px;background:'+hv.bg+';border-radius:6px;font-size:12px;color:'+hv.color+';font-weight:600;">'+hv.txt+'</div>';
    h+='<button class="btn-red" style="margin-top:6px;" onclick="removeTrack(\''+t.sym+'\')">移除追蹤</button>';
    h+='</div>';
  });
  if(failed.length) h+='<div style="padding:10px 16px;background:#fff5f5;font-size:11px;color:#d94f4f;">⚠️ '+failed.length+' 檔更新失敗：'+failed.join('、')+'</div>';
  h+='</div>';
  el.innerHTML=h;
}

function removeTrack(sym){
  if(!confirm('確定移除追蹤 '+sym+'？')) return;
  var track=loadTrack().filter(function(t){return t.sym!==sym;});
  saveTrack(track);
  showBreakoutTracking();
}

function exportTracking(){
  var track=loadTrack();
  if(!track.length){ alert('目前沒有追蹤記錄可匯出'); return; }
  var blob=new Blob([JSON.stringify(track,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='breakout-track-'+todayStr()+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},500);
}

function importTracking(input){
  var file=input.files&&input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('格式不對');
      var track=loadTrack();
      var existing={}; track.forEach(function(t){existing[t.sym]=true;});
      var merged=0;
      data.forEach(function(t){ if(t.sym&&!existing[t.sym]){ track.push(t); existing[t.sym]=true; merged++; } });
      saveTrack(track);
      alert('✅ 匯入成功，新增 '+merged+' 檔（重複的略過），目前共 '+track.length+' 檔');
      showBreakoutTracking();
    }catch(err){ alert('❌ 匯入失敗：檔案格式不正確'); }
    input.value='';
  };
  reader.readAsText(file);
}

async function runScan(sector){
  var el=document.getElementById('scanResult');
  var stocks=SECTORS[sector]||[];
  if(!stocks.length){el.innerHTML='<div class="err">此板塊無股票</div>';return;}
  el.innerHTML='<div class="loading"><span class="spin"></span>掃描 '+sector+' 板塊（'+stocks.length+'檔）...</div>';
  var results=[];
  for(var i=0;i<stocks.length;i++){
    var sym=stocks[i].sym;
    try{
      var yRaw=await fYahoo(sym);
      var va=mkValid(yRaw);
      if(va.length>=55){
        var a=detectAccum(va);
        var now15=Date.now()/1000-15*86400;
        var now30=Date.now()/1000-30*86400;
        var buy15=a.bigBuys.filter(function(s){return new Date(s.date).getTime()/1000>now15;});
        var buy30=a.bigBuys.filter(function(s){return new Date(s.date).getTime()/1000>now30;});
        var sell15=a.bigSells.filter(function(s){return new Date(s.date).getTime()/1000>now15;});
        // 計算RS Rating + 趨勢 + 新高（用2年數據確保足夠歷史）
        var rsRating=null, rsTrend=null, rsNewHigh=false;
        try{
          var spyCloses=await getSPYCloses();
          // 額外抓該股票2年數據用於RS計算
          var yRaw2y=await fYahoo2y(sym);
          if(yRaw2y&&spyCloses){
            var va2y=mkValid(yRaw2y);
            var stockCloses=va2y.map(function(d){return d.c;});
            if(stockCloses.length>=252){
              var spyPerf=calcRSPerformance(spyCloses);
              var stockPerf=calcRSPerformance(stockCloses);
              rsRating=calcRSRating(stockPerf,spyPerf);
              // 一個月前的RS
              if(stockCloses.length>=252+21&&spyCloses.length>=252+21){
                var rsOld=calcRSHistory(stockCloses,spyCloses,21);
                if(rsOld!==null){
                  var diff=rsRating-rsOld;
                  if(diff>=10)rsTrend='up';
                  else if(diff<=-10)rsTrend='down';
                  else rsTrend='stable';
                }
              }
              // RS新高
              if(rsRating>=70&&stockCloses.length>=252+63&&spyCloses.length>=252+63){
                var rs30=calcRSHistory(stockCloses,spyCloses,30);
                var rs60=calcRSHistory(stockCloses,spyCloses,60);
                rsNewHigh=(rs30===null||rs30<rsRating)&&(rs60===null||rs60<rsRating);
              }
            }
          }
        }catch(e){}
        results.push({sym:sym,a:a,buy15:buy15,buy30:buy30,sell15:sell15,sector:sector,bigBuys:a.bigBuys,rsRating:rsRating,rsTrend:rsTrend,rsNewHigh:rsNewHigh});
      }
    }catch(e){}
    await new Promise(function(r){setTimeout(r,300);});
  }
  // 排序
  if(scanType==='big'){
    results.sort(function(a,b){
      var sa=a.buy15.length*3+a.buy30.length-a.sell15.length*2;
      var sb=b.buy15.length*3+b.buy30.length-b.sell15.length*2;
      return sb-sa;
    });
  } else if(scanType==='rs'){
    results.sort(function(a,b){
      var ra=a.rsRating||0;
      var rb=b.rsRating||0;
      return rb-ra;
    });
  } else {
    results.sort(function(a,b){return b.a.sm-a.a.sm;});
  }
  renderScanResults(results);
}

// 今日精選存儲
var todayBestCache=[];

function calcScanScore(r){
  var s=0;
  var now=Date.now()/1000;
  // 近期大單權重
  var buy5=r.bigBuys?r.bigBuys.filter(function(b){return (now-new Date(b.date).getTime()/1000)<5*86400;}).length:0;
  var buy10=r.bigBuys?r.bigBuys.filter(function(b){return (now-new Date(b.date).getTime()/1000)<10*86400;}).length:0;
  if(buy5>=1)s+=3;
  else if(r.buy15.length>=2)s+=2;
  else if(r.buy15.length===1)s+=1;
  else if(r.buy30.length>=1)s+=0;
  s=Math.max(0,s-Math.min(r.sell15.length,2));
  if(r.a.sm>=5)s+=3;else if(r.a.sm>=3)s+=2;else if(r.a.sm>=1)s+=1;
  var macdOk=r.a.macd.aboveZero&&!r.a.macd.histShrink&&!r.a.macd.macdDown;
  if(r.a.ma5up)s+=1;
  if(macdOk)s+=1;
  if(!r.a.volShrink)s+=1;
  // RS Rating加入評分
  if(r.rsRating!==null&&r.rsRating!==undefined){
    if(r.rsRating>=90)s+=2;
    else if(r.rsRating>=70)s+=1;
    else if(r.rsRating<50)s-=2;
  }
  // RS新高加入評分（Minervini最重視的訊號）
  if(r.rsNewHigh)s+=2;
  // RS趨勢加入評分
  if(r.rsTrend==='up')s+=1;
  else if(r.rsTrend==='down')s-=1;
  // ── 漲幅懲罰：避免已漲多的股票排第一 ──
  var diff=(+r.a.cur-+r.a.scP)/+r.a.scP*100;
  if(diff<=20)s+=2;
  else if(diff<=40)s+=0;
  else if(diff<=60)s-=2;
  else if(diff<=100){s-=3;s=Math.min(s,6);}
  else s=Math.min(s,4);
  return Math.max(0,Math.min(s,10));
}

function getActionAdvice(score, diff){
  // 漲幅超過60%不追高
  if(diff>60) return {text:'❌ 不追高（漲幅'+diff+'%）',color:'#d94f4f',bg:'#fef0f0'};
  // 漲幅40-60%：即使評分高也要輕倉
  if(diff>=40){
    if(score>=6) return {text:'⚠️ 輕倉試探 10-15%（已漲'+diff+'%）',color:'#d97020',bg:'#fff5ec'};
    return {text:'⏸ 觀望等待',color:'#d97020',bg:'#fff5ec'};
  }
  // 漲幅20-40%：倉位減半
  if(diff>=20){
    if(score>=8) return {text:'🚀 強力買入 · 倉位減半 15-25%',color:'#2ea86e',bg:'#edfaf3'};
    if(score>=6) return {text:'👀 可輕倉試探 10-15%',color:'#c8952a',bg:'#fffbec'};
    if(score>=4) return {text:'⏸ 觀望等待',color:'#d97020',bg:'#fff5ec'};
    return {text:'❌ 不建議',color:'#d94f4f',bg:'#fef0f0'};
  }
  // 漲幅<20%：最佳進場點
  if(score>=8) return {text:'🚀 強力買入 · 標準倉位 30-50%',color:'#2ea86e',bg:'#edfaf3'};
  if(score>=6) return {text:'👀 可輕倉試探 15-25%',color:'#c8952a',bg:'#fffbec'};
  if(score>=4) return {text:'⏸ 觀望等待',color:'#d97020',bg:'#fff5ec'};
  return {text:'❌ 不建議',color:'#d94f4f',bg:'#fef0f0'};
}
function getSignalDesc(r){
  var parts=[];
  var macdOk=r.a.macd.aboveZero&&!r.a.macd.histShrink&&!r.a.macd.macdDown;
  if(r.buy15.length>=2)parts.push('近期大單'+r.buy15.length+'次買入');
  else if(r.buy15.length===1)parts.push('近期大單買入');
  else if(r.buy30.length>=1)parts.push('30天內有大單');
  if(r.a.macd.aboveZero&&r.a.ma5up)parts.push('MACD翻正+MA5向上');
  else if(r.a.macd.aboveZero)parts.push('MACD已翻正');
  if(r.a.sm>=4)parts.push('吸籌訊號強');
  else if(r.a.sm>=2)parts.push('底部吸籌中');
  if(r.sell15.length>0)parts.push('⚠️有賣出訊號');
  return parts.length?parts.join('，'):'訊號待確認';
}

function renderScanResults(results){
  var el=document.getElementById('scanResult');
  if(!results.length){el.innerHTML='<div class="err">無法取得數據</div>';return;}
  results.forEach(function(r){ r.scanScore=calcScanScore(r); });
  // 根據scanType決定排序
  if(scanType==='rs'){
    results.sort(function(a,b){
      var ra=(a.rsRating!==null&&a.rsRating!==undefined)?a.rsRating:-1;
      var rb=(b.rsRating!==null&&b.rsRating!==undefined)?b.rsRating:-1;
      return rb-ra;
    });
  } else {
    results.sort(function(a,b){return b.scanScore-a.scanScore;});
  }
  // 存入今日精選
  results.forEach(function(r){
    var idx=todayBestCache.findIndex(function(x){return x.sym===r.sym;});
    if(idx>=0)todayBestCache[idx]=r;
    else todayBestCache.push(r);

  var RANKS=['🥇','🥈','🥉'];

  results.forEach(function(r,idx){
    var score=r.scanScore;
    var stars=getStars(score);
    var desc=getSignalDesc(r);
    var rank=idx<3?RANKS[idx]:''+(idx+1)+'.';
    var macdTag=r.a.macd.aboveZero?'<span class="tag tg">MACD零軸上</span>':'<span class="tag tr">MACD零軸下</span>';
    var ma5Tag=r.a.ma5up?'<span class="tag tg">MA5↑</span>':'<span class="tag tr">MA5↓</span>';
    var bigTag='';
    if(r.buy15.length>=2)bigTag='<span class="tag tg">🔥 大單x'+r.buy15.length+'</span>';
    else if(r.buy15.length===1)bigTag='<span class="tag tg">📈 大單x1</span>';
    else if(r.buy30.length>0)bigTag='<span class="tag ty">👀 近30天</span>';
    if(r.sell15.length>0)bigTag+=' <span class="tag tr">⚠️賣x'+r.sell15.length+'</span>';
    var bg=idx===0?'#fffbec':'#fffdf5';
    h+='<div class="scan-result-card" style="background:'+bg+'" onclick="quickAnalyzeAndHide(\''+r.sym+'\')">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">';
    h+='<div style="display:flex;align-items:center;gap:8px;">';
    h+='<span style="font-size:18px;min-width:30px;">'+rank+'</span>';
    h+='<div><span class="scan-sym">'+r.sym+'</span><span class="scan-sector">'+r.sector+'</span>';

function chipLoad(sym){return chipCache[sym]||[];}
function chipSave(sym,inst,ret,ins,cap,shortFloat){
  var hist=chipLoad(sym);
  var today=new Date().toISOString().slice(0,10);
  var f=hist.filter(function(h){return h.d!==today;});
  f.push({d:today,i:inst,r:ret,n:ins,cap:cap||'M',sf:shortFloat||0});
  if(f.length>8) f.splice(0,f.length-8);
  chipCache[sym]=f;
  try{localStorage.setItem('chip_'+sym,JSON.stringify(f));}catch(e){}
  return f;
}
function chipLoadWithStorage(sym){
  try{var s=localStorage.getItem('chip_'+sym);if(s){var d=JSON.parse(s);chipCache[sym]=d;return d;}}catch(e){}
  return chipCache[sym]||[];
}

// 按籌碼評分排序股票（有評分的在前，無評分的在後）
function sortStocksByChipScore(stocks){
  return stocks.slice().sort(function(a,b){
    var histA=chipLoadWithStorage(a.sym);
    var histB=chipLoadWithStorage(b.sym);
    var scoreA=-1, scoreB=-1;
    if(histA.length){
      var lastA=histA[histA.length-1];
      scoreA=chipAnalysis(lastA.cap||'M',lastA.i,lastA.r,lastA.n||0).score;
    }
    if(histB.length){
      var lastB=histB[histB.length-1];
      scoreB=chipAnalysis(lastB.cap||'M',lastB.i,lastB.r,lastB.n||0).score;
    }
    return scoreB-scoreA;
  });
}
function chipAnalysis(cap,inst,retail,insiderPct){
  var insider=insiderPct||0;
  var control=Math.min(inst+insider,100);
  var limits={S:[15,25],M:[20,35],L:[15,25],XL:[12,20],XXL:[10,15]};
  var rWarn=limits[cap]?limits[cap][0]:20, rDanger=limits[cap]?limits[cap][1]:35;
  var status,score,text,emoji,light,levelText;
  var insiderNote=insider>=15?' (含內部人'+insider+'%)':'';
  if(control>90){status='⚠️ 籌碼高度集中';score=4;emoji='🟡';light='yellow';text='控盤合計'+control+'%過高，流動性有限';}
  else if(control>=60){
    if(retail<=rWarn){status='✅ 籌碼甜蜜點';score=10;emoji='🟢';light='green';text='控盤'+control+'%'+insiderNote+'，散戶僅'+retail+'%，結構良好 ✅';}
    else if(retail<=rDanger){status='🟡 尚可觀察';score=6;emoji='🟡';light='yellow';text='控盤'+control+'%'+insiderNote+'，散戶'+retail+'%略偏高（上限'+rDanger+'%）';}
    else{status='🟠 散戶偏多';score=4;emoji='🟠';light='orange';text='散戶'+retail+'%超標（上限'+rDanger+'%），拉抬難度增加';}
  } else if(control>=40){status='🟡 控盤偏低';score=3;emoji='🟡';light='yellow';text='控盤'+control+'%'+insiderNote+'偏低，需搭配技術指標確認';}
  else{status='❌ 主力缺席';score=1;emoji='🔴';light='red';text='控盤僅'+control+'%，主力幾乎不在場';}
  // 等級文字
  if(score>=9)levelText='優質';
  else if(score>=6)levelText='尚可';
  else if(score>=4)levelText='普通';
  else if(score>=3)levelText='偏弱';
  else levelText='危險';
  return{status,score,text,emoji,light,rWarn,rDanger,control,levelText};
}

function calcRSPerformance(closes){
  var n=closes.length;
  if(n<253)return null;
  var current=closes[n-1];
  var p63=closes[n-64];
  var p126=closes[n-127];
  var p189=closes[n-190];
  var p252=closes[n-253];
  var r1=(current-p63)/p63;
  var r2=(current-p126)/p126;
  var r3=(current-p189)/p189;
  var r4=(current-p252)/p252;
  var weighted=r1*0.4+r2*0.2+r3*0.2+r4*0.2;
  return{weighted:weighted,r63:r1,r126:r2,r189:r3,r252:r4};
}

// 計算歷史每一天的RS Rating（用於趨勢判斷）
function calcRSHistory(stockCloses,spyCloses,daysBack){
  // 計算 daysBack 天前的RS Rating
  if(stockCloses.length<252+daysBack||spyCloses.length<252+daysBack)return null;
  var stockOld=stockCloses.slice(0,stockCloses.length-daysBack);
  var spyOld=spyCloses.slice(0,spyCloses.length-daysBack);
  var stockPerf=calcRSPerformance(stockOld);
  var spyPerf=calcRSPerformance(spyOld);
  return calcRSRating(stockPerf,spyPerf);
}

// 檢查RS是否創3個月新高
function checkRSNewHigh(stockCloses,spyCloses,currentRS){
  if(!currentRS)return false;
  // 檢查過去63天的RS，看今天是否最高
  for(var d=1;d<=63;d+=3){ // 每3天檢查一次，節省計算
    var pastRS=calcRSHistory(stockCloses,spyCloses,d);
    if(pastRS&&pastRS>currentRS)return false;
  }
  return true;
}

// 計算52週高點距離（%）
function calc52WeekDist(closes){
  var start=Math.max(0,closes.length-252);
  var max52=Math.max.apply(null,closes.slice(start));
  var current=closes[closes.length-1];
  return ((current-max52)/max52*100).toFixed(0); // 負值代表距離高點幾%
}

function calcRSRating(stockPerf,spyPerf){
  if(!stockPerf||!spyPerf)return null;
  var stockRatio=1+stockPerf.weighted;
  var spyRatio=1+spyPerf.weighted;
  var rs=stockRatio/spyRatio-1;
  var rating;
  if(rs>=0.5)rating=95+(rs-0.5)*8;
  else if(rs>=0.3)rating=85+(rs-0.3)*50;
  else if(rs>=0.15)rating=75+(rs-0.15)*66.67;
  else if(rs>=0.05)rating=60+(rs-0.05)*150;
  else if(rs>=0)rating=50+rs*200;
  else if(rs>=-0.05)rating=40+rs*200;
  else if(rs>=-0.15)rating=25+(rs+0.05)*150;
  else if(rs>=-0.30)rating=10+(rs+0.15)*100;
  else rating=Math.max(1,10+rs*30);
  return Math.max(1,Math.min(99,Math.round(rating)));
}

function mkValid(y){
  var ts=y.timestamp,q=y.indicators.quote[0],v=[];
  for(var i=0;i<ts.length;i++)
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i])
      v.push({c:q.close[i],o:q.open[i],h:q.high[i],l:q.low[i],v:q.volume[i],t:ts[i]});
  return v;
}
function calcOBV(va){
  var o=0;var a=[0];
  for(var i=1;i<va.length;i++){
    if(va[i].c>va[i-1].c)o+=va[i].v;
    else if(va[i].c<va[i-1].c)o-=va[i].v;
    a.push(o);
  }
  return a;
}
function calcMACD(va){
  var cl=va.map(function(d){return d.c;});
  function ema(a,k){var r=[a[0]],m=2/(k+1);for(var i=1;i<a.length;i++)r.push(a[i]*m+r[i-1]*(1-m));return r;}
  var e12=ema(cl,12),e26=ema(cl,26),ml=e12.map(function(v,i){return v-e26[i];}),sg=ema(ml,9),ht=ml.map(function(v,i){return v-sg[i];});
  var m=va.length;
  return{aboveZero:ml[m-1]>0,histShrink:Math.abs(ht[m-1])<Math.abs(ht[m-2]),macdDown:ml[m-1]<ml[Math.max(0,m-4)]};
}
function findTR(va){
  var m=va.length;
  var dt=null;
  for(var i=Math.max(10,m-180);i<m-20;i++){
    var top=true;
    for(var j=i-5;j<=i+5;j++){if(j===i||j<0||j>=m)continue;if(va[j].h>va[i].h){top=false;break;}}
    if(!top)continue;
    var tp=va[i].h,slc=va.slice(i+1,Math.min(i+60,m));
    if(!slc.length)continue;
    var mn=Math.min.apply(null,slc.map(function(x){return x.l;})),dd=(tp-mn)/tp*100;
    if(dd>=20&&tp>va[Math.max(0,i-30)].c*1.25)
      if(!dt||tp>dt.p)dt={idx:i,p:tp};
  }
  var st=dt?dt.idx:Math.max(0,m-90);
  var botIdx=st;
  for(var i=st;i<m;i++)if(va[i].l<va[botIdx].l)botIdx=i;
  var botP=va[botIdx].l;
  var newStart=botIdx;
  for(var i=botIdx+1;i<m-5;i++){
    if(va[i].h>botP*1.20){
      var nb=i;
      for(var j=i+1;j<m;j++)if(va[j].l<va[nb].l)nb=j;
      if(va[nb].l>botP*1.05){newStart=i;break;}
    }
  }
  var sc=null;
  for(var i=newStart;i<m-3;i++){
    var d=va[i],sl=va.slice(Math.max(0,i-20),i);
    if(sl.length<5)continue;
    var maxV=Math.max.apply(null,sl.map(function(x){return x.v;}));
    var drop=(d.c-va[i-1].c)/va[i-1].c*100,lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(d.v>maxV*0.45&&drop<-0.3&&rng>0&&lw>rng*0.08)
      if(!sc||d.l<sc.l)sc={idx:i,l:d.l,date:new Date(d.t*1000).toISOString().slice(0,10)};
  }
  if(!sc||va[m-1].c<sc.l*0.88){
    var mi=newStart;
    for(var i=newStart;i<m;i++)if(va[i].l<va[mi].l)mi=i;
    sc={idx:mi,l:va[mi].l,date:new Date(va[mi].t*1000).toISOString().slice(0,10)};
  }
  var arH=sc.l*1.02;
  for(var i=sc.idx+1;i<Math.min(sc.idx+10,m);i++)if(va[i].h>arH)arH=va[i].h;
  var trTop=arH*1.15;
  var trEnd=m-1,trEnded=false,bc=0;
  for(var i=sc.idx+11;i<m;i++){
    if(va[i].c>trTop){bc++;if(bc>=2){trEnd=i-1;trEnded=true;break;}}else bc=0;
  }
  return{sc:sc,trTop:trTop,trEnd:trEnd,trEnded:trEnded};
}

// ═══════════════════════════════════════════════
//   detectAccum：v2 加入第二次成本（近30天波段成本）
// ═══════════════════════════════════════════════
function detectAccum(va){
  var m=va.length,tr=findTR(va),ob=calcOBV(va);
  var avg60=va.slice(-60).reduce(function(s,d){return s+d.v;},0)/Math.min(60,m);
  var n=0;
  var signalDates=[];
  for(var i=tr.sc.idx+1;i<=tr.trEnd;i++){
    var d=va[i];
    if(d.c>tr.trTop||d.c<tr.sc.l*0.93)continue;
    var s=0;
    if(i>=3&&d.c<va[i-3].c&&ob[i]>ob[i-3])s++;
    var bd=Math.abs(d.c-d.o),lw=Math.min(d.c,d.o)-d.l,rng=d.h-d.l;
    if(rng>0&&lw>bd*0.8&&(d.c-d.l)/rng>0.4)s++;
    if(d.v/avg60>0.8&&Math.abs(d.c-d.o)/d.o*100<3)s++;
    if(i>=10){
      var p=va.slice(i-10,i),mx=Math.max.apply(null,p.map(function(x){return x.h;})),mn2=Math.min.apply(null,p.map(function(x){return x.l;}));
      if(mn2>0&&(mx-mn2)/mn2*100<25&&ob[i]>ob[i-10])s++;
    }
    if(d.l<tr.sc.l*1.08&&d.c>tr.sc.l*0.97&&i>=1&&ob[i]>=ob[i-1])s++;
    if(s>=2){n++;signalDates.push(new Date(d.t*1000).toISOString().slice(0,10));}
  }
  var cur=va[m-1].c,obvUp=ob[m-1]>ob[Math.max(0,m-20)];
  var dA=0,pA=0,bP=0,breakoutVolRatio=null,breakoutDate=null;
  if(tr.trEnded){
    dA=m-1-tr.trEnd;bP=va[Math.min(tr.trEnd+1,m-1)].c;pA=Math.round((cur/bP-1)*100);
    // 🆕 v6 新增：突破當天的量能 vs 前 20 日均量（Minervini 標準：突破要爆量 ≥1.5x，最好 2x）
    var boIdx=Math.min(tr.trEnd+1,m-1);
    breakoutDate=new Date(va[boIdx].t*1000).toISOString().slice(0,10);  // v9 新增：突破日
    var volStart=Math.max(0,boIdx-20);
    if(boIdx>volStart){
      var avgVolBefore=va.slice(volStart,boIdx).reduce(function(s,d){return s+d.v;},0)/(boIdx-volStart);
      if(avgVolBefore>0) breakoutVolRatio=+(va[boIdx].v/avgVolBefore).toFixed(1);
    }
  }
  var sm=0;
  if(tr.trEnded&&n>=6)sm=6;
  else if(tr.trEnded&&n>=3)sm=5;
  else if(tr.trEnded)sm=3;
  else if(!tr.trEnded&&n>=5&&obvUp)sm=4;
  else if(!tr.trEnded&&n>=2)sm=2;
  // ═══ 🆕 v12：頭部派發偵測 — 變數宣告（實際計算移到 bigSells 品質判斷之後）═══
  var dn=0,distDates=[],dm=0,distCmf=null,isTopping=false,distReasons=[];
  var ma5=va.slice(-5).reduce(function(s,d){return s+d.c;},0)/5;
  var ma5p=va.slice(-6,-1).reduce(function(s,d){return s+d.c;},0)/5;
  var av5=va.slice(-5).reduce(function(s,d){return s+d.v;},0)/5;
  var av20=va.slice(-20).reduce(function(s,d){return s+d.v;},0)/20;
  var bigBuys=[],bigSells=[],bigNeutrals=[];
  var startIdx=Math.max(55,m-60);
  for(var i=startIdx;i<m;i++){
    var d=va[i];
    var avg50=va.slice(i-50,i).reduce(function(s,x){return s+x.v;},0)/50;
    var volRatio=d.v/avg50;
    var rng=d.h-d.l;
    var closePos=rng>0?(d.c-d.l)/rng:0.5;
    var chg=(d.c-d.o)/d.o*100;
    var dt=new Date(d.t*1000).toISOString().slice(0,10);
    if(volRatio>=1.5&&d.c>d.o&&closePos>=0.6)
      bigBuys.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2),volume:d.v,idx:i});
    if(volRatio>=1.5&&d.c<d.o&&closePos<=0.4)
      bigSells.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2),volume:d.v,idx:i});
    // 🆕 v3 新增：高量但方向不明的日子（不歸類為買也不歸類為賣）
    if(volRatio>=1.5){
      var alreadyBuy=(d.c>d.o&&closePos>=0.6);
      var alreadySell=(d.c<d.o&&closePos<=0.4);
      if(!alreadyBuy&&!alreadySell){
        // 上影線長度（衝高被打下的型態）
        var upperShadow=rng>0?(d.h-Math.max(d.o,d.c))/rng:0;
        var inMiddle=closePos>=0.3&&closePos<=0.7;
        if(upperShadow>=0.4){
          // 衝高被打下 — 經典誘多型態
          bigNeutrals.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2),volume:d.v,idx:i,type:'rejection',high:+d.h.toFixed(2)});
        } else if(inMiddle){
          // 高量震盪收中段
          bigNeutrals.push({date:dt,ratio:+volRatio.toFixed(1),chg:+chg.toFixed(1),price:+d.c.toFixed(2),volume:d.v,idx:i,type:'middle',high:+d.h.toFixed(2)});
        }
      }
    }
  }
  // ═══ v2 新增：大單品質檢查 ═══
  // 對每筆大單計算 CMF 資金流 + 隔日驗證，判斷是真買盤還是誘多
  bigBuys.forEach(function(b){
    // 1. CMF 5天窗口（前後各2天）— 看大單周圍資金實際流向
    var cmfStart=Math.max(0,b.idx-2);
    var cmfEnd=Math.min(m-1,b.idx+2);
    var sumMFV=0,sumV=0;
    for(var k=cmfStart;k<=cmfEnd;k++){
      var dd=va[k];
      var r2=dd.h-dd.l;
      if(r2<=0)continue;
      var mfm=((dd.c-dd.l)-(dd.h-dd.c))/r2;
      sumMFV+=mfm*dd.v;
      sumV+=dd.v;
    }
    b.cmf=sumV>0?+(sumMFV/sumV).toFixed(3):null;
    // 2. 隔日驗證：後續3天有沒有跌破當天最低
    b.brokenDown=false;
    var lowThisDay=va[b.idx].l;
    for(var j=b.idx+1;j<=Math.min(b.idx+3,m-1);j++){
      if(va[j].c<lowThisDay){b.brokenDown=true;break;}
    }
    // 3. 判定品質等級
    var futureDays=m-1-b.idx;
    if(b.brokenDown){
      b.quality='bad';
      b.qualityNote='❌ 後續被打下，可能誘多';
    } else if(b.cmf!==null&&b.cmf<-0.05){
      b.quality='bad';
      b.qualityNote='❌ 資金流負向，可疑';
    } else if(b.cmf!==null&&b.cmf>0.1){
      b.quality='good';
      b.qualityNote='✅ 資金流正向，真實買盤';
    } else if(futureDays<3){
      b.quality='pending';
      b.qualityNote='⏳ 太新，待 '+(3-futureDays)+' 天後驗證';
    } else {
      b.quality='neutral';
      b.qualityNote='⚠️ 資金流中性，普通大單';
    }
  });
  // 對賣單也做品質判斷（簡化版：只看後續是否反彈）
  bigSells.forEach(function(b){
    b.bouncedBack=false;
    var highThisDay=va[b.idx].h;
    for(var j=b.idx+1;j<=Math.min(b.idx+3,m-1);j++){
      if(va[j].c>highThisDay){b.bouncedBack=true;break;}
    }
    b.quality=b.bouncedBack?'neutral':'bad';
    b.qualityNote=b.bouncedBack?'⚠️ 後續反彈，可能洗盤':'❌ 後續未反彈，主力出貨';
  });

  // 🆕 v3 新增：對高量警示（bigNeutrals）做品質判斷
  bigNeutrals.forEach(function(b){
    // CMF 5天窗口
    var cmfStart=Math.max(0,b.idx-2);
    var cmfEnd=Math.min(m-1,b.idx+2);
    var sumMFV=0,sumV=0;
    for(var k=cmfStart;k<=cmfEnd;k++){
      var dd=va[k];
      var r2=dd.h-dd.l;
      if(r2<=0)continue;
      var mfm=((dd.c-dd.l)-(dd.h-dd.c))/r2;
      sumMFV+=mfm*dd.v;
      sumV+=dd.v;
    }
    b.cmf=sumV>0?+(sumMFV/sumV).toFixed(3):null;
    // 隔日驗證：後續3天是否跌破當天最低
    b.brokenDown=false;
    var lowThisDay=va[b.idx].l;
    for(var j=b.idx+1;j<=Math.min(b.idx+3,m-1);j++){
      if(va[j].c<lowThisDay){b.brokenDown=true;break;}
    }
    // 判定
    if(b.type==='rejection'){
      // 衝高被打下
      if(b.brokenDown||(b.cmf!==null&&b.cmf<0)){
        b.quality='bad';
        b.qualityNote='❌ 衝高被打下 + 後續弱勢，強烈誘多訊號';
      } else if(b.cmf!==null&&b.cmf<0.1){
        b.quality='warn';
        b.qualityNote='⚠️ 衝高 $'+b.high+' 被打下，疑似誘多';
      } else {
        b.quality='warn';
        b.qualityNote='⚠️ 衝高被打下但資金流仍正向，多空僵持';
      }
    } else {
      // 高量收中段
      if(b.brokenDown||(b.cmf!==null&&b.cmf<-0.05)){
        b.quality='bad';
        b.qualityNote='❌ 高量震盪 + 資金流負向，可疑';
      } else if(b.cmf!==null&&b.cmf>0.2){
        b.quality='good';
        b.qualityNote='🔍 高量震盪但資金流強勁正向，主力悄悄吸籌中';
      } else {
        b.quality='warn';
        b.qualityNote='⚠️ 高量但方向不明，需觀察後續';
      }
    }
  });

  // ═══ 🆕 v12：頭部派發偵測（底部吸籌的鏡像）— 在 bigSells 品質判斷後計算 ═══
  // 只在「近期高檔區」偵測主力暗中出貨；結合 bar 掃描 + 真出貨大單 + 可疑高量
  (function(){
    var winN=Math.min(60,m);
    var winSlice=va.slice(-winN);
    var hi60=Math.max.apply(null,winSlice.map(function(x){return x.h;}));
    var lo60=Math.min.apply(null,winSlice.map(function(x){return x.l;}));
    if(hi60<=lo60)return;
    var curC=va[m-1].c;
    var inHighZone=curC>=lo60+(hi60-lo60)*0.5; // 現價在區間上半部（高檔）才偵測派發
    var highZone=lo60+(hi60-lo60)*0.55;
    var startI=Math.max(10,m-40);
    var c1=0,c2=0,c3=0,c5=0;
    for(var i=startI;i<m;i++){
      var d=va[i];
      if(d.c<highZone)continue;
      var s=0;
      if(i>=3&&d.c>va[i-3].c&&ob[i]<ob[i-3]){s++;c1++;}                                  // 價漲但OBV背離
      var body=Math.abs(d.c-d.o),uw=d.h-Math.max(d.c,d.o),rng=d.h-d.l;
      if(rng>0&&uw>body*0.8&&(d.h-d.c)/rng>0.4){s++;c2++;}                                 // 高檔長上影
      if(d.v/avg60>1.2&&Math.abs(d.c-d.o)/d.o*100<2){s++;c3++;}                            // 高量滯漲
      if(i>=10){var p=va.slice(i-10,i),mx=Math.max.apply(null,p.map(function(x){return x.h;})),mn=Math.min.apply(null,p.map(function(x){return x.l;}));if(mn>0&&(mx-mn)/mn*100<25&&ob[i]<ob[i-10])s++;}
      if(d.h>hi60*0.97&&i>=1&&ob[i]<=ob[i-1]){s++;c5++;}                                   // 衝頂無力
      if(s>=2){dn++;distDates.push(new Date(d.t*1000).toISOString().slice(0,10));}
    }
    // 近20天窗口 CMF
    var cs=Math.max(0,m-20),sumMFV=0,sumV=0;
    for(var k=cs;k<m;k++){var dd=va[k],r2=dd.h-dd.l;if(r2<=0)continue;sumMFV+=(((dd.c-dd.l)-(dd.h-dd.c))/r2)*dd.v;sumV+=dd.v;}
    distCmf=sumV>0?+(sumMFV/sumV).toFixed(3):null;
    // 近30天「真出貨」大單（後續未反彈）＋「可疑高量」次數 — 這是最可靠的派發證據
    var now30=Date.now()/1000-30*86400;
    var now15=Date.now()/1000-15*86400;
    var badSells=bigSells.filter(function(b){return b.quality==='bad'&&new Date(b.date).getTime()/1000>now30;}).length;
    var badHighVol=bigNeutrals.filter(function(b){return b.quality==='bad';}).length;
    // 近15天主力買盤支撐（關鍵：底部主力在買 vs 高檔主力在賣的分水嶺）
    var recentBuys15=bigBuys.filter(function(b){return new Date(b.date).getTime()/1000>now15;}).length;
    var recentBadSells15=bigSells.filter(function(b){return b.quality==='bad'&&new Date(b.date).getTime()/1000>now15;}).length;
    // 主力淨派發：近期有真出貨「且」近15天無大單買盤支撐
    var netDistribution=(recentBadSells15>=1||badSells>=2)&&recentBuys15===0;
    // 🛡️ 硬性保護：近15天主力積極買入（2次以上）→ 是建倉/吸籌，絕不標派發
    var hasStrongBuySupport=recentBuys15>=2;
    // 派發分級 dm
    var evidence=dn+badSells*2+badHighVol;
    if(evidence>=6)dm=6;else if(evidence>=4)dm=5;else if(evidence>=2)dm=3;else if(evidence>=1)dm=2;
    // 健康強勢股（價漲+MA5向上+資金流強+無真出貨）→ 永不標派發
    var healthyStrong=(ma5>ma5p)&&distCmf!==null&&distCmf>0.15&&badSells===0;
    // 真派發條件：高檔 + 非健康強勢 + 主力沒在積極買 + （bar訊號足且資金流弱 ＯＲ 主力淨派發）
    isTopping=inHighZone&&!healthyStrong&&!hasStrongBuySupport&&((dn>=2&&distCmf!==null&&distCmf<0.1)||netDistribution);
    if(netDistribution&&recentBuys15===0)distReasons.push('主力近15天無買盤、卻有真出貨');
    if(badSells>0)distReasons.push('近30天 '+badSells+' 次主力真出貨（賣後未反彈）');
    if(badHighVol>0)distReasons.push('高量震盪資金流轉負 '+badHighVol+' 次');
    if(c1>0)distReasons.push('價漲量縮背離 '+c1+' 次');
    if(c2>0)distReasons.push('高檔長上影 '+c2+' 次');
    if(c3>0)distReasons.push('高量滯漲 '+c3+' 次');
    if(c5>0)distReasons.push('衝頂無力 '+c5+' 次');
  })();

  var scP=tr.sc.l;
  var scD=tr.sc.date;
  var scMethod='tr';
  if(bigBuys.length>=1){
    var totalVP=0, totalV=0;
    bigBuys.forEach(function(b){
      totalVP += b.price * b.volume;
      totalV += b.volume;
    });
    if(totalV>0){
      var weightedCost = totalVP / totalV;
      if(weightedCost < tr.sc.l * 1.5){ 
        scP = weightedCost;
        scD = bigBuys[bigBuys.length-1].date;
        scMethod = 'weighted';
      }
    }
  }
  // ═══ 新增：第二次成本（近30天波段成本） ═══
  // 只看近30天的大單，代表「目前這一波」的主力進場價
  var wc2=null;
  var now30s=Date.now()/1000-30*86400;
  var recent30=bigBuys.filter(function(b){return new Date(b.date).getTime()/1000>now30s;});
  if(recent30.length>0){
    var tVP=0,tV=0;
    recent30.forEach(function(b){tVP+=b.price*b.volume;tV+=b.volume;});
    if(tV>0){
      wc2={
        p:(tVP/tV).toFixed(2),
        d:recent30[recent30.length-1].date,
        n:recent30.length
      };
    }
  }
  return{tr:tr,sm:sm,n:n,signalDates:signalDates,bigBuys:bigBuys,bigSells:bigSells,bigNeutrals:bigNeutrals,wc2:wc2,
    cur:cur.toFixed(2),scP:scP.toFixed(2),scD:scD,scMethod:scMethod,
    trTop:tr.trTop.toFixed(2),trEnded:tr.trEnded,dA:dA,pA:pA,bP:bP.toFixed(2),breakoutVolRatio:breakoutVolRatio,breakoutDate:breakoutDate,
    dn:dn,distDates:distDates,dm:dm,distCmf:distCmf,isTopping:isTopping,distReasons:distReasons,
    ma5up:ma5>ma5p,volShrink:av5<av20*0.75,macd:calcMACD(va),obvUp:obvUp};
}

function buildCondTxt(a,macdOk,buy15,buy30){
  var trTop='$'+a.trTop;
  if(a.trEnded){
    if(a.ma5up&&macdOk&&buy15.length>0) return '突破後動能強勁且有大單支撐，可持倉續抱；量能持續放大可考慮加碼。';
    else if(a.ma5up&&macdOk) return '突破後動能仍在，可持倉觀察；若MA5下彎或量能萎縮，考慮減倉。';
    else if(a.macd.aboveZero&&!a.ma5up) return 'MACD仍在零軸上但MA5下彎，短期走弱整理，等MA5重新向上再加碼。';
    else if(!a.macd.aboveZero) return '突破後MACD跌回零軸下，動能轉弱，建議減倉觀望，等重新站上零軸。';
    else return '突破後動能減弱，等回測 '+trTop+' 附近量縮後放量確認，再考慮加碼。';
  } else {
    if(a.macd.aboveZero&&a.ma5up&&buy15.length>0) return 'MACD已翻上零軸、MA5向上且有大單買入，主力正在建倉！可考慮輕倉佈局，放量突破 '+trTop+' 後加碼。';
    else if(a.macd.aboveZero&&a.ma5up) return 'MACD已翻上零軸且MA5向上，動能轉強。等放量突破 '+trTop+' 確認主力發動後進場。';
    else if(a.macd.aboveZero&&!a.ma5up) return 'MACD已翻上零軸但MA5仍下彎，動能轉正初期。等MA5也向上後，放量突破 '+trTop+' 再進場。';
    else if(buy30.length>0) return '底部有大單買入痕跡，主力可能悄悄吸籌。但MACD尚未翻正，繼續等待：MACD翻上零軸＋放量突破 '+trTop+' 再進場。';
    else return 'MACD尚在零軸下，主力還未明顯發動。耐心等待：MACD翻上零軸＋放量突破 '+trTop+' 確認後再進場。';
  }
}

// ═══ v2 新增：突破後動能判讀 ═══
// 根據突破後天數 + 漲幅，告訴使用者目前在第一波的哪個位置
function getBreakoutPhase(dA,pA,ma5up,macd){
  if(!dA||dA<1)return null;
  // 漲幅過大優先判斷
  if(pA>60){
    return{
      phase:'🚫 第一波尾聲或過熱',
      desc:'統計上多數股票第一波在 +60% 內結束。突破後 '+dA+' 天 +'+pA+'%，已超出主升段平均區間',
      advice:'不建議追高，等回測 MA20 或回到突破點再考慮',
      warning:'若強行進場停損抓 -5%，多數情況此時進場勝率低',
      color:'#d94f4f',
      bg:'#fef0f0'
    };
  }
  // 🆕 v11：突破後停滯/動能不足偵測（避免只看「突破天數」就誤判強勢拉升）
  if(dA>=6 && pA<20){
    var ma5Down=(ma5up===false);
    var macdWeak=macd?(!macd.aboveZero||macd.histShrink):false;
    var stalled=(pA<=2);
    if(stalled||ma5Down){
      var reasons=[];
      if(stalled) reasons.push('突破 '+dA+' 天漲幅僅 +'+pA+'%（沒在拉升）');
      if(ma5Down) reasons.push('MA5 下彎');
      if(macdWeak) reasons.push('MACD 動能轉弱');
      return{
        phase:'⚠️ 突破後停滯，動能不足',
        desc:'雖然突破已 '+dA+' 天，但'+reasons.join('、')+' → 這不是健康的主升段，要留意假突破或主力高檔出貨',

    h+='<div class="fold-body" id="fb-big">';
    var hasNeutrals=a.bigNeutrals&&a.bigNeutrals.length>0;
    if(a.bigBuys.length===0&&a.bigSells.length===0&&!hasNeutrals){
      h+='<div class="note">近60天無大單買賣記錄</div>';
    } else {
      a.bigBuys.slice().reverse().forEach(function(s){
        var qColor=s.quality==='good'?'#2ea86e':s.quality==='bad'?'#d94f4f':s.quality==='pending'?'#3a7bd5':'#c8952a';
