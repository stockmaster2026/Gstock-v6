<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>測試 2:加 modal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#f5f0e8;padding:20px;}
h2{color:#8a6e2f;}
.box{background:#fff;padding:15px;border-radius:10px;margin:10px 0;border:1px solid #ddd;}
button{display:block;width:100%;padding:15px;margin:8px 0;background:#c8a84b;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;font-family:inherit;}
button:active{transform:scale(.98);}
#log{font-family:monospace;font-size:12px;line-height:1.6;}
.ok{color:#2ea86e;}
.fail{color:#d94f4f;}

/* Modal 樣式 - 跟 diary.html 完全一樣 */
.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,.5);z-index:999;display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:#fffdf5;border-radius:16px;width:100%;max-width:560px;display:flex;flex-direction:column;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fffbec;border-bottom:1px solid #e8dfc0;}
.modal-title{font-size:15px;font-weight:700;color:#8a6e2f;}
.modal-close{background:#f0e8d0;color:#8a6e2f;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;}
.modal-body{flex:1;padding:16px 18px;}
</style>

</head>
<body>

<h2>🧪 測試 2:加上 Modal + localStorage</h2>
<p>diary.html 核心架構,看哪一部分壞掉</p>

<div id="content"></div>

<button onclick="openMyModal()">🎯 開啟 Modal(關鍵測試)</button>
<button onclick="testStorage()">💾 測試 localStorage</button>
<button onclick="testLargeRender()">🎨 測試大量 render</button>

<div class="box">
  <h3>結果</h3>
  <div id="log"></div>
</div>

<!-- Modal HTML 跟 diary 一樣 -->

<div class="modal-overlay" id="myModal" onclick="onModalBgClick(event,'myModal')">
<div class="modal" onclick="event.stopPropagation()">
<div class="modal-hdr"><span class="modal-title">📝 測試 Modal</span><button class="modal-close" onclick="closeModal('myModal')">關閉</button></div>
<div class="modal-body" id="myModalBody"></div>
</div>
</div>

<script>
var state = {
  count: 0,
  trades: []
};

function $(id){ return document.getElementById(id); }

function log(msg, type) {
  var el = $('log');
  var cls = type || '';
  el.innerHTML = '<div class="' + cls + '">[' + new Date().toLocaleTimeString() + '] ' + msg + '</div>' + (el.innerHTML || '');
}

function openModal(id){
  $(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(id){
  $(id).classList.remove('open');
  document.body.style.overflow = '';
}

function onModalBgClick(e, id){
  if(e.target && e.target.id === id) closeModal(id);
}

function openMyModal() {
  state.count++;
  // 動態渲染 modal 內容(跟 diary 做法一樣)
  var html = '';
  html += '<div>第 ' + state.count + ' 次開啟</div>';
  html += '<div style="margin-top:10px"><button onclick="modalAction()">點這裡(modal 內動態按鈕)</button></div>';
  html += '<div style="margin-top:10px"><button onclick="modalActionWithArg(\'test\',123)">帶參數測試</button></div>';
  $('myModalBody').innerHTML = html;
  openModal('myModal');
  log('✅ 開啟 modal 成功(' + state.count + ')', 'ok');
}

function modalAction() {
  log('✅ Modal 內動態按鈕成功!', 'ok');
}

function modalActionWithArg(s, n) {
  log('✅ Modal 內帶參數成功!s=' + s + ', n=' + n, 'ok');
}

function testStorage() {
  try {
    var data = {
      count: state.count,
      trades: state.trades,
      time: Date.now()
    };
    localStorage.setItem('test2_data', JSON.stringify(data));
    var v = localStorage.getItem('test2_data');
    var parsed = JSON.parse(v);
    log('✅ localStorage 成功 count=' + parsed.count, 'ok');
  } catch(e) {
    log('❌ localStorage 失敗: ' + e.message, 'fail');
  }
}

// 測試大量 render(模擬 diary 的 render() 函數)
function testLargeRender() {
  try {
    state.trades.push({
      id: 'trade_' + state.count,
      sym: 'TEST' + state.count,
      price: 100 + state.count
    });

    var html = '';
    html += '<div class="box"><h3>持倉列表 (' + state.trades.length + ' 筆)</h3>';
    state.trades.forEach(function(t, i) {
      html += '<div style="padding:8px;border-bottom:1px solid #eee">';
      html += t.sym + ' @ $' + t.price + ' ';
      html += '<button style="display:inline;width:auto;padding:5px 10px;font-size:12px" onclick="removeTrade(\'' + t.id + '\')">刪</button>';
      html += '</div>';
    });
    html += '</div>';
    $('content').innerHTML = html;
    log('✅ 大量 render 成功(' + state.trades.length + ' 筆)', 'ok');
  } catch(e) {
    log('❌ render 失敗: ' + e.message, 'fail');
  }
}

function removeTrade(id) {
  state.trades = state.trades.filter(function(t){ return t.id !== id; });
  testLargeRender(); // 重新 render
  log('✅ 刪除 ' + id + ' 成功', 'ok');
}

function startApp() {
  log('🚀 startApp 開始(readyState=' + document.readyState + ')', 'ok');
  log('📋 請依序測試 5 個按鈕', 'ok');
}

if(document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(startApp, 0);
} else {
  document.addEventListener('DOMContentLoaded', startApp);
}
</script>

</body>
</html>
