var SM_WIN=5, LR_WIN=63, MOM_SPAN=10, NORM_WIN=252, NORM_MIN=40, MOM_GAIN_MAX=4, AXIS_CLAMP=40;
var WARMUP=SM_WIN+LR_WIN+NORM_MIN+MOM_SPAN, DAYS_NEEDED=460;
var rrgInterval='1d';
function scoreRsLevel(){return null;}function scoreAbsTrend(){return null;}function scoreShape(){return null;}function scoreVolume(){return null;}function rankScore(){return null;}function defenseEvents(){return null;}
  function winMean(arr, i, n) {
    if (i-n+1 < 0) return null;
    var s=0;
    for(var k=i-n+1;k<=i;k++){ var v=arr[k]; if(v===null||!isFinite(v)) return null; s+=v; }
    return s/n;
  }
  // arr[0..i] 裡最後 maxN 個非 null 值的標準差（後視窗口，不含未來）
  function trailStd(arr, i, maxN, minN) {
    var v=[];
    for(var k=i;k>=0&&v.length<maxN;k--){ var x=arr[k]; if(x!==null&&isFinite(x)) v.push(x); }
    if (v.length<minN) return null;
    var m=0; for(var a=0;a<v.length;a++) m+=v[a]; m/=v.length;
    var s2=0; for(var b=0;b<v.length;b++){ var d=v[b]-m; s2+=d*d; }
    var sd=Math.sqrt(s2/(v.length-1));
    return (isFinite(sd)&&sd>0)?sd:null;
  }

  function clampAxis(v) {
    if(!isFinite(v)) return 100;
    if(v>100+AXIS_CLAMP) return 100+AXIS_CLAMP;
    if(v<100-AXIS_CLAMP) return 100-AXIS_CLAMP;
    return v;
  }

  var BUF_FRAC=0.30, BUF_MIN=0.30, BUF_MAX=3.0;
  function axisSd(arr) {
    if(!arr||arr.length<10) return 1;
    var m=0,n=arr.length;
    for(var i=0;i<n;i++) m+=arr[i]; m/=n;
    var s2=0; for(var j=0;j<n;j++){ var d=arr[j]-m; s2+=d*d; }
    var sd=Math.sqrt(s2/(n-1));
    return (isFinite(sd)&&sd>0)?sd:1;
  }
  function bufOf(sd) { return Math.min(Math.max(sd*BUF_FRAC, BUF_MIN), BUF_MAX); }
  function wmaAt(arr, i, n) {
    if (i-n+1 < 0) return null;
    var s=0, w=0;
    for(var k=0;k<n;k++){ var v=arr[i-n+1+k]; if(v===null||!isFinite(v)) return null; s+=v*(k+1); w+=(k+1); }
    return s/w;
  }
  function calculateRRG(sectorCloses, spyCloses, secVols) {
    var N=Math.min(sectorCloses.length, spyCloses.length);
    if (N<WARMUP+2) return { ratios:[], moms:[] };

    // ① 對數相對強度線。取 log 的用意：斜率就是「每天贏幾 %」，與股價絕對水準無關，
    //    所以 4 元的股票和 400 元的股票放在同一張圖上才有可比性。
    var lr=[];
    for(var i=0;i<N;i++){
      var sp=sectorCloses[i], bp=spyCloses[i];
      if(!(sp>0)||!(bp>0)){ lr.push(null); continue; }
      lr.push(Math.log(sp/bp)*100);
    }

    // ② RS-Ratio = 對數 RS 線偏離自己 63 根均線的幅度（單位：%），以 100 為中心。
    //    形式跟舊版同源，差別只在窗口 10 → 63，但差別是決定性的：
    //    對一條以固定速率上升的 RS 線，「偏離長均線」≈ 斜率 × (窗口/2)，
    //    窗口 10 的放大倍數只有 ~4.5，窗口 63 是 ~31 —— 前者分不出強弱，後者分得出。
    //    取 log 讓它與股價水準無關，上下對稱，4 元和 400 元的股票可以放同一張圖。
    // v2.14.0：先平滑（WMA）。平滑後的值 sm[j] 才拿去跟自己 LR_WIN 根均值比。
    var sm=[];
    for(var si=0;si<N;si++) sm.push(wmaAt(lr,si,SM_WIN));
    var dev=[];
    for(var j=0;j<N;j++){
      var m=winMean(sm,j,LR_WIN);
      dev.push((m===null||sm[j]===null)?null:(sm[j]-m));
    }
    var ratioAll=[];
    for(var p=0;p<N;p++){
      ratioAll.push(dev[p]===null?null:clampAxis(100+dev[p]));
    }

    // ③ RS-Momentum = RS-Ratio 的變化量（官方：是 RS-Ratio 的 ROC，
    //    不是價格動能、也不是原始 RS 線的動能），再做 normalize —— 舊版缺掉這一步。
    //    normalize 用「兩軸標準差比」當增益，讓 x/y 尺度相同，圖上的 45 度線才有意義。
    //    增益設上限：平滑序列的 momRaw 本身趨近 0，乘上有限增益仍然趨近 0，不會爆。
    var momRaw=[];
    for(var q=0;q<N;q++){
      var a=dev[q], b=(q-MOM_SPAN>=0)?dev[q-MOM_SPAN]:null;
      momRaw.push((a===null||b===null)?null:(a-b));
    }
    var momAll=[];
    for(var t=0;t<N;t++){
      var mr=momRaw[t];
      if(mr===null){ momAll.push(null); continue; }
      var sdR=trailStd(dev,t,NORM_WIN,NORM_MIN);
      var sdM=trailStd(momRaw,t,NORM_WIN,NORM_MIN);
      var gain=1;
      if(sdR!==null&&sdM!==null) gain=Math.min(sdR/sdM, MOM_GAIN_MAX);
      momAll.push(clampAxis(100+mr*gain));
    }

    // ④ 只輸出兩軸同時有值的點，並保持 ratios[i] 與 moms[i] 成對（下游全部依賴這個前提）
    var ratios=[], moms=[];
    for(var z=0;z<N;z++){
      if(ratioAll[z]===null||momAll[z]===null) continue;
      ratios.push(ratioAll[z]); moms.push(momAll[z]);
    }

    // ⑤ 這一檔自己的「邊界死區」。舊版是固定 ±1.0，但 RS-Ratio 的實際全幅只有 5.8，
    //    ±1.0 就吃掉 78% 的日子；而波動大的股票又等於沒有死區 —— 不是尺度無關的。
    //    改成按這一檔自己的振幅抓比例，讓死區在每一檔身上代表同樣的「幾乎沒動」。
    var sdR=axisSd(ratios), sdM=axisSd(moms);
    var buf={ r:bufOf(sdR), m:bufOf(sdM), sdR:sdR, sdM:sdM };

    // ⑥ 排名分數（v2.8）。RRG 的角色是排序，所以這裡一併算出來。
    var _rsNow = ratios.length ? ratios[ratios.length-1] : null;
    var sRs    = scoreRsLevel(_rsNow);
    var sAbs   = scoreAbsTrend(sectorCloses);
    var sShape = scoreShape(lr);
    var sVol   = scoreVolume(secVols);
    var rank = rankScore({ rs:sRs,
                           abs:(sAbs?sAbs.score:null),
                           shape:(sShape?sShape.score:null),
                           vol:(sVol?sVol.score:null) });
    return { ratios:ratios, moms:moms, buf:buf,
             rank:rank, rsPart:sRs, absPart:sAbs, shapePart:sShape, volPart:sVol,
             defense: defenseEvents(sectorCloses, secVols) };
  }

var PROXIES=['https://gstock-proxy.cykjas.workers.dev/?url=','https://corsproxy.io/?key=00bcaf2a&url=','https://api.allorigins.win/raw?url=','https://api.codetabs.com/v1/proxy/?quest='];
function buildYahooURL(t){ return 'https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?range=2y&interval=1d'; }
  function tryProxy(proxyIndex, ticker, errs) {
    errs = errs || [];
    if (proxyIndex>=PROXIES.length) {
      return Promise.reject(new Error('all_proxies_failed ｜ ' + errs.join('  /  ')));
    }
    var yahooUrl=buildYahooURL(ticker);
    var proxiedUrl=PROXIES[proxyIndex]+encodeURIComponent(yahooUrl);
    return fetch(proxiedUrl).then(function(r){ if(!r.ok) throw new Error('HTTP_'+r.status); return r.json(); })
      .then(function(j){
        if(!j.chart||!j.chart.result||j.chart.result.length===0) throw new Error('no_chart');
        var result=j.chart.result[0];
        if(!result.indicators||!result.indicators.quote||!result.indicators.quote[0].close) throw new Error('no_close');
        var closes=result.indicators.quote[0].close;
        // v2.7.1：timestamp 不再是硬性依賴。
        //   v2.7.0 只要 result.timestamp 缺了，每一根都會被 continue 跳過 →
        //   vc.length=0 → throw → 跳下一個 proxy → 三個都這樣 → 誤報成網路失敗。
        //   缺日期就退回「按尾端 index 對齊」（＝ v2.6.6 的行為），只是少了日期校正。
        var stamps=result.timestamp;
        var noStamp=!stamps||!stamps.length;
        // v2.8：一併收成交量。Medhat & Schmeling (RFS 2022, 1963-2018) 發現
        //   一個月尺度的相對強度延續「只存在於高 turnover 的股票」
        //   （高 turnover +1.37%/月 t=4.74；低 turnover 反轉 −1.41%/月 t=−7.13）。
        //   量能不是裝飾，是決定訊號符號的條件變數。缺量不致命，只是那一項不計分。
        var vols=(result.indicators.quote[0].volume)||[];

     +'<div class="sub">白話：進場後 20 天內，賺的空間（最高彈到哪）跟賠的空間（最低跌到哪）差不多；而且每 10 檔就有 1 檔最差跌超過 <b>'+sgn(deep.w20)+'</b>。到第 20 天收盤，中位數 '+sgn(deep.r20)+'。</div>'
     +'<div class="sub">回到「前面那段跌幅」的 38.2%／50%／61.8% 的機率，20 天內只有 '+pp(deep.lv[0].p)+'／'+pp(deep.lv[1].p)+'／'+pp(deep.lv[2].p)+'（只算進場時還沒到那個位置的）。所以「彈到某個價位」不能當成預期，只能當成「如果彈得好，可能會遇到壓力的地方」。</div>'; }
  else h+='<div class="sub">符合條件的事件太少（不到 30 次），沒辦法下結論。</div>';
  h+='<div class="sub dim">事件＝RRG 從弱勢轉進改善的那一天，而且那天前 60 個交易日是先高後低（有跌一段）。跌幅＝那段的高點到低點。資料到 '+fmtD(last)+'；事件共 '+all.length+' 次。</div></div>';
  h+=watchCard(per,parseTk(),function(b){ var g=G[b.k]; return {p:g.lv.map(function(x){return x.p;}),n20:g.n20,w20:g.w20}; },RES.tkSec,'這次完整分析的結果'); saveStats(G);
  // ② 分組表
  function row(b){ var s=G[b.k]; return '<tr><td>'+b.n+'</td><td>'+s.n+'</td><td>'+sgn(s.D==null?null:-s.D)+'</td><td>'+(s.rN==null?'—':Math.round(s.rN)+'%')+'</td><td><b>'+sgn(s.mfe20)+'</b></td><td><b>'+sgn(s.mae20)+'</b></td><td>'+sgn(s.r10)+'</td><td>'+sgn(s.r20)+'</td><td>'+sgn(s.w20)+'</td></tr>'; }
  h+='<div class="card"><div class="hd">② 跌得越深，反彈越大嗎？（以進入改善那天的收盤價買進，往後看 20 天）</div><div style="overflow-x:auto"><table><tr class="th"><td>跌幅分組</td><td>事件數</td><td>跌幅中位數</td><td>進場時已彈回前跌幅的</td><td>20 天內最高彈（中位數）</td><td>20 天內最低跌（中位數）</td><td>10 天後</td><td>20 天後</td><td>最差 1 成（20 天內最低）</td></tr>'+BINS.map(row).join('')+'</table></div>'
   +'<div class="sub dim">白話：「最高彈」和「最低跌」都是進場後 20 天內，收盤價離進場價最遠的那一天，用中位數看。兩個數字一起看：彈得多，但跌得也深，就是賠率不好。只看收盤價，沒看盤中，所以真正盤中的高低點會更極端。</div></div>';
  // ③ 目標位
  function lrow(b){ var s=G[b.k]; return '<tr><td>'+b.n+'</td>'+s.lv.map(function(l){ return '<td>'+pp(l.p)+(l.n?'<span class="dim">（'+l.n+'）</span>':'')+'</td>'; }).join('')+'</tr>'; }
  h+='<div class="card"><div class="hd">③ 彈回前面跌幅的 38.2%／50%／61.8%（斐波那契回撤），20 天內有多少機率碰到？</div><div style="overflow-x:auto"><table><tr class="th"><td>跌幅分組</td><td>38.2%</td><td>50%</td><td>61.8%</td></tr>'+BINS.map(lrow).join('')+'</table></div>'
   +'<div class="sub dim">白話：前面跌幅＝60 天內從高點跌到低點。括號是樣本數（只算進場時還沒到那個位置的事件）。這三個位置是很多人用的慣例，我沒有證據它們有特別意義；這張表只是告訴你「走到那裡的機率」。</div></div>';
  // ④ 停損 / 目標
  function srow(b){ var s=G[b.k]; return '<tr><td>'+b.n+'</td>'+s.st.map(function(x){ return '<td>賺 '+pp(x.w)+'／賠 '+pp(x.l)+'／都沒到 '+pp(x.nn)+'</td>'; }).join('')+'</tr>'; }
  h+='<div class="card"><div class="hd">④ 設停損、賺賠比 2：1 的做法，20 天內結果如何？</div><div style="overflow-x:auto"><table><tr class="th"><td>跌幅分組</td>'+STOPS.map(function(s){return '<td>停損 '+Math.round(s*100)+'%／目標 '+Math.round(s*200)+'%</td>';}).join('')+'</tr>'+BINS.map(srow).join('')+'</table></div>'
   +'<div class="sub dim">白話：進場後哪一個先碰到（用收盤價判斷）：「賺」＝先漲到目標，「賠」＝先跌到停損。賺賠比 2：1 時，只要「賺」的比例超過約 33%，長期就不賠；低於 33% 就是在虧。實際操作還有滑價、盤中跳空，會比這張表差一點。</div></div>';
  // ⑤ 今天的名單
  var list=[]; Object.keys(per).forEach(function(t){ var n=per[t].now; if(n&&n.D>=0.20&&n.days<=10) list.push({t:t,sn:(RES.tkSec[t]||[])[0]||'',n:n}); });
  list.sort(function(a,b){return b.n.D-a.n.D;});
  var rows=list.map(function(x){ var n=x.n, b=binOf(n.D), s=G[b.k], hit=function(L,i){ return n.rN<L?pp(s.lv[i].p):'已過'; };
    return '<tr><td><b>'+x.t+'</b><div class="dim" style="font-size:.7rem">'+x.sn+'</div></td><td>第 '+n.days+' 天</td><td>'+sgn(-n.D*100)+'</td><td>'+Math.round(n.rN*100)+'%</td><td>'+n.c.toFixed(2)+'</td><td>'+(n.T+0.382*(n.H-n.T)).toFixed(2)+'（'+hit(0.382,0)+'）</td><td>'+(n.T+0.5*(n.H-n.T)).toFixed(2)+'（'+hit(0.5,1)+'）</td><td>'+(n.T+0.618*(n.H-n.T)).toFixed(2)+'（'+hit(0.618,2)+'）</td><td>'+sgn(s.w20)+'</td><td>'+bsCell(per[x.t])+'</td><td style="color:'+(n.st2?'#00d4a8':'#ff6b6b')+'">'+(n.st2==null?'—':(n.st2?'Stage 2':'不在 Stage 2'))+'</td></tr>'; }).join('');
  h+='<div class="card"><div class="hd">⑤ 今天剛轉到改善、而且前面跌超過 20% 的股票（資料到 '+fmtD(last)+'）</div>'
   +(list.length?'<div style="overflow-x:auto"><table><tr class="th"><td>股票</td><td>改善第幾天</td><td>前面跌幅</td><td>已彈回</td><td>現價</td><td>38.2% 價位（機率）</td><td>50% 價位（機率）</td><td>61.8% 價位（機率）</td><td>同組最差 1 成</td><td>反彈狀態</td><td>K 線</td></tr>'+rows+'</table></div>':'<div class="sub">目前沒有符合的股票。</div>')
   +'<div class="sub dim">白話：價位＝低點＋前面跌幅×比例，括號是這個跌幅組歷史上 20 天內碰到的機率；「已過」代表現價已經超過那個位置。這是歷史統計，不是目標價預測，也不是買進建議。「不在 Stage 2」的依你的規則本來就不買。<br><b>反彈狀態</b>：用低點之後的走勢分類（繼續反彈中／反彈停滯／反彈結束／還沒開始彈／已彈到壓力區），規則是我訂的、沒驗證過；「結束」要等價格吐回去才看得出來，有落後。</div></div>';
  h+=trackCard(per,last); saveSnap(list,last);
  h+='<div class="card warn"><div class="hd">⚠ 這份統計的限制</div><ul><li>用的是現在的板塊名單往回看，一路跌下去、已經下市或被踢出的股票不在裡面（倖存者偏差），<b>反彈的數字很可能比實際好看</b>。</li>'
   +'<li>資料只有約 '+Math.round(Object.values(per)[0].ev.length>=0?18:18)+' 個月，行情特殊；事件彼此不獨立（很多股票同一天一起轉）。</li>'
   +'<li>只用收盤價，沒有盤中高低點，也沒有算滑價、股息；跌幅分組（15%、30%、50%）、停損比例、20 天都是我定的，沒驗證過。</li>'
   +'<li>RRG 只用來定義「剛轉到改善」，引擎跟 rrg.html、dwell.html 相同（日線、平滑 5 天）。</li></ul></div>';
  el('out').innerHTML=h;
}
window.addEventListener('DOMContentLoaded',function(){ el('go').addEventListener('click',run); el('lk').addEventListener('click',lookup); var tk=el('tk'); try{ var sv=localStorage.getItem('rebound_watch'); tk.value=sv||WATCH_DEF; }catch(e){ tk.value=WATCH_DEF; } tk.addEventListener('keydown',function(ev){ if(ev.key==='Enter') lookup(); }); });

</script></body></html>
