.btn.go{background:var(--orange);border-color:var(--orange);color:#fff;}

.h{font-weight:900;font-size:17px;}
.sub{font-size:12.5px;color:#778;line-height:1.6;}
.read{font-size:14.5px;line-height:1.65;margin-top:6px;}

.pos{color:#0d8a3f;font-weight:800;}.neg{color:#b3262e;font-weight:800;}
.prog{font-size:14px;color:#667;padding:6px 0;}

function getSectors(){
  var stored=null;
  try{var s=localStorage.getItem(SKEY);if(s) stored=JSON.parse(s);}catch(e){}
  var defs=JSON.parse(JSON.stringify(SECTORS_DEFAULT));
  if(!stored||!Array.isArray(stored)) return defs.filter(function(x){return x.id!=='custom'||x.tickers.length;});
  var byName={},order=[];
  stored.forEach(function(sec){
    if(!sec||!sec.name) return;
    sec.tickers=sec.tickers||[];
    if(byName[sec.name]){ sec.tickers.forEach(function(t){ if(byName[sec.name].tickers.indexOf(t)<0) byName[sec.name].tickers.push(t); }); }
    else{ byName[sec.name]=sec; order.push(sec.name); }
  });
  var out=order.map(function(n){return byName[n];});
  var defByName={}; defs.forEach(function(d){defByName[d.name]=d;});
  out.forEach(function(sec){ var d=defByName[sec.name]; if(d){ sec.id=d.id; sec.icon=d.icon; } });
  var ids={}; out.forEach(function(sec){ids[sec.id]=true;});
  defs.forEach(function(d){ if(!ids[d.id] && d.id!=='custom') out.push(d); });
  return out.filter(function(sec){ return sec.id!=='custom' || (sec.tickers&&sec.tickers.length); });
}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function fetchYahoo(t,retried){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(t)+'?interval=1d&range=2y&_cb='+Date.now();   // 時間戳：避免代理或中間層回傳舊快取
  var r=await fetch(PROXY+encodeURIComponent(base),{cache:'no-store'});
  if(r.status===429 && !retried){ await sleep(2000); return fetchYahoo(t,true); }
  if(!r.ok) throw new Error('Yahoo HTTP '+r.status);
  var data=await r.json();
  if(!data.chart||!data.chart.result||!data.chart.result[0]) throw new Error('Yahoo 沒有這檔的資料');
  return data.chart.result[0];
}
function rd3(x){return Math.round(x*1000)/1000;}
function parseBars(res){
  var ts=res.timestamp||[], q=res.indicators.quote[0];
  var B={d:[],o:[],h:[],l:[],c:[],v:[]};
  for(var i=0;i<ts.length;i++){
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i]){
      B.d.push(new Date(ts[i]*1000).toISOString().slice(0,10));
      B.o.push(rd3(q.open[i]));B.h.push(rd3(q.high[i]));B.l.push(rd3(q.low[i]));B.c.push(rd3(q.close[i]));B.v.push(q.volume[i]);
    }
  }
  if(B.c.length<20) throw new Error('資料太少（'+B.c.length+' 天）');
  B.nm=(res.meta&&(res.meta.longName||res.meta.shortName))||null;
  // Yahoo 的日線最後一根有時還沒更新到今天：用 meta 的最新成交價補上或更新
  try{
    var m=res.meta||{};
    if(m.regularMarketPrice>0&&m.regularMarketTime){
      var nyd=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(m.regularMarketTime*1000));
      var L=B.d.length-1, px=rd3(m.regularMarketPrice);
      if(nyd===B.d[L]){
        if(Math.abs(B.c[L]-px)>1e-6){ B.c[L]=px; if(px>B.h[L]) B.h[L]=px; if(px<B.l[L]) B.l[L]=px; B.patched='更新'; }

  var go=by['剛起步'].concat(by['進行中']);
  var h='<div class="box"><div class="h" style="font-size:20px">'+fd(date)+'（週'+wd(date)+'）當天'+(date!==ds?'<span class="sub">（你選的 '+ds+' 不是交易日，用前一個交易日）</span>':'')+'</div>';
  h+='<div class="read"><b>一句話：</b>'+(go.length?'當天「剛起步／進行中」的板塊有 <b>'+go.length+'</b> 個：'+go.map(function(r){return r.x.s.name+'（'+r.st.label+'）';}).join('、')+'。':'當天沒有任何板塊在「剛起步／進行中」。')+(by['進行中（偏後段）'].length?' 進行中但偏後段：'+nm('進行中（偏後段）')+'。':'')+(by['暫停'].length?' 高點附近暫停：'+nm('暫停')+'。':'')+'</div>';
  var rest=by['休息中'].length+by['回檔中'].length+by['大幅回吐'].length+by['沒動靜'].length;
  h+='<div class="read">另外 <b>'+rest+'</b> 個板塊在回檔、回吐、休息或沒動靜。'+(by['剛起步'].length===0?' 沒有板塊在剛起步，代表當天看不到「新主流剛冒出來」的訊號。':'')+'</div></div>';
  // 強弱
  var o1=R.slice().sort(function(a,b){return (b.r3==null?-9:b.r3)-(a.r3==null?-9:a.r3);}), mx=Math.max.apply(null,o1.map(function(r){return Math.abs(r.r3||0);}))||1;
  h+='<div class="box"><div class="h">① 過去 3 個月，誰漲得最多？</div>';
  var zs=zList(o1.map(function(r){return r.r3;})), vs=o1.map(function(r){return (r.r3||0)*100;}), lo=Math.min(0,Math.min.apply(null,vs)), hi=Math.max(0,Math.max.apply(null,vs));
  o1.forEach(function(r,i){ h+=dRow(r.x.s.icon+' '+r.x.s.name,vs[i],lo,hi,fmtPct(vs[i],0),'最近 1 個月：'+f0(r.r1)+'（'+mWord(r.r1)+'）<br>'+zTxt(zs[i]),plainRead(r.r3,r.r1)); });
  h+=Z_NOTE;
  h+='<div class="read"><b>怎麼看：</b>中間那條細線是 0（沒漲沒跌）。綠條往右＝這個板塊在「過去 3 個月」漲了，紅條往左＝跌了，數字就是漲跌幅。「過去 3 個月」是從你選的那一天往前數 3 個月，不是 3 月份。右邊的「最近 1 個月」是看它最近還有沒有力氣：過去 3 個月漲很多、最近 1 個月卻在跌，可能已經開始休息；兩個都在漲，才是還在跑。這裡的數字都只用當天以前的價格。</div></div>';
  // 位階
  h+='<div class="box"><div class="h">② 當天各板塊在哪個位置（條＝最近一波高點吐回幾成；越短越強）</div>';
  R.filter(function(r){return r.st;}).sort(function(a,b){return a.st.give-b.st.give;}).forEach(function(r){
    var st=r.st, m=st.main; h+=barsRow(r.x.s.icon+' '+r.x.s.name,Math.round(st.give*100),st.col,'<b style="color:'+st.col+'">'+st.label+'</b><br><b>位階分 '+posScore(st.give)+'</b>／100（吐回 '+Math.round(st.give*100)+'%）<br><span style="color:#667">離高點 '+st.dayPk+' 日｜當時最大一波 '+f0(m.gain)+'</span>');
  });
  by['沒動靜'].forEach(function(r){ h+=barsRow(r.x.s.icon+' '+r.x.s.name,0,'#bbb','<b style="color:#667">沒動靜</b><br><span style="color:#667">到當天為止沒有 15% 以上的波</span>'); });
  h+='<div class="read"><b>白話：</b>吐回少、離高點近＝買盤還在或只是暫停；吐回多＝休息或轉弱。<b>位階分</b>：100＝正在這一波的高點，0＝這一波整個吐回去了；越高越強。「當時最大一波」只算到當天為止，不含後來才出現的大波。</div></div>';
  h+='<div class="box"><div class="h">③ 對照你當時的記憶</div><div class="sub">先自己想：當時你買了什麼、為什麼買。上面的位階有沒有幫你理解當時的狀況？想好了再按下面揭曉後來發生的事。</div><div class="row"><button class="btn go" id="btnRev">揭曉：之後 20、60 個交易日發生什麼事</button></div><div id="rev"></div></div>';
  out.innerHTML=h;
  el('btnRev').onclick=function(){ reveal(R,k); };
  el('aggBox').style.display='block';
}
function reveal(R,k){
  var s20=spyFwd(k,20), s60=spyFwd(k,60), h='<div class="read"><b>大盤（SPY）：</b>之後 20 日 '+f0(s20)+'，60 日 '+f0(s60)+'。（比大盤多＝贏過大盤）</div>';
  h+='<div style="overflow-x:auto"><table class="t"><tr><th>板塊</th><th>當天位階</th><th>後 20 日</th><th>比大盤</th><th>後 60 日</th><th>比大盤</th></tr>';
  var rows=R.map(function(r){ var n=r.x.s.name, a=fwdOf(n,k,20), b=fwdOf(n,k,60); return {r:r,a:a,b:b,ea:(a!=null&&s20!=null)?a-s20:null,eb:(b!=null&&s60!=null)?b-s60:null}; }).sort(function(p,q){return (q.a==null?-9:q.a)-(p.a==null?-9:p.a);});
  var cl=function(v){ return v==null?'':(v>=0?'pos':'neg'); };
  rows.forEach(function(w){ h+='<tr><td><b>'+w.r.x.s.icon+' '+w.r.x.s.name+'</b></td><td>'+w.r.cat+'</td><td class="'+cl(w.a)+'">'+f0(w.a)+'</td><td class="'+cl(w.ea)+'">'+f0(w.ea)+'</td><td class="'+cl(w.b)+'">'+f0(w.b)+'</td><td class="'+cl(w.eb)+'">'+f0(w.eb)+'</td></tr>'; });
  h+='</table></div>';
  var grp=function(cs){ var a=rows.filter(function(w){return cs.indexOf(w.r.cat)>=0&&w.ea!=null;}); return a; };
  var g1=grp(['剛起步','進行中','進行中（偏後段）']), g2=grp(['休息中','回檔中','大幅回吐','沒動靜']);
  var avg=function(a){ return a.length?a.reduce(function(s,w){return s+w.ea;},0)/a.length:null; };
  h+='<div class="read"><b>白話：</b>'+(g1.length?'當天標「剛起步／進行中」的 '+g1.length+' 個板塊，後 20 日平均比大盤 '+f0(avg(g1))+'；':'當天沒有「剛起步／進行中」的板塊；')+(g2.length?'標「回檔／休息／沒動靜」的 '+g2.length+' 個，平均比大盤 '+f0(avg(g2))+'。':'')+' 單一天只有十幾個板塊，只能當一個故事，不能當證據。</div>';
  el('rev').innerHTML=h;
}
function median(a){ if(!a.length) return null; a=a.slice().sort(function(x,y){return x-y;}); var m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; }
function winP(v){ return v.length?Math.round(v.filter(function(x){return x>0;}).length/v.length*100)+'%':'—'; }
function statRow(name,a){
  var e20=a.map(function(r){return r.e20;}), e60=a.filter(function(r){return r.e60!=null;}).map(function(r){return r.e60;});
  var m20=median(e20), m60=median(e60), ep={}; a.forEach(function(r){ ep[r.key]=1; }); var ne=Object.keys(ep).length;
  var cl=function(v){ return v==null?'':(v>=0?'pos':'neg'); };
  return '<tr><td><b>'+name+'</b></td><td>'+a.length+'</td><td>'+ne+'</td><td class="'+cl(m20)+'">'+f0(m20)+'</td><td>'+winP(e20)+'</td><td class="'+cl(m60)+'">'+f0(m60)+'</td><td>'+winP(e60)+'</td></tr>';
}
var THEAD='<tr><th>分類</th><th>次數</th><th>獨立事件數</th><th>後 20 日比大盤（中位數）</th><th>20 日贏大盤</th><th>後 60 日比大盤（中位數）</th><th>60 日贏大盤</th></tr>';
function splitTable(title,a,defs){
  var h='<div style="font-weight:800;margin:10px 0 2px">'+title+'</div><div style="overflow-x:auto"><table class="t">'+THEAD;
  defs.forEach(function(d){ var g=a.filter(d[1]); if(g.length) h+=statRow(d[0],g); });
  return h+'</table></div>';
}
function runAgg(){
  var btn=el('btnAgg'), out=el('aggOut'); btn.disabled=true; out.innerHTML='<div class="prog">計算中…</div>';
  var sl=secLists(), ks=[]; for(var k=119;k<SPYB.d.length-20;k+=5) ks.push(k);
  var rec=[], i=0;
  function step(){
    var t0=Date.now();
    while(i<ks.length&&Date.now()-t0<60){
      var k=ks[i++], s20=spyFwd(k,20), s60=spyFwd(k,60);
      sl.forEach(function(x){
        var r=stateAt(x,k), a=fwdOf(x.s.name,k,20), b=fwdOf(x.s.name,k,60);
        if(a==null||s20==null) return;
        var st=r.st, n=r.A?r.A.NB:0;
        rec.push({cat:catOf(st),sec:x.s.name,key:x.s.name+'|'+(st?r.A.dates[st.last.i0]:'none'),e20:a-s20,e60:(b!=null&&s60!=null)?b-s60:null,
          gain:st?st.last.gain:null,r3:r.r3,r5:(r.A&&n>5)?r.A.idx[n-1]/r.A.idx[n-6]-1:null,big:st?st.isMain:null,bars:st?st.bars:null});
      });
    }
    out.innerHTML='<div class="prog">計算中… '+i+'／'+ks.length+' 個日期</div>';
    if(i<ks.length) return setTimeout(step,0);
    var h='<div style="overflow-x:auto"><table class="t">'+THEAD;
    CATS.forEach(function(c){ var a=rec.filter(function(r){return r.cat===c;}); if(a.length) h+=statRow(c,a); });
    h+=statRow('全部（基準線）',rec)+'</table></div>';
    h+='<div class="read"><b>怎麼讀：</b>每一列和最下面「全部」比：比它好，才代表這個位階之後比隨便挑一個板塊好。贏大盤比例接近 50% ＝ 跟丟銅板差不多。<b>獨立事件數</b>＝把連續幾天同一個板塊、同一波的紀錄算成一件事，這才是真正的樣本數；小於 10 的列不要相信。</div>';
    // 剛起步 拆開看
    var js=rec.filter(function(r){return r.cat==='剛起步';});
    if(js.length){
      h+='<div class="h" style="margin-top:14px">為什麼「剛起步」表現這麼差？把它拆開看</div><div class="sub">只看標成「剛起步」的紀錄（'+js.length+' 次），按不同條件分組。看哪一組特別差、哪一組沒那麼差。</div>';
      h+=splitTable('① 起漲那一波已經漲了多少',js,[['已漲 15～20%',function(r){return r.gain<0.20;}],['已漲 20～30%',function(r){return r.gain>=0.20&&r.gain<0.30;}],['已漲 30% 以上',function(r){return r.gain>=0.30;}]]);
      h+=splitTable('② 最近 5 天已經漲了多少（追高程度）',js,[['最近 5 天漲不到 5%',function(r){return r.r5!=null&&r.r5<0.05;}],['漲 5～10%',function(r){return r.r5!=null&&r.r5>=0.05&&r.r5<0.10;}],['漲 10% 以上',function(r){return r.r5!=null&&r.r5>=0.10;}]]);
      h+=splitTable('③ 起漲前的大環境（前 3 個月漲跌）',js,[['前 3 個月是跌的',function(r){return r.r3!=null&&r.r3<0;}],['前 3 個月小漲（0～15%）',function(r){return r.r3!=null&&r.r3>=0&&r.r3<0.15;}],['前 3 個月已漲 15% 以上',function(r){return r.r3!=null&&r.r3>=0.15;}]]);
      h+=splitTable('④ 這一波是不是到目前為止最大的一波',js,[['是（到當天為止最大一波）',function(r){return r.big===true;}],['不是（只是小反彈）',function(r){return r.big===false;}]]);
      var secs={}; js.forEach(function(r){ secs[r.sec]=1; });
      h+=splitTable('⑤ 是不是被少數幾個板塊拉低',js,Object.keys(secs).map(function(n){ return [n,function(r){return r.sec===n;}]; }));
      var rows=[['已漲幅',[['<20%',function(r){return r.gain<0.20;}],['20～30%',function(r){return r.gain>=0.20&&r.gain<0.30;}],['≥30%',function(r){return r.gain>=0.30;}]]],['最近5天',[['<5%',function(r){return r.r5!=null&&r.r5<0.05;}],['5～10%',function(r){return r.r5!=null&&r.r5>=0.05&&r.r5<0.10;}],['≥10%',function(r){return r.r5!=null&&r.r5>=0.10;}]]]];
      var good=[], bad=[];
      rows.forEach(function(rw){ rw[1].forEach(function(d){ var g=js.filter(d[1]); if(g.length>=10){ var m=median(g.map(function(r){return r.e20;})); (m>=0?good:bad).push(rw[0]+' '+d[0]+'（'+f0(m)+'）'); } }); });
      h+='<div class="read"><b>白話：</b>'+(good.length?'比較沒那麼差的分組：'+good.join('、')+'。':'每一組（次數 10 以上的）後 20 日中位數都是負的，代表不是某一種情況造成，是這個位階本身的特性。')+(bad.length?' 特別差的分組：'+bad.join('、')+'。':'')+' 請特別留意「獨立事件數」：如果只有幾件，那只是幾次事件的巧合。</div>';
    }
    h+='<div class="sub" style="margin-top:6px">⚠ 資料只有約 2 年、全是同一段 AI 行情；相鄰日期的結果高度重疊；拆越細樣本越少。所有結果只能當線索，不是規律。</div>';
    out.innerHTML=h; btn.disabled=false;
  }
  setTimeout(step,0);
}
async function init(){
  try{ migrateNames2(); }catch(e){}
  SECS=getSectors().filter(function(s){return s.tickers&&s.tickers.length>=3;});
  var tick={'SPY':1}; SECS.forEach(function(s){ s.tickers.forEach(function(t){ tick[t]=1; }); });
  var list=Object.keys(tick).filter(function(t){ return !BARS[t]; });
  await loadMany(list,function(d,tot){ el('prog').textContent='載入價格 '+d+'／'+tot+' …（第一次要一兩分鐘；20 分鐘內開過 charts 的話會用同一份快取）'; });
  if(!BARS['SPY']){ el('prog').textContent='沒抓到大盤（SPY）資料，無法計算。請稍後按重新整理。'; return; }
  SPYB=BARS['SPY'];
  OFF=Math.max(0,SPYB.d.length-504);
  var dates=SPYB.d.slice(OFF);
  secLists().forEach(function(x){ FULL[x.s.name]=sectorIdx(x.list,dates); });
  el('prog').textContent='價格資料：'+fd(SPYB.d[0])+' ～ '+fd(SPYB.d[SPYB.d.length-1])+'，可以開始了。';
  var dt=el('dt'); dt.min=SPYB.d[119]; dt.max=SPYB.d[SPYB.d.length-1]; dt.value=PRESETS[0][1];
  el('presets').innerHTML=PRESETS.map(function(p){ return '<button class="btn" data-d="'+p[1]+'">'+p[0]+'</button>'; }).join('');
  Array.prototype.forEach.call(el('presets').children,function(b){ b.onclick=function(){ dt.value=b.getAttribute('data-d'); showDay(dt.value); }; });
  el('btnGo').onclick=function(){ showDay(dt.value); };
  el('btnAgg').onclick=runAgg;
  showDay(dt.value);
}
init();
</script>
