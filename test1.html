<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>單按鈕測試</title>
<style>
body{font-family:-apple-system,sans-serif;background:#f5f0e8;padding:20px;}
h2{color:#8a6e2f;}
.box{background:#fff;padding:15px;border-radius:10px;margin:10px 0;border:1px solid #ddd;}
button{display:block;width:100%;padding:15px;margin:8px 0;background:#c8a84b;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;}
button:active{transform:scale(.98);}
#log{font-family:monospace;font-size:12px;line-height:1.6;}
.ok{color:#2ea86e;}
.fail{color:#d94f4f;}
</style>
</head>
<body>

<h2>🧪 單按鈕架構測試</h2>
<p>測試 diary.html 的「動態 render + innerHTML + onclick」架構</p>

<div class="box">
  <h3>測試 1:靜態 onclick(寫死在 HTML)</h3>
  <button onclick="testStatic()">📍 靜態按鈕(應該能動)</button>
</div>

<div id="dynamicArea"></div>

<div class="box">
  <h3>結果</h3>
  <div id="log"></div>
</div>

<script>
// 模擬 diary.html 的架構
var state = {
  count: 0,
  trades: []
};

function $(id){ return document.getElementById(id); }

function log(msg, type) {
  var el = $('log');
  var cls = type || '';
  el.innerHTML = '<div class="' + cls + '">[' + new Date().toLocaleTimeString() + '] ' + msg + '</div>' + el.innerHTML;
}

// 測試 1:靜態 onclick
function testStatic() {
  state.count++;
  log('✅ 靜態 onclick 成功!(第 ' + state.count + ' 次)', 'ok');
}

// 測試 2:動態 render 出 onclick(diary.html 的做法)
function renderDynamic() {
  var html = '';
  html += '<div class="box">';
  html += '<h3>測試 2:動態插入的 onclick(diary 的做法)</h3>';
  html += '<button onclick="testDynamic()">🎯 動態按鈕(關鍵測試!)</button>';
  html += '<button onclick="testDynamicWithArg(\'hello\')">📦 動態按鈕帶參數</button>';
  html += '</div>';
  $('dynamicArea').innerHTML = html;
  log('🔄 動態 render 完成', 'ok');
}

function testDynamic() {
  state.count++;
  log('✅ 動態 onclick 成功!(第 ' + state.count + ' 次)', 'ok');
}

function testDynamicWithArg(msg) {
  state.count++;
  log('✅ 動態帶參數成功!參數=' + msg + '(第 ' + state.count + ' 次)', 'ok');
}

// 模擬 diary 的啟動
function startApp() {
  log('🚀 startApp 開始', 'ok');
  log('document.readyState = ' + document.readyState);
  renderDynamic();
  log('🎉 全部完成,請依序點按鈕', 'ok');
}

if(document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(startApp, 0);
} else {
  document.addEventListener('DOMContentLoaded', startApp);
}
</script>

</body>
</html>
