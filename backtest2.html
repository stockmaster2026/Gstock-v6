<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飆股訊號回測</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f0f4f8;color:#1a202c;font-family:sans-serif;min-height:100vh;}
header{background:#fff;border-bottom:1px solid #c8d0dc;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:18px;font-weight:800;color:#0066bb;letter-spacing:1px;}
.sub{font-size:11px;color:#718096;margin-left:8px;}
.container{max-width:900px;margin:0 auto;padding:20px 16px;}

/* 預設股票按鈕 */
.preset-section{background:#fff;border:1px solid #c8d0dc;border-radius:12px;padding:16px;margin-bottom:16px;}
.preset-title{font-size:13px;font-weight:700;color:#4a5568;margin-bottom:10px;}
.preset-grid{display:flex;flex-wrap:wrap;gap:8px;}
.preset-btn{background:#edf2f7;border:1px solid #c8d0dc;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:#2d3748;transition:all 0.15s;}
.preset-btn:hover{background:#0066bb;color:#fff;border-color:#0066bb;}
.preset-btn.active{background:#0066bb;color:#fff;border-color:#0066bb;}

/* 輸入區 */
.input-section{background:#fff;border:1px solid #c8d0dc;border-radius:12px;padding:16px;margin-bottom:16px;}
.input-row{display:flex;gap:8px;flex-wrap:wrap;}
.sym-input{flex:1;min-width:150px;background:#f7fafc;border:1px solid #c8d0dc;border-radius:8px;padding:9px 14px;font-size:13px;color:#1a202c;outline:none;}
.sym-input:focus{border-color:#0066bb;}
.run-btn{background:#0066bb;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.run-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* 說明條件 */
.conditions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.cond{background:#edf2f7;border:1px solid #c8d0dc;border-radius:6px;padding:4px 10px;font-size:11px;color:#4a5568;}
.cond span{color:#0066bb;font-weight:700;}

/* 結果卡片 */
.result-card{background:#fff;border:1px solid #c8d0dc;border-radius:12px;padding:16px;margin-bottom:12px;}
.result-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.result-sym{font-size:20px;font-weight:800;color:#0066bb;}
.result-name{font-size:12px;color:#718096;}
.signal-count{margin-left:auto;background:#0066bb;color:#fff;border-radius:8px;padding:3px 12px;font-size:12px;font-weight:700;}

/* 訊號表格 */
.signal-table{width:100%;border-collapse:collapse;font-size:12px;}
.signal-table th{background:#f7fafc;padding:8px 10px;text-align:left;color:#4a5568;font-weight:600;border-bottom:2px solid #e2e8f0;}
.signal-table td{padding:8px 10px;border-bottom:1px solid #e2e8f0;}
.signal-table tr:hover td{background:#f7fafc;}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.badge-strong{background:#c6f6d5;color:#22543d;}
.badge-partial{background:#fefcbf;color:#744210;}
.score-bar{display:flex;gap:3px;align-items:center;}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.on{background:#0066bb;}
.dot.off{background:#e2e8f0;}
.chg-up{color:#22543d;font-weight:700;}
.chg-dn{color:#c53030;font-weight:700;}

/* Loading */
.loading-box{background:#fff;border:1px solid #c8d0dc;border-radius:12px;padding:40px;text-align:center;color:#718096;font-size:13px;}
.sp{width:28px;height:28px;border:2px solid #e2e8f0;border-top-color:#0066bb;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

.empty-msg{text-align:center;padding:30px;color:#718096;font-size:13px;}
.err-msg{text-align:center;padding:20px;color:#c53030;font-size:13px;}
</style>

</head>
<body>
<header>
  <div><span class="logo">📊 飆股訊號回測</span><span class="sub">Signal Backtest — 過去365天</span></div>
  <a href="news.html" style="font-size:11px;color:#718096;text-decoration:none;">← 回情報站</a>
</header>
<div class="container">

  <div class="preset-section">
    <div class="preset-title">🔥 去年飆漲代表股（點選加入）</div>
    <div class="preset-grid">
      <button class="preset-btn" onclick="togglePreset(this,'TERN')">TERN +2700%</button>
      <button class="preset-btn" onclick="togglePreset(this,'ERAS')">ERAS +900%</button>
      <button class="preset-btn" onclick="togglePreset(this,'OKLO')">OKLO +500%</button>
      <button class="preset-btn" onclick="togglePreset(this,'KTOS')">KTOS +200%</button>
      <button class="preset-btn" onclick="togglePreset(this,'RKLB')">RKLB +150%</button>
      <button class="preset-btn" onclick="togglePreset(this,'PLTR')">PLTR +120%</button>
      <button class="preset-btn" onclick="togglePreset(this,'IONQ')">IONQ +180%</button>
      <button class="preset-btn" onclick="togglePreset(this,'NBIS')">NBIS +300%</button>
    </div>
  </div>

  <div class="input-section">
    <div class="input-row">
      <input class="sym-input" id="symInput" placeholder="輸入股票代碼，例：TERN, OKLO, KTOS" />
      <button class="run-btn" id="runBtn" onclick="runBacktest()">🔍 開始回測</button>
    </div>
    <div class="conditions">
      <div class="cond">📈 <span>均線多排</span> 5&gt;10&gt;20&gt;50日</div>
      <div class="cond">⚡ <span>MACD金叉</span> DIF穿越DEA</div>
      <div class="cond">🎯 <span>KD金叉</span> %K穿越%D</div>
      <div class="cond">💪 <span>RSI&gt;50</span> 從低位上穿</div>
      <div class="cond">🔊 <span>成交量</span> &gt;20日均量1.5倍</div>
      <div class="cond">🚀 <span>突破盤整</span> 創20日新高</div>
    </div>
  </div>

  <div id="results"></div>
</div>

<script>
const K = 'd745a41r01qno4q0h68gd745a41r01qno4q0h690';
var selectedSyms = [];

function togglePreset(btn, sym) {
  btn.classList.toggle('active');
  if (btn.classList.contains('active')) {
    if (selectedSyms.indexOf(sym) < 0) selectedSyms.push(sym);
  } else {
    selectedSyms = selectedSyms.filter(function(s){ return s !== sym; });
  }
  document.getElementById('symInput').value = selectedSyms.join(', ');
}

function getSyms() {
  var val = document.getElementById('symInput').value;
  return val.split(/[,\s]+/).map(function(s){ return s.trim().toUpperCase(); }).filter(Boolean);
}

// ── 技術指標計算 ──

function sma(data, period) {
  var result = new Array(data.length).fill(null);
  for (var i = period - 1; i < data.length; i++) {
    var sum = 0;
    for (var j = 0; j < period; j++) sum += data[i - j];
    result[i] = sum / period;
  }
  return result;
}

function ema(data, period) {
  var result = new Array(data.length).fill(null);
  var k = 2 / (period + 1);
  for (var i = 0; i < data.length; i++) {
    if (i === 0) { result[i] = data[i]; continue; }
    if (result[i-1] === null) { result[i] = data[i]; continue; }
    result[i] = data[i] * k + result[i-1] * (1 - k);
  }
  return result;
}

function calcMACD(closes) {
  var ema12 = ema(closes, 12);
  var ema26 = ema(closes, 26);
  var dif = closes.map(function(_, i) {
    if (ema12[i] === null || ema26[i] === null) return null;
    return ema12[i] - ema26[i];
  });
  var validDif = dif.map(function(v) { return v === null ? 0 : v; });
  var dea = ema(validDif, 9);
  return { dif: dif, dea: dea };
}

function calcKD(highs, lows, closes, period) {
  period = period || 9;
  var k = new Array(closes.length).fill(50);
  var d = new Array(closes.length).fill(50);
  for (var i = period - 1; i < closes.length; i++) {
    var hh = Math.max.apply(null, highs.slice(i - period + 1, i + 1));
    var ll = Math.min.apply(null, lows.slice(i - period + 1, i + 1));
    var rsv = hh === ll ? 50 : (closes[i] - ll) / (hh - ll) * 100;
    k[i] = (2/3) * k[i-1] + (1/3) * rsv;
    d[i] = (2/3) * d[i-1] + (1/3) * k[i];
  }
  return { k: k, d: d };
}

function calcRSI(closes, period) {
  period = period || 14;
  var result = new Array(closes.length).fill(null);
  for (var i = period; i < closes.length; i++) {
    var gains = 0, losses = 0;
    for (var j = i - period + 1; j <= i; j++) {
      var diff = closes[j] - closes[j-1];
      if (diff > 0) gains += diff;
      else losses += Math.abs(diff);
    }
    var avgGain = gains / period;
    var avgLoss = losses / period;
    result[i] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
  }
  return result;
}

// ── 回測主邏輯 ──

function detectSignals(dates, opens, highs, lows, closes, volumes) {
  var n = closes.length;
  var ma5  = sma(closes, 5);
  var ma10 = sma(closes, 10);
  var ma20 = sma(closes, 20);
  var ma50 = sma(closes, 50);
  var macd = calcMACD(closes);
  var kd   = calcKD(highs, lows, closes, 9);
  var rsi  = calcRSI(closes, 14);
  var vol20 = sma(volumes, 20);

  var signals = [];

  for (var i = 51; i < n; i++) {
    var score = 0;
    var details = [];

    // 1. 均線多排
    var maAligned = ma5[i] !== null && ma10[i] !== null && ma20[i] !== null && ma50[i] !== null
      && ma5[i] > ma10[i] && ma10[i] > ma20[i] && ma20[i] > ma50[i];
    if (maAligned) { score++; details.push('均線多排'); }

    // 2. MACD 金叉（今天 DIF > DEA，昨天 DIF < DEA）
    var macdCross = macd.dif[i] !== null && macd.dea[i] !== null
      && macd.dif[i] > macd.dea[i] && macd.dif[i-1] < macd.dea[i-1];
    var macdAbove = macd.dif[i] !== null && macd.dea[i] !== null && macd.dif[i] > macd.dea[i];
    if (macdCross) { score += 2; details.push('MACD金叉'); }
    else if (macdAbove) { score++; details.push('MACD多頭'); }

    // 3. KD 金叉
    var kdCross = kd.k[i] > kd.d[i] && kd.k[i-1] < kd.d[i-1];
    var kdAbove = kd.k[i] > kd.d[i];
    if (kdCross) { score += 2; details.push('KD金叉'); }
    else if (kdAbove) { score++; details.push('KD多頭'); }

    // 4. RSI 從 50 以下穿越 50
    var rsiCross = rsi[i] !== null && rsi[i-1] !== null && rsi[i] > 50 && rsi[i-1] < 50;
    var rsiAbove = rsi[i] !== null && rsi[i] > 55;
    if (rsiCross) { score += 2; details.push('RSI穿越50'); }
    else if (rsiAbove) { score++; details.push('RSI>55'); }

    // 5. 成交量放大 1.5 倍以上
    var volSpike = vol20[i] !== null && volumes[i] > vol20[i] * 1.5;
    if (volSpike) { score++; details.push('成交量放大'); }

    // 6. 突破 20 日高點（盤整突破）
    var max20 = Math.max.apply(null, closes.slice(Math.max(0, i-20), i));
    var breakout = closes[i] > max20 * 1.01;
    if (breakout) { score += 2; details.push('突破盤整'); }

    if (score >= 4) {
      // 計算未來 30/60 天漲幅
      var fwd30 = i + 30 < n ? ((closes[i+30] - closes[i]) / closes[i] * 100).toFixed(1) : null;
      var fwd60 = i + 60 < n ? ((closes[i+60] - closes[i]) / closes[i] * 100).toFixed(1) : null;

      signals.push({
        date: new Date(dates[i] * 1000).toISOString().split('T')[0],
        close: closes[i].toFixed(2),
        score: score,
        details: details,
        fwd30: fwd30,
        fwd60: fwd60
      });
    }
  }
  return signals;
}

async function fetchCandles(sym) {
  var to = Math.floor(Date.now() / 1000);
  var from = to - 365 * 86400;
  var url = 'https://finnhub.io/api/v1/stock/candle?symbol=' + sym + '&resolution=D&from=' + from + '&to=' + to + '&token=' + K;
  var r = await fetch(url);
  var d = await r.json();
  if (!d || d.s !== 'ok') throw new Error('無法取得 ' + sym + ' 資料');
  return d;
}

function renderResult(sym, signals, totalDays) {
  if (signals.length === 0) {
    return '<div class="result-card"><div class="result-header"><span class="result-sym">$' + sym + '</span></div><div class="empty-msg">過去365天內未出現評分≥4的起漲訊號</div></div>';
  }

  var rows = signals.slice(0, 15).map(function(s) {
    var dots = '';
    var maxScore = 10;
    for (var i = 0; i < 7; i++) {
      dots += '<div class="dot ' + (i < s.score ? 'on' : 'off') + '"></div>';
    }
    var f30 = s.fwd30 !== null ? '<span class="' + (parseFloat(s.fwd30) >= 0 ? 'chg-up' : 'chg-dn') + '">' + (parseFloat(s.fwd30) >= 0 ? '+' : '') + s.fwd30 + '%</span>' : '<span style="color:#718096">—</span>';
    var f60 = s.fwd60 !== null ? '<span class="' + (parseFloat(s.fwd60) >= 0 ? 'chg-up' : 'chg-dn') + '">' + (parseFloat(s.fwd60) >= 0 ? '+' : '') + s.fwd60 + '%</span>' : '<span style="color:#718096">—</span>';
    var badge = s.score >= 7 ? '<span class="badge badge-strong">強訊號</span>' : '<span class="badge badge-partial">訊號</span>';

    return '<tr>'
      + '<td>' + s.date + '</td>'
      + '<td>$' + s.close + '</td>'
      + '<td><div class="score-bar">' + dots + ' <span style="font-size:11px;color:#4a5568;margin-left:4px">' + s.score + '/10</span></div></td>'
      + '<td>' + badge + '</td>'
      + '<td style="font-size:11px;color:#4a5568;">' + s.details.join(' · ') + '</td>'
      + '<td>' + f30 + '</td>'
      + '<td>' + f60 + '</td>'
      + '</tr>';
  }).join('');

  return '<div class="result-card">'
    + '<div class="result-header">'
    + '<span class="result-sym">$' + sym + '</span>'
    + '<span class="result-name">過去365天</span>'
    + '<span class="signal-count">' + signals.length + ' 個訊號</span>'
    + '</div>'
    + '<table class="signal-table">'
    + '<thead><tr><th>日期</th><th>收盤價</th><th>強度</th><th>評級</th><th>滿足條件</th><th>+30天</th><th>+60天</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>'
    + '</div>';
}

async function runBacktest() {
  var syms = getSyms();
  if (!syms.length) return;
  var btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 回測中…';
  document.getElementById('results').innerHTML = '<div class="loading-box"><div class="sp"></div>正在下載 ' + syms.length + ' 支股票的365天K線資料…</div>';

  var html = '';
  for (var i = 0; i < syms.length; i++) {
    var sym = syms[i];
    try {
      document.getElementById('results').innerHTML = '<div class="loading-box"><div class="sp"></div>計算 ' + sym + ' (' + (i+1) + '/' + syms.length + ')…</div>';
      var d = await fetchCandles(sym);
      var signals = detectSignals(d.t, d.o, d.h, d.l, d.c, d.v);
      html += renderResult(sym, signals, d.t.length);
    } catch(e) {
      html += '<div class="result-card"><div class="result-header"><span class="result-sym">$' + sym + '</span></div><div class="err-msg">❌ ' + e.message + '</div></div>';
    }
    await new Promise(function(r){ setTimeout(r, 300); });
  }

  document.getElementById('results').innerHTML = html;
  btn.disabled = false;
  btn.textContent = '🔍 開始回測';
}
</script>

</body>
</html>
