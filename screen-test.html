function getSectors(){
  var stored=null;
  try{var s=localStorage.getItem(SKEY);if(s) stored=JSON.parse(s);}catch(e){}
  var defs=JSON.parse(JSON.stringify(SECTORS_DEFAULT));
  if(!stored||!Array.isArray(stored)) return defs.filter(function(x){return x.id!=='custom'||x.tickers.length;});
  var byName={},order=[];
  stored.forEach(function(sec){
    if(!sec||!sec.name) return;
    sec.tickers=sec.tickers||[];
    if(byName[sec.name]){ sec.tickers.forEach(function(t){ if(byName[sec.name].tickers.indexOf(t)<0) byName[sec.name].tickers.push(t); }); }
    else{ byName[sec.name]=sec; order.push(sec.name); }
  });
  var out=order.map(function(n){return byName[n];});
  var defByName={}; defs.forEach(function(d){defByName[d.name]=d;});
  out.forEach(function(sec){ var d=defByName[sec.name]; if(d){ sec.id=d.id; sec.icon=d.icon; } });
  var ids={}; out.forEach(function(sec){ids[sec.id]=true;});
  defs.forEach(function(d){ if(!ids[d.id] && d.id!=='custom') out.push(d); });
  return out.filter(function(sec){ return sec.id!=='custom' || (sec.tickers&&sec.tickers.length); });
}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function fetchYahoo(t,retried){
  var base='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(t)+'?interval=1d&range=2y&_cb='+Date.now();   // 時間戳：避免代理或中間層回傳舊快取
  var r=await fetch(PROXY+encodeURIComponent(base),{cache:'no-store'});
  if(r.status===429 && !retried){ await sleep(2000); return fetchYahoo(t,true); }
  if(!r.ok) throw new Error('Yahoo HTTP '+r.status);
  var data=await r.json();
  if(!data.chart||!data.chart.result||!data.chart.result[0]) throw new Error('Yahoo 沒有這檔的資料');
  return data.chart.result[0];
}
function rd3(x){return Math.round(x*1000)/1000;}
function parseBars(res){
  var ts=res.timestamp||[], q=res.indicators.quote[0];
  var B={d:[],o:[],h:[],l:[],c:[],v:[]};
  for(var i=0;i<ts.length;i++){
    if(q.close[i]&&q.volume[i]&&q.high[i]&&q.low[i]&&q.open[i]){
      B.d.push(new Date(ts[i]*1000).toISOString().slice(0,10));
      B.o.push(rd3(q.open[i]));B.h.push(rd3(q.high[i]));B.l.push(rd3(q.low[i]));B.c.push(rd3(q.close[i]));B.v.push(q.volume[i]);
    }
  }
  if(B.c.length<20) throw new Error('資料太少（'+B.c.length+' 天）');
  B.nm=(res.meta&&(res.meta.longName||res.meta.shortName))||null;
  // Yahoo 的日線最後一根有時還沒更新到今天：用 meta 的最新成交價補上或更新
  try{
    var m=res.meta||{};
    if(m.regularMarketPrice>0&&m.regularMarketTime){
      var nyd=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(m.regularMarketTime*1000));
      var L=B.d.length-1, px=rd3(m.regularMarketPrice);
      if(nyd===B.d[L]){
        if(Math.abs(B.c[L]-px)>1e-6){ B.c[L]=px; if(px>B.h[L]) B.h[L]=px; if(px<B.l[L]) B.l[L]=px; B.patched='更新'; }
      }else if(nyd>B.d[L]){
        B.d.push(nyd); B.o.push(px); B.h.push(rd3(m.regularMarketDayHigh>0?Math.max(m.regularMarketDayHigh,px):px));
        B.l.push(rd3(m.regularMarketDayLow>0?Math.min(m.regularMarketDayLow,px):px)); B.c.push(px); B.v.push(m.regularMarketVolume||0); B.patched='補上';
      }
    }
  }catch(e){}
  return B;
}

    var h='<div class="read">共掃 '+R.length+' 個「某檔某天」，從 '+(R[0]?R[0].d:'—')+' 到 '+(R.length?R[R.length-1].d:'—')+'。每檔每 5 個交易日算一次；隔天開盤買、持有 20 天，比 SPY 同期。</div>';
    var tb=function(title,filt){ var rows=R.filter(filt); var x='<div style="margin-top:10px;font-weight:900;font-size:15.5px">'+title+'（'+rows.length+' 筆）</div><div class="tw"><table class="t"><tr><th>組合</th><th>筆數</th><th>20天中位數</th><th>比大盤多</th><th>賺錢／碰停損8%</th></tr>'; G.forEach(function(g){ x+='<tr><td><b>'+g[0]+'</b></td>'+cell(rows.filter(g[1]))+'</tr>'; }); return x+'</table></div>'; };
    h+=tb('A. 全部時期',function(){return true;});
    h+=tb('B. 大盤在 50 日線上的日子',function(x){return x.mk==='up';});
    h+=tb('C. 大盤在 50 日線下的日子（跟今天一樣）',function(x){return x.mk==='dn';});
    var mid=R.length?R[Math.floor(R.length/2)].d:'';
    h+=tb('D. 前半段（'+mid+' 以前）',function(x){return x.d<mid;});
    h+=tb('E. 後半段',function(x){return x.d>=mid;});
    // 白話結論：入選 vs 基準，在 C（弱市）
    var rd=function(f,flt){ var a=R.filter(f).filter(flt); return stat(a.map(function(x){return x.o;})); };
    var bDn=rd(function(x){return x.mk==='dn';},function(){return true;}), pDn=rd(function(x){return x.mk==='dn';},function(x){return x.L1&&x.L2;});
    var bUp=rd(function(x){return x.mk==='up';},function(){return true;}), pUp=rd(function(x){return x.mk==='up';},function(x){return x.L1&&x.L2;});
    var say=function(nm,b,p){ if(!b||!p) return nm+'：資料不足。'; var d=p.exm-b.exm; var t=p.n<30?'（入選只有 '+p.n+' 筆，太少，不能當結論）':''; return nm+'：入選比大盤多 '+pc1(p.exm)+'，基準 '+pc1(b.exm)+'，差 '+pc1(d)+(Math.abs(d)<1.5?'，差距小於 1.5 個百分點，等於沒差別':(d>0?'，入選比較好':'，入選比較差'))+t+'。'; };
    h+='<div class="verdict" style="background:#fff7d6">白話結論：<br>'+say('大盤在 50 日線下（像現在）',bDn,pDn)+'<br>'+say('大盤在 50 日線上',bUp,pUp)+'</div>';
    h+='<div class="sub" style="margin-top:8px">⚠ 門檻是我訂的；只有約 1 年多的資料、同一段行情；名單是現在的熱門股（倖存者偏差）；每檔每 5 天取一次，相鄰樣本會重疊，不是獨立的；沒算手續費與滑價。大盤在 50 日線下的日子可能很少，筆數少於 30 的不要下結論。基本面完全沒進回測（沒有歷史資料）。</div>';
    out.innerHTML=h; btn.disabled=false;
  },30);
}
async function init(){
  try{ migrateNames2(); }catch(e){}
  SECS=getSectors().filter(function(s){return s.tickers&&s.tickers.length>=3;});
  var tick={'SPY':1}; SECS.forEach(function(s){ s.tickers.forEach(function(t){ tick[t]=1; }); });
  var list=Object.keys(tick).filter(function(t){ return !BARS[t]; });
  await loadMany(list,function(d,tot){ el('prog').textContent='載入價格 '+d+'／'+tot+' …'; });
  if(!BARS['SPY']){ el('prog').textContent='沒抓到大盤（SPY）資料，請稍後重新整理。'; return; }
  SECS.forEach(function(s){ s.tickers.forEach(function(t){ (T2S[t]=T2S[t]||[]).push(s.name); }); var l=s.tickers.filter(function(t){return BARS[t];}).map(function(t){return {t:t,B:BARS[t],o:{}};}); if(l.length>=3) LISTS[s.name]=l; });
  var S=BARS['SPY']; el('prog').textContent='價格資料到 '+fd(S.d[S.d.length-1])+'，共 '+Object.keys(T2S).filter(function(t){return BARS[t];}).length+' 檔、'+Object.keys(LISTS).length+' 個板塊，可以開始了。';
  el('btnT').disabled=false; el('btnT').onclick=runT;
}
init();
</script>
