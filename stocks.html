<style>

<div class="header">

<div class="main">

<div class="legend-bar">
    <div class="legend-item"><div class="leg-dot" style="background:#0a5c2e"></div>強勢(8分以上)</div>

<script>
const SECTORS = {
  '七巨頭':        { emoji:'🤖', stocks:['NVDA','AAPL','MSFT','GOOGL','META','AMZN','TSLA'] },
  'AI 晶片':       { emoji:'🧠', stocks:['NVDA','AVGO','AMD','TSM','ARM','MPWR','INTC','QCOM','SITM','LSCC','TSEM','GFS','ASX'] },
  '半導體設備':    { emoji:'🏭', stocks:['ASML','AMAT','LRCX','KLAC','AEHR','TER','ONTO','KLIC','CAMT','ENTG','MKSI','FORM','NVMI','ACMR'] },
  '光通訊':        { emoji:'📡', stocks:['COHR','LITE','AAOI','CIEN','FN','AXTI','MRVL','GLW','ANET','POET','ALAB','CRDO','MTSI','VIAV','CLS','SMTC','MXL','APH'] },
  '記憶體與儲存':  { emoji:'💾', stocks:['MU','SNDK','WDC','STX','NTAP','P','SMCI','DELL','HPE','AMKR','RMBS','PENG','SIMO'] },
  'AI 電力與散熱': { emoji:'⚡', stocks:['VRT','BE','OKLO','GEV','PWR','ETN','CEG','TLN','SMR','NNE','VST','NRG','MOD','NVT','AAON','POWL','FIX','STRL','BWXT','CW'] },
  '太空與國防':    { emoji:'🚀', stocks:['RKLB','LUNR','ASTS','PL','KTOS','AVAV','LDOS','RCAT','LMT','RTX','RDW','FLY','KRMN','VOYG','VSAT','ONDS','AXON','MRCY','PLTR','NOC','GD','LHX'] },
  '量子運算':      { emoji:'⚛️', stocks:['IONQ','RGTI','QBTS','QUBT','LAES','ARQQ'] },
  '生技與醫材':    { emoji:'🧬', stocks:['LLY','NVO','ISRG','TEM','CRSP','NTRA','HIMS','RXRX','VKTX','ALNY','AMGN','SYK','MDT','NTLA','BEAM','ARWR','IONS','VRTX','GH','ILMN'] },
  '資安':          { emoji:'🛡️', stocks:['CRWD','PANW','ZS','S','FTNT','NET','OKTA','RBRK','TENB','QLYS','CHKP','SAIL','CVLT','VRNS','FFIV','AKAM','GEN'] },
  '軟體 SaaS':     { emoji:'💻', stocks:['NOW','CRM','DDOG','SNOW','MDB','TEAM','HUBS','WDAY','ADBE','INTU','PLTR','ORCL','DT','ESTC','NTNX','GTLB','VEEV'] },
  '金融':          { emoji:'🏦', stocks:['JPM','GS','MS','BLK','KKR','BX','SCHW','COIN','HOOD','V','ARCC','APO','SYF','ALLY','AXP','COF','MA','CME','SPGI','BAC'] },
  '貴金屬/礦業':   { emoji:'🥇', stocks:['NEM','AEM','WPM','B','HL','FNV','KGC','AU','AGI','PAAS'] },
};

const CLASS_A = ['NVDA','AMD','MU','WDC','COHR','STX','SNDK','MSFT','AAPL','GOOGL','META','AMZN','TSLA','NEM','LRCX','AVGO','IBM','VRT','ETN','CEG','VST'];
function getClass(sym) { return CLASS_A.includes(sym) ? 'A' : 'B'; }
// 門檻統一用10分制：A類6.5分，B類7.0分
function getThreshold(sym) { return getClass(sym) === 'A' ? 6.5 : 7.0; }

let currentSector = '七巨頭';

const PROXIES = [
  url => `https://gstock-proxy.cykjas.workers.dev/?url=${encodeURIComponent(url)}`
];

// Yahoo 的日線在盤中會多一根「還沒收完」的今天：收盤價是即時價、成交量只有走完的一部分。
// 這根不能拿去算量能判斷（會被當成縮量），所以盤中就先拿掉，只用已經收完的交易日。
function isPartialBar(tLast, nowMs) {
  const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const parts = x => { const o = {}; fmt.formatToParts(new Date(x)).forEach(p => { o[p.type] = p.value; }); return o; };
  const a = parts(tLast * 1000), n = parts(nowMs);
  if (a.year + a.month + a.day !== n.year + n.month + n.day) return false;   // 最後一根不是今天
  return (+n.hour) * 60 + (+n.minute) < 16 * 60;                              // 美東 16:00 收盤前
}
const YCACHE = {};   // 同一檔 10 分鐘內不重抓（切板塊、回頭看都立刻出來）
async function fetchYahoo(symbol) {
  const hit = YCACHE[symbol];
  if (hit && Date.now() - hit.at < 600000) return hit.data;
  const yahooUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=2y`;
  let lastErr = '';
  for (let i = 0; i < PROXIES.length; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const res = await fetch(PROXIES[i](yahooUrl), { signal: ctrl.signal });
      if (!res.ok) { lastErr = 'HTTP ' + res.status; continue; }
      const data = await res.json();
      if (!data.chart || !data.chart.result) { lastErr = '查無這個代號的資料'; continue; }
      const result = data.chart.result[0];
      const closes = result.indicators.quote[0].close;
      const volumes = result.indicators.quote[0].volume;
      const timestamps = result.timestamp;
      const valid = closes.map((c, k) => ({ c, v: volumes[k], t: timestamps[k] }))
                          .filter(d => d.c !== null && d.c !== undefined);
      let partial = false;
      if (valid.length > 2 && isPartialBar(valid[valid.length-1].t, Date.now())) { valid.pop(); partial = true; }
      if (valid.length < 2) { lastErr = '資料筆數不足'; continue; }
      const out = {
        current: valid[valid.length-1].c,
        prev: valid[valid.length-2].c,
        closes: valid.map(d => d.c),
        volumes: valid.map(d => d.v || 0),
        timestamps: valid.map(d => d.t),
        partial
      };
      YCACHE[symbol] = { at: Date.now(), data: out };
      return out;
    } catch(e) {
      lastErr = (e && e.name === 'AbortError') ? '逾時（12 秒沒有回應）' : (e && e.message) || '連線失敗';
    } finally {
      clearTimeout(timer);
    }
  }
  throw new Error(lastErr || '抓不到資料');
}

// 大盤(SPY)：回傳今天漲跌，以及每天的收盤（讓 10 日趨勢每一天用當天的大盤）
function dayKey(t) { return new Date(t * 1000).toISOString().slice(0, 10); }
async function getSpy() {
  try {
    const spy = await fetchYahoo('SPY');
    const byDate = {};
    spy.closes.forEach((c, k) => { byDate[dayKey(spy.timestamps[k])] = c; });
    return { change: spy.prev ? ((spy.current - spy.prev) / spy.prev * 100) : 0, byDate };
  } catch(e) {
    return { change: null, byDate: null };
  }
}

async function searchCustomStock() {
  const input = document.getElementById('customInput');
  const sym = input.value.trim().toUpperCase();
  if (!sym) return;
  if (!/^[A-Z0-9.\-]{1,10}$/.test(sym)) {
    document.getElementById('customCardArea').innerHTML = '<div style="padding:12px;color:#c0281e;font-size:12px">代號只能是英文字母或數字（例如 ASTS、PLTR）。</div>';
    return;
  }
  const area = document.getElementById('customCardArea');
  area.innerHTML = `<div class="cards-grid"><div class="stock-card card-loading" id="custom-card-${sym}">
    <div style="padding:30px;text-align:center;color:#aaa;font-size:12px;">
      <div style="font-family:'Oswald',sans-serif;font-size:22px;color:#1a2a3a;margin-bottom:8px">${sym}</div>
      載入中...
    </div>
  </div></div>`;
  const spy = await getSpy();
  await loadStock(sym, spy.change, 0, spy.byDate, 'custom-card-' + sym);
}

function init() {
  const bar = document.getElementById('sectorBar');
  try {
    const inp = document.getElementById('customInput');
    if (inp) inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') searchCustomStock();
    });
  } catch(e) {}
  bar.innerHTML = Object.entries(SECTORS).map(([name, s]) =>
    `<div class="sector-tag ${name===currentSector?'active':''}" data-sector="${name}" onclick="switchSector(this)">${s.emoji} ${name}</div>`
  ).join('');
  loadSector(currentSector);
}

function switchSector(el) {
  const sectorName = el.getAttribute('data-sector');
  if (!sectorName || !SECTORS[sectorName]) return;
  currentSector = sectorName;
  document.querySelectorAll('.sector-tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('customCardArea').innerHTML = '';
  document.getElementById('customInput').value = '';
  loadSector(sectorName);
}

let loadToken = 0;   // 切換板塊時，舊板塊還沒跑完的就停掉，不再浪費請求
async function loadSector(sectorName) {
  const my = ++loadToken;
  const stocks = SECTORS[sectorName].stocks;
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = stocks.map((sym, i) => `
    <div class="stock-card card-loading" id="card-${sym}" style="animation-delay:${Math.min(i,12)*0.05}s">
      <div style="padding:30px;text-align:center;color:#aaa;font-size:12px;">
        <div style="font-family:'Oswald',sans-serif;font-size:22px;color:#1a2a3a;margin-bottom:8px">${sym}</div>
        載入中...
      </div>
    </div>`).join('');
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('progressFill').style.width = '0%';
  const spy = await getSpy();
  if (my !== loadToken) return;
  let next = 0, done = 0;
  async function worker() {
    while (my === loadToken) {
      const i = next++;
      if (i >= stocks.length) return;
      await loadStock(stocks[i], spy.change, i, spy.byDate);
      done++;
      if (my === loadToken) document.getElementById('progressFill').style.width = `${(done/stocks.length)*100}%`;
      await sleep(150);
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  if (my === loadToken) document.getElementById('progressBar').style.display = 'none';
}

async function loadStock(sym, spyChange, idx, spyByDate, domId) {
  const cardId = domId || `card-${sym}`;
  try {
    const d = await fetchYahoo(sym);
    if (d.partial) { const mn = document.getElementById('marketNote'); if (mn) mn.style.display = 'block'; }
    const stockClass = getClass(sym);
    const threshold = getThreshold(sym);
    const scores = calcScore(d, spyChange);
    const total10 = scores.total / 10;
    const change = d.prev ? ((d.current - d.prev) / d.prev * 100) : 0;

    const hist10 = calcHistory10(d, spyChange, spyByDate);
    const whaleScore = calcWhale(d);
    const whaleDisplay = getWhaleDisplay(whaleScore);
    const whaleHistory = calcWhaleHistory10(d);
    const advice = genAdvice(sym, scores, d, stockClass, threshold, change, whaleScore);

    // ★ 覆蓋規則：空頭訊號強制降級顏色
    const hasBearOverride = advice.technical.includes('空頭訊號確認') 
      || advice.technical.includes('跌破MA200');
    const hasFireOverride = advice.fireLv >= 3;
    const hasFireWarn = advice.fireLv >= 1 && advice.fireLv < 3;
    let weather;
    if (hasBearOverride) {
      weather = { icon:'🌧️', label:'走弱 — 空頭訊號！', cardCls:'card-red-light' };
    } else if (hasFireOverride) {
      weather = { icon:'🔥', label:'過熱 — 謹慎追高', cardCls:'card-orange' };
    } else if (advice.noMA200) {
      weather = { icon:'🆕', label:'新上市 — 資料不足', cardCls:'card-gray' };
    } else {
      weather = getWeather(total10, threshold);
      // 一把火／二把火：顏色照分數（趨勢確實強），但標籤不能再寫「積極進場／可小量試單」，
      // 否則會跟下面「空手者等回調」互相打架
      if (hasFireWarn) {
        weather = { icon:'🔥', label: total10 >= threshold ? '強勢但過熱 — 不追高' : '過熱 — 留意回調', cardCls: weather.cardCls };
      }
    }

    const card = document.getElementById(cardId);
    card.className = `stock-card ${weather.cardCls}`;

    const chgSign = change >= 0 ? '+' : '';

    // ★ suggestText 也跟著覆蓋
    const suggestText = hasBearOverride ? '⚠️ 空頭訊號警示'
      : (hasFireOverride || hasFireWarn) ? '🔥 過熱警示'
      : advice.noMA200 ? '🆕 資料不足，僅供參考'
      : total10 >= threshold ? '✓ 符合進場條件'
      : total10 >= 4 ? '～ 繼續觀察' : '✗ 暫時迴避';

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="stock-symbol">${sym}</div>
          <div class="class-badge">${stockClass}類｜門檻${threshold.toFixed(1)}分</div>
        </div>
        <div class="score-circle">
          <div class="score-num">${total10.toFixed(1)}</div>
          <div class="score-lbl">/ 10</div>
        </div>
      </div>
      <div class="price-row">
        <span class="price-val">$${d.current.toFixed(2)}</span>
        <span class="price-chg">${chgSign}${change.toFixed(2)}%</span>
      </div>
      <div class="weather-row">${weather.icon} ${weather.label}</div>
      <div class="suggest-tag">${suggestText}</div>
      <div class="factors">
        ${factorRow('🏆 冠軍(30%)', scores.champ)}
        ${factorRow('🌏 大盤(25%)', scores.market)}
        ${factorRow('💥 量能(18%)', scores.volume)}
        ${factorRow('📊 指標(12%)', scores.indicator)}
        ${factorRow('⚡ 短期動能(15%)', scores.momentum)}
      </div>
      <div class="trend-section">
        <div class="trend-title">📅 近10日趨勢</div>
        <div class="trend-row-label"><span style="display:inline-block;width:42px">📊 綜合</span>${renderTrendBars(hist10, threshold)}</div>
        ${trendReading(hist10, '綜合分數')}
        <div class="trend-row-label"><span style="display:inline-block;width:42px">🐋 鯨魚</span>${renderWhaleTrend(whaleHistory)}</div>
        ${trendReading(whaleHistory, '主力吸籌')}
        <div class="trend-row-label"><span style="display:inline-block;width:42px">💰 股價</span>${renderPriceTrend(d.closes)}</div>
        ${priceReading(d.closes)}
      </div>
      ${spyChange == null ? '<div class="trend-note">⚠ 大盤資料沒抓到，「大盤」那一項先用中性值，其他四項不受影響。</div>' : ''}
      <div class="score-summary-box">
        <div class="score-summary-row">
          <span class="ss-label">📊 綜合評分</span>
          <span><span class="ss-num">${total10.toFixed(1)}</span><span class="ss-denom"> / 10</span></span>
        </div>
        <div class="score-summary-row">
          <span class="ss-label">🐋 鯨魚指標</span>
          <span><span class="ss-num" style="color:${whaleScore>=7?'#a8ffc8':whaleScore>=4?'#a8d8ff':'rgba(255,255,255,0.75)'}">${whaleDisplay.score}</span><span class="ss-denom"> / 10</span></span>
        </div>
      </div>
      <div class="advice-box">
        <div class="advice-technical">${advice.technical}</div>
        <div class="advice-action">💡 ${advice.action}</div>
      </div>
    `;
  } catch(e) {
    const cardErr = document.getElementById(cardId);
    if (cardErr) cardErr.innerHTML = `<div style="padding:20px;text-align:center;color:#999;font-size:12px;">⚠️ 無法載入<br><small>${e.message}</small></div>`;
  }
}

// ★ factorRow：進度條用0-100內部值，顯示轉成10分制
function factorRow(label, score) {
  return `<div class="factor-row">
    <span class="factor-lbl">${label}</span>
    <div class="factor-bar-wrap"><div class="factor-bar-fill" style="width:${score}%"></div></div>
    <span class="factor-val">${(score/10).toFixed(1)}</span>
  </div>`;
}

function calcHistory10(d, spyChange, spyByDate) {
  const results = [];
  const len = d.closes.length;
  for (let i = 0; i < 10; i++) {
    const idx = len - 10 + i;
    if (idx < 199) { results.push(null); continue; }   // 不滿200根就算不出 MA200，不畫假的分數
    // 每一天用「那一天」的前收盤與大盤漲跌；今天（最後一格）維持與卡片主分數完全相同
    let sc = spyChange;
    if (i < 9 && spyByDate && d.timestamps) {
      const c1 = spyByDate[dayKey(d.timestamps[idx])];
      const c0 = spyByDate[dayKey(d.timestamps[idx-1])];
      if (c1 && c0) sc = (c1 - c0) / c0 * 100;
    }
    const slice = { ...d, closes: d.closes.slice(0, idx+1), volumes: d.volumes.slice(0, idx+1),
                    prev: i < 9 ? d.closes[idx-1] : d.prev };
    const s = calcScore(slice, sc);
    results.push(s.total / 10); // ★ 存10分制
  }
  return results;
}

// ★ renderTrendBars 現在接收10分制數值
function renderTrendBars(scores, threshold) {
  return `<span style="display:inline-flex;gap:2px;vertical-align:middle">${scores.map((s, i) => {
    if (s === null) return `<span class="trend-num-val" style="opacity:0.3;display:inline-block;width:18px">--</span>`;
    const isToday = i === 9;
    // 顏色門檻與卡片一致：達標=綠、4分以上=藍、2.5分以上=淡紅、其餘=橘
    const color = s >= threshold ? 'rgba(160,255,200,0.95)'
                : s >= 4.0 ? 'rgba(160,200,255,0.95)'
                : s >= 2.5 ? 'rgba(255,160,160,0.95)'
                : 'rgba(255,140,100,0.95)';
    return `<span class="trend-num-val" style="background:${color};display:inline-block;min-width:18px;text-align:center;border-radius:3px;padding:1px 2px;${isToday?'font-weight:900;':''}">${s.toFixed(1)}</span>`;
  }).join('')}</span>`;
}

// 近10日走勢的白話解讀（光看數字沒有意義）
function trendReading(arr, label) {
  const v = arr.filter(x => x !== null && x !== undefined);
  if (v.length < 4) return '';
  const first = v[0], last = v[v.length-1], diff = last - first;
  const word = diff >= 1 ? '在走強' : diff <= -1 ? '在轉弱' : '大致持平';
  return `<div class="trend-note">近${v.length}日 ${first.toFixed(1)} → ${last.toFixed(1)}：${label}${word}</div>`;
}
function priceReading(closes) {
  const last10 = closes.slice(-10);
  if (last10.length < 2 || !(last10[0] > 0)) return '';
  const pct = (last10[last10.length-1] - last10[0]) / last10[0] * 100;
  const word = pct >= 3 ? '股價在往上' : pct <= -3 ? '股價在往下' : '股價大致橫盤';
  return `<div class="trend-note">近10日 ${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%：${word}</div>`;
}

function genAdvice(sym, scores, d, stockClass, threshold, change, whaleScore=0) {
  const closes = d.closes;
  const volumes = d.volumes;
  const price = closes[closes.length-1];
  const ma20 = avg(closes.slice(-20));
  const ma50 = closes.length >= 50 ? avg(closes.slice(-50)) : null;
  const ma200 = closes.length >= 200 ? avg(closes.slice(-200)) : null;
  const rsi = calcRSI(closes);

  const aboveMA20 = ma20 && price > ma20;
  const aboveMA50 = ma50 && price > ma50;
  const aboveMA200 = ma200 && price > ma200;
  const ma50AboveMA200 = ma50 && ma200 && ma50 > ma200;

  const ma50now = ma50;
  const ma50_5ago = closes.length >= 55 ? avg(closes.slice(-55,-5)) : null;
  const ma50Slope = ma50now && ma50_5ago ? (ma50now - ma50_5ago) / ma50_5ago * 100 : 0;
  const ma50Declining = ma50Slope < -0.5;

  function ema(arr, p) {
    const k = 2/(p+1); let r = [arr[0]];
    for (let i=1;i<arr.length;i++) r.push(arr[i]*k+r[i-1]*(1-k));
    return r;
  }
  const ema12 = ema(closes, 12); const ema26 = ema(closes, 26);
  const macdNow = ema12[ema12.length-1] - ema26[ema26.length-1];
  const macdBelowZero = macdNow < 0;

  let consolidDays = 0;
  for (let i = closes.length-1; i >= closes.length-15 && i >= 1; i--) {
    const slice = closes.slice(i-4 >= 0 ? i-4 : 0, i+1);
    const h = Math.max(...slice); const l = Math.min(...slice);
    if ((h-l)/l < 0.08) consolidDays++; else break;
  }

  const rsiHigh = rsi && rsi > 75;
  const rsiVeryHigh = rsi && rsi > 85;
  let fireLv = 0;
  if (rsiVeryHigh) fireLv = 3;
  else if (rsiHigh && scores.champ >= 80) fireLv = 2;
  else if (rsiHigh) fireLv = 1;

  const avgVol20 = avg(volumes.slice(-20));
  const todayVol = volumes[volumes.length-1];
  const volShrinking = todayVol < avgVol20 * 0.8;
  const volExpanding = todayVol > avgVol20 * 1.3;
  const risingSignal = aboveMA20 && aboveMA50 && aboveMA200 && ma50AboveMA200 && !macdBelowZero && volShrinking;
  const breakoutSignal = aboveMA20 && aboveMA50 && volExpanding && change > 2;
  const bearSignal = macdBelowZero && ma50Declining && consolidDays >= 5;

  let technical = '';
  if (fireLv === 3) {
    technical = `RSI高達${rsi ? Math.round(rsi) : '--'}，嚴重過熱，股價嚴重偏離均線。`;
  } else if (fireLv === 2) {
    technical = `RSI持續在75以上，過熱跡象明顯，注意回調風險。`;
  } else if (fireLv === 1) {
    technical = `RSI達${rsi ? Math.round(rsi) : '--'}，開始進入過熱區間，留意訊號變化。`;
  } else if (bearSignal) {
    technical = `MACD在零軸下，MA50向下，股價窄幅盤整${consolidDays}天沒有突破，空頭訊號確認。`;
  } else if (breakoutSignal) {
    technical = `股價放量突破，漲幅${change.toFixed(1)}%，均線多排，突破訊號出現。`;
  } else if (risingSignal) {
    technical = '均線多排，縮量整理，MACD在零軸上，起漲準備訊號。';
  } else if (aboveMA20 && aboveMA50 && aboveMA200 && ma50AboveMA200) {
    technical = '均線完全多排，股價在所有均線上方，趨勢強勁。';
  } else if (aboveMA200 && ma50AboveMA200) {
    technical = `股價在MA200上方，但短期跌破MA${aboveMA50?'20':'50'}，動能略顯不足。`;
  } else if (!ma200) {
    technical = '上市還不滿200個交易日，長期均線（MA200）算不出來，只能看短期走勢。';
  } else if (!aboveMA200) {
    technical = `股價跌破MA200，均線${ma50Declining?'空頭排列':'趨勢轉弱'}，長期偏空。`;
  } else {
    technical = '技術面中性，方向待確認。';
  }

  // ★ 行動建議用10分制門檻
  const total10 = scores.total / 10;
  let action = '';
  if (fireLv === 3) {
    action = '🔥🔥🔥 三把火極度過熱！持倉者建議減碼50%鎖利，空手者絕對不追高。';
  } else if (fireLv === 2) {
    action = '🔥🔥 二把火過熱！持倉者可減碼30%，等回測MA20再評估是否加回。';
  } else if (fireLv === 1) {
    action = '🔥 一把火初次過熱，持倉者留意，暫不加碼。空手者等待回調再進場。';
  } else if (bearSignal) {
    action = '⚠️ 空頭四訊號警示！持倉者建議立即減倉，出現長黑K確認後清倉離場。';
  } else if (breakoutSignal) {
    action = '📈 突破訊號！可積極建倉，停損設在突破點下方3-5%。';
  } else if (risingSignal) {
    action = '📈 起漲準備！空手者可小量試單（全倉30%），確認放量突破後再加碼。';
  } else if (total10 >= 8.0) {
    action = `持倉者續抱，停損上移至MA20。空手者可${stockClass==='A'?'積極':'小量'}建倉。`;
  } else if (total10 >= threshold) {
    action = `達到${stockClass}類進場門檻（${threshold.toFixed(1)}分）。空手者可試單，倉位30-50%，停損MA50。`;
  } else if (total10 >= 5.0) {
    action = stockClass==='A'
      ? '中性偏強。持倉者繼續持有，空手者等分數突破6.5分再進場。'
      : '中性觀望。空手者等分數突破7.0分，確認方向後再試單。';
  } else if (total10 >= 4.0) {
    action = stockClass==='A'
      ? 'A類股中性偏弱，機構可能逢低承接。持倉者設好停損，空手者繼續等待。'
      : '接近危險邊緣。持倉者考慮減倉至半倉，空手者暫時迴避。';
  } else if (total10 >= 2.5) {
    action = stockClass==='A'
      ? 'A類大型股走弱。持倉者停損設MA200，跌破MA200則清倉。空手者等待反彈訊號。'
      : '走弱訊號明確。持倉者建議減倉或停損離場，空手者暫時迴避。';
  } else {
    action = '⛈️ 危險區間！持倉者建議清倉觀望，空手者絕對不抄底，等趨勢確認反轉。';
  }

  const whaleStrong = whaleScore >= 7;
  const whaleMed = whaleScore >= 4;
  // 過熱／空頭警示優先：鯨魚訊號只能「補充說明」，不能蓋掉警示、更不能叫人加碼
  if (fireLv >= 1 || bearSignal) {
    if (whaleStrong) {
      action = action + ' 🐋 另外：主力有明顯吸籌跡象，但這不改變上面的判斷（過熱／空頭警示優先，不因此加碼）。';
    } else if (!whaleMed && total10 >= 7.5) {
      action = action + ' ⚠️ 注意：主力吸籌訊號弱，上漲可能缺乏持續性，謹慎追高。';
    }
  } else if (whaleStrong && total10 >= threshold) {
    action = '🐋🐋🐋 主力積極吸籌！' + action + ' 鯨魚訊號極強，可提高倉位至60-70%。';
  } else if (whaleStrong && total10 >= 4.0) {
    action = '🐋🐋🐋 注意！技術面雖偏弱，但主力有明顯吸籌跡象。空手者可小量試探（10-20%），設好停損。';
  } else if (whaleStrong && total10 < 4.0) {
    action = '🐋 主力可能在底部悄悄吸籌，但技術面仍弱。持倉者暫不加碼，空手者觀察是否形成底部型態再決定。';
  } else if (whaleMed && total10 >= threshold) {
    action = action + ' 🐋🐋 主力有買入跡象，訊號可信度提高。';
  } else if (!whaleMed && total10 >= 7.5) {
    action = action + ' ⚠️ 注意：主力吸籌訊號弱，上漲可能缺乏持續性，謹慎追高。';
  }

  // 新上市（不滿200個交易日）：長期均線算不出來，分數只由不完整的資料算出 → 不給進出場建議
  if (!ma200 && fireLv === 0 && !bearSignal) {
    action = '🆕 新上市，歷史資料還不夠（不滿200個交易日），這張卡的分數只供參考。先看短期走勢與量能，等滿200個交易日再用這套評分。';
  }
  return { technical, action, fireLv, bearSignal, noMA200: !ma200 };
}

// ★ getWeather 接收10分制
function getWeather(score10, threshold) {
  if (score10 >= 8.0) return { icon:'🌟', label:'強勢 — 積極進場', cardCls:'card-green-dark' };
  if (score10 >= threshold) return { icon:'☀️', label:'達標 — 可小量試單', cardCls:'card-green-light' };
  if (score10 >= 5.0) return { icon:'⛅', label:'中性偏強 — 觀望', cardCls:'card-blue-dark' };
  if (score10 >= 4.0) return { icon:'☁️', label:'中性偏弱 — 注意', cardCls:'card-blue-light' };
  if (score10 >= 2.5) return { icon:'🌧️', label:'走弱 — 開始關注', cardCls:'card-red-light' };
  return { icon:'⛈️', label:'危險 — 立刻行動', cardCls:'card-red-dark' };
}

function calcScore(d, spyChange) {
  const closes = d.closes;
  const price = closes[closes.length-1];
  const ma20 = avg(closes.slice(-20));
  const ma50 = closes.length >= 50 ? avg(closes.slice(-50)) : null;
  const ma200 = closes.length >= 200 ? avg(closes.slice(-200)) : null;

  let champ = 0;
  if (ma200 && price > ma200) champ += 35;
  if (ma50 && ma200 && ma50 > ma200) champ += 30;
  if (ma20 && ma50 && ma20 > ma50) champ += 20;
  if (ma200) champ += 15;
  champ = Math.min(100, champ);

  let marketBase = spyChange == null ? 50 : 50 + (spyChange > 1 ? 30 : spyChange > 0 ? 15 : spyChange > -1 ? -10 : -25);
  let rs = 50;
  if (closes.length >= 20) {
    const stockRet20 = (price - closes[closes.length-20]) / closes[closes.length-20] * 100;
    if (stockRet20 > 15) rs = 90;
    else if (stockRet20 > 8) rs = 75;
    else if (stockRet20 > 3) rs = 65;
    else if (stockRet20 > 0) rs = 55;
    else if (stockRet20 > -3) rs = 45;
    else if (stockRet20 > -8) rs = 35;
    else rs = 20;
  }
  let market = Math.round(marketBase * 0.70 + rs * 0.30);
  market = Math.min(100, Math.max(0, market));

  const volumes = d.volumes;
  const avgVol = avg(volumes.slice(-20));
  const todayVol = volumes[volumes.length-1];
  const change = d.prev ? ((price - d.prev) / d.prev * 100) : 0;
  let volume = 50;
  if (change > 0 && todayVol > avgVol * 1.4) volume += 30;
  else if (change > 0 && todayVol > avgVol) volume += 15;
  else if (change < 0 && todayVol > avgVol * 1.4) volume -= 20;
  volume = Math.min(100, Math.max(0, volume));

  const rsi = calcRSI(closes);
  let indicator = 50;
  if (rsi && rsi > 50) indicator += 20;
  if (rsi && rsi > 60 && rsi < 80) indicator += 15;
  if (ma20 && ma50 && ma20 > ma50 && price > ma20) indicator += 15;
  indicator = Math.min(100, Math.max(0, indicator));

  // ★ 第五維度：短期動能(15%)
  let momentum = 50;
  if (closes.length >= 6) {
    const ret5 = (price - closes[closes.length-6]) / closes[closes.length-6] * 100;
    if (ret5 > 8) momentum = 95;
    else if (ret5 > 4) momentum = 80;
    else if (ret5 > 1) momentum = 65;
    else if (ret5 > -1) momentum = 50;
    else if (ret5 > -4) momentum = 35;
    else if (ret5 > -8) momentum = 20;
    else momentum = 5;
    let downDays = 0;
    for (let i = closes.length-1; i >= closes.length-5 && i >= 1; i--) {
      if (closes[i] < closes[i-1]) downDays++; else break;
    }
    if (downDays >= 4) momentum = Math.min(momentum, 20);
    else if (downDays >= 3) momentum = Math.min(momentum, 35);
  }
  momentum = Math.min(100, Math.max(0, momentum));

  // ★ 新權重：冠軍30% 大盤25% 量能18% 指標12% 短期動能15%
  const total = Math.round(champ*0.30 + market*0.25 + volume*0.18 + indicator*0.12 + momentum*0.15);
  return { total, champ, market, volume, indicator, momentum };
}

function calcWhale(d) {
  const closes = d.closes;
  const volumes = d.volumes;
  const len = closes.length;
  if (len < 21) return 0;
  let score = 0;
  let upVol = 0, downVol = 0;
  for (let i = len-20; i < len; i++) {
    if (closes[i] > closes[i-1]) upVol += volumes[i];
    else downVol += volumes[i];
  }
  const volRatio = upVol / (downVol || 1);
  if (volRatio > 2.0) score += 3;
  else if (volRatio > 1.5) score += 2;
  else if (volRatio > 1.2) score += 1;
  const avgVol20 = volumes.slice(-20).reduce((a,b)=>a+b,0)/20;
  const avgVol5 = volumes.slice(-5).reduce((a,b)=>a+b,0)/5;
  const volShrink = avgVol5 / avgVol20;
  if (volShrink < 0.5) score += 3;
  else if (volShrink < 0.7) score += 2;
  else if (volShrink < 0.85) score += 1;
  const priceChange20 = (closes[len-1] - closes[len-20]) / closes[len-20] * 100;
  if (priceChange20 > 10) score += 2;
  else if (priceChange20 > 3) score += 1;
  const todayVol = volumes[len-1];
  const todayChange = (closes[len-1] - closes[len-2]) / closes[len-2] * 100;
  if (todayChange > 2 && todayVol > avgVol20 * 1.5) score += 2;
  else if (todayChange > 0 && todayVol > avgVol20 * 1.2) score += 1;
  return Math.min(10, score);
}

function getWhaleDisplay(score) {
  let emoji = '';
  if (score >= 7) emoji = '🐋🐋🐋';
  else if (score >= 4) emoji = '🐋🐋';
  else if (score >= 1) emoji = '🐋';
  else emoji = '—';
  return { emoji, score: score.toFixed(1) };
}

function calcWhaleHistory10(d) {
  // 每一天都用與「🐋 鯨魚指標」同一套算法，這樣最後一格 = 今天的鯨魚分數
  const results = [];
  const len = d.closes.length;
  for (let i = 0; i < 10; i++) {
    const idx = len - 10 + i;
    if (idx < 21) { results.push(null); continue; }
    results.push(calcWhale({ closes: d.closes.slice(0, idx+1), volumes: d.volumes.slice(0, idx+1) }));
  }
  return results;
}

function renderWhaleTrend(history) {
  return `<span style="display:inline-flex;gap:2px;vertical-align:middle">${history.map((s, i) => {
    if (s === null) return `<span class="wt-num" style="opacity:0.3;display:inline-block;min-width:18px">--</span>`;
    const isToday = i === 9;
    const color = s >= 7 ? 'rgba(160,255,200,0.9)' : s >= 4 ? 'rgba(160,200,255,0.9)' : 'rgba(255,200,200,0.7)';
    return `<span class="wt-num" style="background:${color};display:inline-block;min-width:18px;text-align:center;border-radius:3px;padding:1px 2px;${isToday?'font-weight:900;':''}">${s.toFixed(1)}</span>`;
  }).join('')}</span>`;
}

function renderPriceTrend(closes) {
  const last10 = closes.slice(-10);
  return `<span style="display:inline-flex;gap:2px;vertical-align:middle">${last10.map((p, i) => {
    const isToday = i === 9;
    const prev = i > 0 ? last10[i-1] : p;
    const up = p >= prev;
    const changeRatio = prev > 0 ? Math.abs(p - prev) / prev : 0;
    const isAnomaly = changeRatio > 0.30; // 單日偏離超過30%視為異常
    const color = isAnomaly ? 'rgba(255,200,0,0.9)'  // 橘黃色警示
                : up ? 'rgba(160,255,200,0.9)'
                : 'rgba(255,160,160,0.9)';
    const display = p >= 100 ? Math.round(p) : p.toFixed(1);
    const warning = isAnomaly ? '⚠' : '';
    return `<span title="${isAnomaly?'數據異常，請確認':''}\" style="display:inline-block;min-width:18px;text-align:center;border-radius:3px;padding:1px 2px;background:${color};font-family:'Oswald',sans-serif;font-size:8px;font-weight:${isToday?'900':'600'}">${warning}${display}</span>`;
  }).join('')}</span>`;
}

// RSI：Wilder 平滑法（TradingView 的 RSI 也是這個），才會跟你在 TradingView 看到的數字一致
function calcRSI(closes, period=14) {
  if (closes.length < period+1) return null;
  let gain = 0, loss = 0;
  for (let i = 1; i <= period; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff > 0) gain += diff; else loss -= diff;
  }
  let avgG = gain / period, avgL = loss / period;
  for (let i = period+1; i < closes.length; i++) {
    const diff = closes[i] - closes[i-1];
    avgG = (avgG * (period-1) + (diff > 0 ? diff : 0)) / period;
    avgL = (avgL * (period-1) + (diff < 0 ? -diff : 0)) / period;
  }
  if (avgL === 0) return avgG === 0 ? 50 : 100;
  return 100 - 100 / (1 + avgG / avgL);
}

function avg(arr) { return arr.reduce((a,b)=>a+b,0)/arr.length; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
