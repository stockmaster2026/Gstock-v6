<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>籌碼測試</title>
<style>
body{background:#f5e8a0;font-family:sans-serif;padding:16px;margin:0;}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.ticker{font-size:22px;font-weight:900;color:#0066bb;}
.price{font-size:18px;font-weight:700;}
.up{color:#009944;} .dn{color:#cc1133;}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin:6px 0;}
.bd-o{background:rgba(221,102,0,0.12);color:#dd6600;border:1px solid rgba(221,102,0,0.3);}
.bd-b{background:rgba(0,102,187,0.12);color:#0066bb;border:1px solid rgba(0,102,187,0.3);}
.bd-g{background:rgba(0,153,68,0.12);color:#009944;border:1px solid rgba(0,153,68,0.3);}
.bd-r{background:rgba(204,17,51,0.1);color:#cc1133;border:1px solid rgba(204,17,51,0.2);}
.bar-wrap{height:10px;background:rgba(0,0,0,0.07);border-radius:5px;overflow:hidden;margin:4px 0;}
.bar-fill{height:100%;border-radius:5px;transition:width 1s ease;}
.bf-full{background:linear-gradient(90deg,#0066bb,#00aa55);}
.bf-high{background:linear-gradient(90deg,#0088cc,#44aaff);}
.bf-mid{background:linear-gradient(90deg,#dd8800,#ffbb44);}
.bf-low{background:linear-gradient(90deg,#cc1133,#ff6688);}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #f0f0f0;}
.row:last-child{border:none;}
.lbl{color:#888;}
.val{font-weight:600;color:#1a1a2e;}
.cost-wrap{position:relative;height:14px;margin:8px 0;}
.cost-bar{height:100%;background:rgba(0,0,0,0.07);border-radius:4px;position:relative;overflow:hidden;}
.cost-zone{position:absolute;top:0;bottom:0;background:rgba(0,102,187,0.25);}
.cost-pin{position:absolute;top:0;bottom:0;width:3px;background:#dd6600;border-radius:2px;}
.cost-lbl{position:absolute;font-size:9px;font-weight:700;color:#dd6600;transform:translateX(-50%);top:-14px;white-space:nowrap;}
.axis{display:flex;justify-content:space-between;font-size:10px;color:#999;margin-top:2px;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top:2px solid #0066bb;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
h2{text-align:center;color:#1a1a2e;margin-bottom:16px;}
button{width:100%;background:#0066bb;color:white;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:16px;}
</style>
</head>
<body>
<h2>🐋 籌碼分析測試</h2>
<button onclick="loadAll()">🔄 載入即時數據</button>
<div id="cards"></div>

<script>
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';

// 內建歷史籌碼數據（來自我們之前的分析）
const CHIP_DATA={
  'LUNR':{chip:100,cL:18,cH:22,wc:19.5,botP:7.2,botD:'2024-04',note:'籌碼100%完成'},
  'RKLB':{chip:100,cL:18,cH:28,wc:22.0,botP:4.5,botD:'2024-04',note:'籌碼100%完成'},
  'PL':  {chip:100,cL:20,cH:28,wc:23.5,botP:2.8,botD:'2024-06',note:'籌碼100%完成'},
  'BKSY':{chip:100,cL:20,cH:28,wc:23.5,botP:4.2,botD:'2024-06',note:'籌碼100%完成'},
  'IONQ':{chip:28, cL:10,cH:18,wc:14.0,botP:4.8,botD:'2024-08',note:'空頭整理中'},
};

const STOCKS=Object.keys(CHIP_DATA);

async function fetchQ(t){
  const r=await fetch('https://finnhub.io/api/v1/quote?symbol='+t+'&token='+K);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function chipClass(c){
  if(c>=100)return'bf-full';
  if(c>=60)return'bf-high';
  if(c>=30)return'bf-mid';
  return'bf-low';
}
function chipColor(c){
  if(c>=100)return'#009944';
  if(c>=60)return'#0066bb';
  if(c>=30)return'#dd8800';
  return'#cc1133';
}
function phase(price,a){
  if(a.chip>=100&&price>a.wc*1.05)
    return{badge:'🟠 籌碼滿格·攻擊中',cls:'bd-o',text:'主力籌碼滿格，等一把火突破！'};
  if(a.chip>=100)
    return{badge:'🔵 籌碼滿格·等信號',cls:'bd-b',text:'籌碼完成，等題材+爆量+收強進場。'};
  if(a.chip>=60)
    return{badge:'🟢 吸籌中 '+a.chip+'%',cls:'bd-g',text:'主力建倉中，等籌碼完成後再進場。'};
  return{badge:'🔴 空頭整理·觀望',cls:'bd-r',text:'均線空頭，底部未確認，暫時觀望。'};
}
function pp(v,mn,mx){return Math.min(Math.max((v-mn)/(mx-mn)*100,2),96).toFixed(1);}

async function loadAll(){
  var cont=document.getElementById('cards');
  cont.innerHTML='<div style="text-align:center;padding:20px;"><div class="spinner"></div> 載入中...</div>';
  
  var results=[];
  for(var t of STOCKS){
    try{
      var q=await fetchQ(t);
      var price=q.c||q.pc||0;
      results.push({t,q,price});
    }catch(e){
      results.push({t,err:e.message});
    }
    await new Promise(r=>setTimeout(r,300));
  }
  
  cont.innerHTML='';
  for(var r of results){
    var div=document.createElement('div');
    div.className='card';
    if(r.err){
      div.innerHTML='<div class="ticker">'+r.t+'</div><div style="color:red;font-size:12px;">'+r.err+'</div>';
      cont.appendChild(div);
      continue;
    }
    var a=CHIP_DATA[r.t];
    var ph=phase(r.price,a);
    var dist=Math.round((r.price/a.wc-1)*100);
    var pMn=Math.floor(a.botP*0.8/5)*5;
    var pMx=Math.ceil(r.price*1.5/5)*5;
    var cl=pp(a.cL,pMn,pMx);
    var cw=((a.cH-a.cL)/(pMx-pMn)*100).toFixed(1);
    var np=pp(r.price,pMn,pMx);
    var up=r.q.dp>=0;

    div.innerHTML=
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">'+
        '<div>'+
          '<div class="ticker">'+r.t+'</div>'+
          '<div style="font-size:11px;color:#888;">'+(up?'▲':'▼')+Math.abs(r.q.dp).toFixed(1)+'% 今日</div>'+
        '</div>'+
        '<div style="text-align:right;">'+
          '<div class="price '+(up?'up':'dn')+'"">$'+r.price.toFixed(2)+'</div>'+
          '<div style="font-size:11px;color:'+(dist>=0?'#009944':'#cc1133')+'">vs成本 '+(dist>=0?'+':'')+dist+'%</div>'+
        '</div>'+
      '</div>'+
      '<div class="badge '+ph.cls+'">'+ph.badge+'</div>'+
      '<div style="font-size:11px;color:#666;margin-bottom:8px;">'+ph.text+'</div>'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'+
        '<span style="font-size:11px;color:#888;width:44px;">🐋 籌碼</span>'+
        '<div style="flex:1;" class="bar-wrap"><div class="bar-fill '+chipClass(a.chip)+'" style="width:'+a.chip+'%"></div></div>'+
        '<span style="font-size:12px;font-weight:700;color:'+chipColor(a.chip)+';">'+a.chip+'%</span>'+
      '</div>'+
      '<div style="font-size:11px;color:#888;margin-bottom:2px;">📍 成本密集區 $'+a.cL+' - $'+a.cH+'</div>'+
      '<div class="cost-wrap">'+
        '<div class="cost-lbl" style="left:'+np+'%">▼$'+r.price.toFixed(1)+'</div>'+
      '</div>'+
      '<div class="cost-bar">'+
        '<div class="cost-zone" style="left:'+cl+'%;width:'+cw+'%"></div>'+
        '<div class="cost-pin" style="left:'+np+'%"></div>'+
      '</div>'+
      '<div class="axis"><span>$'+pMn+'</span><span style="color:#0066bb;">成本區</span><span>$'+pMx+'</span></div>'+
      '<div style="margin-top:8px;">'+
        '<div class="row"><span class="lbl">底部確認</span><span class="val">$'+a.botP+' ('+a.botD+')</span></div>'+
        '<div class="row"><span class="lbl">加權成本</span><span class="val">$'+a.wc+'</span></div>'+
        '<div class="row"><span class="lbl">分析備註</span><span class="val">'+a.note+'</span></div>'+
      '</div>';
    cont.appendChild(div);
  }
}

loadAll();
</script>

</body>
</html>
