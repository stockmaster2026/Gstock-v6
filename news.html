
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場情報站</title>
<style>
body{background:#0d1117;color:#f0f6fc;font-family:sans-serif;padding:16px;margin:0;}
h1{color:#00e5ff;font-size:20px;margin-bottom:4px;}
.meta{font-size:12px;color:#6e7681;margin-bottom:16px;}
.card{background:#1c2128;border:1px solid #30363d;border-radius:10px;padding:14px;margin-bottom:10px;}
.src{font-size:11px;color:#00e5ff;margin-bottom:6px;}
.zh{font-size:16px;font-weight:700;color:#f0f6fc;line-height:1.5;margin-bottom:4px;}
.en{font-size:12px;color:#6e7681;}
.sp{width:24px;height:24px;border:2px solid #30363d;border-top-color:#00e5ff;border-radius:50%;animation:spin 0.8s linear infinite;margin:30px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.err{color:#f85149;padding:20px;text-align:center;}
</style>
</head>
<body>
<h1>📡 MARKET INTEL</h1>
<div class="meta" id="meta">載入中…</div>
<div id="content"><div class="sp"></div></div>
<script>
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';

function ago(u){const d=Math.floor(Date.now()/1000-u);if(d<3600)return Math.floor(d/60)+‘分前’;if(d<86400)return Math.floor(d/3600)+‘小時前’;return Math.floor(d/86400)+‘天前’;}

async function tr(text){
try{
const r=await fetch(‘https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=’+encodeURIComponent(text));
const d=await r.json();
return d[0].map(x=>x[0]).join(’’);
}catch{return text;}
}

async function load(){
try{
// Step 1: 抓新聞
document.getElementById(‘meta’).textContent=‘抓取新聞中…’;
const r=await fetch(‘https://finnhub.io/api/v1/news?category=general&minId=0&token=’+K);
const data=await r.json();
const items=(data||[]).slice(0,5); // 只取5則

```
if(!items.length){
  document.getElementById('meta').textContent='無新聞資料';
  document.getElementById('content').innerHTML='<div class="err">無資料</div>';
  return;
}

// Step 2: 先顯示英文
document.getElementById('meta').textContent='共 '+items.length+' 則 · 翻譯中…';
document.getElementById('content').innerHTML=items.map((n,i)=>`
  <div class="card">
    <div class="src">${(n.source||'').toUpperCase()} · ${ago(n.datetime)}</div>
    <div class="zh" id="z${i}">…</div>
    <div class="en">${n.headline||''}</div>
  </div>`).join('');

// Step 3: 逐一翻譯
for(let i=0;i<items.length;i++){
  const zh=await tr(items[i].headline||'');
  const el=document.getElementById('z'+i);
  if(el) el.textContent=zh;
  document.getElementById('meta').textContent='翻譯中 '+(i+1)+'/'+items.length+'…';
}
document.getElementById('meta').textContent='共 '+items.length+' 則 · '+new Date().toLocaleTimeString('zh-TW');
```

}catch(e){
document.getElementById(‘content’).innerHTML=’<div class="err">❌ 錯誤：’+e.message+’</div>’;
document.getElementById(‘meta’).textContent=‘載入失敗’;
}
}

load();
</script>

</body>
</html>
