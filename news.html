
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場情報站</title>
<style>
body{background:#0d1117;color:#f0f6fc;font-family:sans-serif;padding:16px;}
h1{color:#00e5ff;margin-bottom:8px;}
.status{font-size:12px;color:#6e7681;margin-bottom:16px;}
.card{background:#1c2128;border:1px solid #30363d;border-radius:10px;padding:14px;margin-bottom:10px;}
.src{font-size:11px;color:#00e5ff;margin-bottom:6px;}
.title{font-size:15px;color:#c9d1d9;text-decoration:none;display:block;line-height:1.5;}
.title:hover{color:#f0f6fc;}
.time{font-size:11px;color:#6e7681;margin-top:6px;}
.btn{background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.3);border-radius:6px;color:#00e5ff;font-size:12px;padding:6px 14px;cursor:pointer;margin-top:8px;display:inline-block;}
.trans{margin-top:8px;background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.2);border-radius:8px;padding:12px;font-size:15px;font-weight:600;color:#f0f6fc;display:none;}
.err{color:#f85149;padding:20px;text-align:center;}
.loading{text-align:center;padding:40px;color:#6e7681;}
</style>
</head>
<body>
<h1>📡 MARKET INTEL</h1>
<div class="status" id="status">連線中…</div>
<div id="content"><div class="loading">載入新聞中…</div></div>

<script>
const KEY = 'd745a41r01qno4q0h68gd745a41r01qno4q0h690';

function ago(u){
  const d=Math.floor(Date.now()/1000-u);
  if(d<3600)return Math.floor(d/60)+'分前';
  if(d<86400)return Math.floor(d/3600)+'小時前';
  return Math.floor(d/86400)+'天前';
}

async function translate(i){
  const btn=document.getElementById('b'+i);
  const box=document.getElementById('t'+i);
  const text=window['h'+i]||'';
  btn.textContent='⏳';
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|zh-TW');
    const d=await r.json();
    box.textContent=d?.responseData?.translatedText||'翻譯失敗';
    box.style.display='block';
    btn.textContent='✅ 已翻譯';
  }catch(e){
    btn.textContent='❌ 重試';
  }
}

async function load(){
  try{
    const r=await fetch('https://finnhub.io/api/v1/news?category=general&minId=0&token='+KEY);
    const data=await r.json();
    const items=(data||[]).slice(0,20);
    document.getElementById('status').textContent='共 '+items.length+' 則新聞 · '+new Date().toLocaleTimeString('zh-TW');
    document.getElementById('content').innerHTML=items.map((n,i)=>{
      window['h'+i]=n.headline||'';
      return `<div class="card">
        <div class="src">${(n.source||'').toUpperCase()} · <span class="time">${ago(n.datetime)}</span></div>
        <a class="title" href="${n.url||'#'}" target="_blank">${n.headline||''}</a>
        <div id="t${i}" class="trans"></div>
        <button id="b${i}" class="btn" onclick="translate(${i})">🌐 中文翻譯</button>
      </div>`;
    }).join('');
  }catch(e){
    document.getElementById('content').innerHTML='<div class="err">載入失敗：'+e.message+'</div>';
    document.getElementById('status').textContent='連線失敗';
  }
}

load();
</script>

</body>
</html>
