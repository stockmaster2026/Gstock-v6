<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場情報站 — StockMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0c10;
    --surface:  #111318;
    --card:     #161920;
    --border:   #1f2330;
    --accent:   #00e5ff;
    --accent2:  #ff6b35;
    --gold:     #ffd166;
    --green:    #00c896;
    --red:      #ff4757;
    --muted:    #4a5568;
    --text:     #e2e8f0;
    --subtext:  #8892a4;
    --mono:     'DM Mono', monospace;
    --sans:     'Noto Sans TC', sans-serif;
    --display:  'Bebas Neue', sans-serif;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–bg);
color: var(–text);
font-family: var(–sans);
min-height: 100vh;
overflow-x: hidden;
}

/* ── NOISE TEXTURE OVERLAY ── */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background-image: url(“data:image/svg+xml,%3Csvg viewBox=‘0 0 256 256’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cfilter id=‘noise’%3E%3CfeTurbulence type=‘fractalNoise’ baseFrequency=‘0.9’ numOctaves=‘4’ stitchTiles=‘stitch’/%3E%3C/filter%3E%3Crect width=‘100%25’ height=‘100%25’ filter=‘url(%23noise)’ opacity=‘0.03’/%3E%3C/svg%3E”);
pointer-events: none;
z-index: 0;
}

/* ── HEADER ── */
header {
position: sticky;
top: 0;
z-index: 100;
background: rgba(10,12,16,0.92);
backdrop-filter: blur(20px);
border-bottom: 1px solid var(–border);
padding: 12px 20px;
}

.header-top {
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
}

.logo {
display: flex;
align-items: baseline;
gap: 8px;
}

.logo-main {
font-family: var(–display);
font-size: 22px;
letter-spacing: 2px;
color: var(–accent);
line-height: 1;
}

.logo-sub {
font-family: var(–mono);
font-size: 10px;
color: var(–muted);
letter-spacing: 1px;
}

.api-row {
display: flex;
align-items: center;
gap: 8px;
margin-top: 10px;
}

.api-input {
flex: 1;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 6px;
padding: 7px 12px;
color: var(–text);
font-family: var(–mono);
font-size: 11px;
outline: none;
transition: border-color 0.2s;
}

.api-input:focus { border-color: var(–accent); }
.api-input::placeholder { color: var(–muted); }

.btn-save {
background: var(–accent);
color: #000;
border: none;
border-radius: 6px;
padding: 7px 14px;
font-family: var(–mono);
font-size: 11px;
font-weight: 500;
cursor: pointer;
white-space: nowrap;
transition: opacity 0.2s;
}
.btn-save:hover { opacity: 0.85; }

.status-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background: var(–muted);
flex-shrink: 0;
transition: background 0.3s;
}
.status-dot.live { background: var(–green); box-shadow: 0 0 6px var(–green); }
.status-dot.error { background: var(–red); }

/* ── TABS ── */
.tab-bar {
display: flex;
gap: 0;
background: var(–surface);
border-bottom: 1px solid var(–border);
overflow-x: auto;
scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab-btn {
flex: 1;
padding: 13px 16px;
background: none;
border: none;
color: var(–subtext);
font-family: var(–sans);
font-size: 13px;
font-weight: 500;
cursor: pointer;
white-space: nowrap;
border-bottom: 2px solid transparent;
transition: all 0.2s;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}

.tab-btn:hover { color: var(–text); background: rgba(255,255,255,0.03); }

.tab-btn.active {
color: var(–accent);
border-bottom-color: var(–accent);
background: rgba(0,229,255,0.04);
}

.tab-icon { font-size: 15px; }

/* ── MAIN CONTENT ── */
main {
position: relative;
z-index: 1;
max-width: 900px;
margin: 0 auto;
padding: 0 0 80px;
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── SECTION HEADER ── */
.section-header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 18px 20px 12px;
border-bottom: 1px solid var(–border);
}

.section-title {
font-family: var(–display);
font-size: 20px;
letter-spacing: 2px;
color: var(–text);
}

.section-meta {
font-family: var(–mono);
font-size: 10px;
color: var(–muted);
}

.refresh-btn {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 6px;
color: var(–subtext);
font-size: 14px;
width: 32px;
height: 32px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.2s;
}
.refresh-btn:hover { color: var(–accent); border-color: var(–accent); }
.refresh-btn.spinning { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── SENTIMENT BAR ── */
.sentiment-bar {
margin: 16px 20px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 10px;
padding: 14px 18px;
display: flex;
align-items: center;
gap: 16px;
}

.sentiment-label {
font-family: var(–mono);
font-size: 10px;
color: var(–subtext);
letter-spacing: 1px;
white-space: nowrap;
}

.sentiment-track {
flex: 1;
height: 6px;
background: var(–border);
border-radius: 3px;
overflow: hidden;
}

.sentiment-fill {
height: 100%;
border-radius: 3px;
background: linear-gradient(90deg, var(–red), var(–accent2), var(–gold), var(–green));
transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.sentiment-pct {
font-family: var(–mono);
font-size: 12px;
font-weight: 500;
white-space: nowrap;
min-width: 60px;
text-align: right;
}

/* ── NEWS CARDS ── */
.news-list {
padding: 8px 20px;
display: flex;
flex-direction: column;
gap: 10px;
}

.news-card {
background: var(–card);
border: 1px solid var(–border);
border-radius: 10px;
padding: 16px;
cursor: pointer;
transition: all 0.2s;
text-decoration: none;
display: block;
position: relative;
overflow: hidden;
animation: fadeUp 0.3s ease both;
}

@keyframes fadeUp {
from { opacity: 0; transform: translateY(8px); }
to   { opacity: 1; transform: translateY(0); }
}

.news-card:hover {
border-color: rgba(0,229,255,0.3);
background: #1a1e28;
transform: translateY(-1px);
}

.news-card::before {
content: ‘’;
position: absolute;
left: 0; top: 0; bottom: 0;
width: 3px;
background: var(–accent);
opacity: 0;
transition: opacity 0.2s;
}
.news-card:hover::before { opacity: 1; }

.card-top {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 8px;
gap: 10px;
}

.card-source {
font-family: var(–mono);
font-size: 10px;
color: var(–accent);
letter-spacing: 0.5px;
background: rgba(0,229,255,0.08);
padding: 2px 8px;
border-radius: 4px;
white-space: nowrap;
}

.card-time {
font-family: var(–mono);
font-size: 10px;
color: var(–muted);
white-space: nowrap;
}

.card-title {
font-size: 14px;
font-weight: 500;
line-height: 1.5;
color: var(–text);
margin-bottom: 8px;
}

.card-summary {
font-size: 12px;
line-height: 1.6;
color: var(–subtext);
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}

.card-ticker-row {
display: flex;
gap: 6px;
margin-top: 10px;
flex-wrap: wrap;
}

.ticker-tag {
font-family: var(–mono);
font-size: 10px;
font-weight: 500;
color: var(–gold);
background: rgba(255,209,102,0.1);
border: 1px solid rgba(255,209,102,0.2);
padding: 2px 7px;
border-radius: 4px;
}

/* ── WATCHLIST INPUT (Tab 2) ── */
.watchlist-input-row {
padding: 16px 20px 0;
display: flex;
gap: 8px;
flex-wrap: wrap;
}

.watch-input {
flex: 1;
min-width: 200px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 6px;
padding: 8px 12px;
color: var(–text);
font-family: var(–mono);
font-size: 12px;
outline: none;
transition: border-color 0.2s;
}
.watch-input:focus { border-color: var(–accent); }
.watch-input::placeholder { color: var(–muted); }

.btn-fetch {
background: var(–surface);
border: 1px solid var(–accent);
border-radius: 6px;
color: var(–accent);
padding: 8px 16px;
font-family: var(–mono);
font-size: 12px;
cursor: pointer;
transition: all 0.2s;
white-space: nowrap;
}
.btn-fetch:hover { background: rgba(0,229,255,0.1); }

.stock-group {
margin: 16px 20px 0;
border: 1px solid var(–border);
border-radius: 10px;
overflow: hidden;
}

.stock-group-header {
display: flex;
align-items: center;
gap: 10px;
padding: 12px 16px;
background: var(–surface);
border-bottom: 1px solid var(–border);
}

.stock-symbol {
font-family: var(–display);
font-size: 18px;
letter-spacing: 1px;
color: var(–gold);
}

.stock-news-list { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }

/* ── RADAR (Tab 3) ── */
.radar-intro {
padding: 16px 20px 0;
font-size: 12px;
color: var(–subtext);
line-height: 1.7;
background: var(–surface);
border-bottom: 1px solid var(–border);
padding-bottom: 14px;
}

.radar-badge {
display: inline-block;
font-family: var(–mono);
font-size: 10px;
color: var(–accent2);
background: rgba(255,107,53,0.1);
border: 1px solid rgba(255,107,53,0.2);
padding: 1px 7px;
border-radius: 4px;
margin-right: 6px;
}

/* ── LOADING / EMPTY ── */
.loading {
padding: 48px 20px;
text-align: center;
color: var(–muted);
font-family: var(–mono);
font-size: 12px;
}

.loading-spinner {
width: 28px;
height: 28px;
border: 2px solid var(–border);
border-top-color: var(–accent);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin: 0 auto 14px;
}

.empty {
padding: 48px 20px;
text-align: center;
color: var(–muted);
font-size: 13px;
line-height: 1.8;
}

.empty-icon { font-size: 36px; margin-bottom: 12px; }

/* ── MOVERS (Tab 3) ── */
.movers-grid {
padding: 12px 20px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap: 10px;
}

.mover-card {
background: var(–card);
border: 1px solid var(–border);
border-radius: 10px;
padding: 14px;
cursor: pointer;
transition: all 0.2s;
animation: fadeUp 0.3s ease both;
}

.mover-card:hover { border-color: rgba(255,107,53,0.4); transform: translateY(-1px); }

.mover-top {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 10px;
}

.mover-sym {
font-family: var(–display);
font-size: 20px;
letter-spacing: 1px;
color: var(–text);
}

.mover-chg {
font-family: var(–mono);
font-size: 14px;
font-weight: 500;
padding: 3px 10px;
border-radius: 6px;
}

.mover-chg.up { color: var(–green); background: rgba(0,200,150,0.12); }
.mover-chg.down { color: var(–red); background: rgba(255,71,87,0.12); }

.mover-news-title {
font-size: 12px;
line-height: 1.5;
color: var(–subtext);
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}

/* ── BACK TO STOCKS LINK ── */
.back-link {
display: block;
text-align: center;
padding: 16px;
font-family: var(–mono);
font-size: 11px;
color: var(–muted);
text-decoration: none;
letter-spacing: 1px;
transition: color 0.2s;
}
.back-link:hover { color: var(–accent); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(–border); border-radius: 2px; }
</style>

</head>

<script>
// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let API_KEY = localStorage.getItem('finnhubKey') || '';
let watchSymbols = [];

// Pre-fill saved key
if (API_KEY) {
  document.getElementById('apiKeyInput').value = API_KEY;
  document.getElementById('statusDot').classList.add('live');
}

// Try to load watchlist from stocks.html localStorage (common keys)
function loadSavedWatchlist() {
  const keys = ['watchlist','userStocks','stockList','myStocks','holdings'];
  for (const k of keys) {
    const val = localStorage.getItem(k);
    if (val) {
      try {
        const parsed = JSON.parse(val);
        const syms = Array.isArray(parsed)
          ? parsed.map(s => typeof s === 'string' ? s : s.symbol || s.ticker || '').filter(Boolean)
          : [];
        if (syms.length) {
          document.getElementById('watchInput').value = syms.join(', ');
          return syms;
        }
      } catch {}
    }
  }
  // Default suggestions
  const defaults = ['AAOI','IONQ','LUNR','PL','TSLA'];
  document.getElementById('watchInput').value = defaults.join(', ');
  return defaults;
}

// ══════════════════════════════════════════
//  API KEY
// ══════════════════════════════════════════
function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val) return;
  API_KEY = val;
  localStorage.setItem('finnhubKey', val);
  document.getElementById('statusDot').classList.add('live');
  loadMarketNews();
}

// ══════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');

  if (tab === 'market' && API_KEY) loadMarketNews();
  if (tab === 'watchlist') { loadSavedWatchlist(); }
  if (tab === 'radar') loadRadar();
}

// ══════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════
function timeAgo(unix) {
  const diff = Math.floor(Date.now()/1000 - unix);
  if (diff < 60) return `${diff}秒前`;
  if (diff < 3600) return `${Math.floor(diff/60)}分前`;
  if (diff < 86400) return `${Math.floor(diff/3600)}小時前`;
  return `${Math.floor(diff/86400)}天前`;
}

function cleanSource(src) {
  if (!src) return 'NEWS';
  return src.replace(/^https?:\/\/(www\.)?/, '').split('/')[0].toUpperCase().slice(0,20);
}

function setRefreshSpin(id, on) {
  const btn = document.getElementById(id);
  if (btn) on ? btn.classList.add('spinning') : btn.classList.remove('spinning');
}

async function finnhub(endpoint) {
  if (!API_KEY) throw new Error('no key');
  const url = `https://finnhub.io/api/v1${endpoint}&token=${API_KEY}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ══════════════════════════════════════════
//  TAB 1: MARKET NEWS
// ══════════════════════════════════════════
async function loadMarketNews() {
  if (!API_KEY) {
    document.getElementById('marketNewsList').innerHTML =
      '<div class="empty"><div class="empty-icon">🔑</div>請輸入 Finnhub API Key 開始使用</div>';
    return;
  }

  setRefreshSpin('refreshMarket', true);
  document.getElementById('marketNewsList').innerHTML =
    '<div class="loading"><div class="loading-spinner"></div>正在抓取最新財經新聞…</div>';

  try {
    const news = await finnhub('/news?category=general&minId=0');
    const items = (news || []).slice(0, 30);

    // Sentiment calc (basic: count positive/negative keywords)
    const bullish = ['surge','rally','gain','up','rise','record','beat','bull','growth','profit'];
    const bearish = ['fall','drop','plunge','loss','decline','crash','bear','cut','recession','fear'];
    let bull = 0, bear = 0;
    items.forEach(n => {
      const txt = ((n.headline||'') + ' ' + (n.summary||'')).toLowerCase();
      bull += bullish.filter(w => txt.includes(w)).length;
      bear += bearish.filter(w => txt.includes(w)).length;
    });
    const total = bull + bear || 1;
    const bullPct = Math.round(bull / total * 100);
    document.getElementById('sentimentFill').style.width = bullPct + '%';
    const sentEl = document.getElementById('sentimentPct');
    if (bullPct >= 55) {
      sentEl.style.color = 'var(--green)';
      sentEl.textContent = `看漲 ${bullPct}%`;
    } else if (bullPct <= 45) {
      sentEl.style.color = 'var(--red)';
      sentEl.textContent = `看跌 ${100-bullPct}%`;
    } else {
      sentEl.style.color = 'var(--gold)';
      sentEl.textContent = `中立`;
    }

    document.getElementById('marketMeta').textContent =
      `共 ${items.length} 則 · 更新於 ${new Date().toLocaleTimeString('zh-TW')}`;

    if (!items.length) {
      document.getElementById('marketNewsList').innerHTML =
        '<div class="empty"><div class="empty-icon">📭</div>目前沒有新聞資料</div>';
      return;
    }

    document.getElementById('marketNewsList').innerHTML = items.map((n, i) => `
      <a class="news-card" href="${n.url || '#'}" target="_blank" rel="noopener"
         style="animation-delay:${i * 0.03}s">
        <div class="card-top">
          <span class="card-source">${cleanSource(n.source)}</span>
          <span class="card-time">${timeAgo(n.datetime)}</span>
        </div>
        <div class="card-title">${n.headline || '（無標題）'}</div>
        ${n.summary ? `<div class="card-summary">${n.summary}</div>` : ''}
        ${n.related ? `<div class="card-ticker-row">
          ${n.related.split(',').filter(Boolean).slice(0,5).map(t =>
            `<span class="ticker-tag">$${t.trim()}</span>`).join('')}
        </div>` : ''}
      </a>`).join('');

  } catch (e) {
    document.getElementById('marketNewsList').innerHTML =
      `<div class="empty"><div class="empty-icon">❌</div>載入失敗：${e.message}<br>請確認 API Key 是否正確</div>`;
    document.getElementById('statusDot').className = 'status-dot error';
  }

  setRefreshSpin('refreshMarket', false);
}

// ══════════════════════════════════════════
//  TAB 2: WATCHLIST NEWS
// ══════════════════════════════════════════
async function loadWatchlistNews() {
  if (!API_KEY) {
    document.getElementById('watchlistContent').innerHTML =
      '<div class="empty"><div class="empty-icon">🔑</div>請先儲存 Finnhub API Key</div>';
    return;
  }

  const raw = document.getElementById('watchInput').value;
  const syms = raw.split(/[,\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
  if (!syms.length) return;

  watchSymbols = syms;
  localStorage.setItem('newsWatchlist', JSON.stringify(syms));

  setRefreshSpin('refreshWatch', true);
  document.getElementById('watchlistContent').innerHTML =
    '<div class="loading"><div class="loading-spinner"></div>正在抓取個股新聞…</div>';

  const today = new Date();
  const from = new Date(today - 7 * 86400000).toISOString().split('T')[0];
  const to   = today.toISOString().split('T')[0];

  try {
    const results = await Promise.all(syms.map(sym =>
      finnhub(`/company-news?symbol=${sym}&from=${from}&to=${to}`).then(data => ({ sym, data }))
    ));

    const html = results.map(({ sym, data }) => {
      const items = (data || []).slice(0, 5);
      if (!items.length) return `
        <div class="stock-group">
          <div class="stock-group-header">
            <span class="stock-symbol">$${sym}</span>
            <span style="font-size:11px;color:var(--muted)">近7日無新聞</span>
          </div>
        </div>`;

      return `
        <div class="stock-group">
          <div class="stock-group-header">
            <span class="stock-symbol">$${sym}</span>
            <span style="font-family:var(--mono);font-size:10px;color:var(--muted)">${items.length} 則</span>
          </div>
          <div class="stock-news-list">
            ${items.map(n => `
              <a class="news-card" href="${n.url||'#'}" target="_blank" rel="noopener"
                 style="margin:0;padding:12px">
                <div class="card-top">
                  <span class="card-source">${cleanSource(n.source)}</span>
                  <span class="card-time">${timeAgo(n.datetime)}</span>
                </div>
                <div class="card-title" style="font-size:13px">${n.headline||'（無標題）'}</div>
              </a>`).join('')}
          </div>
        </div>`;
    }).join('');

    document.getElementById('watchlistContent').innerHTML =
      `<div style="padding:12px 20px;display:flex;flex-direction:column;gap:12px">${html}</div>`;

  } catch(e) {
    document.getElementById('watchlistContent').innerHTML =
      `<div class="empty"><div class="empty-icon">❌</div>載入失敗：${e.message}</div>`;
  }

  setRefreshSpin('refreshWatch', false);
}

// ══════════════════════════════════════════
//  TAB 3: MOVE RADAR
// ══════════════════════════════════════════
async function loadRadar() {
  if (!API_KEY) {
    document.getElementById('radarContent').innerHTML =
      '<div class="empty"><div class="empty-icon">🔑</div>請先儲存 Finnhub API Key</div>';
    return;
  }

  const raw = document.getElementById('watchInput').value;
  const syms = raw.split(/[,\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);

  if (!syms.length) {
    document.getElementById('radarContent').innerHTML =
      '<div class="empty"><div class="empty-icon">⚡</div>請先在「我的持倉」設定股票清單</div>';
    return;
  }

  setRefreshSpin('refreshRadar', true);
  document.getElementById('radarContent').innerHTML =
    '<div class="loading"><div class="loading-spinner"></div>正在掃描異動股票…</div>';

  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

  try {
    // Fetch quote + recent news for each symbol in parallel
    const results = await Promise.all(syms.map(async sym => {
      const [quote, news] = await Promise.all([
        finnhub(`/quote?symbol=${sym}`),
        finnhub(`/company-news?symbol=${sym}&from=${yesterday}&to=${today}`)
      ]);
      return { sym, quote, news: (news||[]).slice(0,1) };
    }));

    // Sort by absolute % change
    results.sort((a,b) => Math.abs(b.quote?.dp||0) - Math.abs(a.quote?.dp||0));

    // Filter: show stocks with ±1% change OR any recent news
    const movers = results.filter(r => Math.abs(r.quote?.dp||0) >= 1 || r.news.length > 0);

    if (!movers.length) {
      document.getElementById('radarContent').innerHTML =
        '<div class="empty"><div class="empty-icon">😴</div>今日持倉無明顯異動<br>市場平靜，繼續觀察</div>';
      setRefreshSpin('refreshRadar', false);
      return;
    }

    document.getElementById('radarContent').innerHTML = `
      <div class="movers-grid">
        ${movers.map((r, i) => {
          const dp = r.quote?.dp || 0;
          const c  = r.quote?.c  || 0;
          const isUp = dp >= 0;
          const topNews = r.news[0];
          return `
            <div class="mover-card" style="animation-delay:${i*0.05}s"
                 onclick="${topNews ? `window.open('${topNews.url}','_blank')` : ''}">
              <div class="mover-top">
                <span class="mover-sym">$${r.sym}</span>
                <span class="mover-chg ${isUp ? 'up':'down'}">
                  ${isUp?'+':''}${dp.toFixed(2)}%
                </span>
              </div>
              <div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:8px">
                現價 $${c.toFixed(2)}
              </div>
              ${topNews
                ? `<div class="mover-news-title">${topNews.headline}</div>
                   <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px">
                     ${cleanSource(topNews.source)} · ${timeAgo(topNews.datetime)}
                   </div>`
                : `<div class="mover-news-title" style="color:var(--muted)">今日暫無最新新聞</div>`
              }
            </div>`;
        }).join('')}
      </div>`;

  } catch(e) {
    document.getElementById('radarContent').innerHTML =
      `<div class="empty"><div class="empty-icon">❌</div>載入失敗：${e.message}</div>`;
  }

  setRefreshSpin('refreshRadar', false);
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  loadSavedWatchlist();
  if (API_KEY) loadMarketNews();
});
</script>
