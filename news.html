
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場情報站</title>
<style>
body{background:#1a1f2e;color:#e8edf5;font-family:sans-serif;padding:0;margin:0;}
header{position:sticky;top:0;background:rgba(22,28,45,0.97);backdrop-filter:blur(20px);border-bottom:1px solid #2d3550;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:18px;font-weight:700;color:#4fc3f7;letter-spacing:2px;}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf82;margin-right:6px;}
.tabs{display:flex;background:#1e2438;border-bottom:1px solid #2d3550;}
.tab{flex:1;padding:13px 8px;background:none;border:none;color:#8896b0;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:#4fc3f7;border-bottom-color:#4fc3f7;}
.panel{display:none;padding-bottom:60px;}.panel.active{display:block;}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid #2d3550;flex-wrap:wrap;gap:8px;}
.ph-left{flex:1;}
.pt{font-size:16px;font-weight:700;letter-spacing:2px;color:#e8edf5;}
.pm{font-size:11px;color:#8896b0;margin-top:2px;}
.ph-btns{display:flex;gap:8px;align-items:center;}
.rb{background:#1e2438;border:1px solid #2d3550;border-radius:8px;color:#8896b0;font-size:15px;width:32px;height:32px;cursor:pointer;}
.rb.spin{animation:spin 1s linear infinite;}
.tr-btn{background:rgba(79,195,247,0.1);border:1px solid rgba(79,195,247,0.35);border-radius:8px;color:#4fc3f7;font-size:12px;padding:6px 12px;cursor:pointer;white-space:nowrap;}
.tr-btn:disabled{opacity:0.5;cursor:not-allowed;}
@keyframes spin{to{transform:rotate(360deg);}}
.nl{padding:10px 16px;display:flex;flex-direction:column;gap:10px;}
.card{background:#232b3e;border:1px solid #2d3550;border-radius:12px;padding:16px;}
.ct{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cs{font-size:10px;color:#4fc3f7;background:rgba(79,195,247,0.12);padding:2px 7px;border-radius:4px;}
.ctime{font-size:10px;color:#8896b0;}
.title{font-size:15px;font-weight:600;color:#e8edf5;line-height:1.55;text-decoration:none;display:block;}
.title:hover{color:#4fc3f7;}
.zh-title{font-size:16px;font-weight:700;color:#e8edf5;line-height:1.55;text-decoration:none;display:none;margin-bottom:4px;}
.zh-title:hover{color:#4fc3f7;}
.summary{font-size:13px;color:#b0bec5;line-height:1.6;margin-top:8px;padding:10px 12px;background:rgba(255,255,255,0.04);border-left:3px solid #2d3550;border-radius:0 6px 6px 0;}
.trow{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.tk{font-size:10px;color:#ffd166;background:rgba(255,209,102,0.12);border:1px solid rgba(255,209,102,0.25);padding:2px 6px;border-radius:4px;}
.sp{width:24px;height:24px;border:2px solid #2d3550;border-top-color:#4fc3f7;border-radius:50%;animation:spin 0.8s linear infinite;margin:30px auto;display:block;}
.empty{padding:40px;text-align:center;color:#8896b0;}
.err{padding:20px;text-align:center;color:#ef5350;font-size:13px;}
.wi{width:100%;background:#1e2438;border:1px solid #2d3550;border-radius:8px;padding:9px 14px;color:#e8edf5;font-size:11px;outline:none;margin-bottom:8px;box-sizing:border-box;}
.wi:focus{border-color:#4fc3f7;}
.fb{width:100%;background:#1e2438;border:1px solid #4fc3f7;border-radius:8px;color:#4fc3f7;padding:9px;font-size:12px;cursor:pointer;}
.sg{margin:10px 16px 0;border:1px solid #2d3550;border-radius:12px;overflow:hidden;}
.sh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1e2438;border-bottom:1px solid #2d3550;}
.ss{font-size:18px;font-weight:700;color:#ffd166;}
.mg{padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
.mv{background:#232b3e;border:1px solid #2d3550;border-radius:10px;padding:14px;}
.mt{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.ms{font-size:18px;font-weight:700;color:#e8edf5;}
.mc{font-size:13px;font-weight:700;padding:3px 9px;border-radius:6px;}
.mc.up{color:#4caf82;background:rgba(76,175,130,0.15);}
.mc.dn{color:#ef5350;background:rgba(239,83,80,0.15);}
.mp{font-size:11px;color:#8896b0;margin-bottom:8px;}
.tr-status{font-size:11px;color:#8896b0;padding:8px 16px;text-align:center;}
</style>
</head>
<body>
<header>
  <div><span class="live"></span><span class="logo">MARKET INTEL</span></div>
  <a href="stocks.html" style="font-size:11px;color:#6e7681;text-decoration:none;">← 回主站</a>
</header>
<div class="tabs">
  <button class="tab active" onclick="go('market')" id="tab-market">📡 今日市場</button>
  <button class="tab" onclick="go('watchlist')" id="tab-watchlist">👁 我的持倉</button>
  <button class="tab" onclick="go('radar')" id="tab-radar">⚡ 異動雷達</button>
</div>
<div class="panel active" id="panel-market">
  <div class="ph">
    <div class="ph-left"><div class="pt">TODAY'S MARKET</div><div class="pm" id="mm">載入中…</div></div>
    <div class="ph-btns">
      <button class="tr-btn" id="tr-market" onclick="translatePanel('market')" style="display:none">🌐 翻譯標題</button>
      <button class="rb" id="rm" onclick="loadMarket()">↻</button>
    </div>
  </div>
  <div class="nl" id="ml"><span class="sp"></span></div>
</div>
<div class="panel" id="panel-watchlist">
  <div class="ph">
    <div class="ph-left"><div class="pt">MY WATCHLIST</div><div class="pm">個股最新動態（每次最多8支）</div></div>
    <div class="ph-btns">
      <button class="tr-btn" id="tr-watchlist" onclick="translatePanel('watchlist')" style="display:none">🌐 翻譯標題</button>
      <button class="rb" id="rw" onclick="loadWatch()">↻</button>
    </div>
  </div>
  <div style="padding:12px 16px 0;">
    <input class="wi" id="wi" placeholder="股票代碼，逗號分開（最多8支）…">
    <button class="fb" onclick="loadWatch()">抓取個股新聞</button>
  </div>
  <div id="wc" style="margin-top:8px;"><div class="empty">點「抓取個股新聞」開始</div></div>
</div>
<div class="panel" id="panel-radar">
  <div class="ph">
    <div class="ph-left"><div class="pt">MOVE RADAR</div><div class="pm">今日異動</div></div>
    <div class="ph-btns">
      <button class="tr-btn" id="tr-radar" onclick="translatePanel('radar')" style="display:none">🌐 翻譯標題</button>
      <button class="rb" id="rr" onclick="loadRadar()">↻</button>
    </div>
  </div>
  <div style="padding:10px 16px;font-size:12px;color:#8896b0;background:#1e2438;border-bottom:1px solid #2d3550;">掃描 <strong id="rc">42</strong> 支股票</div>
  <div id="radc"><div class="empty">點右上角 ↻ 開始掃描</div></div>
</div>

<script>
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';
const DW=['AAPL','TSLA','PL','LUNR','RKLB','VSAT','RCAT','AAOI','AXTI','GLW','CREDO','TSEM','LITE','COBRA','MU','SNDK','IONQ','RGTI','QBTS','TEM','HIMS','CRISP','PLTR','OKLO','KTOS','ASTS','CRWV','NBIS','CRCL','NVDA','AMD','GOOG','META','TMUS','SANA','PI','SOUN','RXRX','SOFI','BABI','HOOD'];
document.getElementById('wi').value='AAOI, IONQ, LUNR, PL, TSLA, NVDA, PLTR, AAPL';
document.getElementById('rc').textContent=DW.length;

function ago(u){const d=Math.floor(Date.now()/1000-u);if(d<3600)return Math.floor(d/60)+'分前';if(d<86400)return Math.floor(d/3600)+'小時前';return Math.floor(d/86400)+'天前';}
function src(s){if(!s)return'NEWS';return s.replace(/^https?:\/\/(www\.)?/,'').split('/')[0].toUpperCase().slice(0,12);}
function spn(id,on){const b=document.getElementById(id);if(b)on?b.classList.add('spin'):b.classList.remove('spin');}
async function api(ep){const r=await fetch('https://finnhub.io/api/v1'+ep+'&token='+K);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function syms(){return document.getElementById('wi').value.split(/[,\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean).slice(0,8);}
function go(t){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.getElementById('panel-'+t).classList.add('active');document.getElementById('tab-'+t).classList.add('active');if(t==='market')loadMarket();if(t==='radar')loadRadar();}

// 翻譯單一文字
async function tr(text){
  if(!text)return'';
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q='+encodeURIComponent(text.slice(0,400)));
    const d=await r.json();
    return d[0].map(function(x){return x[0];}).join('');
  }catch(e){return'';}
}

// 翻譯某個 panel 下的所有標題 + 摘要
async function translatePanel(panelName){
  var btn=document.getElementById('tr-'+panelName);
  if(!btn)return;
  btn.disabled=true;
  btn.textContent='⏳ 翻譯中…';

  var panel=document.getElementById('panel-'+panelName);
  var cards=panel.querySelectorAll('.card');
  var total=cards.length;

  for(var i=0;i<cards.length;i++){
    var c=cards[i];

    // 翻譯標題
    var enEl=c.querySelector('.title');
    var zhEl=c.querySelector('.zh-title');
    if(enEl&&zhEl){
      var enText=enEl.textContent;
      if(enText&&enText.trim()!==''){
        var zhTitle=await tr(enText);
        if(zhTitle&&zhTitle!==enText){
          zhEl.textContent=zhTitle;
          zhEl.href=enEl.href;
          zhEl.style.display='block';
          enEl.style.color='#6e7681';
          enEl.style.fontSize='11px';
        }
      }
    }

    // 翻譯摘要
    var sumEl=c.querySelector('.summary');
    var zhSumEl=c.querySelector('.zh-summary');
    if(sumEl&&zhSumEl){
      var sumText=sumEl.textContent;
      if(sumText&&sumText.trim()!==''){
        var zhSum=await tr(sumText);
        if(zhSum&&zhSum!==sumText){
          zhSumEl.textContent=zhSum;
          zhSumEl.style.display='block';
          sumEl.style.display='none';
        }
      }
    }

    btn.textContent='⏳ '+(i+1)+'/'+total;
    await new Promise(function(r){setTimeout(r,200);});
  }
  btn.textContent='✅ 已翻譯';
}

let cardIdx=0;
function card(n){
  var idx=cardIdx++;
  var tks=n.related?n.related.split(',').filter(Boolean).slice(0,4).map(function(t){return '<span class="tk">$'+t.trim()+'</span>';}).join(''):'';
  return '<div class="card">'
    +'<div class="ct"><span class="cs">'+src(n.source)+'</span><span class="ctime">'+ago(n.datetime)+'</span></div>'
    +'<a class="zh-title" href="'+(n.url||'#')+'" target="_blank" id="zh'+idx+'" style="display:none;font-size:16px;font-weight:700;color:#f0f6fc;line-height:1.55;text-decoration:none;margin-bottom:4px;"></a>'
    +'<a class="title" href="'+(n.url||'#')+'" target="_blank">'+(n.headline||'')+'</a>'
    +(n.summary
      ?'<div class="summary">'+n.summary+'</div>'
       +'<div class="zh-summary" style="display:none;font-size:13px;color:#c9d1d9;line-height:1.7;margin-top:8px;padding:10px 12px;background:rgba(0,229,255,0.05);border-left:3px solid rgba(0,229,255,0.3);border-radius:0 6px 6px 0;"></div>'
      :'')
    +(tks?'<div class="trow">'+tks+'</div>':'')
    +'</div>';
}

async function loadMarket(){
  spn('rm',true);cardIdx=0;
  document.getElementById('ml').innerHTML='<span class="sp"></span>';
  document.getElementById('tr-market').style.display='none';
  try{
    var news=await api('/news?category=general&minId=0');
    var items=(news||[]).slice(0,20);
    document.getElementById('mm').textContent='共 '+items.length+' 則 · '+new Date().toLocaleTimeString('zh-TW');
    document.getElementById('ml').innerHTML=items.map(function(n){return card(n);}).join('');
    document.getElementById('tr-market').style.display='inline-block';
    document.getElementById('tr-market').disabled=false;
    document.getElementById('tr-market').textContent='🌐 翻譯標題';
  }catch(e){
    document.getElementById('ml').innerHTML='<div class="err">❌ '+e.message+'<br><br><button onclick="loadMarket()" style="background:#161b22;border:1px solid #30363d;color:#f0f6fc;padding:8px 16px;border-radius:6px;cursor:pointer;">重試</button></div>';
  }
  spn('rm',false);
}

async function loadWatch(){
  var s=syms();
  if(!s.length)return;
  spn('rw',true);cardIdx=0;
  document.getElementById('tr-watchlist').style.display='none';
  var to=new Date().toISOString().split('T')[0];
  var from=new Date(Date.now()-7*86400000).toISOString().split('T')[0];
  var res=[];
  for(var i=0;i<s.length;i++){
    var sym=s[i];
    document.getElementById('wc').innerHTML='<div class="empty">抓取中 '+(i+1)+'/'+s.length+' ('+sym+')…</div>';
    try{
      var d=await api('/company-news?symbol='+sym+'&from='+from+'&to='+to);
      res.push({sym:sym,d:Array.isArray(d)?d:[]});
    }catch(e){res.push({sym:sym,d:[]});}
    await new Promise(function(r){setTimeout(r,300);});
  }
  var html=res.map(function(item){
    var items2=(item.d||[]).slice(0,3);
    if(!items2.length)return '<div class="sg"><div class="sh"><span class="ss">$'+item.sym+'</span><span style="font-size:11px;color:#6e7681">近7日無新聞</span></div></div>';
    return '<div class="sg"><div class="sh"><span class="ss">$'+item.sym+'</span><span style="font-size:10px;color:#6e7681">'+items2.length+' 則</span></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:8px">'+items2.map(function(n){return card(n);}).join('')+'</div></div>';
  }).join('');
  document.getElementById('wc').innerHTML='<div style="padding:10px 16px;display:flex;flex-direction:column;gap:10px">'+html+'</div>';
  document.getElementById('tr-watchlist').style.display='inline-block';
  document.getElementById('tr-watchlist').disabled=false;
  document.getElementById('tr-watchlist').textContent='🌐 翻譯標題';
  spn('rw',false);
}

async function loadRadar(){
  spn('rr',true);cardIdx=0;
  document.getElementById('radc').innerHTML='<span class="sp"></span>';
  document.getElementById('tr-radar').style.display='none';
  var to=new Date().toISOString().split('T')[0];
  var from=new Date(Date.now()-86400000).toISOString().split('T')[0];
  var res=[];
  for(var i=0;i<DW.length;i+=10){
    var br=await Promise.all(DW.slice(i,i+10).map(async function(sym){
      try{
        var q=await api('/quote?symbol='+sym);
        var n=await api('/company-news?symbol='+sym+'&from='+from+'&to='+to);
        return{sym:sym,q:q,news:(n||[]).slice(0,1)};
      }catch(e){return{sym:sym,q:{dp:0,c:0},news:[]};}
    }));
    res.push.apply(res,br);
    if(i+10<DW.length)await new Promise(function(r){setTimeout(r,300);});
  }
  res.sort(function(a,b){return Math.abs(b.q.dp||0)-Math.abs(a.q.dp||0);});
  var movers=res.filter(function(r){return Math.abs(r.q.dp||0)>=1||r.news.length>0;});
  if(!movers.length){document.getElementById('radc').innerHTML='<div class="empty">今日無明顯異動</div>';spn('rr',false);return;}
  var html='<div class="mg">'+movers.map(function(r){
    var dp=r.q.dp||0,c=r.q.c||0,up=dp>=0,n=r.news[0];
    return '<div class="mv">'
      +'<div class="mt"><span class="ms">$'+r.sym+'</span><span class="mc '+(up?'up':'dn')+'">'+(up?'+':'')+dp.toFixed(2)+'%</span></div>'
      +'<div class="mp">$'+c.toFixed(2)+'</div>'
      +(n?card(n):'<div style="font-size:12px;color:#6e7681">今日暫無新聞</div>')
      +'</div>';
  }).join('')+'</div>';
  document.getElementById('radc').innerHTML=html;
  document.getElementById('tr-radar').style.display='inline-block';
  document.getElementById('tr-radar').disabled=false;
  document.getElementById('tr-radar').textContent='🌐 翻譯標題';
  spn('rr',false);
}

loadMarket();
</script>

</body>
</html>
