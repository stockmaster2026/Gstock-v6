
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場情報站</title>
<style>
body{background:#0d1117;color:#f0f6fc;font-family:'Noto Sans TC',sans-serif;padding:16px;margin:0;}
h1{color:#00e5ff;font-size:22px;margin-bottom:4px;}
.meta{font-size:12px;color:#6e7681;margin-bottom:16px;}
.card{background:#1c2128;border:1px solid #30363d;border-radius:10px;padding:14px;margin-bottom:10px;}
.src{font-family:monospace;font-size:11px;color:#00e5ff;margin-bottom:6px;}
.zh{font-size:16px;font-weight:600;color:#f0f6fc;line-height:1.55;margin-bottom:4px;}
.en{font-size:12px;color:#6e7681;line-height:1.5;text-decoration:none;display:block;}
.en:hover{color:#c9d1d9;}
.err{color:#f85149;padding:20px;text-align:center;}
.loading{text-align:center;padding:40px;color:#6e7681;font-size:14px;}
.spinner{width:28px;height:28px;border:2px solid #30363d;border-top-color:#00e5ff;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<h1>📡 MARKET INTEL 產經情報站</h1>
<div class="meta" id="meta">載入中…</div>
<div id="content"><div class="loading"><div class="spinner"></div>抓取新聞並翻譯中，請稍候…</div></div>

<script>
const KEY = 'd745a41r01qno4q0h68gd745a41r01qno4q0h690';

function ago(u){
  const d=Math.floor(Date.now()/1000-u);
  if(d<3600)return Math.floor(d/60)+'分前';
  if(d<86400)return Math.floor(d/3600)+'小時前';
  return Math.floor(d/86400)+'天前';
}

// 用 Google Translate 非官方 API 翻譯
async function translateText(text) {
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=' + encodeURIComponent(text);
    const r = await fetch(url);
    const d = await r.json();
    return d[0].map(x=>x[0]).join('');
  } catch(e) {
    return text; // 失敗就顯示英文原文
  }
}

async function load(){
  try {
    const r = await fetch('https://finnhub.io/api/v1/news?category=general&minId=0&token='+KEY);
    const data = await r.json();
    const items = (data||[]).slice(0,20);
    
    document.getElementById('meta').textContent = '共 '+items.length+' 則新聞 · 翻譯中…';
    
    // 先顯示英文，同時背景翻譯
    document.getElementById('content').innerHTML = items.map((n,i) => `
      <div class="card">
        <div class="src">${(n.source||'').toUpperCase()} · ${ago(n.datetime)}</div>
        <div class="zh" id="zh${i}">⏳ 翻譯中…</div>
        <a class="en" href="${n.url||'#'}" target="_blank">${n.headline||''}</a>
      </div>`).join('');
    
    document.getElementById('meta').textContent = '共 '+items.length+' 則新聞 · '+new Date().toLocaleTimeString('zh-TW');
    
    // 逐一翻譯標題
    for(let i=0;i<items.length;i++){
      const zh = await translateText(items[i].headline||'');
      const el = document.getElementById('zh'+i);
      if(el) el.textContent = zh;
      // 每翻譯3條稍微暫停，避免被限速
      if(i%3===2) await new Promise(r=>setTimeout(r,200));
    }
    
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="err">載入失敗：'+e.message+'</div>';
    document.getElementById('meta').textContent = '連線失敗';
  }
}

load();
</script>

</body>
</html>
