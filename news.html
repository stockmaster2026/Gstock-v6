
<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場情報站</title>
<style>
body{background:#0d1117;color:#f0f6fc;font-family:sans-serif;padding:0;margin:0;}
header{position:sticky;top:0;background:rgba(13,17,23,0.97);border-bottom:1px solid #30363d;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:18px;font-weight:700;color:#00e5ff;letter-spacing:2px;}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fb950;margin-right:6px;}
.tabs{display:flex;background:#161b22;border-bottom:1px solid #30363d;}
.tab{flex:1;padding:13px 8px;background:none;border:none;color:#6e7681;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:#00e5ff;border-bottom-color:#00e5ff;}
.panel{display:none;padding-bottom:60px;}.panel.active{display:block;}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid #30363d;}
.pt{font-size:16px;font-weight:700;letter-spacing:2px;}
.pm{font-size:11px;color:#6e7681;margin-top:2px;}
.rb{background:#161b22;border:1px solid #30363d;border-radius:8px;color:#6e7681;font-size:15px;width:32px;height:32px;cursor:pointer;}
.rb.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.nl{padding:10px 16px;display:flex;flex-direction:column;gap:10px;}
.card{background:#1c2128;border:1px solid #30363d;border-radius:12px;padding:16px;}
.ct{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cs{font-size:10px;color:#00e5ff;background:rgba(0,229,255,0.1);padding:2px 7px;border-radius:4px;}
.ctime{font-size:10px;color:#6e7681;}
.title{font-size:15px;font-weight:600;color:#f0f6fc;line-height:1.55;text-decoration:none;display:block;}
.title:hover{color:#00e5ff;}
.summary{font-size:13px;color:#c9d1d9;line-height:1.6;margin-top:8px;padding:10px 12px;background:rgba(255,255,255,0.03);border-left:3px solid #30363d;border-radius:0 6px 6px 0;}
.trow{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.tk{font-size:10px;color:#ffd166;background:rgba(255,209,102,0.1);border:1px solid rgba(255,209,102,0.2);padding:2px 6px;border-radius:4px;}
.sp{width:24px;height:24px;border:2px solid #30363d;border-top-color:#00e5ff;border-radius:50%;animation:spin 0.8s linear infinite;margin:30px auto;display:block;}
.empty{padding:40px;text-align:center;color:#6e7681;}
.err{padding:20px;text-align:center;color:#f85149;font-size:13px;}
.wi{width:100%;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:9px 14px;color:#f0f6fc;font-size:11px;outline:none;margin-bottom:8px;box-sizing:border-box;}
.wi:focus{border-color:#00e5ff;}
.fb{width:100%;background:#161b22;border:1px solid #00e5ff;border-radius:8px;color:#00e5ff;padding:9px;font-size:12px;cursor:pointer;}
.sg{margin:10px 16px 0;border:1px solid #30363d;border-radius:12px;overflow:hidden;}
.sh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#161b22;border-bottom:1px solid #30363d;}
.ss{font-size:18px;font-weight:700;color:#ffd166;}
.mg{padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
.mv{background:#1c2128;border:1px solid #30363d;border-radius:10px;padding:14px;}
.mt{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.ms{font-size:18px;font-weight:700;}
.mc{font-size:13px;font-weight:700;padding:3px 9px;border-radius:6px;}
.mc.up{color:#3fb950;background:rgba(63,185,80,0.15);}
.mc.dn{color:#f85149;background:rgba(248,81,73,0.15);}
.mp{font-size:11px;color:#6e7681;margin-bottom:8px;}
</style>
</head>
<body>
<header>
  <div><span class="live"></span><span class="logo">MARKET INTEL</span></div>
  <a href="stocks.html" style="font-size:11px;color:#6e7681;text-decoration:none;">← 回主站</a>
</header>
<div class="tabs">
  <button class="tab active" onclick="go('market')" id="tab-market">📡 今日市場</button>
  <button class="tab" onclick="go('watchlist')" id="tab-watchlist">👁 我的持倉</button>
  <button class="tab" onclick="go('radar')" id="tab-radar">⚡ 異動雷達</button>
</div>
<div class="panel active" id="panel-market">
  <div class="ph"><div><div class="pt">TODAY'S MARKET</div><div class="pm" id="mm">載入中…</div></div><button class="rb" id="rm" onclick="loadMarket()">↻</button></div>
  <div class="nl" id="ml"><span class="sp"></span></div>
</div>
<div class="panel" id="panel-watchlist">
  <div class="ph"><div><div class="pt">MY WATCHLIST</div><div class="pm">個股最新動態（每次最多8支）</div></div><button class="rb" id="rw" onclick="loadWatch()">↻</button></div>
  <div style="padding:12px 16px 0;">
    <input class="wi" id="wi" placeholder="股票代碼，逗號分開（最多8支）…">
    <button class="fb" onclick="loadWatch()">抓取個股新聞</button>
  </div>
  <div id="wc" style="margin-top:8px;"><div class="empty">點「抓取個股新聞」開始</div></div>
</div>
<div class="panel" id="panel-radar">
  <div class="ph"><div><div class="pt">MOVE RADAR</div><div class="pm">今日異動</div></div><button class="rb" id="rr" onclick="loadRadar()">↻</button></div>
  <div style="padding:10px 16px;font-size:12px;color:#6e7681;background:#161b22;border-bottom:1px solid #30363d;">掃描 <strong id="rc">42</strong> 支股票</div>
  <div id="radc"><div class="empty">點右上角 ↻ 開始掃描</div></div>
</div>

<script>
const K='d745a41r01qno4q0h68gd745a41r01qno4q0h690';
const DW=['AAPL','TSLA','PL','LUNR','RKLB','VSAT','RCAT','AAOI','AXTI','GLW','CREDO','TSEM','LITE','COBRA','MU','SNDK','IONQ','RGTI','QBTS','TEM','HIMS','CRISP','PLTR','OKLO','KTOS','ASTS','CRWV','NBIS','CRCL','NVDA','AMD','GOOG','META','TMUS','SANA','PI','SOUN','RXRX','SOFI','BABI','HOOD'];
document.getElementById('wi').value='AAOI, IONQ, LUNR, PL, TSLA, NVDA, PLTR, AAPL';
document.getElementById('rc').textContent=DW.length;

function ago(u){const d=Math.floor(Date.now()/1000-u);if(d<3600)return Math.floor(d/60)+'分前';if(d<86400)return Math.floor(d/3600)+'小時前';return Math.floor(d/86400)+'天前';}
function src(s){if(!s)return'NEWS';return s.replace(/^https?:\/\/(www\.)?/,'').split('/')[0].toUpperCase().slice(0,12);}
function sp(id,on){const b=document.getElementById(id);if(b)on?b.classList.add('spin'):b.classList.remove('spin');}
async function api(ep){const r=await fetch('https://finnhub.io/api/v1'+ep+'&token='+K);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function syms(){return document.getElementById('wi').value.split(/[,\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean).slice(0,8);}
function go(t){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.getElementById('panel-'+t).classList.add('active');document.getElementById('tab-'+t).classList.add('active');if(t==='market')loadMarket();if(t==='radar')loadRadar();}

function card(n){
  const tks=n.related?n.related.split(',').filter(Boolean).slice(0,4).map(t=>'<span class="tk">$'+t.trim()+'</span>').join(''):'';
  return '<div class="card">'
    +'<div class="ct"><span class="cs">'+src(n.source)+'</span><span class="ctime">'+ago(n.datetime)+'</span></div>'
    +'<a class="title" href="'+(n.url||'#')+'" target="_blank">'+(n.headline||'')+'</a>'
    +(n.summary?'<div class="summary">'+n.summary+'</div>':'')
    +(tks?'<div class="trow">'+tks+'</div>':'')
    +'</div>';
}

async function loadMarket(){
  sp('rm',true);
  document.getElementById('ml').innerHTML='<span class="sp"></span>';
  try{
    const news=await api('/news?category=general&minId=0');
    const items=(news||[]).slice(0,20);
    document.getElementById('mm').textContent='共 '+items.length+' 則 · '+new Date().toLocaleTimeString('zh-TW');
    document.getElementById('ml').innerHTML=items.map(n=>card(n)).join('');
  }catch(e){
    document.getElementById('ml').innerHTML='<div class="err">❌ '+e.message+'<br><br><button onclick="loadMarket()" style="background:#161b22;border:1px solid #30363d;color:#f0f6fc;padding:8px 16px;border-radius:6px;cursor:pointer;">重試</button></div>';
  }
  sp('rm',false);
}

async function loadWatch(){
  const s=syms();
  if(!s.length)return;
  sp('rw',true);
  const to=new Date().toISOString().split('T')[0];
  const from=new Date(Date.now()-7*86400000).toISOString().split('T')[0];
  const res=[];
  for(let i=0;i<s.length;i++){
    const sym=s[i];
    document.getElementById('wc').innerHTML='<div class="empty">抓取中 '+(i+1)+'/'+s.length+' ('+sym+')…</div>';
    try{
      const d=await api('/company-news?symbol='+sym+'&from='+from+'&to='+to);
      res.push({sym,d:Array.isArray(d)?d:[]});
    }catch(e){
      res.push({sym,d:[]});
    }
    await new Promise(r=>setTimeout(r,300));
  }
  const html=res.map(function(item){
    const sym=item.sym;
    const items=(item.d||[]).slice(0,3);
    if(!items.length)return '<div class="sg"><div class="sh"><span class="ss">$'+sym+'</span><span style="font-size:11px;color:#6e7681">近7日無新聞</span></div></div>';
    return '<div class="sg"><div class="sh"><span class="ss">$'+sym+'</span><span style="font-size:10px;color:#6e7681">'+items.length+' 則</span></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:8px">'+items.map(n=>card(n)).join('')+'</div></div>';
  }).join('');
  document.getElementById('wc').innerHTML='<div style="padding:10px 16px;display:flex;flex-direction:column;gap:10px">'+html+'</div>';
  sp('rw',false);
}

async function loadRadar(){
  sp('rr',true);
  document.getElementById('radc').innerHTML='<span class="sp"></span>';
  const to=new Date().toISOString().split('T')[0];
  const from=new Date(Date.now()-86400000).toISOString().split('T')[0];
  const res=[];
  for(let i=0;i<DW.length;i+=10){
    const br=await Promise.all(DW.slice(i,i+10).map(async function(sym){
      try{
        const q=await api('/quote?symbol='+sym);
        const n=await api('/company-news?symbol='+sym+'&from='+from+'&to='+to);
        return{sym,q,news:(n||[]).slice(0,1)};
      }catch(e){return{sym,q:{dp:0,c:0},news:[]};}
    }));
    res.push.apply(res,br);
    if(i+10<DW.length)await new Promise(r=>setTimeout(r,300));
  }
  res.sort(function(a,b){return Math.abs(b.q.dp||0)-Math.abs(a.q.dp||0);});
  const movers=res.filter(function(r){return Math.abs(r.q.dp||0)>=1||r.news.length>0;});
  if(!movers.length){
    document.getElementById('radc').innerHTML='<div class="empty">今日無明顯異動</div>';
    sp('rr',false);return;
  }
  const html='<div class="mg">'+movers.map(function(r){
    const dp=r.q.dp||0;
    const c=r.q.c||0;
    const up=dp>=0;
    const n=r.news[0];
    return '<div class="mv">'
      +'<div class="mt"><span class="ms">$'+r.sym+'</span><span class="mc '+(up?'up':'dn')+'">'+(up?'+':'')+dp.toFixed(2)+'%</span></div>'
      +'<div class="mp">$'+c.toFixed(2)+'</div>'
      +(n?'<a href="'+(n.url||'#')+'" target="_blank" style="font-size:13px;color:#c9d1d9;text-decoration:none;line-height:1.5;display:block">'+(n.headline||'')+'</a>'
        :'<div style="font-size:12px;color:#6e7681">今日暫無新聞</div>')
      +'</div>';
  }).join('')+'</div>';
  document.getElementById('radc').innerHTML=html;
  sp('rr',false);
}

loadMarket();
</script>

</body>
</html>
