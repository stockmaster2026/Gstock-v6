
<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stooq測試</title>
</head>
<body style="padding:20px;font-family:sans-serif;background:#f5e8a0;">
<h2>🔧 Stooq 歷史數據測試</h2>
<button onclick="test()" style="background:#0066bb;color:white;border:none;border-radius:8px;padding:12px 24px;font-size:16px;cursor:pointer;">測試 PL 歷史數據</button>
<div id="result" style="margin-top:20px;padding:16px;background:white;border-radius:10px;font-size:12px;display:none;white-space:pre-wrap;word-break:break-all;"></div>

<script>
async function test(){
  var d=document.getElementById('result');
  d.style.display='block';
  d.style.color='black';
  d.innerHTML='⏳ 請求中...';
  try{
    var url='https://stooq.com/q/d/l/?s=pl.us&i=d';
    var r=await fetch(url);
    d.innerHTML='HTTP狀態: '+r.status+'\n\n';
    var text=await r.text();
    d.innerHTML+='回應前500字:\n'+text.slice(0,500);
    if(text.includes('Date') || text.includes('Close')){
      d.style.color='green';
      d.innerHTML='✅ 成功！CSV數據:\n\n'+text.slice(0,500);
    } else {
      d.style.color='red';
      d.innerHTML='❌ 數據異常:\n\n'+text.slice(0,500);
    }
  }catch(e){
    d.innerHTML='❌ 錯誤: '+e.message+'\n類型: '+e.name;
    d.style.color='red';
  }
}
</script>

</body>
</html>
