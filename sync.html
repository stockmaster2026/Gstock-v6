<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資料同步</title><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="決策樹"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="theme-color" content="#c8a84b"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;background:#f5f0e8;color:#1a1a2e;padding:20px}.w{max-width:560px;margin:0 auto}h1{font-size:22px;color:#8a6e2f;text-align:center;margin-bottom:20px}.c{background:#fffdf5;border:1px solid #e8dfc0;border-radius:16px;padding:18px;margin-bottom:16px}.c h2{font-size:15px;color:#5a4010;margin-bottom:10px}.c p{font-size:13px;color:#666;line-height:1.6;margin-bottom:12px}.b{display:block;width:100%;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:700;margin-top:10px}.b1{background:linear-gradient(135deg,#c8a84b,#8a6e2f);color:#fff}.b2{background:linear-gradient(135deg,#2ea86e,#1e7a4f);color:#fff}.b3{background:linear-gradient(135deg,#d94f4f,#a03030);color:#fff}.b4{background:#f0e8d0;color:#8a6e2f}textarea{width:100%;min-height:120px;padding:12px;border:1px solid #d0c090;border-radius:10px;font-family:monospace;font-size:11px;background:#fffbec}.w-box{background:#fef4e6;border-left:4px solid #e8a940;padding:12px;border-radius:8px;margin-bottom:12px;font-size:12px;color:#7a5210}.s-box{background:#edfaf3;border-left:4px solid #2ea86e;padding:12px;border-radius:8px;margin-bottom:12px;font-size:12px;color:#1e5a3f;display:none}.e-box{background:#fef0f0;border-left:4px solid #d94f4f;padding:12px;border-radius:8px;margin-bottom:12px;font-size:12px;color:#7a2020;display:none}.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.s{background:#f0e8d0;border-radius:8px;padding:10px;text-align:center}.sn{font-size:20px;font-weight:700;color:#8a6e2f}.sl{font-size:10px;color:#8a8068;margin-top:2px}.bk{display:block;text-align:center;margin-top:20px;padding:12px;background:#fff;border:1px solid #d0c090;border-radius:10px;color:#8a6e2f;text-decoration:none;font-size:14px;font-weight:700}</style></head><body><div class="w"><h1>🔄 資料同步工具</h1><div class="c"><h2>📊 目前裝置</h2><div class="st"><div class="s"><div class="sn" id="kc">-</div><div class="sl">項目</div></div><div class="s"><div class="sn" id="ts">-</div><div class="sl">大小</div></div><div class="s"><div class="sn" id="env">-</div><div class="sl">環境</div></div></div></div><div class="c"><h2>📤 匯出資料</h2><p>在有資料的裝置按此按鈕,自動複製。</p><button class="b b1" onclick="exp()">📋 匯出並複製</button></div><div class="c"><h2>📥 匯入資料</h2><div class="w-box">⚠️ 會覆蓋此裝置的資料!</div><textarea id="imp" placeholder="貼上資料碼..."></textarea><button class="b b2" onclick="imprt()">📥 匯入</button><div class="s-box" id="ss"></div><div class="e-box" id="ee"></div></div><div class="c"><h2>⚙️ 進階</h2><button class="b b4" onclick="dl()">💾 下載備份</button><button class="b b3" onclick="clr()">🗑️ 清空此裝置</button></div><a class="bk" href="test-accum.html">← 回決策樹 App</a></div><script>
function env(){if(window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches)return 'PWA';return 'Safari';}
function fs(b){if(b<1024)return b+'B';if(b<1048576)return (b/1024).toFixed(1)+'KB';return (b/1048576).toFixed(1)+'MB';}
function refresh(){var k=Object.keys(localStorage),t=0;k.forEach(function(x){t+=new Blob([localStorage.getItem(x)||'']).size;});document.getElementById('kc').textContent=k.length;document.getElementById('ts').textContent=fs(t);document.getElementById('env').textContent=env();}
function exp(){var d={};Object.keys(localStorage).forEach(function(k){d[k]=localStorage.getItem(k);});if(!Object.keys(d).length){alert('沒有資料可匯出');return;}var p={v:1,env:env(),at:new Date().toISOString(),n:Object.keys(d).length,data:d};var s=JSON.stringify(p),enc='DTSYNC|'+btoa(unescape(encodeURIComponent(s)));if(navigator.clipboard){navigator.clipboard.writeText(enc).then(function(){alert('✅ 已複製!\n'+Object.keys(d).length+' 個項目,'+fs(s.length)+'\n\n切到另一裝置貼上匯入。');}).catch(function(){prompt('請手動複製:',enc);});}else{prompt('請手動複製:',enc);}}
function imprt(){var raw=document.getElementById('imp').value.trim(),s=document.getElementById('ss'),e=document.getElementById('ee');s.style.display='none';e.style.display='none';if(!raw){e.textContent='❌ 請貼上資料碼';e.style.display='block';return;}try{if(!raw.startsWith('DTSYNC|'))throw new Error('格式錯誤');var p=JSON.parse(decodeURIComponent(escape(atob(raw.substring(7)))));if(!p.data)throw new Error('無資料');if(!confirm('確定匯入?\n來源:'+(p.env||'?')+'\n時間:'+(p.at?new Date(p.at).toLocaleString():'?')+'\n項目:'+Object.keys(p.data).length+' 個\n\n⚠️ 會覆蓋現有資料!'))return;localStorage.clear();Object.keys(p.data).forEach(function(k){localStorage.setItem(k,p.data[k]);});s.innerHTML='✅ 匯入成功!'+Object.keys(p.data).length+' 項';s.style.display='block';refresh();setTimeout(function(){if(confirm('成功!回決策樹 App?'))location.href='test-accum.html';},500);}catch(x){e.textContent='❌ '+x.message;e.style.display='block';}}
function dl(){var d={};Object.keys(localStorage).forEach(function(k){d[k]=localStorage.getItem(k);});if(!Object.keys(d).length){alert('沒有資料');return;}var p={v:1,env:env(),at:new Date().toISOString(),n:Object.keys(d).length,data:d};var b=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='backup-'+new Date().toISOString().split('T')[0]+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);}
function clr(){if(!confirm('⚠️ 清空此裝置資料?不可復原!'))return;if(!confirm('最後確認?'))return;localStorage.clear();refresh();alert('已清空');}
refresh();
</script></body></html>
